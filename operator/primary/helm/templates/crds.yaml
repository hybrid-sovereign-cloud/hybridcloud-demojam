                    The site this gateway attaches. A CloudInfrastructure in the same namespace; its spec.type
                    selects the gateway flavour (openstack: site gateway VM; openshift: hub-side landing).
                  required: [name]
                  properties:
                    kind:
                      type: string
                      enum: [CloudInfrastructure]
                      default: CloudInfrastructure
                    name:
                      type: string
                      maxLength: 253
                transport:
                  type: object
                  properties:
                    type:
                      type: string
                      description: >-
                        none: the site peers with the border gateway over the underlay. wireguard: a site gateway
                        VM tunnels to the border gateway (WireGuard carried over TLS through the hub ingress).
                        Defaults to the fabric's transportDefaults.defaultTunnelType.
                      enum: [none, wireguard, ipsec, macsec]  # TIGHTEN-LATER-REMOVE
                      # >>> TIGHTEN-LATER-ADD
                      # enum: [none, wireguard]
                      # <<< TIGHTEN-LATER-ADD
                    vaultPeerConfigRef:
                      type: string
