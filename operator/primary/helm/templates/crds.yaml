                      type: array
                      items:
                        type: string
                    teamView:
                      description: View Team, Assignment, and Rbac CRs
                      type: array
                      items:
                        type: string
                    projectAdmin:
                      description: Create/edit/delete Project CRs; view Assignment and Rbac CRs
                      type: array
                      items:
                        type: string
                    projectView:
                      description: View Project, Assignment, and Rbac CRs
                      type: array
                      items:
                        type: string
                    assignmentAdmin:
                      description: Create/edit/delete Assignment CRs; view Rbac CRs
                      type: array
                      items:
                        type: string
                    identityAdmin:
                      description: Create and view Rbac CRs
                      type: array
                      items:
                        type: string
            status:
              description: Observed state set by the operator after reconciliation
              type: object
              properties:
                entity:
                  type: string
                description:
                  type: string
                openshiftConsoleURL:
                  type: string
                billingID:
                  type: string
                websiteLink:
                  type: string
                status:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                message:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
