                        type: string
                        maxLength: 63
                        description: Entity name
                openstack:
                  type: object
                  description: OpenStack site (Red Hat OpenStack Services on OpenShift). Required when type is openstack.
                  properties:
                    region:
                      type: string
                      maxLength: 64
                      default: regionOne
                      description: OpenStack region name.
                    managementClusterKubeconfigRef:
                      type: string
                      maxLength: 512
                      description: >-
