                          properties:
                            cidr:
                              type: string
                              maxLength: 64
                              default: 100.64.0.0/11
                              x-kubernetes-validations:
                                - rule: isCIDR(self)
                                  message: must be a CIDR
                            blockPrefixLength:
                              type: integer
                              minimum: 1
                              maximum: 30
                              default: 14
                        serviceNetworkPool:
                          type: object
                          description: Service CIDR pool.
                          x-kubernetes-validations:
                            - rule: "!has(self.cidr) || !has(self.blockPrefixLength) || !isCIDR(self.cidr) || cidr(self.cidr).prefixLength() <= self.blockPrefixLength"
                              message: blockPrefixLength must not be shorter than the pool prefix
                          properties:
                            cidr:
                              type: string
                              maxLength: 64
                              default: 100.96.0.0/11
                              x-kubernetes-validations:
                                - rule: isCIDR(self)
                                  message: must be a CIDR
                            blockPrefixLength:
                              type: integer
                              minimum: 1
                              maximum: 30
                              default: 16
                aws:
                  type: object
                  description: AWS account. Required when type is aws.
                  required: [accountId, region]
                  properties:
                    accountId:
                      type: string
                      pattern: '^[0-9]{12}$'
                      description: AWS account ID.
                    region:
                      type: string
                      maxLength: 32
                      description: AWS region, e.g. us-east-1.
                    baseDomain:
                      type: string
                      maxLength: 253
                      description: Parent Route53 domain for tenant projects.
            status:
              type: object
              properties:
                capabilities:
                  type: object
                  description: >-
                    What the site offers, as discovered by the provision job. Known keys: evpn (the site can
                    attach to a HybridFabric), virtualization (OpenShift Virtualization present), frrK8s (FRR
                    provider and route advertisements enabled), dataplane (NetConfig and NodeSets found),
                    openstackApi (cloud API reachable with the credentials).
                  additionalProperties:
                    type: boolean
                site:
                  type: object
                  description: Observed site details (informational).
                  properties:
