                      type: string
                      maxLength: 512
                      description: Vault KV path holding the credentials.
                    secretRef:
                      type: object
                      description: Secret in the CloudInfrastructure namespace holding the credentials.
                      required: [name]
                      properties:
                        name:
                          type: string
                          maxLength: 253
                entityRefs:
                  type: array
                  description: >-
                    Entities allowed to reference this infrastructure from their cloud projects. Empty means
                    every Entity.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
