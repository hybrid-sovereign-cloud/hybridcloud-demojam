                        Vault KV path holding this gateway's WireGuard key pair (wgPrivateKey, wgPublicKey).
                        Defaults to fabric/wireguard/<gateway>.
                wireguard:
                  type: object
                  description: Site gateway tunnel settings (transport.type wireguard).
                  properties:
                    address:
                      type: string
                      description: >-
                        Site gateway tunnel address with prefix length, e.g. 10.254.254.12/32. Allocated from the
                        border gateway's tunnel subnet when omitted.
