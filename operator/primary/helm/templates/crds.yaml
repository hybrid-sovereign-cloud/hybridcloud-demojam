            spec:
              description: Desired state for PlatformOpenshift
              type: object
              properties:
                type:
                  type: string
                  description: "Platform type: openstack | aws | hosted (Hypershift HCP on CloudVirt)"
                  enum: [openstack, aws, hosted]
                openstack:
                  type: object
                  description: "OpenStack-specific configuration"
                  properties:
                    environment:
                      type: string
                      description: "CloudOSO CR name providing the OpenStack environment"
                    controlPlaneCount:
                      type: integer
                      description: "Control plane node count"
                      default: 3
                    workerCount:
                      type: integer
                      description: "Worker node count"
                      default: 3
                    controlPlaneFlavor:
                      type: string
