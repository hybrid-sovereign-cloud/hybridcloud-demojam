# CloudInfrastructure: platform-owned registration of a cloud site (bring-your-own
# cloud). Lives in sovereign-cloud. Tenant cloud projects (CloudOSO, CloudVirt,
# CloudAWS) and CloudGateways reference it by name through spec.cloudRef.
