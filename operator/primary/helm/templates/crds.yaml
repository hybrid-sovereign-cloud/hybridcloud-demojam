apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridfabrics.hybridsovereign.redhat
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridFabric
    listKind: HybridFabricList
    plural: hybridfabrics
    singular: hybridfabric
    shortNames:
      - hfab
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Platform EVPN fabric: one per hub. Tenants are VRFs on it (HybridNetwork: VNI + route target);
            sites attach through CloudGateways.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              # >>> TIGHTEN-LATER-ADD
              # required: [domainAsn, vniPool, underlay, borderGateway]
              # x-kubernetes-validations:
              #   - rule: "self.domainAsn <= 65535 || self.vniPool.end <= 65535"
              #     message: with a 4-byte domainAsn the route target (ASN:VNI) limits vniPool.end to 65535
              # <<< TIGHTEN-LATER-ADD
              properties:
                enabled:
                  type: boolean
                  default: false
                domainAsn:
                  type: integer
                  description: Fabric BGP autonomous system (iBGP between the border gateway and all sites).
                  minimum: 1
                  maximum: 4294967295
                  # >>> TIGHTEN-LATER-ADD
                  # x-kubernetes-validations:
                  #   - rule: self == oldSelf
                  #     message: domainAsn is immutable
                  # <<< TIGHTEN-LATER-ADD
                # >>> TIGHTEN-LATER-DROP
                routeReflectors:
                  type: array
                  description: >-
                    Deprecated. Hub route-reflector pods; superseded by spec.borderGateway. Leave empty for new fabrics.
                  items:
                    type: object
                    required: [name, address]
                    properties:
                      name:
                        type: string
                      address:
                        type: string
                      nodeName:
                        type: string
                        description: >-
                          Optional node pin for the route-reflector pod (deprecated).
                # <<< TIGHTEN-LATER-DROP
                vniPool:
                  type: object
                  description: VNI range allocated to HybridNetworks (one VNI per tenant VRF).
                  required: [start, end]
                  # >>> TIGHTEN-LATER-ADD
                  # x-kubernetes-validations:
                  #   - rule: self.start <= self.end
                  #     message: vniPool.start must not exceed vniPool.end
                  #   - rule: self == oldSelf
                  #     message: vniPool is immutable
                  # <<< TIGHTEN-LATER-ADD
                  properties:
                    start:
                      type: integer
                      # >>> TIGHTEN-LATER-ADD
                      # minimum: 1
                      # maximum: 16777215
                      # <<< TIGHTEN-LATER-ADD
                    end:
                      type: integer
                      # >>> TIGHTEN-LATER-ADD
                      # minimum: 1
                      # maximum: 16777215
                      # <<< TIGHTEN-LATER-ADD
                underlay:
                  type: object
                  description: >-
                    Fabric underlay address plan and the border gateway's underlay leg on the hub. Site underlays
                    and hub VTEP addresses are carved from cidr; fabric-wide unique.
                  # >>> TIGHTEN-LATER-ADD
                  # required: [cidr]
                  # <<< TIGHTEN-LATER-ADD
                  x-kubernetes-validations:
                    - rule: "(has(self.type) && self.type == 'localnet') || (!has(self.hubVtepBlock) && !has(self.hubLegAddress))"
                      message: underlay.hubVtepBlock and underlay.hubLegAddress require underlay.type localnet
                    - rule: "!(has(self.type) && self.type == 'localnet' && has(self.dhcpRange))"
                      message: underlay.dhcpRange is not allowed with type localnet (DHCP would be served on the node network)
                    - rule: "!has(self.hubVtepBlock) || !has(self.cidr) || !isCIDR(self.cidr) || !isCIDR(self.hubVtepBlock) || (cidr(self.cidr).containsIP(cidr(self.hubVtepBlock).masked().ip()) && cidr(self.hubVtepBlock).prefixLength() >= cidr(self.cidr).prefixLength())"
                      message: underlay.hubVtepBlock must lie inside underlay.cidr
                    - rule: "!has(self.hubLegAddress) || !has(self.cidr) || !isCIDR(self.cidr) || !isCIDR(self.hubLegAddress) || cidr(self.cidr).containsIP(cidr(self.hubLegAddress).ip())"
                      message: underlay.hubLegAddress must lie inside underlay.cidr
                  properties:
                    type:
                      type: string
                      description: >-
                        How the border gateway's underlay NIC (network attachment nadName) attaches on the hub.
                        ovn-layer2: OVN-Kubernetes layer2 network without IPAM; the gateway holds gatewayAddress and
                        serves dhcpRange. localnet: OVN-Kubernetes localnet network on the node bridge mapped to
                        physicalNetworkName; the gateway holds hubLegAddress, hub nodes use addresses from
                        hubVtepBlock as EVPN VTEPs, and no DHCP is served.
                      enum: [ovn-layer2, localnet]
                      default: ovn-layer2
                    physicalNetworkName:
                      type: string
                      maxLength: 253
                      default: physnet
                      description: >-
                        type localnet only. OVN bridge mapping name; physnet maps to the node's external bridge
                        (br-ex) by default.
                    nadName:
                      type: string
                      description: Network attachment name; unique per fabric.
                      default: fabric-underlay
                    cidr:
                      type: string
                      description: Underlay CIDR, e.g. 192.168.64.0/18
                      # Bounded now so the underlay CEL rules stay within the cost budget.
                      maxLength: 64
                      # >>> TIGHTEN-LATER-ADD
                      # x-kubernetes-validations:
                      #   - rule: isCIDR(self)
                      #     message: must be a CIDR
                      #   - rule: self == oldSelf
                      #     message: underlay.cidr is immutable
                      # <<< TIGHTEN-LATER-ADD
                    gatewayAddress:
                      type: string
                      description: >-
                        type ovn-layer2: border gateway address on the underlay. Defaults to the first host of cidr.
                      # >>> TIGHTEN-LATER-ADD
                      # maxLength: 64
                      # x-kubernetes-validations:
                      #   - rule: isIP(self)
                      #     message: must be an IP address
                      # <<< TIGHTEN-LATER-ADD
                    hubVtepBlock:
                      type: string
                      maxLength: 64
                      description: >-
                        type localnet only. CIDR inside cidr reserved for hub node VTEP addresses (hub-side
                        CloudVirt attachment) and the gateway's hub leg; never handed out by DHCP. E.g.
                        192.168.65.0/24.
                      x-kubernetes-validations:
                        - rule: isCIDR(self)
                          message: must be a CIDR
                    hubLegAddress:
                      type: string
                      maxLength: 64
                      description: >-
                        type localnet only. Border gateway address with prefix length on the localnet leg, e.g.
                        192.168.65.1/24. Defaults to the first host of hubVtepBlock.
                      x-kubernetes-validations:
                        - rule: isCIDR(self)
                          message: must be an address with prefix length
                    dhcpRange:
                      type: object
                      description: type ovn-layer2 only. Dynamic address range served on the underlay.
                      properties:
                        start:
                          type: string
                        end:
                          type: string
                        leaseTime:
                          type: string
                          default: 10m
                    mtu:
                      type: integer
                      default: 1400
                      # >>> TIGHTEN-LATER-ADD
                      # minimum: 1280
                      # maximum: 9216
                      # <<< TIGHTEN-LATER-ADD
                borderGateway:
                  type: object
                  description: >-
                    Border gateway virtual machine on the hub: fabric route reflector (l2vpn evpn, ipv4
                    unicast), DHCP server and router for spec.underlay, and tunnel endpoint for remote site
                    gateways.
                  # >>> TIGHTEN-LATER-ADD
                  # required: [loopback]
                  # <<< TIGHTEN-LATER-ADD
                  properties:
                    name:
                      type: string
                      description: Base name for the VM, Service and Route.
                    loopback:
                      type: string
                      description: BGP router ID and the address all spokes peer with, e.g. 10.255.10.10
                      # >>> TIGHTEN-LATER-ADD
                      # maxLength: 64
                      # x-kubernetes-validations:
                      #   - rule: isIP(self)
                      #     message: must be an IP address
                      #   - rule: self == oldSelf
                      #     message: borderGateway.loopback is immutable
                      # <<< TIGHTEN-LATER-ADD
                    vaultCredentialRef:
                      type: string
                      description: >-
                        Vault KV path holding the WireGuard key pair (wgPrivateKey, wgPublicKey). Defaults to
                        fabric/<fabric>/bgw.
                    wireguard:
                      type: object
                      properties:
                        address:
                          type: string
                          default: 10.254.254.1/24
                          description: Tunnel interface address with prefix length.
                          # >>> TIGHTEN-LATER-ADD
                          # maxLength: 64
                          # x-kubernetes-validations:
                          #   - rule: isCIDR(self)
                          #     message: must be an address with prefix length
                          # <<< TIGHTEN-LATER-ADD
                        listenPort:
                          type: integer
                          default: 51820
                          # >>> TIGHTEN-LATER-ADD
                          # minimum: 1
                          # maximum: 65535
                          # <<< TIGHTEN-LATER-ADD
                        mtu:
                          type: integer
                          default: 1380
                          # >>> TIGHTEN-LATER-ADD
                          # minimum: 1280
                          # maximum: 9216
                          # <<< TIGHTEN-LATER-ADD
                    ingressHost:
                      type: string
                      description: >-
                        Route host for the tunnel endpoint. Defaults to <name>.<ingress domain>.
                    vmSize:
                      type: object
                      properties:
                        cpu:
                          type: integer
                          default: 2
                        memory:
                          type: string
                          default: 4Gi
                    image:
                      type: string
                      default: docker://quay.io/containerdisks/centos-stream:9
                      description: Root disk image (container disk URL).
                    storageClass:
                      type: string
                      description: StorageClass for the root disk.
                bgp:
                  type: object
                  description: Fabric-wide BGP session settings.
                  properties:
                    authentication:
                      type: object
                      description: Optional TCP MD5 authentication for every BGP session on the fabric.
                      properties:
                        secretRef:
                          type: object
                          description: Secret in the HybridFabric namespace; key password.
                          required: [name]
                          properties:
                            name:
                              type: string
                              maxLength: 253
                transportDefaults:
                  type: object
                  properties:
                    mtu:
                      type: integer
                      default: 1442
                      # >>> TIGHTEN-LATER-ADD
                      # minimum: 1280
                      # maximum: 9216
                      # <<< TIGHTEN-LATER-ADD
                    defaultTunnelType:
                      type: string
                      description: Transport used by CloudGateways that do not set spec.transport.type.
                      enum: [wireguard, ipsec, macsec, none]  # TIGHTEN-LATER-REMOVE
                      # >>> TIGHTEN-LATER-ADD
                      # enum: [none, wireguard]
                      # <<< TIGHTEN-LATER-ADD
                      default: wireguard
                # >>> TIGHTEN-LATER-DROP
                numberingAuthority:
                  type: object
                  description: Deprecated; unused.
                  x-kubernetes-preserve-unknown-fields: true
                # <<< TIGHTEN-LATER-DROP
                entityRefs:
                  type: array
                  description: >-
                    Entities allowed to place their HybridNetworks on this fabric (admin multi-select).
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Entity name
            status:
              type: object
              properties:
                fabricBaseReady:
                  type: boolean
                borderBgwReady:
                  type: boolean
                  description: True when the border gateway VM is ready, or when no border gateway is configured.
                bgwEndpoint:
                  type: string
                  description: Tunnel endpoint (host:port) for remote site gateways.
                bgwPeerCount:
                  type: integer
                  description: Number of remote site gateways configured as tunnel peers.
                bgwAddress:
                  type: string
                  description: Border gateway underlay address.
                peers:
                  type: array
                  description: BGP peers of the border gateway (sites and hub VTEPs).
                  items:
                    type: object
                    properties:
                      address:
                        type: string
                      site:
                        type: string
                        description: CloudGateway (or hub node) the peer belongs to.
                      state:
                        type: string
                        description: BGP session state, e.g. Established, Active, Idle.
                      prefixesReceived:
                        type: integer
                hubRrReady:
                  type: boolean
                  description: >-
                    Deprecated. Readiness of route-reflector pods for spec.routeReflectors.
                allocatedVniCount:
                  type: integer
                availableVniCount:
                  type: integer
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
