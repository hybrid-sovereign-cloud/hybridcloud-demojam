                      type: string
                      description: "OpenStack flavor for workers"
                      default: "m1.large"
                    externalNetwork:
                      type: string
                      description: "Neutron external network name"
                      default: "ext-net"
                aws:
                  type: object
                  description: "AWS-specific configuration"
                  required: [environment]
                  properties:
                    environment:
                      type: string
                      description: "CloudAWS CR name providing the AWS environment"
                    region:
                      type: string
                      description: "AWS region (default: us-east-1)"
                      default: us-east-1
                    clusterType:
                      type: string
                      description: "Cluster topology type"
                      default: standalone
                      enum: [standalone, ha]
                    controlPlaneCount:
                      type: integer
                      description: "Control plane node count"
                      default: 3
                    workerCount:
                      type: integer
                      description: "Worker node count"
                      default: 2
                    controllerFlavor:
                      type: string
                      description: "AWS instance type for control plane"
                      default: m5.xlarge
                    workerFlavor:
                      type: string
                      description: "AWS instance type for workers"
                      default: m5.large
                hosted:
                  type: object
                  description: "ACM Hypershift HostedControlPlane on CloudVirt infrastructure"
                  required: [environment]
                  properties:
                    environment:
                      type: string
                      description: "CloudVirt CR name providing the virt environment"
                    releaseImage:
                      type: string
                      description: "Optional OCP release image override (empty = discover)"
                    nodePoolReplicas:
                      type: integer
                      default: 2
                    workerCores:
                      type: integer
                      description: "KubeVirt worker vCPU count (default 4 for ACM+FRR headroom)"
                      default: 4
                    workerMemory:
                      type: string
                      description: "KubeVirt worker memory (default 16Gi for ACM policy addons + FRR-k8s)"
                      default: "16Gi"
                toolRbac:
                  description: Controls who gets roles on the provisioned OpenShift cluster (Layer 2 RBAC)
                  type: object
                  properties:
                    clusterAdminRbac:
                      description: Rbac CR names that get cluster-admin on the target cluster
                      type: array
                      items:
                        type: string
                    clusterOperatorRbac:
                      description: Rbac CR names that can manage workloads and power state (no RBAC changes)
                      type: array
                      items:
                        type: string
