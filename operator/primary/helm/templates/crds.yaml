                      type: string
                      maxLength: 255
                      description: External Neutron network for floating IPs.
                    baseDomain:
                      type: string
                      maxLength: 253
                      description: Parent DNS domain for tenant projects on this site.
                    projectDomain:
                      type: string
                      maxLength: 64
                      description: Keystone domain for tenant projects.
                    designate:
                      type: object
                      description: Designate zone used for tenant project DNS.
                      properties:
                        zoneId:
                          type: string
                          maxLength: 64
                        projectId:
                          type: string
                          maxLength: 64
                    route53VaultPath:
                      type: string
                      maxLength: 512
                      description: Vault KV path for Route53 credentials, when DNS is delegated to Route53.
