---
# Canonical 14-role permission matrix for entity namespace RBAC.
# Each entry maps a spec.namespaceRbac key to a K8s Role name and its rules.
# crud_resources: get/list/watch/create/update/patch/delete + status read
# read_resources: get/list/watch + status read only
#
# Scale note: at 10,000+ Rbac CRs per entity the binding resolution loop
# uses async dispatch (see namespace_roles.yml). This vars file is static
# and loaded once per reconcile — O(1) overhead regardless of CR count.
entity_named_roles:
  - spec_key: entityAdmin
    role_name: entity-admin
    crud_resources:
      - cloudosos
      - cloudawss
      - platformopenshifts
      - vaultkvs
      - vaults
      - quayorgs
      - aaporgs
      - projects
      - teams
      - assignments
      - rbacs
    read_resources: []
    # Core secrets CRUD for CloudAWS/CloudOSO credentialsSecretRef (UI-supplied keys)
    core_crud_resources:
      - secrets

  - spec_key: auditor
    role_name: auditor
    crud_resources: []
    read_resources:
      - cloudosos
      - cloudawss
      - platformopenshifts
      - vaultkvs
      - vaults
      - quayorgs
      - aaporgs
      - projects
      - teams
      - assignments
      - rbacs

  - spec_key: BobsTeam
    role_name: bobs-team
    crud_resources: []
    read_resources:
      - cloudosos
      - cloudawss
      - platformopenshifts
      - vaultkvs
      - vaults
      - quayorgs
      - aaporgs
      - projects
      - teams
      - assignments
      - rbacs

  - spec_key: cloudOSOAdmin
    role_name: cloudoso-admin
    crud_resources: [cloudosos]
    read_resources: [rbacs]
    core_crud_resources:
      - secrets

  - spec_key: cloudOSOView
    role_name: cloudoso-view
    crud_resources: []
    read_resources: [cloudosos, rbacs]

  - spec_key: cloudAWSAdmin
    role_name: cloudaws-admin
    crud_resources: [cloudawss]
    read_resources: [rbacs]
    core_crud_resources:
      - secrets

  - spec_key: cloudAWSView
    role_name: cloudaws-view
    crud_resources: []
    read_resources: [cloudawss, rbacs]

  - spec_key: platformOpenshiftAdmin
    role_name: platformopenshift-admin
    crud_resources: [platformopenshifts]
    read_resources: [cloudosos, cloudawss, rbacs]

  - spec_key: platformOpenshiftView
    role_name: platformopenshift-view
    crud_resources: []
    read_resources: [platformopenshifts, rbacs]

  - spec_key: teamAdmin
    role_name: team-admin
    crud_resources: [teams]
    read_resources: [assignments, rbacs]

  - spec_key: teamView
    role_name: team-view
    crud_resources: []
    read_resources: [teams, assignments, rbacs]

  - spec_key: projectAdmin
    role_name: project-admin
    crud_resources: [projects]
    read_resources: [assignments, rbacs]

  - spec_key: projectView
    role_name: project-view
    crud_resources: []
    read_resources: [projects, assignments, rbacs]

  - spec_key: assignmentAdmin
    role_name: assignment-admin
    crud_resources: [assignments]
    read_resources: [projects, teams, rbacs]

  - spec_key: identityAdmin
    role_name: identity-admin
    crud_resources: [rbacs]
    read_resources: []
