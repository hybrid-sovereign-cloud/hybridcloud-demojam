---
# Kafka / AMQ Streams are retired. Operators launch AAP JobTemplates directly.
# Keep this task as a no-op so legacy role includes do not fail.

- name: Skip AMQ Streams publish (retired)
  ansible.builtin.debug:
    msg: >-
      AMQ/Kafka publish skipped for {{ operator_event_reason | default('event') }}
      on {{ operator_event_regarding.kind | default('?') }}/{{ operator_event_regarding.name | default('?') }}.
      Active path: Ansible Operator → AAP JobTemplate.

- name: Emit optional Kubernetes Event for debugging
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: events.k8s.io/v1
      kind: Event
      metadata:
        namespace: "{{ operator_event_regarding.namespace }}"
        generateName: "{{ operator_event_regarding.kind | lower }}-{{ operator_event_regarding.name }}-op-"
      regarding: "{{ operator_event_regarding }}"
      reason: "{{ operator_event_reason }}"
      note: "{{ operator_event_note | default('') | truncate(1024, True, '…') }}"
      type: Normal
      action: "{{ operator_event_action | default('Create') }}"
      reportingController: "{{ operator_reporting_controller | default('hybridsovereign-operator') }}"
      reportingInstance: "{{ operator_reporting_controller | default('hybridsovereign-operator') }}"
      eventTime: "{{ now(utc=true).isoformat() }}Z"
  when: operator_emit_k8s_events | default(false) | bool
