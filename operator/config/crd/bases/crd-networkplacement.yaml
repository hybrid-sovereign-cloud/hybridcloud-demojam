              x-kubernetes-validations:
                - rule: "!has(self.vmNamespaces) || (has(self.backend) && self.backend.kind == 'CloudVirt')"
                  message: vmNamespaces is only valid for backend kind CloudVirt
              properties:
                network:
                  type: string
                  description: HybridNetwork name in the same namespace.
                  # >>> TIGHTEN-LATER-ADD
                  # x-kubernetes-validations:
                  #   - rule: self == oldSelf
                  #     message: network is immutable
                  # <<< TIGHTEN-LATER-ADD
