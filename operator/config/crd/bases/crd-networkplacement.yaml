                      type: string
                prefixes:
                  type: array
                  description: >-
                    Overlay prefixes for this placement. Unique within the HybridNetwork. CloudVirt prefixes must
                    not overlap the hub's cluster, service or node networks.
                  # >>> TIGHTEN-LATER-ADD
                  # maxItems: 64
                  # <<< TIGHTEN-LATER-ADD
                  items:
                    type: string
                    # >>> TIGHTEN-LATER-ADD
                    # maxLength: 64
