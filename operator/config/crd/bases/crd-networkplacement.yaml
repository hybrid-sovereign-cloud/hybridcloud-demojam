                  #     message: backend is immutable
                  # <<< TIGHTEN-LATER-ADD
                  properties:
                    kind:
                      type: string
                      description: PlatformOpenshift is deprecated (hosted clusters do not attach to the fabric).
                      enum: [CloudAWS, CloudOSO, CloudVirt, PlatformOpenshift]  # TIGHTEN-LATER-REMOVE
                      # >>> TIGHTEN-LATER-ADD
                      # enum: [CloudAWS, CloudOSO, CloudVirt]
                      # <<< TIGHTEN-LATER-ADD
