# Validation tightened on 2026-10-08 (restructure cutover, plan §5b step 6):
# required fields, immutables, CEL rules and narrowed enums are active and the
# deprecated pre-CloudInfrastructure fields are gone.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridnetworks.hybridsovereign.redhat
  labels:
    app.kubernetes.io/instance: hs-crds
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/tracking-id: "hs-crds:apiextensions.k8s.io/CustomResourceDefinition:sovereign-cloud/hybridnetworks.hybridsovereign.redhat"
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridNetwork
    listKind: HybridNetworkList
    plural: hybridnetworks
    singular: hybridnetwork
    shortNames:
      - hnet
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Tenant hybrid network identity for Hybrid VPC.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 512
                # Required when the Entity is tagged on more than one Ready HybridFabric
                # (design/fabric.md §19.6) — disambiguates VNI allocation.
                fabricRef:
                  type: string
                  description: >-
                    Optional HybridFabric name in sovereign-cloud. When set, VNI/RT
                    allocation uses this fabric; must be entity-visible and Ready.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: fabricRef is immutable
                overlayMtu:
                  type: integer
                  minimum: 1280
                  maximum: 9216
                  description: >-
                    MTU of the tenant overlay (CUDN mtu, Neutron network MTU). Defaults to a value computed from
                    the fabric transport MTU; see status.overlayMtu.
                networkViewerRbac:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                entity:
                  type: string
                billingId:
                  type: string
                networkId:
                  type: string
                vni:
                  type: integer
                vrfName:
                  type: string
                canonicalRt:
                  type: string
                fabric:
                  type: string
                placementCount:
                  type: integer
                placementsReady:
                  type: integer
                overlayMtu:
                  type: integer
                  description: Effective overlay MTU.
                placements:
                  type: array
                  description: NetworkPlacements of this network.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      backendKind:
                        type: string
                      backendName:
                        type: string
                      prefixes:
                        type: array
                        items:
                          type: string
                      ready:
                        type: boolean
                allocated:
                  type: boolean
                fabricVniReady:
                  type: boolean
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: VNI
          type: integer
          jsonPath: .status.vni
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
