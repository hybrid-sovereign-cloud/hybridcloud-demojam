# CloudInfrastructure: platform-owned registration of a cloud site (bring-your-own
# cloud). Lives in sovereign-cloud. Tenant cloud projects (CloudOSO, CloudVirt,
# CloudAWS) and CloudGateways reference it by name through spec.cloudRef.
# New kind: required fields, immutables and CEL are enforced from the start.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudinfrastructures.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudInfrastructure
    listKind: CloudInfrastructureList
    plural: cloudinfrastructures
    singular: cloudinfrastructure
    shortNames:
      - cinfra
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Platform-owned cloud site (OpenStack, OpenShift Virtualization or AWS) that tenant cloud projects
            and fabric gateways attach to. Holds the site-level credentials and infrastructure references;
            tenant objects never carry them. Exactly one of spec.openstack, spec.openshift or spec.aws is set,
            matching spec.type.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
              x-kubernetes-validations:
                - rule: has(self.openstack) == (self.type == 'openstack')
                  message: spec.openstack must be set if and only if spec.type is openstack
                - rule: has(self.openshift) == (self.type == 'openshift')
                  message: spec.openshift must be set if and only if spec.type is openshift
                - rule: has(self.aws) == (self.type == 'aws')
                  message: spec.aws must be set if and only if spec.type is aws
              properties:
                type:
                  type: string
                  description: Cloud type. Selects the typed section below. Immutable.
                  enum: [openstack, openshift, aws]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.type is immutable
                displayName:
                  type: string
                  maxLength: 128
                  description: Human-readable site name shown in consoles.
                credentialsRef:
                  type: object
                  description: >-
                    Administrative credentials for the cloud API. Exactly one of vaultPath or secretRef.
                    openstack: clouds.yaml (key clouds.yaml); aws: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY;
                    openshift: not needed for clusterRef local.
                  x-kubernetes-validations:
                    - rule: has(self.vaultPath) != has(self.secretRef)
                      message: set exactly one of credentialsRef.vaultPath or credentialsRef.secretRef
                  properties:
                    vaultPath:
                      type: string
                      maxLength: 512
                      description: Vault KV path holding the credentials.
                    secretRef:
                      type: object
                      description: Secret in the CloudInfrastructure namespace holding the credentials.
                      required: [name]
                      properties:
                        name:
                          type: string
                          maxLength: 253
                entityRefs:
                  type: array
                  description: >-
                    Entities allowed to reference this infrastructure from their cloud projects. Empty means
                    every Entity.
                  maxItems: 256
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        description: Entity name
                openstack:
                  type: object
                  description: OpenStack site (Red Hat OpenStack Services on OpenShift). Required when type is openstack.
                  properties:
                    region:
                      type: string
                      maxLength: 64
                      default: regionOne
                      description: OpenStack region name.
                    managementClusterKubeconfigRef:
                      type: string
                      maxLength: 512
                      description: >-
                        Vault KV path (key kubeconfig) for the OpenShift cluster that runs the OpenStack control
                        plane (NetConfig, data plane NodeSets, site gateway VM). Defaults to oso/<name>/mgmt-kubeconfig.
                    netConfigRef:
                      type: string
                      maxLength: 253
                      default: openstacknetconfig
                      description: NetConfig that receives the fabric network.
                    dataplaneNodeSetRefs:
                      type: array
                      description: >-
                        OpenStackDataPlaneNodeSets that receive the fabric EVPN configuration. Ordered: rolled out
                        one at a time in this order.
                      maxItems: 64
                      items:
                        type: string
                        maxLength: 253
                      x-kubernetes-validations:
                        - rule: self.all(x, self.exists_one(y, y == x))
                          message: dataplaneNodeSetRefs entries must be unique
                    externalNetwork:
                      type: string
                      maxLength: 255
                      description: External Neutron network for floating IPs.
                    baseDomain:
                      type: string
                      maxLength: 253
                      description: Parent DNS domain for tenant projects on this site.
                    projectDomain:
                      type: string
                      maxLength: 64
                      description: Keystone domain for tenant projects.
                    designate:
                      type: object
                      description: Designate zone used for tenant project DNS.
                      properties:
                        zoneId:
                          type: string
                          maxLength: 64
                        projectId:
                          type: string
                          maxLength: 64
                    route53VaultPath:
                      type: string
                      maxLength: 512
                      description: Vault KV path for Route53 credentials, when DNS is delegated to Route53.
                openshift:
                  type: object
                  description: >-
                    OpenShift cluster with OpenShift Virtualization used for tenant VMs and hosted control planes.
                    Required when type is openshift.
                  properties:
                    clusterRef:
                      type: string
                      maxLength: 253
                      default: local
                      description: Target cluster. local is the hub cluster itself (the only supported value today).
                    bootImage:
                      type: string
                      maxLength: 512
                      default: docker://quay.io/containerdisks/centos-stream:9
                      description: Default VM root disk image (container disk URL).
                    storageClass:
                      type: string
                      maxLength: 253
                      description: StorageClass for VM disks.
                    hostedClusterCidrDefaults:
                      type: object
                      description: >-
                        Default pod/service CIDR pools for hosted clusters on this site when
                        PlatformOpenshift.spec.networking does not set them. Carved into one block per cluster.
                      properties:
                        clusterNetworkPool:
                          type: object
                          description: Pod CIDR pool.
                          x-kubernetes-validations:
                            - rule: "!has(self.cidr) || !has(self.blockPrefixLength) || !isCIDR(self.cidr) || cidr(self.cidr).prefixLength() <= self.blockPrefixLength"
                              message: blockPrefixLength must not be shorter than the pool prefix
                          properties:
                            cidr:
                              type: string
                              maxLength: 64
                              default: 100.64.0.0/11
                              x-kubernetes-validations:
                                - rule: isCIDR(self)
                                  message: must be a CIDR
                            blockPrefixLength:
                              type: integer
                              minimum: 1
                              maximum: 30
                              default: 14
                        serviceNetworkPool:
                          type: object
                          description: Service CIDR pool.
                          x-kubernetes-validations:
                            - rule: "!has(self.cidr) || !has(self.blockPrefixLength) || !isCIDR(self.cidr) || cidr(self.cidr).prefixLength() <= self.blockPrefixLength"
                              message: blockPrefixLength must not be shorter than the pool prefix
                          properties:
                            cidr:
                              type: string
                              maxLength: 64
                              default: 100.96.0.0/11
                              x-kubernetes-validations:
                                - rule: isCIDR(self)
                                  message: must be a CIDR
                            blockPrefixLength:
                              type: integer
                              minimum: 1
                              maximum: 30
                              default: 16
                aws:
                  type: object
                  description: AWS account. Required when type is aws.
                  required: [accountId, region]
                  properties:
                    accountId:
                      type: string
                      pattern: '^[0-9]{12}$'
                      description: AWS account ID.
                    region:
                      type: string
                      maxLength: 32
                      description: AWS region, e.g. us-east-1.
                    baseDomain:
                      type: string
                      maxLength: 253
                      description: Parent Route53 domain for tenant projects.
            status:
              type: object
              properties:
                capabilities:
                  type: object
                  description: >-
                    What the site offers, as discovered by the provision job. Known keys: evpn (the site can
                    attach to a HybridFabric), virtualization (OpenShift Virtualization present), frrK8s (FRR
                    provider and route advertisements enabled), dataplane (NetConfig and NodeSets found),
                    openstackApi (cloud API reachable with the credentials).
                  additionalProperties:
                    type: boolean
                site:
                  type: object
                  description: Observed site details (informational).
                  properties:
                    endpoint:
                      type: string
                      description: Cloud API or cluster API endpoint.
                    region:
                      type: string
                    version:
                      type: string
                      description: Platform version (OpenStack release or OpenShift version).
                    dataplaneNodeSets:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          ready:
                            type: boolean
                  x-kubernetes-preserve-unknown-fields: true
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
