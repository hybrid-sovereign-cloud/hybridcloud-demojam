apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudgateways.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudGateway
    listKind: CloudGatewayList
    plural: cloudgateways
    singular: cloudgateway
    shortNames:
      - cgw
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Cloud landing-zone gateway for Hybrid VPC.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                cloud:
                  type: string
                  enum: [aws, openstack, openshift]
                region:
                  type: string
                domainAsn:
                  type: integer
                landingZoneTemplate:
                  type: string
                  default: default
                fabricRef:
                  type: string
                transport:
                  type: object
                  properties:
                    type:
                      type: string
                      description: >-
                        none = native underlay peering to the fabric BGW (HCP spokes on the hub
                        underlay L2). wireguard = site gateway VM tunnels to the BGW over
                        WireGuard inside wstunnel (TLS via the hub ingress).
                      enum: [wireguard, ipsec, macsec, none]
                    vaultPeerConfigRef:
                      type: string
                      description: >-
                        Vault KV path holding this gateway's WireGuard key pair
                        (wgPrivateKey, wgPublicKey; optional sshPublicKey). Read by the
                        BGW (public key) and by the site gateway VM (private key).
                siteUnderlay:
                  type: object
                  description: >-
                    cloud=openstack only. Site underlay L2 between the gateway VM (on the RHOSO
                    management OpenShift cluster) and the EDPM computes' fabric NIC.
                  properties:
                    interface:
                      type: string
                      description: Spare NIC on the management-cluster nodes enslaved to br-fabric (e.g. enp7s0)
                    computeInterface:
                      type: string
                      description: EDPM compute NIC on the same L2 (e.g. eth5); becomes the EVPN VTEP / FRR source
                    cidr:
                      type: string
                      description: Site underlay CIDR (e.g. 192.168.80.0/24); NetConfig network `fabric`
                    gatewayAddress:
                      type: string
                      description: Gateway VM eth1 address without prefix length (default first host of cidr)
                    mtu:
                      type: integer
                      default: 1442
                    macNatShim:
                      type: object
                      description: >-
                        LAB ONLY. The RHDP hypervisor drops frames whose source MAC is not the
                        node NIC's own MAC, so a bridged VM cannot talk on the spare NIC. When
                        enabled, a privileged DaemonSet runs on every node, reads the local NIC
                        MAC at runtime (/sys/class/net/<interface>/address in the host netns)
                        and applies an nft bridge table rewriting vmMac <-> node MAC on that
                        NIC. Harmless on nodes not hosting the gateway VM, so the VM is not
                        pinned and no per-node values are needed. Physical deployments leave
                        this off.
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        vmMac:
                          type: string
                          default: "02:fa:b0:50:00:01"
                          description: Gateway VM fabric NIC MAC (also used as the VM interface macAddress)
                        interface:
                          type: string
                          description: Node NIC to translate on (default siteUnderlay.interface)
                wireguard:
                  type: object
                  properties:
                    address:
                      type: string
                      description: Gateway wg0 address with prefix length (e.g. 10.254.254.12/32)
                managementClusterKubeconfigRef:
                  type: string
                  description: >-
                    Vault KV path (key kubeconfig) for the RHOSO management OpenShift cluster.
                    Defaults to the referenced CloudOSO.spec.managementClusterKubeconfigRef.
                awsAccountId:
                  type: string
                openstackCloudOSORef:
                  type: string
                platformOpenshiftRef:
                  type: string
                  description: PlatformOpenshift name in the gateway entity namespace (hosted/openstack spokes)
                virtCloudVirtRef:
                  type: string
                  description: Optional CloudVirt environment name when landing on CNV
            status:
              type: object
              properties:
                landingZoneReady:
                  type: boolean
                gatewayAddress:
                  type: string
                transportReady:
                  type: boolean
                peerCount:
                  type: integer
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cloud
          type: string
          jsonPath: .spec.cloud
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
