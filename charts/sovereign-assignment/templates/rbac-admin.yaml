{{- if ne .Values.toolRbac.assignmentAdminGroup "" }}
{{- $devopsNs := printf "%s-%s-devops" .Values.entity .Values.team }}
{{- $istioNs := printf "%s-%s-istio" .Values.entity .Values.team }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assignment-admin
  namespace: {{ $devopsNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.toolRbac.assignmentAdminGroup }}
{{- range .Values.projects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assignment-admin
  namespace: {{ $.Values.entity }}-{{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ $.Values.toolRbac.assignmentAdminGroup }}
{{- end }}
{{- if $.Values.features.istio }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assignment-admin
  namespace: {{ $istioNs }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.toolRbac.assignmentAdminGroup }}
{{- end }}
{{- end }}
