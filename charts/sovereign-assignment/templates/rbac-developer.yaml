{{- if ne .Values.toolRbac.assignmentDeveloperGroup "" }}
{{- range .Values.projects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assignment-developer
  namespace: {{ $.Values.entity }}-{{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ $.Values.toolRbac.assignmentDeveloperGroup }}
{{- end }}
{{- end }}
