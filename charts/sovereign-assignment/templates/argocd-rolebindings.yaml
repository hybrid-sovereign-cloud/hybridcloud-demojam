{{- if .Values.features.gitops }}
{{- range .Values.projects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Values.entity }}-{{ $.Values.team }}-argocd-admin-{{ . }}
  namespace: {{ $.Values.entity }}-{{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.entity }}-{{ $.Values.team }}-argocd-argocd-application-controller
    namespace: {{ $.Values.entity }}-{{ $.Values.team }}-devops
  - kind: ServiceAccount
    name: {{ $.Values.entity }}-{{ $.Values.team }}-argocd-argocd-server
    namespace: {{ $.Values.entity }}-{{ $.Values.team }}-devops
{{- end }}
{{- end }}
