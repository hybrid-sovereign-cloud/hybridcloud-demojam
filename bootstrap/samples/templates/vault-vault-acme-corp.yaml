{{- if .Values.samples.vault.vault_acme_corp.enabled }}
{{/*
  ha: true → plugin-vault deploys 3 replicas with integrated raft (not file).
  File storage is valid only for ha: false (single replica).
*/}}
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Vault
metadata:
  name: acme-vault
  namespace: entity-acme-corp
spec:
  ha: true
  rbacConfig: keycloak-sovereign-tenants-services
{{- end }}
