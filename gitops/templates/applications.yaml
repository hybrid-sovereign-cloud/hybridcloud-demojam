{{- /*
Child Applications — ZTP wave order (parent sync waits for prior wave Healthy):
  0  AppProject + Namespaces (templates/)
  5  hs-argocd-capacity
 10  hs-eso
 15  hs-builds
 20  hs-vault
 22  hs-security
 24  hs-mce              — MulticlusterEngine OLM (before ACM hub)
 26  hs-acm              — ACM hub / MultiClusterHub
 30  hs-quay
 31  hs-gitea
 35  hs-aap-config
 38  hs-crds             — hybridsovereign CRDs only
 40  hs-operators        — Deployments + image-wait (needs CRDs + image)
 42  hs-platform-configs — ZTP prereq: RbacConfig/AAPConfig/QuayConfig (+ secret/ready hooks)
 46  hs-platform-smoke   — always-on ACME Entity + dummy tool CRs
 50  hs-ui
 60  hs-samples          — gated by provision.samples (default: false)

Per-app debug (no full wipe): ./scripts/ztp-app.sh cleanup|redeploy|wait APP
Full wipe only after every app is independently Healthy: ./scripts/ztp-wipe.sh
*/ -}}
{{- $repo := .Values.global.repoURL -}}
{{- $rev := .Values.global.targetRevision -}}
{{- $server := .Values.global.destinationServer -}}
{{- $partOf := .Values.global.partOf -}}


{{- if (default true .Values.provision.argocdCapacity) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hs-argocd-capacity
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/instance: field-content
    app.kubernetes.io/part-of: {{ $partOf }}
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hybridsovereign
  source:
    repoURL: {{ $repo | quote }}
    targetRevision: {{ $rev | quote }}
    path: gitops/infrastructure/argocd-capacity
  destination:
    server: {{ $server | quote }}
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}

