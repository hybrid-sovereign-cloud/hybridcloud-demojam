{{- if .Values.provision.quay }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hs-quay
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: {{ $partOf }}
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hybridsovereign
  source:
    repoURL: {{ $repo | quote }}
    targetRevision: {{ $rev | quote }}
    path: gitops/infrastructure/quay
  destination:
    server: {{ $server | quote }}
    namespace: quay
  ignoreDifferences:
    - group: quay.redhat.com
      kind: QuayRegistry
      jqPathExpressions:
        - .spec.components
        - .status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
{{- end }}

{{- if .Values.provision.gitea }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hs-gitea
