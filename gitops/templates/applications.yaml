    repoURL: {{ $repo | quote }}
    targetRevision: {{ $rev | quote }}
    path: gitops/infrastructure/gitea
  destination:
    server: {{ $server | quote }}
    namespace: gitea
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/storageClassName
        - /spec/volumeName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

