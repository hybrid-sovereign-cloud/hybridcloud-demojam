{{- /*
Child Applications — each points at a path under gitops/ in the same repo.
Everything is Argo-managed for mirror replica installs on clusters 1..N.
*/ -}}
{{- $repo := .Values.global.repoURL -}}
{{- $rev := .Values.global.targetRevision -}}
{{- $server := .Values.global.destinationServer -}}
{{- $partOf := .Values.global.partOf -}}

{{- if .Values.provision.eso }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hs-eso
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: {{ $partOf }}
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hybridsovereign
  source:
    repoURL: {{ $repo | quote }}
    targetRevision: {{ $rev | quote }}
    path: gitops/operators/eso
  destination:
    server: {{ $server | quote }}
    namespace: openshift-external-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}

