{{- if .Values.provision.namespaces }}
{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    app.kubernetes.io/part-of: {{ $.Values.global.partOf }}
    app.kubernetes.io/managed-by: argocd
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Never prune platform namespaces — child-app ownership drift must not delete them.
    argocd.argoproj.io/sync-options: Prune=false
{{- end }}
{{- end }}
