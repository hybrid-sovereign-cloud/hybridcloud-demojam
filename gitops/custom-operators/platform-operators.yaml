---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybridsovereign-rbacconfig-operator
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/operator-kind: RbacConfig
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hybridsovereign-rbacconfig-operator
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: hybridsovereign-rbacconfig-operator
    namespace: sovereign-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hybridsovereign-entity-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: watches-rbacconfig
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
data:
  watches.yaml: |
    ---
    - version: v1alpha1
      group: hybridsovereign.redhat
      kind: RbacConfig
      role: kind_reconcile
      snakeCaseParameters: false
      reconcilePeriod: 1h
      finalizer:
        name: rbacconfig.hybridsovereign.redhat/finalizer
        role: kind_reconcile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybridsovereign-rbacconfig-operator
  namespace: sovereign-cloud
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/operator-kind: RbacConfig
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      hybridsovereign.redhat/operator-kind: RbacConfig
  template:
    metadata:
      labels:
        hybridsovereign.redhat/operator-kind: RbacConfig
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: hybridsovereign-rbacconfig-operator
      containers:
        - name: operator
          image: quay.io/gauravshankar/hybridsovereign-ansible-operator:latest
          imagePullPolicy: Always
          env:
            - name: MAX_CONCURRENT_RECONCILES
              value: "2"
            - name: OPERATOR_KIND
              value: RbacConfig
            - name: WATCH_NAMESPACE
              value: ""
            - name: AAP_HOST
              valueFrom:
                secretKeyRef:
                  name: aap-operator-credentials
                  key: host
                  optional: true
            - name: AAP_USER
              valueFrom:
                secretKeyRef:
                  name: aap-operator-credentials
                  key: username
                  optional: true
            - name: AAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aap-operator-credentials
                  key: password
                  optional: true
          volumeMounts:
            - name: watches
              mountPath: /opt/ansible/watches.yaml
              subPath: watches.yaml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: watches
          configMap:
            name: watches-rbacconfig

