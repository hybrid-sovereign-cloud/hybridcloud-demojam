# Tenant-scoped kind operators (cluster-wide watch). Non-parked kinds only.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybridsovereign-rbac-operator
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/operator-kind: Rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hybridsovereign-rbac-operator
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: hybridsovereign-rbac-operator
    namespace: sovereign-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hybridsovereign-entity-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: watches-rbac
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
data:
  watches.yaml: |
    ---
    - version: v1alpha1
      group: hybridsovereign.redhat
      kind: Rbac
      role: kind_reconcile
      snakeCaseParameters: false
      finalizer:
        name: rbac.hybridsovereign.redhat/finalizer
        role: kind_reconcile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybridsovereign-rbac-operator
  namespace: sovereign-cloud
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/operator-kind: Rbac
spec:
  replicas: 1
  selector:
    matchLabels:
      hybridsovereign.redhat/operator-kind: Rbac
  template:
    metadata:
      labels:
        hybridsovereign.redhat/operator-kind: Rbac
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: hybridsovereign-rbac-operator
      containers:
        - name: operator
          image: image-registry.openshift-image-registry.svc:5000/sovereign-cloud/hybridsovereign-ansible-operator:latest
          imagePullPolicy: Always
          env:
            - name: OPERATOR_KIND
              value: Rbac
            - name: WATCH_NAMESPACE
              value: ""
            - name: AAP_HOST
              valueFrom:
                secretKeyRef:
                  name: aap-operator-credentials
                  key: host
                  optional: true
            - name: AAP_USER
              valueFrom:
                secretKeyRef:
                  name: aap-operator-credentials
                  key: username
                  optional: true
            - name: AAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aap-operator-credentials
                  key: password
                  optional: true
          volumeMounts:
            - name: watches
              mountPath: /opt/ansible/watches.yaml
              subPath: watches.yaml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: watches
          configMap:
            name: watches-rbac
---
