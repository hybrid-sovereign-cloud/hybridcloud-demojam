# Gate operator Deployments until ImageStream tags exist (ZTP: builds finish after BC create).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybridsovereign-image-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hybridsovereign-image-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams"]
    verbs: ["get", "list"]
  - apiGroups: ["build.openshift.io"]
    resources: ["builds", "buildconfigs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hybridsovereign-image-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hybridsovereign-image-wait
subjects:
  - kind: ServiceAccount
    name: hybridsovereign-image-wait
    namespace: sovereign-cloud
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hybridsovereign-image-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    # Before operator Deployments (wave 10+ in this app)
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hybridsovereign-image-wait
    spec:
      serviceAccountName: hybridsovereign-image-wait
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              NS=sovereign-cloud
              REQUIRED=(hybridsovereign-ansible-operator)
              echo "Waiting for ImageStream tags in ${NS}: ${REQUIRED[*]}"
              for i in $(seq 1 90); do
                ok=1
                for is in "${REQUIRED[@]}"; do
                  tag=$(oc get is -n "$NS" "$is" -o jsonpath='{.status.tags[?(@.tag=="latest")].tag}' 2>/dev/null || true)
                  if [ -z "$tag" ]; then
                    ok=0
                    echo "  missing ${is}:latest (attempt ${i}/90)"
                  fi
                done
                if [ "$ok" = "1" ]; then
                  echo "All required ImageStreams ready."
                  oc get is -n "$NS" "${REQUIRED[@]}" -o custom-columns=NAME:.metadata.name,LATEST:.status.tags[0].tag
                  exit 0
                fi
                sleep 20
              done
              echo "ERROR: ImageStreams not ready after timeout — check hs-builds"
              oc get is,builds -n "$NS" || true
              exit 1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
