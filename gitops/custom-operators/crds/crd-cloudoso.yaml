apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudosos.hybridsovereign.redhat
  labels:
    app.kubernetes.io/instance: hs-crds
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/tracking-id: "hs-crds:apiextensions.k8s.io/CustomResourceDefinition:sovereign-cloud/cloudosos.hybridsovereign.redhat"
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudOSO
    listKind: CloudOSOList
    plural: cloudosos
    singular: cloudoso
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Tenant OpenStack project on a platform CloudInfrastructure (type openstack): creates the
            Keystone project, application credential and per-project clouds.yaml, plus DNS
            prerequisites, and exposes the observed outputs and Namespace entity metadata on status.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: >-
                Desired helper inputs forwarded to OSOHelper spec.environmentprep
                on the central cluster.
              type: object
              required: [cloudRef]
              properties:
                cloudRef:
                  type: object
                  description: >-
                    Platform CloudInfrastructure (type openstack) this project is created on, in the platform
                    namespace (sovereign-cloud). Supplies the cloud credentials and site settings.
                  required: [name]
                  properties:
                    kind:
                      type: string
                      enum: [CloudInfrastructure]
                      default: CloudInfrastructure
                    name:
                      type: string
                      maxLength: 253
                project:
                  type: string
                  description: OpenStack project name hint (required)
                vaultPath:
                  type: string
                  description: >-
                    Deprecated; set spec.cloudRef (credentials come from the CloudInfrastructure). Vault path for
                    OpenStack admin credentials, used only when cloudRef is unset.
                credentialsSecretRef:
                  type: object
                  description: >-
                    Deprecated; set spec.cloudRef. Secret in the same namespace holding key clouds.yaml, used only
                    when cloudRef is unset.
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: Name of the Secret in the CloudOSO namespace
                baseDomain:
                  type: string
                  description: Base DNS domain
                projectDomain:
                  type: string
                  description: Keystone domain name. Unset falls back to the CloudInfrastructure value.
                externalNetwork:
                  type: string
                  description: External Neutron network. Unset falls back to the CloudInfrastructure value.
                route53VaultPath:
                  type: string
                  description: Vault path for Route53 credentials (e.g. oso/accounts/route53-openstack)
                landingzone:
                  type: string
                  description: Landing Zone template name
                  default: default
                designateZoneId:
                  type: string
                  description: Designate zone UUID. Unset falls back to the CloudInfrastructure value.
                designateProjectId:
                  type: string
                  description: OpenStack project ID owning the Designate zone. Unset falls back to the CloudInfrastructure value.
            status:
              description: Observed OSOHelper outputs, Namespace labels/annotations, and readiness.
              type: object
              properties:
                name:
                  type: string
                namespace:
                  type: string
                entity:
                  type: string
                slug:
                  type: string
                domain:
                  type: string
                route53ZoneId:
                  type: string
                apiVIP:
                  type: string
                ingressVIP:
                  type: string
                externalNetwork:
                  type: string
                billingId:
                  type: string
                description:
                  type: string
                osoHelperName:
                  type: string
                  description: Name of the OSOHelper CR created in central cluster
                osoHelperCreated:
                  type: boolean
                  description: Whether the OSOHelper CR was created successfully
                centralApiServer:
                  type: string
                  description: Central cluster API server URL
                projectName:
                  type: string
                  description: OpenStack project name created by OSOHelper
                projectId:
                  type: string
                  description: OpenStack project ID returned by OSOHelper
                domainId:
                  type: string
                  description: OpenStack domain ID from OSOHelper
                domainName:
                  type: string
                  description: OpenStack domain name from OSOHelper
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  type: string
                  format: date-time
                  description: Timestamp of the last reconciliation attempt
                message:
                  type: string
                  description: Human-readable status message (set on failure)
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .metadata.name
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Slug
          type: string
          jsonPath: .status.slug
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Project
          type: string
          jsonPath: .status.projectName
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Last-Reconciled
          type: string
          jsonPath: .status.lastReconciledAt
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
