#   >>> TIGHTEN-LATER-DROP .. <<< TIGHTEN-LATER-DROP  deprecated fields to delete
#   TIGHTEN-LATER-REMOVE at end of line               line to delete
# Command: docs/usage/crds/README.md, section "Tightening validation".
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudgateways.hybridsovereign.redhat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudGateway
    listKind: CloudGatewayList
    plural: cloudgateways
    singular: cloudgateway
    shortNames:
      - cgw
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Attaches one cloud site (a CloudInfrastructure) to a HybridFabric. Platform-owned, one per site,
            shared by every tenant VRF on the fabric.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              # >>> TIGHTEN-LATER-ADD
              # required: [fabricRef, cloudRef]
              # <<< TIGHTEN-LATER-ADD
              properties:
                enabled:
                  type: boolean
                  default: false
                fabricRef:
                  type: string
                  description: HybridFabric name in the same namespace.
                cloudRef:
                  type: object
                  description: >-
                    The site this gateway attaches. A CloudInfrastructure in the same namespace; its spec.type
                    selects the gateway flavour (openstack: site gateway VM; openshift: hub-side landing).
                  required: [name]
                  properties:
                    kind:
                      type: string
                      enum: [CloudInfrastructure]
                      default: CloudInfrastructure
                    name:
                      type: string
                      maxLength: 253
                transport:
                  type: object
                  properties:
                    type:
                      type: string
                      description: >-
                        none: the site peers with the border gateway over the underlay. wireguard: a site gateway
                        VM tunnels to the border gateway (WireGuard carried over TLS through the hub ingress).
                        Defaults to the fabric's transportDefaults.defaultTunnelType.
                      enum: [none, wireguard, ipsec, macsec]  # TIGHTEN-LATER-REMOVE
                      # >>> TIGHTEN-LATER-ADD
                      # enum: [none, wireguard]
                      # <<< TIGHTEN-LATER-ADD
                    vaultPeerConfigRef:
                      type: string
                      description: >-
                        Vault KV path holding this gateway's WireGuard key pair (wgPrivateKey, wgPublicKey).
                        Defaults to fabric/wireguard/<gateway>.
                wireguard:
                  type: object
                  description: Site gateway tunnel settings (transport.type wireguard).
                  properties:
                    address:
                      type: string
                      description: >-
                        Site gateway tunnel address with prefix length, e.g. 10.254.254.12/32. Allocated from the
                        border gateway's tunnel subnet when omitted.
                      # >>> TIGHTEN-LATER-ADD
                      # maxLength: 64
                      # x-kubernetes-validations:
                      #   - rule: isCIDR(self)
                      #     message: must be an address with prefix length
                      # <<< TIGHTEN-LATER-ADD
                siteUnderlay:
                  type: object
                  description: >-
                    OpenStack sites only. Site underlay L2 between the site gateway VM and the data plane compute
                    nodes.
                  properties:
                    interface:
                      type: string
                      description: Node NIC on the management cluster bridged to the site underlay.
                    computeInterface:
                      type: string
                      description: Compute node NIC on the site underlay; used as the EVPN VTEP and BGP source.
                    nodeSetInterfaces:
                      type: object
                      description: Optional per-NodeSet compute NIC override (NodeSet name to interface); falls back to computeInterface.
                      additionalProperties:
                        type: string
                    cidr:
                      type: string
                      description: Site underlay CIDR, e.g. 192.168.80.0/24
                      # >>> TIGHTEN-LATER-ADD
                      # maxLength: 64
                      # x-kubernetes-validations:
                      #   - rule: isCIDR(self)
                      #     message: must be a CIDR
                      # <<< TIGHTEN-LATER-ADD
                    gatewayAddress:
                      type: string
                      description: Site gateway address. Defaults to the first host of cidr.
                      # >>> TIGHTEN-LATER-ADD
                      # maxLength: 64
                      # x-kubernetes-validations:
                      #   - rule: isIP(self)
                      #     message: must be an IP address
                      # <<< TIGHTEN-LATER-ADD
                    mtu:
                      type: integer
                      default: 1442
                      # >>> TIGHTEN-LATER-ADD
                      # minimum: 1280
                      # maximum: 9216
                      # <<< TIGHTEN-LATER-ADD
                    # >>> TIGHTEN-LATER-DROP
                    macNatShim:
                      type: object
                      description: Deprecated; use spec.macNatShim.
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        vmMac:
                          type: string
                          default: "02:fa:b0:50:00:01"
                          description: MAC address of the site gateway VM underlay interface.
                        interface:
                          type: string
                          description: Node NIC to translate on. Defaults to siteUnderlay.interface.
                    # <<< TIGHTEN-LATER-DROP
                macNatShim:
                  type: object
                  description: >-
                    MAC-translation shim on the node NIC that carries this gateway's underlay leg (openstack: the
                    site gateway VM on the management cluster; openshift: the border gateway's hub leg). Only for
                    environments whose hypervisor enforces source-MAC filtering on node NICs; test environments
                    only.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    interface:
                      type: string
                      maxLength: 15
                      description: >-
                        Node NIC to translate on. Defaults to siteUnderlay.interface (openstack) or the node's
                        primary NIC (openshift).
                # >>> TIGHTEN-LATER-DROP
                cloud:
                  type: string
                  description: Deprecated; derived from the CloudInfrastructure type.
                  enum: [aws, openstack, openshift]
                region:
                  type: string
                  description: Deprecated; comes from the CloudInfrastructure.
                domainAsn:
                  type: integer
                  description: Deprecated; the fabric ASN (HybridFabric.spec.domainAsn) is used.
                landingZoneTemplate:
                  type: string
                  description: Deprecated; unused.
                  default: default
                managementClusterKubeconfigRef:
                  type: string
                  description: Deprecated; use CloudInfrastructure.spec.openstack.managementClusterKubeconfigRef.
                awsAccountId:
                  type: string
                  description: Deprecated; use CloudInfrastructure.spec.aws.accountId.
                openstackCloudOSORef:
                  type: string
                  description: Deprecated; use spec.cloudRef.
                platformOpenshiftRef:
                  type: string
                  description: Deprecated; hosted clusters no longer attach to the fabric.
                virtCloudVirtRef:
                  type: string
                  description: Deprecated; use spec.cloudRef.
                # <<< TIGHTEN-LATER-DROP
            status:
              type: object
              properties:
                landingZoneReady:
                  type: boolean
                gatewayAddress:
                  type: string
                transportReady:
                  type: boolean
                peerCount:
                  type: integer
                peerState:
                  type: string
                  description: BGP session state between the site and the border gateway (e.g. Established).
                vtep:
                  type: string
                  description: Site VTEP address(es), comma-separated when several nodes act as VTEPs.
                importedRts:
                  type: array
                  description: Route targets the site currently imports.
                  items:
                    type: string
                edpmNodeSets:
                  type: array
                  description: Fabric rollout state per data plane NodeSet, in rollout order.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      fingerprint:
                        type: string
                      deployment:
                        type: string
                      state:
                        type: string
                        enum:
                          - Converged
                          - Ready
                          - Failed
                          - NotAttempted
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Fabric
          type: string
          jsonPath: .spec.fabricRef
        - name: Cloud
          type: string
          jsonPath: .spec.cloudRef.name
        - name: Transport
          type: string
          jsonPath: .spec.transport.type
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
