# Validation tightened on 2026-10-08 (restructure cutover, plan §5b step 6):
# required fields, immutables, CEL rules and narrowed enums are active and the
# deprecated pre-CloudInfrastructure fields are gone.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkplacements.hybridsovereign.redhat
  labels:
    app.kubernetes.io/instance: hs-crds
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/tracking-id: "hs-crds:apiextensions.k8s.io/CustomResourceDefinition:sovereign-cloud/networkplacements.hybridsovereign.redhat"
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: NetworkPlacement
    listKind: NetworkPlacementList
    plural: networkplacements
    singular: networkplacement
    shortNames:
      - nplace
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            Places a HybridNetwork (tenant VRF) onto one tenant cloud project (CloudOSO, CloudVirt or
            CloudAWS) with the given overlay prefixes.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [network, backend]
              x-kubernetes-validations:
                - rule: "!has(self.vmNamespaces) || (has(self.backend) && self.backend.kind == 'CloudVirt')"
                  message: vmNamespaces is only valid for backend kind CloudVirt
              properties:
                network:
                  type: string
                  description: HybridNetwork name in the same namespace.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: network is immutable
                backend:
                  type: object
                  description: Tenant cloud project the network is placed on, in the same namespace.
                  required: [kind, name]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: backend is immutable
                  properties:
                    kind:
                      type: string
                      description: PlatformOpenshift is deprecated (hosted clusters do not attach to the fabric).
                      enum: [CloudAWS, CloudOSO, CloudVirt]
                    name:
                      type: string
                prefixes:
                  type: array
                  description: >-
                    Overlay prefixes for this placement. Unique within the HybridNetwork. CloudVirt prefixes must
                    not overlap the hub's cluster, service or node networks.
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 64
                    x-kubernetes-validations:
                      - rule: isCIDR(self)
                        message: must be a CIDR
                vmNamespaces:
                  type: array
                  description: >-
                    Backend kind CloudVirt only. Hub namespaces the operator creates for this placement's VMs,
                    labelled at creation as primary-network members of the HybridNetwork (a namespace joins one
                    network only; an existing namespace is refused unless this entity and CloudVirt own it).
                    Defaults to one namespace named <cloudvirt>-<network>.
                  maxItems: 16
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    maxLength: 63
                    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
            status:
              type: object
              properties:
                entity:
                  type: string
                networkId:
                  type: string
                targetBackend:
                  type: string
                vni:
                  type: integer
                vrfName:
                  type: string
                canonicalRt:
                  type: string
                backendRt:
                  type: string
                rtStrategy:
                  type: string
                domainAsn:
                  type: integer
                backendReady:
                  type: boolean
                prerequisiteReady:
                  type: boolean
                fabricApplied:
                  type: boolean
                backendApplied:
                  type: boolean
                validated:
                  type: boolean
                lastValidatedAt:
                  type: string
                  format: date-time
                realizedPrefixes:
                  type: array
                  items:
                    type: string
                vmNamespaces:
                  type: array
                  description: CloudVirt placements only. Namespaces created and joined to the network.
                  items:
                    type: string
                backendIds:
                  type: object
                  description: Backend object identifiers (e.g. Neutron network/router IDs, CUDN name).
                  additionalProperties:
                    type: string
                microNvaName:
                  type: string
                cloudGatewayRef:
                  type: string
                transportLinkRef:
                  type: string
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.network
        - name: Backend
          type: string
          jsonPath: .spec.backend.kind
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
