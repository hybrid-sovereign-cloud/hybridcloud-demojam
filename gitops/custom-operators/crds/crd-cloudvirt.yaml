apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudvirts.hybridsovereign.redhat
  labels:
    app.kubernetes.io/instance: hs-crds
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/tracking-id: "hs-crds:apiextensions.k8s.io/CustomResourceDefinition:sovereign-cloud/cloudvirts.hybridsovereign.redhat"
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: CloudVirt
    listKind: CloudVirtList
    plural: cloudvirts
    singular: cloudvirt
    shortNames:
      - cvirt
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: >-
            CloudVirt declares an OpenShift Virtualization (CNV) environment
            used as a target for PlatformOpenshift type=virt|hosted. Shape
            mirrors CloudOSO (vaultPath, baseDomain, toolRbac) with zero
            hardcoded cluster endpoints.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [vaultPath, baseDomain]
              properties:
                vaultPath:
                  type: string
                  description: Vault KV path for virt environment credentials (optional secrets)
                baseDomain:
                  type: string
                  description: Parent DNS domain for virt workloads (no cluster URL)
                storageClass:
                  type: string
                  description: Preferred StorageClass for VM disks
                  default: ocs-storagecluster-ceph-rbd
                networkAttachment:
                  type: string
                  description: Optional NAD name for secondary networking
                enableVRF:
                  type: boolean
                  description: Enable VRF / EVPN-ready networking (design-time flag)
                  default: false
                vrfId:
                  type: string
                  description: VRF identifier when enableVRF is true
                toolRbac:
                  type: object
                  properties:
                    environmentAdminRbac:
                      type: array
                      items:
                        type: string
                    environmentPoweruserRbac:
                      type: array
                      items:
                        type: string
                    environmentViewerRbac:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                name:
                  type: string
                namespace:
                  type: string
                entity:
                  type: string
                slug:
                  type: string
                domain:
                  type: string
                status:
                  type: string
                  description: Lifecycle status (reconciling, ready, failed)
                lastReconciledAt:
                  type: string
                  format: date-time
                message:
                  type: string
                ready:
                  type: boolean
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Entity
          type: string
          jsonPath: .status.entity
        - name: Slug
          type: string
          jsonPath: .status.slug
        - name: Domain
          type: string
          jsonPath: .status.domain
        - name: Status
          type: string
          jsonPath: .status.status
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
