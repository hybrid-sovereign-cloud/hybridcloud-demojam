apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridfabrics.hybridsovereign.redhat
  labels:
    app.kubernetes.io/instance: hs-crds
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/tracking-id: "hs-crds:apiextensions.k8s.io/CustomResourceDefinition:sovereign-cloud/hybridfabrics.hybridsovereign.redhat"
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridFabric
    listKind: HybridFabricList
    plural: hybridfabrics
    singular: hybridfabric
    shortNames:
      - hfab
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Platform EVPN fabric configuration for Hybrid VPC.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                domainAsn:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                routeReflectors:
                  type: array
                  description: >-
                    Deprecated. Hub route-reflector pods; superseded by spec.borderGateway. Leave empty for new fabrics.
                  items:
                    type: object
                    required: [name, address]
                    properties:
                      name:
                        type: string
                      address:
                        type: string
                      nodeName:
                        type: string
                        description: >-
                          Optional node pin for the route-reflector pod (deprecated).
                vniPool:
                  type: object
                  required: [start, end]
                  properties:
                    start:
                      type: integer
                    end:
                      type: integer
                # Platform-owned CIDR pools so each PlatformOpenshift (and VTEP underlay)
                # on this fabric gets non-overlapping address space.
                underlay:
                  type: object
                  description: >-
                    Hub underlay segment shared by the border gateway and member cluster nodes (OVN-K layer2
                    network without IPAM). Fabric-wide unique.
                  properties:
                    nadName:
                      type: string
                      description: Network attachment name; unique per fabric.
                      default: fabric-underlay
                    cidr:
                      type: string
                      description: Underlay CIDR, e.g. 192.168.64.0/18
                    gatewayAddress:
                      type: string
                      description: Border gateway address on the underlay. Defaults to the first host of cidr.
                    dhcpRange:
                      type: object
                      description: Dynamic address range served to member cluster nodes.
                      properties:
                        start:
                          type: string
                        end:
                          type: string
                        leaseTime:
                          type: string
                          default: 10m
                    mtu:
                      type: integer
                      default: 1400
                borderGateway:
                  type: object
                  description: >-
                    Border gateway virtual machine on the hub: fabric route reflector (l2vpn evpn, ipv4
                    unicast), DHCP server and router for spec.underlay, and tunnel endpoint for remote site
                    gateways.
                  properties:
                    name:
                      type: string
                      description: Base name for the VM, Service and Route.
                    loopback:
                      type: string
                      description: BGP router ID and the address all spokes peer with, e.g. 10.255.10.10
                    vaultCredentialRef:
                      type: string
                      description: >-
                        Vault KV path holding the WireGuard key pair (wgPrivateKey, wgPublicKey). Defaults to
                        fabric/<fabric>/bgw.
                    wireguard:
                      type: object
                      properties:
                        address:
                          type: string
                          default: 10.254.254.1/24
                          description: Tunnel interface address with prefix length.
                        listenPort:
                          type: integer
                          default: 51820
                        mtu:
                          type: integer
                          default: 1380
                    ingressHost:
                      type: string
                      description: >-
                        Route host for the tunnel endpoint. Defaults to <name>.<ingress domain>.
                    vmSize:
                      type: object
                      properties:
                        cpu:
                          type: integer
                          default: 2
                        memory:
                          type: string
                          default: 4Gi
                    image:
                      type: string
                      default: docker://quay.io/containerdisks/centos-stream:9
                      description: Root disk image (container disk URL).
                    storageClass:
                      type: string
                      description: StorageClass for the root disk.
                transportDefaults:
                  type: object
                  properties:
                    mtu:
                      type: integer
                      default: 1442
                    innerMssClamp:
                      type: integer
                      default: 1360
                    defaultTunnelType:
                      type: string
                      enum: [wireguard, ipsec, macsec, none]
                      default: wireguard
                numberingAuthority:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                entityRefs:
                  type: array
                  description: >-
                    Entities tagged to consume this fabric (admin multi-select).
                    PlatformOpenshift joined to this fabric must belong to one of these Entities.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Entity name
            status:
              type: object
              properties:
                fabricBaseReady:
                  type: boolean
                borderBgwReady:
                  type: boolean
                  description: True when the border gateway VM is ready, or when no border gateway is configured.
                bgwEndpoint:
                  type: string
                  description: Tunnel endpoint (host:port) for remote site gateways.
                bgwPeerCount:
                  type: integer
                  description: Number of remote site gateways configured as tunnel peers.
                bgwAddress:
                  type: string
                  description: Border gateway underlay address.
                hubRrReady:
                  type: boolean
                  description: >-
                    Deprecated. Readiness of route-reflector pods for spec.routeReflectors.
                allocatedVniCount:
                  type: integer
                availableVniCount:
                  type: integer
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: ASN
          type: integer
          jsonPath: .spec.domainAsn
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
