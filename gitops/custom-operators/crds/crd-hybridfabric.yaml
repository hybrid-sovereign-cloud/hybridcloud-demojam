apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridfabrics.hybridsovereign.redhat
  labels:
    app.kubernetes.io/instance: hs-crds
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/tracking-id: "hs-crds:apiextensions.k8s.io/CustomResourceDefinition:sovereign-cloud/hybridfabrics.hybridsovereign.redhat"
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridFabric
    listKind: HybridFabricList
    plural: hybridfabrics
    singular: hybridfabric
    shortNames:
      - hfab
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Platform EVPN fabric configuration for Hybrid VPC.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                domainAsn:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                routeReflectors:
                  type: array
                  description: >-
                    DEPRECATED. Legacy hostNetwork FRR hub route-reflector pods. Superseded by
                    spec.borderGateway (BGW VM is the route reflector). Only honoured when set;
                    leave empty for new fabrics.
                  items:
                    type: object
                    required: [name, address]
                    properties:
                      name:
                        type: string
                      address:
                        type: string
                      nodeName:
                        type: string
                        description: >-
                          Optional kubernetes.io/hostname pin for the hostNetwork hub RR
                          pod. When omitted, the provisioner pins to the node whose
                          InternalIP equals address (if any).
                vniPool:
                  type: object
                  required: [start, end]
                  properties:
                    start:
                      type: integer
                    end:
                      type: integer
                # Platform-owned CIDR pools so each PlatformOpenshift (and VTEP underlay)
                # on this fabric gets non-overlapping address space.
                ipam:
                  type: object
                  description: >-
                    Fabric address management (design/fabric.md §16). Fabric-wide unique:
                    VNI/RT (numbering ledger), the underlay (machineNetworkPool) and
                    BGW/gateway addresses. Cluster pod/service CIDRs are never advertised
                    into the fabric; they only must not overlap the hub's (HyperShift on
                    KubeVirt) and, with denyOverlappingClusterCidrs, other clusters'.
                    Overlay (HybridNetwork) prefixes are unique per HybridNetwork only.
                    Greenfield: pick hub and cluster pod/service ranges from CG-NAT
                    100.64.0.0/10 so tenants can use all of RFC1918 for overlays.
                  properties:
                    clusterNetworkPool:
                      type: object
                      description: >-
                        Optional. Default pod CIDR space for NEW clusters joined with
                        allocateFromFabric (e.g. 100.64.0.0/11); not a uniqueness pool. Clusters
                        outside it are kept and flagged LegacyClusterCidrs.
                      required: [cidr, blockPrefixLength]
                      properties:
                        cidr:
                          type: string
                          description: "e.g. 10.128.0.0/12"
                        blockPrefixLength:
                          type: integer
                          minimum: 8
                          maximum: 28
                          description: "Prefix length allocated per cluster (e.g. 14 → /14 blocks)"
                          default: 14
                    serviceNetworkPool:
                      type: object
                      description: >-
                        Optional. Default service CIDR space for NEW clusters joined with
                        allocateFromFabric (e.g. 100.96.0.0/11); not a uniqueness pool.
                      required: [cidr, blockPrefixLength]
                      properties:
                        cidr:
                          type: string
                          description: "e.g. 172.30.0.0/15"
                        blockPrefixLength:
                          type: integer
                          minimum: 12
                          maximum: 28
                          default: 16
                    machineNetworkPool:
                      type: object
                      description: >-
                        Hub underlay (VTEP) space, fabric-wide unique; per-cluster machine
                        blocks never overlap each other.
                      required: [cidr, blockPrefixLength]
                      properties:
                        cidr:
                          type: string
                          description: "e.g. 192.168.64.0/18"
                        blockPrefixLength:
                          type: integer
                          minimum: 16
                          maximum: 28
                          default: 24
                    hybridOverlayReserved:
                      type: array
                      description: >-
                        DEPRECATED / advisory only. Not enforced: overlay prefixes are unique
                        per HybridNetwork (NetworkPlacement checks siblings of the same
                        network and the target cluster's own pod/service CIDRs).
                      items:
                        type: string
                    denyOverlappingClusterCidrs:
                      type: boolean
                      default: true
                      description: >-
                        Reject a PlatformOpenshift whose pod/service CIDRs overlap another
                        member cluster's (the hub's CIDRs are always checked).
                borderGateway:
                  type: object
                  description: >-
                    Hub border gateway (BGW) KubeVirt VM: iBGP route reflector for the fabric
                    (l2vpn evpn + ipv4 unicast, next-hop unchanged), DHCP server and IP router
                    for the hub underlay L2, WireGuard-over-WSS endpoint for remote site
                    gateways (design/fabric-bgw-plan.md §4).
                  properties:
                    name:
                      type: string
                      description: VM / Service / Route base name (default fabric-bgw-<fabric minus -fabric suffix>)
                    loopback:
                      type: string
                      description: BGP router-id / cluster-id and the address every spoke peers with (e.g. 10.255.10.10)
                    vaultCredentialRef:
                      type: string
                      description: >-
                        Vault KV path with keys wgPrivateKey, wgPublicKey (and optional
                        sshPublicKey for debug access). Never stored in Git.
                    underlay:
                      type: object
                      description: Hub underlay L2 (OVN-K layer2 NAD, no IPAM) shared by the BGW and HCP workers
                      properties:
                        nadName:
                          type: string
                          default: fabric-underlay
                          description: >-
                            NAD name and OVN-K network name. Must be unique per fabric; the same
                            NAD is also rendered into every joined HostedCluster VM namespace.
                        cidr:
                          type: string
                          description: Underlay CIDR (default spec.ipam.machineNetworkPool.cidr, e.g. 192.168.64.0/18)
                        address:
                          type: string
                          description: BGW eth1 address without prefix length (default first host of cidr)
                        dhcpRange:
                          type: object
                          description: dnsmasq dynamic range served to HCP workers on the underlay
                          properties:
                            start:
                              type: string
                            end:
                              type: string
                            leaseTime:
                              type: string
                              default: 10m
                        mtu:
                          type: integer
                          default: 1400
                    wireguard:
                      type: object
                      properties:
                        address:
                          type: string
                          default: 10.254.254.1/24
                          description: BGW wg0 address with prefix length
                        listenPort:
                          type: integer
                          default: 51820
                        mtu:
                          type: integer
                          default: 1380
                    ingressHost:
                      type: string
                      description: >-
                        Passthrough Route host for the wstunnel server. Default
                        <name>.<hub ingress domain>.
                    vmSize:
                      type: object
                      properties:
                        cpu:
                          type: integer
                          default: 2
                        memory:
                          type: string
                          default: 4Gi
                    image:
                      type: string
                      default: docker://quay.io/containerdisks/centos-stream:9
                      description: Root disk registry import URL (CentOS Stream 9 / RHEL 9 containerdisk)
                    storageClass:
                      type: string
                      description: StorageClass for the BGW root DataVolume (default role value)
                transportDefaults:
                  type: object
                  properties:
                    mtu:
                      type: integer
                      default: 1442
                    innerMssClamp:
                      type: integer
                      default: 1360
                    defaultTunnelType:
                      type: string
                      enum: [wireguard, ipsec, macsec, none]
                      default: wireguard
                numberingAuthority:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                entityRefs:
                  type: array
                  description: >-
                    Entities tagged to consume this fabric (admin multi-select).
                    PlatformOpenshift joined to this fabric must belong to one of these Entities.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Entity metadata.name (e.g. acme-corp, chad)
            status:
              type: object
              properties:
                fabricBaseReady:
                  type: boolean
                borderBgwReady:
                  type: boolean
                  description: True when the BGW VM is Ready (VMI Ready + guest agent connected) or no borderGateway is configured
                bgwEndpoint:
                  type: string
                  description: wss host:port remote site gateways dial (passthrough Route)
                bgwPeerCount:
                  type: integer
                  description: Number of WireGuard peers (remote site gateways) rendered on the BGW
                bgwAddress:
                  type: string
                  description: BGW underlay address (DHCP server / next hop for spoke routes)
                hubRrReady:
                  type: boolean
                  description: >-
                    True when managed hostNetwork FRR hub route-reflector pods for
                    spec.routeReflectors[] are Available (or none configured).
                allocatedVniCount:
                  type: integer
                availableVniCount:
                  type: integer
                ipamReady:
                  type: boolean
                  description: True when ipam pools are valid and ledger ConfigMap exists
                allocatedClusterCidrCount:
                  type: integer
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: ASN
          type: integer
          jsonPath: .spec.domainAsn
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
