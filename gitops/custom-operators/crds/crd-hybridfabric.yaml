apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hybridfabrics.hybridsovereign.redhat
  labels:
    app.kubernetes.io/instance: hs-crds
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/tracking-id: "hs-crds:apiextensions.k8s.io/CustomResourceDefinition:sovereign-cloud/hybridfabrics.hybridsovereign.redhat"
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: "ServerSideApply=false,Replace=true"
spec:
  group: hybridsovereign.redhat
  names:
    kind: HybridFabric
    listKind: HybridFabricList
    plural: hybridfabrics
    singular: hybridfabric
    shortNames:
      - hfab
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Platform EVPN fabric configuration for Hybrid VPC.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                domainAsn:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                routeReflectors:
                  type: array
                  items:
                    type: object
                    required: [name, address]
                    properties:
                      name:
                        type: string
                      address:
                        type: string
                vniPool:
                  type: object
                  required: [start, end]
                  properties:
                    start:
                      type: integer
                    end:
                      type: integer
                # Platform-owned CIDR pools so each PlatformOpenshift (and VTEP underlay)
                # on this fabric gets non-overlapping address space.
                ipam:
                  type: object
                  description: >-
                    Address pools for clusters joining this fabric. Allocations are
                    recorded on PlatformOpenshift.status.networking and in a ledger
                    ConfigMap. Prevents duplicate HostedCluster defaults (e.g. every
                    HCP using 10.132.0.0/14) from colliding on the EVPN fabric.
                  properties:
                    clusterNetworkPool:
                      type: object
                      description: Pod/cluster CIDR superspace carved per OpenShift cluster
                      required: [cidr, blockPrefixLength]
                      properties:
                        cidr:
                          type: string
                          description: "e.g. 10.128.0.0/12"
                        blockPrefixLength:
                          type: integer
                          minimum: 8
                          maximum: 28
                          description: "Prefix length allocated per cluster (e.g. 14 → /14 blocks)"
                          default: 14
                    serviceNetworkPool:
                      type: object
                      description: Service CIDR superspace carved per OpenShift cluster
                      required: [cidr, blockPrefixLength]
                      properties:
                        cidr:
                          type: string
                          description: "e.g. 172.30.0.0/15"
                        blockPrefixLength:
                          type: integer
                          minimum: 12
                          maximum: 28
                          default: 16
                    machineNetworkPool:
                      type: object
                      description: Node/machine underlay CIDR superspace (VTEP-adjacent)
                      required: [cidr, blockPrefixLength]
                      properties:
                        cidr:
                          type: string
                          description: "e.g. 192.168.64.0/18"
                        blockPrefixLength:
                          type: integer
                          minimum: 16
                          maximum: 28
                          default: 24
                    hybridOverlayReserved:
                      type: array
                      description: >-
                        CIDRs reserved for HybridNetwork / NetworkPlacement prefixes
                        on this fabric; must not be allocated as cluster/service/machine.
                      items:
                        type: string
                    denyOverlappingClusterCidrs:
                      type: boolean
                      default: true
                      description: Reject PlatformOpenshift join when proposed CIDRs overlap any member
                borderGateway:
                  type: object
                  properties:
                    name:
                      type: string
                    loopback:
                      type: string
                    vaultCredentialRef:
                      type: string
                transportDefaults:
                  type: object
                  properties:
                    mtu:
                      type: integer
                      default: 9000
                    innerMssClamp:
                      type: integer
                      default: 1360
                    defaultTunnelType:
                      type: string
                      enum: [wireguard, ipsec, macsec, none]
                      default: wireguard
                numberingAuthority:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                entityRefs:
                  type: array
                  description: >-
                    Entities tagged to consume this fabric (admin multi-select).
                    PlatformOpenshift joined to this fabric must belong to one of these Entities.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Entity metadata.name (e.g. acme-corp, chad)
            status:
              type: object
              properties:
                fabricBaseReady:
                  type: boolean
                borderBgwReady:
                  type: boolean
                hubRrReady:
                  type: boolean
                  description: >-
                    True when managed hostNetwork FRR hub route-reflector pods for
                    spec.routeReflectors[] are Available (or none configured).
                allocatedVniCount:
                  type: integer
                availableVniCount:
                  type: integer
                ipamReady:
                  type: boolean
                  description: True when ipam pools are valid and ledger ConfigMap exists
                allocatedClusterCidrCount:
                  type: integer
                status:
                  type: string
                message:
                  type: string
                ready:
                  type: boolean
                deletionComplete:
                  type: boolean
                lastReconciledAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                edaJobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      jobId:
                        type: string
                      url:
                        type: string
                      timestamp:
                        type: string
                      status:
                        type: string
                        enum: [running, success, failed]
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: ASN
          type: integer
          jsonPath: .spec.domainAsn
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
