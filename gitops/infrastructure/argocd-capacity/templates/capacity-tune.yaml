# Scale OpenShift GitOps for first-phase ZTP (many child Applications + SSA).
# Idempotent Job — safe on every sync; does not own the ArgoCD CR (adopt-only patch).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["argocds"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-capacity-tune
subjects:
  - kind: ServiceAccount
    name: argocd-capacity-tune
    namespace: openshift-gitops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-capacity-tune
    spec:
      serviceAccountName: argocd-capacity-tune
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tune
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              NS=openshift-gitops
              NAME=openshift-gitops
              echo "Tuning ArgoCD ${NAME} for ZTP phase-1 capacity..."
              # Controllers: more memory + 2 shards; repo-server: 2 replicas
              oc patch argocd "${NAME}" -n "${NS}" --type=merge -p '{
                "spec": {
                  "controller": {
                    "processors": {"operation": 20, "status": 40},
                    "sharding": {"enabled": true, "replicas": 2},
                    "resources": {
                      "requests": {"cpu": "500m", "memory": "2Gi"},
                      "limits": {"cpu": "4", "memory": "8Gi"}
                    }
                  },
                  "repo": {
                    "replicas": 2,
                    "resources": {
                      "requests": {"cpu": "250m", "memory": "512Mi"},
                      "limits": {"cpu": "2", "memory": "2Gi"}
                    }
                  },
                  "server": {
                    "resources": {
                      "requests": {"cpu": "125m", "memory": "256Mi"},
                      "limits": {"cpu": "1", "memory": "1Gi"}
                    }
                  }
                }
              }'
              echo "ArgoCD capacity patch applied."
              oc get argocd "${NAME}" -n "${NS}" -o jsonpath='controller.shards={.spec.controller.sharding.replicas} repo.replicas={.spec.repo.replicas}{"\n"}'
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
