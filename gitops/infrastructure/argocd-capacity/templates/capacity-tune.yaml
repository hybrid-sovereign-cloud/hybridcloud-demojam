# Scale OpenShift GitOps for first-phase ZTP (many child Applications + SSA).
# Idempotent Job — safe on every sync; does not own the ArgoCD CR (adopt-only patch).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["argocds"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-capacity-tune
subjects:
  - kind: ServiceAccount
    name: argocd-capacity-tune
    namespace: openshift-gitops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-capacity-tune
  namespace: openshift-gitops
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-capacity-tune
    spec:
      serviceAccountName: argocd-capacity-tune
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tune
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              NS=openshift-gitops
              NAME=openshift-gitops
              echo "Tuning ArgoCD ${NAME} for ZTP phase-1 capacity..."
              # Controllers: more memory + 2 shards; repo-server: 2 replicas
              oc patch argocd "${NAME}" -n "${NS}" --type=merge -p '{
                "spec": {
                  "controller": {
                    "processors": {"operation": 20, "status": 40},
                    "sharding": {"enabled": true, "replicas": 2},
                    "resources": {
                      "requests": {"cpu": "500m", "memory": "2Gi"},
                      "limits": {"cpu": "4", "memory": "8Gi"}
                    }
                  },
                  "repo": {
                    "replicas": 2,
                    "resources": {
                      "requests": {"cpu": "250m", "memory": "512Mi"},
                      "limits": {"cpu": "2", "memory": "2Gi"}
                    }
                  },
                  "server": {
                    "resources": {
                      "requests": {"cpu": "125m", "memory": "256Mi"},
                      "limits": {"cpu": "1", "memory": "1Gi"}
                    }
                  }
                }
              }'
              # ZTP-001: CRDs never get tracking-id under annotation-only + Replace;
              # enable label tracking so app.kubernetes.io/instance on CRDs is enough.
              oc patch argocd "${NAME}" -n "${NS}" --type=merge -p '{
                "spec": {
                  "resourceTrackingMethod": "annotation+label"
                }
              }' || true
              # Ignore OpenShift/operator-injected Namespace labels so field-content
              # stays Synced (pod-security.*, kubernetes.io/metadata.name, ESO labels).
              oc patch argocd "${NAME}" -n "${NS}" --type=merge -p '{
                "spec": {
                  "resourceIgnoreDifferences": {
                    "resourceIdentifiers": [
                      {
                        "group": "",
                        "kind": "Namespace",
                        "customization": {
                          "jqPathExpressions": [
                            ".metadata.labels[\"kubernetes.io/metadata.name\"]",
                            ".metadata.labels[\"pod-security.kubernetes.io/audit\"]",
                            ".metadata.labels[\"pod-security.kubernetes.io/audit-version\"]",
                            ".metadata.labels[\"pod-security.kubernetes.io/warn\"]",
                            ".metadata.labels[\"pod-security.kubernetes.io/warn-version\"]",
                            ".metadata.labels[\"pod-security.kubernetes.io/enforce\"]",
                            ".metadata.labels[\"pod-security.kubernetes.io/enforce-version\"]",
                            ".metadata.labels[\"app\"]",
                            ".metadata.labels[\"app.kubernetes.io/version\"]",
                            ".metadata.annotations[\"openshift.io/sa.scc.mcs\"]",
                            ".metadata.annotations[\"openshift.io/sa.scc.supplemental-groups\"]",
                            ".metadata.annotations[\"openshift.io/sa.scc.uid-range\"]",
                            ".metadata.annotations[\"security.openshift.io/MinimallySufficientPodSecurityStandard\"]"
                          ],
                          "managedFieldsManagers": [
                            "external-secrets-operator",
                            "multicluster-operators-application",
                            "multiclusterhub-operator"
                          ]
                        }
                      },
                      {
                        "group": "argoproj.io",
                        "kind": "Application",
                        "customization": {
                          "jqPathExpressions": [
                            ".metadata.annotations[\"kubectl.kubernetes.io/last-applied-configuration\"]",
                            ".status"
                          ]
                        }
                      }
                    ]
                  }
                }
              }' || true
              # Missing workshop seed Secrets must not Degrade hs-security on fresh ZTP.
              oc patch argocd "${NAME}" -n "${NS}" --type=merge -p '{
                "spec": {
                  "resourceHealthChecks": [
                    {
                      "group": "external-secrets.io",
                      "kind": "PushSecret",
                      "check": "hs = {}\nif obj.status ~= nil and obj.status.conditions ~= nil then\n  for i, c in ipairs(obj.status.conditions) do\n    if c.type == \"Ready\" and c.status == \"False\" then\n      msg = c.message or \"\"\n      if string.find(msg, \"could not get source secret\") or string.find(msg, \"SecretNotFound\") or string.find(msg, \"not found\") then\n        hs.status = \"Healthy\"\n        hs.message = \"Optional source secret not present yet\"\n        return hs\n      end\n      hs.status = \"Degraded\"\n      hs.message = msg\n      return hs\n    end\n  end\nend\nhs.status = \"Healthy\"\nreturn hs\n"
                    }
                  ]
                }
              }' || true
              echo "ArgoCD capacity + tracking + ignoreDifferences + PushSecret health patch applied."
              oc get argocd "${NAME}" -n "${NS}" -o jsonpath='controller.shards={.spec.controller.sharding.replicas} repo.replicas={.spec.repo.replicas} tracking={.spec.resourceTrackingMethod}{"\n"}'
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
