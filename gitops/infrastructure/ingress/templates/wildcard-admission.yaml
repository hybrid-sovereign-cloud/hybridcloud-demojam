# Partial adopt of IngressController/default — only routeAdmission.
# Required for Hypershift KubeVirt baseDomainPassthrough (Subdomain wildcard routes).
# Applied by Argo via ServerSideApply; see Application ignoreDifferences for other fields.
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: ServerSideApply=true,RespectIgnoreDifferences=true
spec:
  routeAdmission:
    wildcardPolicy: WildcardsAllowed
