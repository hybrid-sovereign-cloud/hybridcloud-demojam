# Seed AAP JobTemplates against HybridSovereign EDA project (real playbooks).
# Parked kinds stay on hello_world (Demo Project): cloudoso, cloudaws, platformopenshift.
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-aap-seed-jobtemplates
  namespace: aap
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hs-aap-cred-sync
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              HOST=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.host}' | base64 -d)
              USER=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.username}' | base64 -d)
              PASS=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.password}' | base64 -d)
              auth=(-u "$USER:$PASS")
              ORG=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/organizations/?name=Default" | sed -n 's/.*"count":1.*"id":\([0-9]*\).*/\1/p' | head -1)
              [ -n "$ORG" ] || ORG=1
              INV=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/inventories/?name=Demo%20Inventory" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              [ -n "$INV" ] || INV=1
              DEMO_PROJ=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/projects/?name=Demo%20Project" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              [ -n "$DEMO_PROJ" ] || DEMO_PROJ=6
              HS_PROJ=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/projects/?name=HybridSovereign%20EDA" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              if [ -z "${HS_PROJ}" ]; then
                RESP=$(curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/projects/" \
                  -H 'Content-Type: application/json' \
                  -d '{"name":"HybridSovereign EDA","organization":'"$ORG"',"scm_type":"git","scm_url":"https://github.com/hybrid-sovereign-cloud/hybridcloud-demojam.git","scm_branch":"main","scm_update_on_launch":true}')
                HS_PROJ=$(echo "$RESP" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
                echo "created HybridSovereign EDA project id=$HS_PROJ"
                sleep 15
              fi
              echo "ORG=$ORG INV=$INV DEMO_PROJ=$DEMO_PROJ HS_PROJ=$HS_PROJ"

              # kind -> playbook path under HybridSovereign EDA
              declare -A REAL_PB=(
                [entity]=eda/rulebooks/entity-provision-playbook.yml
                [rbacconfig]=eda/plugin-rbac/rulebooks/rbacconfig-provision-playbook.yml
                [rbac]=eda/plugin-rbac/rulebooks/rbac-provision-playbook.yml
                [persona]=eda/persona/playbooks/persona-provision-playbook.yml
                [aapconfig]=eda/plugin-aap/rulebooks/aapconfig-provision-playbook.yml
                [aaporg]=eda/plugin-aap/rulebooks/aaporg-provision-playbook.yml
                [quayconfig]=eda/plugin-quay/rulebooks/quayconfig-provision-playbook.yml
                [quayorg]=eda/plugin-quay/rulebooks/quayorg-provision-playbook.yml
                [vault]=eda/plugin-vault/rulebooks/vault-provision-playbook.yml
                [vaultkv]=eda/plugin-vault/rulebooks/vaultkv-provision-playbook.yml
                [team]=eda/team/rulebooks/team-provision-playbook.yml
                [project]=eda/project/rulebooks/project-provision-playbook.yml
                [assignment]=eda/assignment/rulebooks/assignment-provision-playbook.yml
                [hybridfabric]=eda/hybridvpc/rulebooks/hybridfabric-provision-playbook.yml
                [cloudgateway]=eda/hybridvpc/rulebooks/cloudgateway-provision-playbook.yml
                [transportlink]=eda/hybridvpc/rulebooks/transportlink-provision-playbook.yml
                [hybridnetwork]=eda/hybridvpc/rulebooks/hybridnetwork-provision-playbook.yml
                [networkplacement]=eda/hybridvpc/rulebooks/networkplacement-provision-playbook.yml
                [uihealthchecker]=eda/hybridvpc/rulebooks/uihealthchecker-provision-playbook.yml
              )
              declare -A REAL_TD=(
                [entity]=eda/rulebooks/entity-teardown-playbook.yml
                [rbacconfig]=eda/plugin-rbac/rulebooks/rbacconfig-teardown-playbook.yml
                [rbac]=eda/plugin-rbac/rulebooks/rbac-teardown-playbook.yml
                [persona]=eda/persona/playbooks/persona-teardown-playbook.yml
                [aapconfig]=eda/plugin-aap/rulebooks/aapconfig-teardown-playbook.yml
                [aaporg]=eda/plugin-aap/rulebooks/aaporg-teardown-playbook.yml
                [quayconfig]=eda/plugin-quay/rulebooks/quayconfig-teardown-playbook.yml
                [quayorg]=eda/plugin-quay/rulebooks/quayorg-teardown-playbook.yml
                [vault]=eda/plugin-vault/rulebooks/vault-teardown-playbook.yml
                [vaultkv]=eda/plugin-vault/rulebooks/vaultkv-teardown-playbook.yml
                [team]=eda/team/rulebooks/team-teardown-playbook.yml
                [project]=eda/project/rulebooks/project-teardown-playbook.yml
                [assignment]=eda/assignment/rulebooks/assignment-teardown-playbook.yml
                [hybridfabric]=eda/hybridvpc/rulebooks/hybridfabric-teardown-playbook.yml
                [cloudgateway]=eda/hybridvpc/rulebooks/cloudgateway-teardown-playbook.yml
                [transportlink]=eda/hybridvpc/rulebooks/transportlink-teardown-playbook.yml
                [hybridnetwork]=eda/hybridvpc/rulebooks/hybridnetwork-teardown-playbook.yml
                [networkplacement]=eda/hybridvpc/rulebooks/networkplacement-teardown-playbook.yml
                [uihealthchecker]=eda/hybridvpc/rulebooks/uihealthchecker-teardown-playbook.yml
              )

              # Ensure Vault credential type + credential for VAULT_TOKEN/VAULT_ADDR
              CT=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/credential_types/?name=Sovereign%20Vault%20Token" | sed -n 's/.*"count":\([0-9]*\).*/\1/p' | head -1)
              if [ "${CT:-0}" = "0" ]; then
                curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/credential_types/" \
                  -H 'Content-Type: application/json' \
                  -d '{"name":"Sovereign Vault Token","kind":"cloud","inputs":{"fields":[{"id":"token","label":"Token","type":"string","secret":true},{"id":"addr","label":"Addr","type":"string"}],"required":["token","addr"]},"injectors":{"env":{"VAULT_TOKEN":"{{`{{ token }}`}}","VAULT_ADDR":"{{`{{ addr }}`}}"}}}' >/dev/null
              fi
              CT_ID=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/credential_types/?name=Sovereign%20Vault%20Token" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              VROOT=$(oc get secret vault-init -n vault -o jsonpath='{.data.rootToken}' | base64 -d)
              VADDR=https://vault-vault.apps.cluster-qvhzm.dyn.redhatworkshops.io
              CRED_COUNT=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/credentials/?name=sovereign-vault-admin" | sed -n 's/.*"count":\([0-9]*\).*/\1/p' | head -1)
              if [ "${CRED_COUNT:-0}" = "0" ]; then
                curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/credentials/" \
                  -H 'Content-Type: application/json' \
                  -d "{\"name\":\"sovereign-vault-admin\",\"organization\":$ORG,\"credential_type\":$CT_ID,\"inputs\":{\"token\":\"$VROOT\",\"addr\":\"$VADDR\"}}" >/dev/null
              fi
              CRED_ID=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/credentials/?name=sovereign-vault-admin" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              echo "Vault credential id=$CRED_ID"

              upsert_jt() {
                local NAME="$1" PB="$2" PROJ="$3"
                local ID COUNT
                COUNT=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/job_templates/?name=$NAME" | sed -n 's/.*"count":\([0-9]*\).*/\1/p' | head -1)
                if [ "${COUNT:-0}" = "0" ]; then
                  RESP=$(curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/job_templates/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"name\":\"$NAME\",\"organization\":$ORG,\"inventory\":$INV,\"project\":$PROJ,\"playbook\":\"$PB\",\"ask_variables_on_launch\":true,\"extra_vars\":\"plugin_rbac_keycloak_realm: sso\\nKEYCLOAK_EXTERNAL_URL: https://sso.apps.cluster-qvhzm.dyn.redhatworkshops.io\\n\"}")
                  ID=$(echo "$RESP" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
                  echo "created $NAME id=$ID pb=$PB"
                else
                  ID=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/job_templates/?name=$NAME" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
                  curl -sk "${auth[@]}" -X PATCH "$HOST/api/controller/v2/job_templates/$ID/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"project\":$PROJ,\"playbook\":\"$PB\",\"ask_variables_on_launch\":true,\"extra_vars\":\"plugin_rbac_keycloak_realm: sso\\nKEYCLOAK_EXTERNAL_URL: https://sso.apps.cluster-qvhzm.dyn.redhatworkshops.io\\n\"}" >/dev/null
                  echo "updated $NAME id=$ID pb=$PB"
                fi
                if [ -n "${CRED_ID:-}" ] && [ -n "${ID:-}" ] && [ "$PROJ" = "$HS_PROJ" ]; then
                  curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/job_templates/$ID/credentials/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"id\":$CRED_ID}" >/dev/null || true
                fi
              }

              for k in "${!REAL_PB[@]}"; do
                upsert_jt "${k}-provision" "${REAL_PB[$k]}" "$HS_PROJ"
                upsert_jt "${k}-teardown" "${REAL_TD[$k]}" "$HS_PROJ"
              done

              # Parked kinds remain hello_world stubs
              for k in cloudoso cloudaws platformopenshift; do
                upsert_jt "${k}-provision" "hello_world.yml" "$DEMO_PROJ"
                upsert_jt "${k}-teardown" "hello_world.yml" "$DEMO_PROJ"
              done

              echo "AAP JobTemplate seed complete (real playbooks + parked stubs)"
