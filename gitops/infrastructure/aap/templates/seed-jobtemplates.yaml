# Seed AAP JobTemplates against HybridSovereign EDA project (real playbooks).
# Includes cloudoso, cloudaws, cloudvirt, platformopenshift (no hello_world park stubs).
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-aap-seed-jobtemplates
  namespace: aap
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  # Force new Job identity after JT catalog changes (ZTP-021/cloudvirt)
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
        hybridsovereign.redhat/seed-generation: "2"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hs-aap-cred-sync
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              # Robust AAP JSON helpers (sed on AWX payloads picks wrong ids — ZTP-021)
              jget() { python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("'"$1"'","") or "")'; }
              jfirst_id() { python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("results") or []; print(r[0]["id"] if r else "")'; }
              APPS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
              if oc -n vault get route vault >/dev/null 2>&1; then
                VADDR="https://$(oc -n vault get route vault -o jsonpath='{.spec.host}')"
              else
                VADDR="https://vault-vault.${APPS_DOMAIN}"
              fi
              if oc -n keycloak get route keycloak >/dev/null 2>&1; then
                KC_URL="https://$(oc -n keycloak get route keycloak -o jsonpath='{.spec.host}')"
              else
                KC_URL="https://sso.${APPS_DOMAIN}"
              fi
              echo "Waiting for aap-operator-credentials in sovereign-cloud..."
              for i in $(seq 1 60); do
                if oc get secret aap-operator-credentials -n sovereign-cloud >/dev/null 2>&1; then
                  break
                fi
                echo "  secret missing (attempt ${i}/60)"
                sleep 5
              done
              oc get secret aap-operator-credentials -n sovereign-cloud >/dev/null
              HOST=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.host}' | base64 -d)
              USER=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.username}' | base64 -d)
              PASS=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.password}' | base64 -d)
              auth=(-u "$USER:$PASS")
              ORG=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/organizations/?name=Default" | jfirst_id)
              [ -n "$ORG" ] || ORG=1
              INV=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/inventories/?name=Demo%20Inventory" | jfirst_id)
              [ -n "$INV" ] || INV=1
              DEMO_PROJ=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/projects/?name=Demo%20Project" | jfirst_id)
              [ -n "$DEMO_PROJ" ] || DEMO_PROJ=6
              HS_PROJ=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/projects/?name=HybridSovereign%20EDA" | jfirst_id)
              if [ -z "${HS_PROJ}" ]; then
                RESP=$(curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/projects/" \
                  -H 'Content-Type: application/json' \
                  -d '{"name":"HybridSovereign EDA","organization":'"$ORG"',"scm_type":"git","scm_url":"https://github.com/hybrid-sovereign-cloud/hybridcloud-demojam.git","scm_branch":"main","scm_update_on_launch":true,"scm_delete_on_update":true}')
                HS_PROJ=$(echo "$RESP" | jget id)
                if [ -z "${HS_PROJ}" ]; then
                  echo "FATAL: failed to create HybridSovereign EDA project (org=$ORG): $RESP" >&2
                  exit 1
                fi
                echo "created HybridSovereign EDA project id=$HS_PROJ"
                sleep 15
              else
                # Clear dirty checkouts that break scm_update_on_launch after wipe/reseed
                curl -sk "${auth[@]}" -X PATCH "$HOST/api/controller/v2/projects/$HS_PROJ/" \
                  -H 'Content-Type: application/json' \
                  -d '{"scm_delete_on_update":true,"scm_update_on_launch":true}' >/dev/null
                curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/projects/$HS_PROJ/update/" >/dev/null || true
                sleep 10
              fi
              echo "ORG=$ORG INV=$INV DEMO_PROJ=$DEMO_PROJ HS_PROJ=$HS_PROJ"
              [ -n "$HS_PROJ" ] || { echo "FATAL: HS_PROJ empty" >&2; exit 1; }

              # kind -> playbook under eda/rulebooks/ (adjacent roles/ so AAP EE finds them)
              declare -A REAL_PB=(
                [entity]=eda/rulebooks/entity-provision-playbook.yml
                [rbacconfig]=eda/rulebooks/rbacconfig-provision-playbook.yml
                [rbac]=eda/rulebooks/rbac-provision-playbook.yml
                [persona]=eda/rulebooks/persona-provision-playbook.yml
                [aapconfig]=eda/rulebooks/aapconfig-provision-playbook.yml
                [aaporg]=eda/rulebooks/aaporg-provision-playbook.yml
                [quayconfig]=eda/rulebooks/quayconfig-provision-playbook.yml
                [quayorg]=eda/rulebooks/quayorg-provision-playbook.yml
                [vault]=eda/rulebooks/vault-provision-playbook.yml
                [vaultkv]=eda/rulebooks/vaultkv-provision-playbook.yml
                [team]=eda/rulebooks/team-provision-playbook.yml
                [project]=eda/rulebooks/project-provision-playbook.yml
                [assignment]=eda/rulebooks/assignment-provision-playbook.yml
                [hybridfabric]=eda/rulebooks/hybridfabric-provision-playbook.yml
                [cloudgateway]=eda/rulebooks/cloudgateway-provision-playbook.yml
                [transportlink]=eda/rulebooks/transportlink-provision-playbook.yml
                [hybridnetwork]=eda/rulebooks/hybridnetwork-provision-playbook.yml
                [networkplacement]=eda/rulebooks/networkplacement-provision-playbook.yml
                [uihealthchecker]=eda/rulebooks/uihealthchecker-provision-playbook.yml
                [platformopenshift]=eda/rulebooks/platformopenshift-provision-playbook.yml
                [cloudoso]=eda/rulebooks/cloudoso-provision-playbook.yml
                [cloudaws]=eda/rulebooks/cloudaws-provision-playbook.yml
                [cloudvirt]=eda/rulebooks/cloudvirt-provision-playbook.yml
              )
              declare -A REAL_TD=(
                [entity]=eda/rulebooks/entity-teardown-playbook.yml
                [rbacconfig]=eda/rulebooks/rbacconfig-teardown-playbook.yml
                [rbac]=eda/rulebooks/rbac-teardown-playbook.yml
                [persona]=eda/rulebooks/persona-teardown-playbook.yml
                [aapconfig]=eda/rulebooks/aapconfig-teardown-playbook.yml
                [aaporg]=eda/rulebooks/aaporg-teardown-playbook.yml
                [quayconfig]=eda/rulebooks/quayconfig-teardown-playbook.yml
                [quayorg]=eda/rulebooks/quayorg-teardown-playbook.yml
                [vault]=eda/rulebooks/vault-teardown-playbook.yml
                [vaultkv]=eda/rulebooks/vaultkv-teardown-playbook.yml
                [team]=eda/rulebooks/team-teardown-playbook.yml
                [project]=eda/rulebooks/project-teardown-playbook.yml
                [assignment]=eda/rulebooks/assignment-teardown-playbook.yml
                [hybridfabric]=eda/rulebooks/hybridfabric-teardown-playbook.yml
                [cloudgateway]=eda/rulebooks/cloudgateway-teardown-playbook.yml
                [transportlink]=eda/rulebooks/transportlink-teardown-playbook.yml
                [hybridnetwork]=eda/rulebooks/hybridnetwork-teardown-playbook.yml
                [networkplacement]=eda/rulebooks/networkplacement-teardown-playbook.yml
                [uihealthchecker]=eda/rulebooks/uihealthchecker-teardown-playbook.yml
                [platformopenshift]=eda/rulebooks/platformopenshift-teardown-playbook.yml
                [cloudoso]=eda/rulebooks/cloudoso-teardown-playbook.yml
                [cloudaws]=eda/rulebooks/cloudaws-teardown-playbook.yml
                [cloudvirt]=eda/rulebooks/cloudvirt-teardown-playbook.yml
              )

              # Ensure Vault credential type + credential for VAULT_TOKEN/VAULT_ADDR
              CT=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/credential_types/?name=Sovereign%20Vault%20Token" | jget count)
              if [ "${CT:-0}" = "0" ]; then
                curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/credential_types/" \
                  -H 'Content-Type: application/json' \
                  -d '{"name":"Sovereign Vault Token","kind":"cloud","inputs":{"fields":[{"id":"token","label":"Token","type":"string","secret":true},{"id":"addr","label":"Addr","type":"string"}],"required":["token","addr"]},"injectors":{"env":{"VAULT_TOKEN":"{{`{{ token }}`}}","VAULT_ADDR":"{{`{{ addr }}`}}"}}}' >/dev/null
              fi
              CT_ID=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/credential_types/?name=Sovereign%20Vault%20Token" | jfirst_id)
              CRED_ID=""
              if oc get secret vault-init -n vault >/dev/null 2>&1; then
                VROOT=$(oc get secret vault-init -n vault -o jsonpath='{.data.rootToken}' | base64 -d)
                CRED_ID=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/credentials/?name=sovereign-vault-admin" | jfirst_id)
                if [ -z "${CRED_ID}" ]; then
                  RESP=$(curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/credentials/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"name\":\"sovereign-vault-admin\",\"organization\":$ORG,\"credential_type\":$CT_ID,\"inputs\":{\"token\":\"$VROOT\",\"addr\":\"$VADDR\"}}")
                  CRED_ID=$(echo "$RESP" | jget id)
                else
                  # Always refresh token after vault re-init (ZTP wipe)
                  curl -sk "${auth[@]}" -X PATCH "$HOST/api/controller/v2/credentials/$CRED_ID/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"inputs\":{\"token\":\"$VROOT\",\"addr\":\"$VADDR\"}}" >/dev/null
                fi
                echo "Vault credential id=$CRED_ID (token refreshed)"
              else
                echo "vault-init not ready — skipping Vault AAP credential (JobTemplates still seeded)"
              fi

              upsert_jt() {
                local NAME="$1" PB="$2" PROJ="$3"
                local ID COUNT RESP
                COUNT=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/job_templates/?name=$NAME" | jget count)
                if [ "${COUNT:-0}" = "0" ]; then
                  RESP=$(curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/job_templates/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"name\":\"$NAME\",\"organization\":$ORG,\"inventory\":$INV,\"project\":$PROJ,\"playbook\":\"$PB\",\"ask_variables_on_launch\":true,\"extra_vars\":\"plugin_rbac_keycloak_realm: sso\\nKEYCLOAK_EXTERNAL_URL: ${KC_URL}\\n\"}")
                  ID=$(echo "$RESP" | jget id)
                  if [ -z "$ID" ]; then
                    echo "FATAL: failed to create JobTemplate $NAME: $RESP" >&2
                    exit 1
                  fi
                  echo "created $NAME id=$ID pb=$PB"
                else
                  ID=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/job_templates/?name=$NAME" | jfirst_id)
                  curl -sk "${auth[@]}" -X PATCH "$HOST/api/controller/v2/job_templates/$ID/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"project\":$PROJ,\"playbook\":\"$PB\",\"ask_variables_on_launch\":true,\"extra_vars\":\"plugin_rbac_keycloak_realm: sso\\nKEYCLOAK_EXTERNAL_URL: ${KC_URL}\\n\"}" >/dev/null
                  echo "updated $NAME id=$ID pb=$PB"
                fi
                if [ -n "${CRED_ID:-}" ] && [ -n "${ID:-}" ] && [ "$PROJ" = "$HS_PROJ" ]; then
                  curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/job_templates/$ID/credentials/" \
                    -H 'Content-Type: application/json' \
                    -d "{\"id\":$CRED_ID}" >/dev/null || true
                fi
              }

              for k in "${!REAL_PB[@]}"; do
                upsert_jt "${k}-provision" "${REAL_PB[$k]}" "$HS_PROJ"
                upsert_jt "${k}-teardown" "${REAL_TD[$k]}" "$HS_PROJ"
              done

              # Prove seed landed (operators look these up by exact name)
              EP_COUNT=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/job_templates/?name=entity-provision" | jget count)
              if [ "${EP_COUNT:-0}" = "0" ]; then
                echo "FATAL: entity-provision JobTemplate missing after seed" >&2
                exit 1
              fi
              echo "AAP JobTemplate seed complete (real playbooks including cloud/platform); entity-provision ok"
