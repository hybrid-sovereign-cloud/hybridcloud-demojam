# Seed stub AAP JobTemplates (Demo Project / hello_world.yml) for operator launches.
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-aap-seed-jobtemplates
  namespace: aap
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hs-aap-cred-sync
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              HOST=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.host}' | base64 -d)
              USER=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.username}' | base64 -d)
              PASS=$(oc get secret aap-operator-credentials -n sovereign-cloud -o jsonpath='{.data.password}' | base64 -d)
              auth=(-u "$USER:$PASS")
              ORG=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/organizations/?name=Default" | sed -n 's/.*"count":1.*"id":\([0-9]*\).*/\1/p' | head -1)
              [ -n "$ORG" ] || ORG=1
              INV=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/inventories/?name=Demo%20Inventory" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              [ -n "$INV" ] || INV=1
              PROJ=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/projects/?name=Demo%20Project" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
              [ -n "$PROJ" ] || PROJ=6
              echo "ORG=$ORG INV=$INV PROJ=$PROJ"
              KINDS="entity rbacconfig aapconfig quayconfig hybridfabric cloudgateway transportlink uihealthchecker team project assignment persona rbac vault vaultkv aaporg quayorg hybridnetwork networkplacement"
              for k in $KINDS; do
                for suffix in provision teardown; do
                  NAME="${k}-${suffix}"
                  COUNT=$(curl -sk "${auth[@]}" "$HOST/api/controller/v2/job_templates/?name=$NAME" | sed -n 's/.*"count":\([0-9]*\).*/\1/p' | head -1)
                  if [ "${COUNT:-0}" = "0" ]; then
                    RESP=$(curl -sk "${auth[@]}" -X POST "$HOST/api/controller/v2/job_templates/" \
                      -H 'Content-Type: application/json' \
                      -d "{\"name\":\"$NAME\",\"organization\":$ORG,\"inventory\":$INV,\"project\":$PROJ,\"playbook\":\"hello_world.yml\",\"ask_variables_on_launch\":true}")
                    if echo "$RESP" | grep -q '"id":'; then
                      echo "created $NAME"
                    else
                      echo "FAILED $NAME: $RESP" >&2
                    fi
                  else
                    echo "exists $NAME"
                  fi
                done
              done
              echo "AAP JobTemplate seed complete"
