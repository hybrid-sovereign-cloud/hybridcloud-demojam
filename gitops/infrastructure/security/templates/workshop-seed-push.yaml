# Push Step 0 human-seeded Secrets (sovereign-secrets) into Vault KV.
# Secret values are NEVER in Git — only PushSecret wiring.
# Seeds survive wipe (see scripts/ztp-wipe.sh preserve list).
# Gated: default off — missing source Secrets degrade hs-security on fresh ZTP.
{{- if .Values.workshopSeeds }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-aws-credentials-example-admin
  namespace: sovereign-secrets
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "45"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: aws-credentials
  data:
    - conversionStrategy: None
      match:
        secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          remoteKey: aws/accounts/example-admin
          property: AWS_ACCESS_KEY_ID
    - conversionStrategy: None
      match:
        secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: aws/accounts/example-admin
          property: AWS_SECRET_ACCESS_KEY
    - conversionStrategy: None
      match:
        secretKey: ACCOUNT_ID
        remoteRef:
          remoteKey: aws/accounts/example-admin
          property: ACCOUNT_ID
