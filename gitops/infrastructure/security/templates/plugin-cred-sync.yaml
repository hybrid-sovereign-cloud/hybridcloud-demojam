# Sync plugin admin credentials + seed Vault KV (hybridsovereign) after wipe/re-init.
# No secret values in Git — sources are in-cluster Secrets / field-content helm values / SA token.
# Image: openshift/cli — python3 stdlib only (no PyYAML, no curl dependency).
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-plugin-cred-sync
  namespace: sovereign-secrets
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "46"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 8
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hs-plugin-cred-sync
      containers:
        - name: sync
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc:8200
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              oc get ns sovereign-cloud-plugins >/dev/null

              APPS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}' 2>/dev/null || true)
              if [ -z "$APPS_DOMAIN" ]; then
                echo "FATAL: cannot discover apps domain from ingresses.config.openshift.io/cluster" >&2
                exit 1
              fi
              KC_URL="https://sso.${APPS_DOMAIN}"
              if oc -n keycloak get route keycloak >/dev/null 2>&1; then
                KC_URL="https://$(oc -n keycloak get route keycloak -o jsonpath='{.spec.host}')"
              fi

              KC_USER=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.username}' | base64 -d)
              KC_PASS=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.password}' | base64 -d)
              oc create secret generic rhbk-services-admin -n sovereign-cloud-plugins \
                --from-literal=username="$KC_USER" \
                --from-literal=password="$KC_PASS" \
                --from-literal=url="$KC_URL" \
                --from-literal=type=keycloak \
                --dry-run=client -o yaml | oc apply -f -
              echo "synced rhbk-services-admin"

              # AAP — prefer operator secrets, then sovereign-secrets, then helm values (stdlib parse)
              AAP_USER=admin
              AAP_PASS=""
              AAP_URL=""
              if oc -n aap get route aap >/dev/null 2>&1; then
                AAP_URL="https://$(oc -n aap get route aap -o jsonpath='{.spec.host}')"
              else
                AAP_URL="https://aap-aap.${APPS_DOMAIN}"
              fi
              if oc get secret aap-admin-credentials -n aap >/dev/null 2>&1; then
                AAP_USER=$(oc get secret aap-admin-credentials -n aap -o jsonpath='{.data.username}' | base64 -d)
                AAP_PASS=$(oc get secret aap-admin-credentials -n aap -o jsonpath='{.data.password}' | base64 -d)
                U=$(oc get secret aap-admin-credentials -n aap -o jsonpath='{.data.url}' | base64 -d || true)
                [ -n "$U" ] && AAP_URL="$U"
              elif oc get secret aap-admin -n sovereign-secrets >/dev/null 2>&1; then
                AAP_PASS=$(oc get secret aap-admin -n sovereign-secrets -o jsonpath='{.data.password}' | base64 -d || true)
                H=$(oc get secret aap-admin -n sovereign-secrets -o jsonpath='{.data.host}' | base64 -d || true)
                [ -n "$H" ] && AAP_URL="$H"
              else
                for s in aap-admin-password aap-controller-admin-password; do
                  if oc get secret "$s" -n aap >/dev/null 2>&1; then
                    AAP_PASS=$(oc get secret "$s" -n aap -o jsonpath='{.data.password}' | base64 -d)
                    break
                  fi
                done
              fi
              if [ -z "$AAP_PASS" ] && oc -n openshift-gitops get application.argoproj.io field-content >/dev/null 2>&1; then
                oc -n openshift-gitops get application.argoproj.io field-content -o json > /tmp/field-content.json
                eval "$(python3 <<'PY'
              import json,re,shlex
              app=json.load(open("/tmp/field-content.json"))
              raw=(app.get("spec") or {}).get("source",{}).get("helm",{}).get("values") or ""
              def pick(*keys):
                  for k in keys:
                      m=re.search(r"(?:^|\n)\s*%s\s*:\s*[\"']?([^\n\"']+)" % re.escape(k), raw)
                      if m:
                          return m.group(1).strip()
                  return ""
              pw=pick("adminPassword")
              user=pick("adminUser","adminUsername")
              url=pick("url")
              if pw: print("AAP_PASS="+shlex.quote(pw))
              if user: print("AAP_USER="+shlex.quote(user))
              if url and url.startswith("http"): print("AAP_URL="+shlex.quote(url))
              PY
              )"
              fi
              [ -n "$AAP_PASS" ] || { echo "FATAL: no AAP admin password found" >&2; exit 1; }
              oc create secret generic aap-admin-credentials -n sovereign-cloud-plugins \
                --from-literal=username="$AAP_USER" \
                --from-literal=password="$AAP_PASS" \
                --from-literal=url="$AAP_URL" \
                --dry-run=client -o yaml | oc apply -f -
              # Also ensure PushSecret source exists
              oc create secret generic aap-admin -n sovereign-secrets \
                --from-literal=host="$AAP_URL" \
                --from-literal=username="$AAP_USER" \
                --from-literal=password="$AAP_PASS" \
                --dry-run=client -o yaml | oc apply -f -
              echo "synced aap-admin-credentials + aap-admin"

              QUAY_URL="https://quay-quay-quay.${APPS_DOMAIN}"
              if oc -n quay get route quay-quay >/dev/null 2>&1; then
                QUAY_URL="https://$(oc -n quay get route quay-quay -o jsonpath='{.spec.host}')"
              fi
              # Placeholder until Quay API initialize runs (hs-platform-configs PreSync owns real bootstrap).
              # Never seed registry SECRET_KEY as the Database admin password.
              QUAY_PASS="quay-bootstrap-pending"
              if oc get secret quay-admin-credentials -n sovereign-cloud-plugins >/dev/null 2>&1; then
                CUR=$(oc get secret quay-admin-credentials -n sovereign-cloud-plugins -o jsonpath='{.data.password}' | base64 -d || true)
                TOK=$(oc get secret quay-admin-credentials -n sovereign-cloud-plugins -o jsonpath='{.data.token}' | base64 -d || true)
                if [ -n "$CUR" ] && [ "$CUR" != "quay-bootstrap-pending" ]; then
                  QUAY_PASS="$CUR"
                fi
                if [ -n "$TOK" ]; then
                  oc create secret generic quay-admin-credentials -n sovereign-cloud-plugins \
                    --from-literal=username=quayadmin \
                    --from-literal=password="$QUAY_PASS" \
                    --from-literal=url="$QUAY_URL" \
                    --from-literal=token="$TOK" \
                    --dry-run=client -o yaml | oc apply -f -
                else
                  oc create secret generic quay-admin-credentials -n sovereign-cloud-plugins \
                    --from-literal=username=quayadmin \
                    --from-literal=password="$QUAY_PASS" \
                    --from-literal=url="$QUAY_URL" \
                    --dry-run=client -o yaml | oc apply -f -
                fi
              else
                oc create secret generic quay-admin-credentials -n sovereign-cloud-plugins \
                  --from-literal=username=quayadmin \
                  --from-literal=password="$QUAY_PASS" \
                  --from-literal=url="$QUAY_URL" \
                  --dry-run=client -o yaml | oc apply -f -
              fi
              echo "synced quay-admin-credentials (bootstrap pending until Quay initialize)"

              oc create secret generic rhbk-admin -n sovereign-secrets \
                --from-literal=username="$KC_USER" \
                --from-literal=password="$KC_PASS" \
                --from-literal=url="$KC_URL" \
                --dry-run=client -o yaml | oc apply -f -
              echo "plugin credential sync complete"

              echo "Waiting for vault-init..."
              for i in $(seq 1 60); do
                oc -n vault get secret vault-init >/dev/null 2>&1 && break
                sleep 5
              done
              export VAULT_TOKEN
              VAULT_TOKEN=$(oc -n vault get secret vault-init -o jsonpath='{.data.rootToken}' | base64 -d)
              [ -n "$VAULT_TOKEN" ] || { echo "vault-init missing; skip KV seed"; exit 0; }

              export KC_USER KC_PASS KC_URL AAP_USER AAP_PASS AAP_URL QUAY_PASS QUAY_URL
              python3 - <<'PY'
              import json, os, re, shlex, subprocess, urllib.error, urllib.request

              addr = os.environ["VAULT_ADDR"]
              tok = os.environ["VAULT_TOKEN"]

              def vault(method, path, payload=None):
                  data = None if payload is None else json.dumps(payload).encode()
                  req = urllib.request.Request(
                      f"{addr}/v1/{path}",
                      data=data,
                      headers={"X-Vault-Token": tok, "Content-Type": "application/json"},
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(req) as r:
                          return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      return e.code, e.read()

              st, _ = vault("GET", "sys/mounts/hybridsovereign")
              if st == 404:
                  vault("POST", "sys/mounts/hybridsovereign", {"type": "kv", "options": {"version": "2"}})
                  print("enabled kv mount hybridsovereign")
              elif st >= 400:
                  print(f"WARN: mounts check status={st}")

              def put_kv(path, data):
                  st, body = vault("POST", f"hybridsovereign/data/{path}", {"data": data})
                  print(f"seeded {path} {st}")
                  if st >= 400:
                      raise SystemExit(f"vault put {path} failed: {body[:200]}")

              api = subprocess.check_output(
                  ["oc", "get", "infrastructure", "cluster", "-o", "jsonpath={.status.apiServerURL}"],
                  text=True,
              ).strip()
              ocp_user = "admin"
              password = ""
              sa_tok = ""
              try:
                  sa_tok = subprocess.check_output(
                      ["oc", "-n", "openshift-config", "get", "secret", "cluster-admin-token",
                       "-o", "jsonpath={.data.token}"],
                      text=True, stderr=subprocess.DEVNULL,
                  ).strip()
                  if sa_tok:
                      sa_tok = subprocess.check_output(["base64", "-d"], input=sa_tok, text=True)
              except Exception:
                  sa_tok = ""

              if subprocess.call(["oc", "-n", "sovereign-secrets", "get", "secret", "openshift-kubeadmin-seed"],
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) == 0:
                  def secret_field(f):
                      # Avoid Python f-string brace doubling — Helm treats that as a template action (ZTP-010)
                      b = subprocess.check_output(
                          ["oc", "-n", "sovereign-secrets", "get", "secret", "openshift-kubeadmin-seed",
                           "-o", "jsonpath={.data." + f + "}"], text=True)
                      return subprocess.check_output(["base64", "-d"], input=b, text=True)
                  api = secret_field("api_host")
                  ocp_user = secret_field("username")
                  password = secret_field("password")
              elif subprocess.call(
                  ["oc", "-n", "openshift-gitops", "get", "application.argoproj.io", "field-content"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
              ) == 0:
                  raw = subprocess.check_output(
                      ["oc", "-n", "openshift-gitops", "get", "application.argoproj.io", "field-content", "-o", "json"],
                      text=True,
                  )
                  app = json.loads(raw)
                  vals = (app.get("spec") or {}).get("source", {}).get("helm", {}).get("values") or ""
                  def pick(*keys):
                      for k in keys:
                          m = re.search(r"(?:^|\n)\s*" + re.escape(k) + r"\s*:\s*[\"']?([^\n\"']+)", vals)
                          if m:
                              return m.group(1).strip()
                      return ""
                  password = pick("adminPassword") or password
                  ocp_user = pick("adminUsername", "adminUser") or ocp_user
                  api = pick("apiUrl", "consoleUrl") or api

              if sa_tok or password:
                  # Normalize api_host so AAP jobs never see scheme-less hosts
                  api_norm = api.strip()
                  if api_norm and not api_norm.startswith(("http://", "https://")):
                      api_norm = "https://" + api_norm.lstrip("/")
                  data = {"api_host": api_norm, "username": ocp_user, "password": password}
                  if sa_tok:
                      data["token"] = sa_tok
                  put_kv("openshift-services-kubeadmin", data)
                  put_kv("openshift-central-kubeadmin", data)
                  # PlatformOpenshift provision expects aap-central-cluster-sa (host + bearer_token)
                  if sa_tok:
                      put_kv(
                          "aap-central-cluster-sa",
                          {"host": api_norm, "api_host": api_norm, "bearer_token": sa_tok, "token": sa_tok},
                      )
              else:
                  print("WARN: no openshift token/password; skip openshift-*-kubeadmin seed")

              def user_put(path, user, pw, url, token=""):
                  if not user or not pw:
                      return
                  data = {"username": user, "password": pw, "url": url}
                  if token:
                      data["token"] = token
                  put_kv(path, data)

              user_put("rhbk-services-admin", os.environ["KC_USER"], os.environ["KC_PASS"], os.environ["KC_URL"])
              user_put("aap-admin", os.environ["AAP_USER"], os.environ["AAP_PASS"], os.environ["AAP_URL"])
              quay_tok = ""
              try:
                  quay_tok = subprocess.check_output(
                      ["oc", "-n", "sovereign-cloud-plugins", "get", "secret", "quay-admin-credentials",
                       "-o", "jsonpath={.data.token}"],
                      text=True, stderr=subprocess.DEVNULL,
                  ).strip()
                  if quay_tok:
                      quay_tok = subprocess.check_output(["base64", "-d"], input=quay_tok, text=True)
              except Exception:
                  quay_tok = ""
              user_put("quay-admin", "quayadmin", os.environ["QUAY_PASS"], os.environ["QUAY_URL"], quay_tok)
              print("vault KV platform seed complete")
              PY
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hs-plugin-cred-sync
  namespace: sovereign-secrets
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hs-plugin-cred-sync
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets", "namespaces"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["infrastructures", "ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hs-plugin-cred-sync
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: hs-plugin-cred-sync
    namespace: sovereign-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hs-plugin-cred-sync
