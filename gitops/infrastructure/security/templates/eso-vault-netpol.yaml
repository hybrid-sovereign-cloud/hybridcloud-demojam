# OpenShift ESO installs deny-all in external-secrets; allow egress to Vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-vault
  namespace: external-secrets
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.openshift.io/metadata.name: vault
      ports:
        - protocol: TCP
          port: 8200
