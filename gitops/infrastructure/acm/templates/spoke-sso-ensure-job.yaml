# Sync hook: ensure shared Keycloak OIDC client + hub Secret/ConfigMap used by
# hs-spoke-sso ACM governance Policy (ZTP SSO for PlatformOpenshift spokes).
# Soft-fails (exit 0) so a missing Keycloak never blocks ACM GitOps sync.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hs-spoke-sso-ensure
  namespace: sovereign-cloud-jobs
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "25"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hs-spoke-sso-ensure
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "25"
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, namespaces, services]
    verbs: [get, list, create, update, patch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list]
  - apiGroups: [hypershift.openshift.io]
    resources: [hostedclusters]
    verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hs-spoke-sso-ensure
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hs-spoke-sso-ensure
subjects:
  - kind: ServiceAccount
    name: hs-spoke-sso-ensure
    namespace: sovereign-cloud-jobs
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-spoke-sso-ensure
  namespace: sovereign-cloud-jobs
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "26"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: hs-spoke-sso-ensure
      restartPolicy: OnFailure
      containers:
        - name: ensure
          image: registry.redhat.io/ubi9/ubi-minimal:latest
          env:
            - name: KC_INTERNAL_URL
              value: "http://keycloak.keycloak.svc:8080"
            - name: KC_REALM
              value: "sso"
            - name: KC_ADMIN_SECRET
              value: "rhbk-services-admin"
            - name: KC_ADMIN_NS
              value: "sovereign-cloud-plugins"
            - name: TARGET_NS
              # ACM hub templates (fromSecret/fromConfigMap) only allow this NS.
              value: "open-cluster-management"
          command:
            - /bin/bash
            - -c
            - |
              set +e
              microdnf install -y curl jq >/dev/null 2>&1
              finish() { echo "$1"; exit 0; }
              command -v curl >/dev/null && command -v jq >/dev/null || finish "curl/jq missing; skip"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API=https://kubernetes.default.svc
              kget() { curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" "$API$1"; }
              USER=$(kget "/api/v1/namespaces/${KC_ADMIN_NS}/secrets/${KC_ADMIN_SECRET}" | jq -r '.data.username // empty' | base64 -d 2>/dev/null)
              PASS=$(kget "/api/v1/namespaces/${KC_ADMIN_NS}/secrets/${KC_ADMIN_SECRET}" | jq -r '.data.password // empty' | base64 -d 2>/dev/null)
              [[ -n "$USER" && -n "$PASS" ]] || finish "admin secret missing; skip"
              # Prefer OpenShift Route host for issuer; admin API via in-cluster SVC
              ROUTE=$(kget "/apis/route.openshift.io/v1/namespaces/keycloak/routes" | jq -r '.items[0].spec.host // empty')
              KC_ADMIN="${KC_INTERNAL_URL}"
              ISSUER_BASE="https://${ROUTE}"
              [[ -n "$ROUTE" ]] || ISSUER_BASE="${KC_INTERNAL_URL}"
              TOK=$(curl -sk -X POST "${KC_ADMIN}/realms/master/protocol/openid-connect/token" \
                -d "grant_type=password&client_id=admin-cli&username=${USER}&password=${PASS}" | jq -r '.access_token // empty')
              [[ -n "$TOK" ]] || finish "keycloak token failed; skip"
              EXIST=$(curl -sk -H "Authorization: Bearer ${TOK}" "${KC_ADMIN}/admin/realms/${KC_REALM}/clients?clientId=openshift-spoke-sso")
              CID=$(echo "$EXIST" | jq -r '.[0].id // empty')
              if [[ -z "$CID" ]]; then
                curl -sk -X POST -H "Authorization: Bearer ${TOK}" -H "Content-Type: application/json" \
                  "${KC_ADMIN}/admin/realms/${KC_REALM}/clients" \
                  -d '{"clientId":"openshift-spoke-sso","name":"OpenShift managed spokes SSO","protocol":"openid-connect","publicClient":false,"standardFlowEnabled":true,"redirectUris":["https://oauth-openshift.apps.*/*","https://console-openshift-console.apps.*/*"],"webOrigins":["https://*"],"attributes":{"groups.claim.enabled":"true"}}' >/dev/null
                CID=$(curl -sk -H "Authorization: Bearer ${TOK}" "${KC_ADMIN}/admin/realms/${KC_REALM}/clients?clientId=openshift-spoke-sso" | jq -r '.[0].id // empty')
              fi
              [[ -n "$CID" ]] || finish "client id missing; skip"
              SECRET=$(curl -sk -H "Authorization: Bearer ${TOK}" "${KC_ADMIN}/admin/realms/${KC_REALM}/clients/${CID}/client-secret" | jq -r '.value // empty')
              [[ -n "$SECRET" ]] || finish "client secret missing; skip"
              ISSUER="${ISSUER_BASE}/realms/${KC_REALM}"
              B64=$(printf '%s' "$SECRET" | base64 -w0 2>/dev/null || printf '%s' "$SECRET" | base64)
              CIDB64=$(printf 'openshift-spoke-sso' | base64 -w0 2>/dev/null || printf 'openshift-spoke-sso' | base64)
              BODY_SEC="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openshift-spoke-sso\",\"namespace\":\"${TARGET_NS}\"},\"type\":\"Opaque\",\"data\":{\"clientSecret\":\"${B64}\",\"clientID\":\"${CIDB64}\"}}"
              curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X PUT "$API/api/v1/namespaces/${TARGET_NS}/secrets/openshift-spoke-sso" -d "$BODY_SEC" >/dev/null \
                || curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X POST "$API/api/v1/namespaces/${TARGET_NS}/secrets" -d "$BODY_SEC" >/dev/null
              BODY_CM="{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"openshift-spoke-sso\",\"namespace\":\"${TARGET_NS}\"},\"data\":{\"issuer\":\"${ISSUER}\",\"clientID\":\"openshift-spoke-sso\"}}"
              curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X PUT "$API/api/v1/namespaces/${TARGET_NS}/configmaps/openshift-spoke-sso" -d "$BODY_CM" >/dev/null \
                || curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X POST "$API/api/v1/namespaces/${TARGET_NS}/configmaps" -d "$BODY_CM" >/dev/null
              # HCP: OAuth is immutable on the guest — push IDP via HostedCluster.spec.configuration
              HCS=$(kget "/apis/hypershift.openshift.io/v1beta1/hostedclusters" 2>/dev/null || echo '{"items":[]}')
              echo "$HCS" | jq -c '.items[]?' 2>/dev/null | while read -r hc; do
                HNS=$(echo "$hc" | jq -r '.metadata.namespace')
                HNM=$(echo "$hc" | jq -r '.metadata.name')
                [[ -n "$HNS" && -n "$HNM" && "$HNS" != "null" ]] || continue
                curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -X PUT "$API/api/v1/namespaces/${HNS}/secrets/openid-client-secret-keycloak" \
                  -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openid-client-secret-keycloak\",\"namespace\":\"${HNS}\"},\"type\":\"Opaque\",\"data\":{\"clientSecret\":\"${B64}\"}}" >/dev/null \
                  || curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -X POST "$API/api/v1/namespaces/${HNS}/secrets" \
                  -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openid-client-secret-keycloak\",\"namespace\":\"${HNS}\"},\"type\":\"Opaque\",\"data\":{\"clientSecret\":\"${B64}\"}}" >/dev/null
                PATCH=$(jq -nc --arg iss "$ISSUER" '{
                  spec: { configuration: { oauth: { identityProviders: [{
                    name: "keycloak-sso", mappingMethod: "claim", type: "OpenID",
                    openID: {
                      clientID: "openshift-spoke-sso",
                      clientSecret: {name: "openid-client-secret-keycloak"},
                      issuer: $iss,
                      extraScopes: ["profile","email"],
                      claims: {
                        preferredUsername: ["preferred_username"],
                        name: ["name"], email: ["email"], groups: ["groups"]
                      }
                    }
                  }]}}}}')
                curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/merge-patch+json" \
                  -X PATCH "$API/apis/hypershift.openshift.io/v1beta1/namespaces/${HNS}/hostedclusters/${HNM}" \
                  -d "$PATCH" >/dev/null && echo "HCP SSO patched ${HNS}/${HNM}" || echo "HCP SSO patch skip ${HNS}/${HNM}"
              done
              finish "spoke SSO client ready issuer=${ISSUER}"
