# Sync hook: ensure shared Keycloak OIDC client + hub Secret/ConfigMap used by
# hs-spoke-sso ACM governance Policy (ZTP SSO for PlatformOpenshift spokes).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hs-spoke-sso-ensure
  namespace: sovereign-cloud-jobs
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "25"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hs-spoke-sso-ensure
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "25"
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, namespaces]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hs-spoke-sso-ensure
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "25"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hs-spoke-sso-ensure
subjects:
  - kind: ServiceAccount
    name: hs-spoke-sso-ensure
    namespace: sovereign-cloud-jobs
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-spoke-sso-ensure
  namespace: sovereign-cloud-jobs
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "26"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: hs-spoke-sso-ensure
      restartPolicy: OnFailure
      containers:
        - name: ensure
          image: registry.redhat.io/ubi9/ubi-minimal:latest
          env:
            - name: KC_URL
              value: "https://sso.apps.cluster-pbkjw.dyn.redhatworkshops.io"
            - name: KC_INTERNAL_URL
              value: "http://keycloak.keycloak.svc:8080"
            - name: KC_REALM
              value: "sso"
            - name: KC_ADMIN_SECRET
              value: "rhbk-services-admin"
            - name: KC_ADMIN_NS
              value: "sovereign-cloud-plugins"
            - name: TARGET_NS
              value: "sovereign-cloud-plugins"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              microdnf install -y curl jq openssl >/dev/null 2>&1 || true
              # Soft-fail path so Argo Sync hooks never block ACM chart sync
              finish() { echo "$1"; exit 0; }
              if ! command -v curl >/dev/null || ! command -v jq >/dev/null; then
                finish "curl/jq missing; skip spoke SSO ensure"
              fi
              # oc may be absent in ubi-minimal — use Kubernetes API via curl token
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API=https://kubernetes.default.svc
              kget() { curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" "$API$1"; }
              kapply() { curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/yaml" -X POST "$API/api/v1/namespaces/${TARGET_NS}/$1" --data-binary @- || true; }
              USER=$(kget "/api/v1/namespaces/${KC_ADMIN_NS}/secrets/${KC_ADMIN_SECRET}" | jq -r '.data.username // empty' | base64 -d 2>/dev/null || true)
              PASS=$(kget "/api/v1/namespaces/${KC_ADMIN_NS}/secrets/${KC_ADMIN_SECRET}" | jq -r '.data.password // empty' | base64 -d 2>/dev/null || true)
              [[ -n "$USER" && -n "$PASS" ]] || finish "admin secret missing; skip"
              KC="$KC_URL"
              TOK=$(curl -sk -X POST "${KC}/realms/master/protocol/openid-connect/token" \
                -d "grant_type=password&client_id=admin-cli&username=${USER}&password=${PASS}" | jq -r '.access_token // empty')
              [[ -n "$TOK" ]] || finish "keycloak token failed; skip"
              EXIST=$(curl -sk -H "Authorization: Bearer ${TOK}" "${KC}/admin/realms/${KC_REALM}/clients?clientId=openshift-spoke-sso")
              CID=$(echo "$EXIST" | jq -r '.[0].id // empty')
              if [[ -z "$CID" ]]; then
                curl -sk -X POST -H "Authorization: Bearer ${TOK}" -H "Content-Type: application/json" \
                  "${KC}/admin/realms/${KC_REALM}/clients" \
                  -d '{"clientId":"openshift-spoke-sso","name":"OpenShift managed spokes SSO","protocol":"openid-connect","publicClient":false,"standardFlowEnabled":true,"redirectUris":["https://oauth-openshift.apps.*/*","https://console-openshift-console.apps.*/*"],"webOrigins":["https://*"],"attributes":{"groups.claim.enabled":"true"}}' >/dev/null || true
                CID=$(curl -sk -H "Authorization: Bearer ${TOK}" "${KC}/admin/realms/${KC_REALM}/clients?clientId=openshift-spoke-sso" | jq -r '.[0].id // empty')
              fi
              [[ -n "$CID" ]] || finish "client id missing; skip"
              SECRET=$(curl -sk -H "Authorization: Bearer ${TOK}" "${KC}/admin/realms/${KC_REALM}/clients/${CID}/client-secret" | jq -r '.value // empty')
              [[ -n "$SECRET" ]] || finish "client secret missing; skip"
              ISSUER="${KC}/realms/${KC_REALM}"
              B64=$(printf '%s' "$SECRET" | base64 -w0)
              curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X PUT "$API/api/v1/namespaces/${TARGET_NS}/secrets/openshift-spoke-sso" \
                -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openshift-spoke-sso\",\"namespace\":\"${TARGET_NS}\"},\"type\":\"Opaque\",\"data\":{\"clientSecret\":\"${B64}\",\"clientID\":\"$(printf openshift-spoke-sso | base64 -w0)\"}}" >/dev/null || \
              curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X POST "$API/api/v1/namespaces/${TARGET_NS}/secrets" \
                -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openshift-spoke-sso\",\"namespace\":\"${TARGET_NS}\"},\"type\":\"Opaque\",\"data\":{\"clientSecret\":\"${B64}\",\"clientID\":\"$(printf openshift-spoke-sso | base64 -w0)\"}}" >/dev/null
              curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X PUT "$API/api/v1/namespaces/${TARGET_NS}/configmaps/openshift-spoke-sso" \
                -d "{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"openshift-spoke-sso\",\"namespace\":\"${TARGET_NS}\"},\"data\":{\"issuer\":\"${ISSUER}\",\"clientID\":\"openshift-spoke-sso\"}}" >/dev/null || \
              curl -sk --cacert "$CACERT" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -X POST "$API/api/v1/namespaces/${TARGET_NS}/configmaps" \
                -d "{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"openshift-spoke-sso\",\"namespace\":\"${TARGET_NS}\"},\"data\":{\"issuer\":\"${ISSUER}\",\"clientID\":\"openshift-spoke-sso\"}}" >/dev/null
              finish "spoke SSO client ready issuer=${ISSUER}"
