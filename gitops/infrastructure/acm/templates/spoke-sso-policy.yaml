# ZTP: ACM governance Policy — Keycloak SSO for standalone PlatformOpenshift
# ManagedClusters (virt / aws / openstack). Hosted (HCP) OAuth is immutable on
# the guest; SSO is applied via HostedCluster.spec.configuration.oauth instead
# (provision playbook + hs-spoke-sso-ensure Job).
#
# Hub templates MUST end with " hub}}" and secrets MUST live in
# open-cluster-management (ACM fromSecret namespace restriction).
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: open-cluster-management
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "29"
spec:
  clusterSet: global
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: hs-spoke-sso
  namespace: open-cluster-management
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: hybridsovereign.redhat/platformopenshift
              operator: Exists
            - key: hybridsovereign.redhat/platform-type
              operator: NotIn
              values: ["hosted"]
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: hybridsovereign.redhat/sso
              operator: In
              values: ["enabled"]
            - key: hybridsovereign.redhat/platform-type
              operator: NotIn
              values: ["hosted"]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: hs-spoke-sso
  namespace: open-cluster-management
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "31"
placementRef:
  name: hs-spoke-sso
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: hs-spoke-sso
    kind: Policy
    apiGroup: policy.open-cluster-management.io
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: hs-spoke-sso
  namespace: open-cluster-management
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "32"
    policy.open-cluster-management.io/standards: "NIST SP 800-53"
    policy.open-cluster-management.io/categories: "AC Access Control"
    policy.open-cluster-management.io/controls: "AC-2 Account Management"
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hs-spoke-sso-oauth-secret
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: openid-client-secret-keycloak
                  namespace: openshift-config
                type: Opaque
                data:
                  clientSecret: '{{ "{{hub fromSecret \"open-cluster-management\" \"openshift-spoke-sso\" \"clientSecret\" hub}}" }}'
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hs-spoke-sso-oauth
        spec:
          remediationAction: enforce
          severity: high
          metadataComplianceType: musthave
          object-templates:
            - complianceType: musthave
              recreateOption: None
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders:
                    - name: keycloak-sso
                      mappingMethod: claim
                      type: OpenID
                      openID:
                        clientID: openshift-spoke-sso
                        clientSecret:
                          name: openid-client-secret-keycloak
                        extraScopes:
                          - profile
                          - email
                        claims:
                          preferredUsername:
                            - preferred_username
                          name:
                            - name
                          email:
                            - email
                          groups:
                            - groups
                        issuer: '{{ "{{hub fromConfigMap \"open-cluster-management\" \"openshift-spoke-sso\" \"issuer\" hub}}" }}'
