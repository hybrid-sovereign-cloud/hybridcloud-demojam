apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea
  namespace: gitea
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
# Admin credentials generated once by Job into sovereign-secrets (never in git).
# Until then Deployment references a bootstrap secret created by init Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: gitea-admin-secret-init
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: gitea
      containers:
        - name: init
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              if oc get secret gitea-admin-secret -n gitea >/dev/null 2>&1; then
                echo "gitea-admin-secret exists"
                exit 0
              fi
              PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
              oc create secret generic gitea-admin-secret -n gitea \
                --from-literal=username=giteaadmin \
                --from-literal=password="$PASS"
              # Mirror into sovereign-secrets for PushSecret backup (best-effort)
              oc create namespace sovereign-secrets --dry-run=client -o yaml | oc apply -f - || true
              oc create secret generic gitea-admin -n sovereign-secrets \
                --from-literal=username=giteaadmin \
                --from-literal=password="$PASS" \
                --dry-run=client -o yaml | oc apply -f -
              echo "created gitea admin secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    app.kubernetes.io/name: gitea
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: gitea
      containers:
        - name: gitea
          # Prefer local ImageStream when built; fallback to RH-compatible codeberg mirror via IS
          image: image-registry.openshift-image-registry.svc:5000/sovereign-cloud/gitea-local:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__server__DOMAIN
              value: gitea
            - name: GITEA__server__ROOT_URL
              value: https://gitea-gitea.apps.cluster-qvhzm.dyn.redhatworkshops.io/
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__admin__USERNAME
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-secret
                  key: username
            - name: GITEA__admin__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: gitea
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: gitea
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitea
  namespace: gitea
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  to:
    kind: Service
    name: gitea-http
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
