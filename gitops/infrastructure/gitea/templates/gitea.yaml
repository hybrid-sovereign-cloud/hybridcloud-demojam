apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea
  namespace: gitea
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
  storageClassName: ocs-external-storagecluster-ceph-rbd-immediate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    app.kubernetes.io/name: gitea
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: gitea
      containers:
        - name: gitea
          image: image-registry.openshift-image-registry.svc:5000/sovereign-cloud/gitea-local:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GITEA__security__INSTALL_LOCK
              value: "false"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: gitea
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: gitea
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gitea
  namespace: gitea
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  to:
    kind: Service
    name: gitea-http
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
