apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: quay
  namespace: quay
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  targetNamespaces:
    - quay
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: quay-operator
  namespace: quay
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: stable-3.17
  installPlanApproval: Automatic
  name: quay-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# ODF NooBaa Object Bucket for Quay storage
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: quay-datastore
  namespace: quay
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  generateBucketName: quay-datastore
  storageClassName: openshift-storage.noobaa.io
---
# Minimal config bundle: enable first-user initialize + superuser for API bootstrap.
# Operator merges managed component settings (DB, redis, storage, hostname) into this.
apiVersion: v1
kind: Secret
metadata:
  name: quay-config-bundle
  namespace: quay
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "19"
stringData:
  config.yaml: |
    FEATURE_USER_INITIALIZE: true
    FEATURE_SUPERUSERS_FULL_ACCESS: true
    FEATURE_USER_CREATION: false
    FEATURE_TEAM_SYNCING: true
    FEATURE_NONSUPERUSER_TEAM_SYNCING_SETUP: false
    TEAM_RESYNC_STALE_TIME: "60m"
    SUPER_USERS:
      - quayadmin
    AUTHENTICATION_TYPE: Database
---
# QuayRegistry with managed objectstorage initially. Minimal managed components for first bring-up.
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: quay
  namespace: quay
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  configBundleSecret: quay-config-bundle
  components:
    - kind: objectstorage
      managed: true
    - kind: postgres
      managed: true
    - kind: clair
      managed: false
    - kind: redis
      managed: true
    - kind: mirror
      managed: false
    - kind: route
      managed: true
    - kind: tls
      managed: true
    - kind: monitoring
      managed: false
    - kind: quay
      managed: true
    - kind: horizontalpodautoscaler
      managed: false
