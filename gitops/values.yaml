# Sovereign GitOps — multi-cluster mirror defaults
# Parent Argo Application (field-content) may inject deployer/aap/keycloak URLs.
# NEVER render *Password / secrets from parent values into manifests.

global:
  partOf: hybridsovereign-gitops
  # Derived per-cluster; override via Argo helm values when needed
  repoURL: https://github.com/hybrid-sovereign-cloud/hybridcloud-demojam
  targetRevision: main
  # In-cluster destination for mirror replicas
  destinationServer: https://kubernetes.default.svc

# Pre-installed on every target cluster — adopt only, never reinstall/uninstall
adopt:
  aap: true
  rhbk: true
  odf: true
  gitops: true
  cnv: true
  certManager: true

# Installed identically via this chart on every cluster
provision:
  namespaces: true
  argocdCapacity: true  # Phase-1: scale GitOps controller/repo before heavy sync
  eso: true
  vault: true
  quay: true
  gitea: true
  acm: true
  mce: true
  # WildcardsAllowed on IngressController/default — required for Hypershift
  # KubeVirt baseDomainPassthrough guest console/apps routes
  ingress: true
  # Default OFF: Day-0 images come from quay.io/gauravshankar (no per-ZTP rebuild).
  # Set true only for air-gap hubs that cannot pull Quay and need local BuildConfigs.
  builds: false
  operators: true
  platformConfigs: true  # ZTP prereq — RbacConfig / AAPConfig / QuayConfig (default on)
  platformSmoke: true    # always-on ACME Entity + local CloudVirt + dummy tool CRs
  # Hybrid Fabric ZTP (design/fabric.md): fabrics + HCP1–3 + EVPN zoning; no RHOSO/CloudOSO
  platformFabric: true
  ui: true
  # IaaC config-as-code: bootstraps the Gitea admin + tenancy repo headlessly,
  # builds the sync image in-cluster, runs the StatefulSet and the Iaac CR.
  iaac: true
  samples: true  # seed workshop sample CRs once (no selfHeal — UI deletes stay deleted)
  aapConfig: true  # JobTemplates / org config only (not AAP instance)

# Image for every kind_reconcile operator Deployment in gitops/custom-operators
# (plain kustomize, so not templated): hs-operators applies it via
# spec.source.kustomize.images, replacing the quay default below. Empty keeps
# the manifests as they are. Pin a tag or digest, never :latest, e.g.
#   image-registry.openshift-image-registry.svc:5000/sovereign-cloud/hybridsovereign-ansible-operator:fabric-restructure-<sha>
customOperators:
  defaultImage: quay.io/gauravshankar/hybridsovereign-ansible-operator
  image: ""

# Hard bans
kafka: false
eda: false
mtc: false
mtv: false

# Sample filters (only used when provision.samples is true)
samples:
  deployAllExceptParked: false
  # Parked = cannot reach healthy on a hub-only run: each needs credentials for,
  # or a provisioned instance of, a cloud outside the central cluster. The
  # central cluster is always provisioned first and must never block on these.
  parkedKinds:
    - CloudAWS
    - CloudOSO
    - OpenStackMigration
  # CloudVirt is NOT a sample — always-on via platform-smoke (local-virt)
  # Iaac is NOT a sample — own app, hs-iaac (wave 52)
  #
  # PlatformOpenshift (type: hosted) + Assignment ARE deployed: HyperShift on the
  # hub's own CloudVirt needs no external cloud. They are the slowest part of a
  # cold run (~30-45 min); set false to skip. Consumed by gitops/apps/samples.
  hostedCluster: true
  hostedClusterNodePoolReplicas: 2
  hostedClusterWorkerCores: 4
  hostedClusterWorkerMemory: 16Gi
# Non-secret URLs (optional overrides from field-content)
deployer:
  domain: ""
  apiUrl: ""
aap:
  url: ""
keycloak:
  consoleUrl: ""
openshift:
  consoleUrl: ""

# Namespaces managed by gitops
namespaces:
  - sovereign-secrets
  - sovereign-cloud
  - sovereign-cloud-plugins
  - sovereign-cloud-jobs  # ACM spoke-sso ensure Job (hs-acm Sync hooks)
  - sovereign-ui
  - vault
  - quay
  - gitea
  - openshift-acm  # ACM hub when provisioned
  - external-secrets  # ESO operand controllers (OpenShift ESO)
  - multicluster-engine  # MCE (hs-mce); never prune
  - open-cluster-management  # ACM hub (hs-acm); never prune

# UI images (gitops/apps/ui). Empty keeps the quay.io/gauravshankar defaults;
# set to internally built digests (gitops/builds BuildConfigs) to run UI code
# from this repo, e.g. image-registry.openshift-image-registry.svc:5000/sovereign-cloud/sovereign-admin-plugin@sha256:...
ui:
  images:
    adminPlugin: ""
    tenantPlugin: ""
    adminDashboard: ""
    tenantDashboard: ""
