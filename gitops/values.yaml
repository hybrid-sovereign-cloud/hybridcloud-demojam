# Sovereign GitOps — multi-cluster mirror defaults
# Parent Argo Application (field-content) may inject deployer/aap/keycloak URLs.
# NEVER render *Password / secrets from parent values into manifests.

global:
  partOf: hybridsovereign-gitops
  # Derived per-cluster; override via Argo helm values when needed
  repoURL: https://github.com/hybrid-sovereign-cloud/hybridcloud-demojam
  targetRevision: main
  # In-cluster destination for mirror replicas
  destinationServer: https://kubernetes.default.svc

# Pre-installed on every target cluster — adopt only, never reinstall/uninstall
adopt:
  aap: true
  rhbk: true
  odf: true
  gitops: true
  cnv: true
  certManager: true

# Installed identically via this chart on every cluster
provision:
  namespaces: true
  argocdCapacity: true  # Phase-1: scale GitOps controller/repo before heavy sync
  eso: true
  vault: true
  quay: true
  gitea: true
  acm: true
  mce: true
  builds: true
  operators: true
  platformConfigs: true  # ZTP prereq — RbacConfig / AAPConfig / QuayConfig (default on)
  platformSmoke: true    # always-on ACME Entity + dummy AAP/Quay/Rbac CRs
  ui: true
  samples: false  # disabled — do not install workshop sample CRs via ArgoCD
  aapConfig: true  # JobTemplates / org config only (not AAP instance)

# Hard bans
kafka: false
eda: false
mtc: false
mtv: false

# Sample filters (only used when provision.samples is true)
samples:
  deployAllExceptParked: false
  parkedKinds:
    - CloudAWS
    - CloudOSO
    - PlatformOpenshift
    - OpenStackMigration

# Non-secret URLs (optional overrides from field-content)
deployer:
  domain: ""
  apiUrl: ""
aap:
  url: ""
keycloak:
  consoleUrl: ""
openshift:
  consoleUrl: ""

# Namespaces managed by gitops
namespaces:
  - sovereign-secrets
  - sovereign-cloud
  - sovereign-cloud-plugins
  - sovereign-ui
  - vault
  - quay
  - gitea
  - openshift-acm  # ACM hub when provisioned
  - external-secrets  # ESO operand controllers (OpenShift ESO)
  - multicluster-engine  # MCE (hs-mce); never prune
  - open-cluster-management  # ACM hub (hs-acm); never prune
