# Allow gitea namespace SA to pull from sovereign-cloud ImageStreams
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-pull-sovereign-cloud-images
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: gitea
    namespace: gitea
  - kind: ServiceAccount
    name: default
    namespace: gitea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
---
# Operators in sovereign-cloud pull local IS (same NS) — also allow plugins NS later
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: default-puller
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: default
    namespace: sovereign-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
