# Always-on platform plugin configs (fresh install defaults).
# RbacConfig → internal SSO realm credentials (rhbk-services-admin).
# AAPConfig  → AAP admin credentials.
# QuayConfig → Quay admin credentials.
# CR name keycloak-sovereign-tenants-services is historical; Keycloak realm is OpenShift lab `sso`.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: RbacConfig
metadata:
  name: keycloak-sovereign-tenants-services
  namespace: sovereign-cloud-plugins
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-config: "true"
spec:
  type: keycloak
  secret: rhbk-services-admin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: AAPConfig
metadata:
  name: aap-sovereign-services
  namespace: sovereign-cloud-plugins
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-config: "true"
spec:
  secret: aap-admin-credentials
  rbacConfig: keycloak-sovereign-tenants-services
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: QuayConfig
metadata:
  name: quay-sovereign-services
  namespace: sovereign-cloud-plugins
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-config: "true"
spec:
  secret: quay-admin-credentials
  rbacConfig: keycloak-sovereign-tenants-services
