# Sync hook (wave -5) — ensure plugin admin secrets exist before config CRs (wave 0/1).
# Parent places this app after hs-quay (30) + hs-aap-config (35) + hs-operators (40).
# Fixes the race where hs-security PostSync (wave 22) may seed Quay before QuayRegistry exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-platform-config-ensure-secrets
  namespace: sovereign-cloud-plugins
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-config: "true"
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
        hybridsovereign.redhat/platform-config: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hs-platform-config-ztp
      containers:
        - name: ensure
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              echo "ZTP Sync: waiting for Keycloak / AAP / Quay admin sources..."

              APPS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
              [ -n "$APPS_DOMAIN" ] || { echo "FATAL: apps domain missing" >&2; exit 1; }

              # --- Keycloak / RHBK (adopted) ---
              for i in $(seq 1 90); do
                if oc get secret keycloak-initial-admin -n keycloak >/dev/null 2>&1; then
                  break
                fi
                echo "  waiting keycloak-initial-admin (${i}/90)"
                sleep 10
              done
              oc get secret keycloak-initial-admin -n keycloak >/dev/null
              KC_URL="https://sso.${APPS_DOMAIN}"
              if oc -n keycloak get route keycloak >/dev/null 2>&1; then
                KC_URL="https://$(oc -n keycloak get route keycloak -o jsonpath='{.spec.host}')"
              fi
              KC_USER=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.username}' | base64 -d)
              KC_PASS=$(oc get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.password}' | base64 -d)
              oc create secret generic rhbk-services-admin -n sovereign-cloud-plugins \
                --from-literal=username="$KC_USER" \
                --from-literal=password="$KC_PASS" \
                --from-literal=url="$KC_URL" \
                --from-literal=type=keycloak \
                --dry-run=client -o yaml | oc apply -f -
              echo "ok rhbk-services-admin → $KC_URL"

              # --- AAP (adopted) ---
              AAP_USER=admin
              AAP_PASS=""
              AAP_URL="https://aap-aap.${APPS_DOMAIN}"
              if oc -n aap get route aap >/dev/null 2>&1; then
                AAP_URL="https://$(oc -n aap get route aap -o jsonpath='{.spec.host}')"
              fi
              for i in $(seq 1 90); do
                if oc get secret aap-admin-credentials -n aap >/dev/null 2>&1 \
                  || oc get secret aap-admin -n sovereign-secrets >/dev/null 2>&1 \
                  || oc get secret -n aap -o name 2>/dev/null | grep -Eq 'admin-password|admin_password'; then
                  break
                fi
                echo "  waiting AAP admin secret (${i}/90)"
                sleep 10
              done
              if oc get secret aap-admin-credentials -n aap >/dev/null 2>&1; then
                AAP_USER=$(oc get secret aap-admin-credentials -n aap -o jsonpath='{.data.username}' | base64 -d)
                AAP_PASS=$(oc get secret aap-admin-credentials -n aap -o jsonpath='{.data.password}' | base64 -d)
                U=$(oc get secret aap-admin-credentials -n aap -o jsonpath='{.data.url}' | base64 -d || true)
                [ -n "$U" ] && AAP_URL="$U"
              elif oc get secret aap-admin -n sovereign-secrets >/dev/null 2>&1; then
                AAP_PASS=$(oc get secret aap-admin -n sovereign-secrets -o jsonpath='{.data.password}' | base64 -d || true)
                H=$(oc get secret aap-admin -n sovereign-secrets -o jsonpath='{.data.host}' | base64 -d || true)
                [ -n "$H" ] && AAP_URL="$H"
              else
                SECRET=$(oc get secret -n aap -o name | grep -E 'admin-password|admin_password' | head -1 | sed 's|secret/||')
                [ -n "$SECRET" ] && AAP_PASS=$(oc get secret -n aap "$SECRET" -o jsonpath='{.data.password}' | base64 -d)
              fi
              [ -n "$AAP_PASS" ] || { echo "FATAL: no AAP admin password" >&2; exit 1; }
              oc create secret generic aap-admin-credentials -n sovereign-cloud-plugins \
                --from-literal=username="$AAP_USER" \
                --from-literal=password="$AAP_PASS" \
                --from-literal=url="$AAP_URL" \
                --dry-run=client -o yaml | oc apply -f -
              echo "ok aap-admin-credentials → $AAP_URL"

              # --- Quay (provisioned by hs-quay wave 30; must exist before this PreSync) ---
              # Do NOT use registry SECRET_KEY as the admin password — Database auth needs a
              # real user. Prefer existing token; else CSRF signin; else /api/v1/user/initialize.
              QUAY_URL="https://quay-quay-quay.${APPS_DOMAIN}"
              if oc -n quay get route quay-quay >/dev/null 2>&1; then
                QUAY_URL="https://$(oc -n quay get route quay-quay -o jsonpath='{.spec.host}')"
              fi
              echo "waiting for Quay API at $QUAY_URL"
              for i in $(seq 1 90); do
                code=$(curl -sk -o /dev/null -w '%{http_code}' "$QUAY_URL/csrf_token" || true)
                [ "$code" = "200" ] && break
                echo "  waiting Quay csrf_token (${i}/90) http=$code"
                sleep 10
              done
              code=$(curl -sk -o /dev/null -w '%{http_code}' "$QUAY_URL/csrf_token" || true)
              [ "$code" = "200" ] || { echo "FATAL: Quay API not ready at $QUAY_URL" >&2; exit 1; }

              export QUAY_URL
              python3 - <<'PY'
              import json, os, ssl, subprocess, sys, urllib.error, urllib.request
              from http.cookiejar import CookieJar

              base = os.environ["QUAY_URL"].rstrip("/")
              ctx = ssl._create_unverified_context()

              def secret_field(name, key):
                  try:
                      b = subprocess.check_output(
                          ["oc", "-n", "sovereign-cloud-plugins", "get", "secret", name,
                           "-o", "jsonpath={.data." + key + "}"],
                          text=True, stderr=subprocess.DEVNULL,
                      ).strip()
                      if not b:
                          return ""
                      return subprocess.check_output(["base64", "-d"], input=b, text=True)
                  except Exception:
                      return ""

              def apply_secret(user, password, token):
                  cmd = [
                      "oc", "create", "secret", "generic", "quay-admin-credentials",
                      "-n", "sovereign-cloud-plugins",
                      f"--from-literal=username={user}",
                      f"--from-literal=password={password}",
                      f"--from-literal=url={base}",
                      f"--from-literal=token={token}",
                      "--dry-run=client", "-o", "yaml",
                  ]
                  yaml = subprocess.check_output(cmd)
                  subprocess.run(["oc", "apply", "-f", "-"], input=yaml, check=True)

              def bearer_ok(token):
                  if not token:
                      return False
                  req = urllib.request.Request(
                      base + "/api/v1/user/",
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  try:
                      with urllib.request.urlopen(req, context=ctx, timeout=30) as r:
                          return r.status == 200
                  except Exception:
                      return False

              def call(opener, method, path, body=None, csrf=None):
                  data = None if body is None else json.dumps(body).encode()
                  req = urllib.request.Request(base + path, data=data, method=method)
                  req.add_header("Content-Type", "application/json")
                  req.add_header("X-Requested-With", "XMLHttpRequest")
                  if csrf:
                      req.add_header("X-CSRF-Token", csrf)
                  try:
                      with opener.open(req, timeout=60) as resp:
                          return resp.status, json.loads(resp.read().decode() or "{}")
                  except urllib.error.HTTPError as e:
                      try:
                          payload = json.loads(e.read().decode() or "{}")
                      except Exception:
                          payload = {}
                      return e.code, payload

              def csrf_signin_apptoken(user, password):
                  jar = CookieJar()
                  opener = urllib.request.build_opener(
                      urllib.request.HTTPSHandler(context=ctx),
                      urllib.request.HTTPCookieProcessor(jar),
                  )
                  st, body = call(opener, "GET", "/csrf_token")
                  if st != 200 or not body.get("csrf_token"):
                      return ""
                  csrf = body["csrf_token"]
                  st, body = call(opener, "POST", "/api/v1/signin",
                                  {"username": user, "password": password}, csrf=csrf)
                  if st != 200 or not body.get("success"):
                      return ""
                  st, body = call(opener, "GET", "/csrf_token")
                  csrf = body.get("csrf_token") or csrf
                  st, body = call(opener, "POST", "/api/v1/user/apptoken",
                                  {"title": "sovereign-ztp-bootstrap"}, csrf=csrf)
                  tok = body.get("token")
                  if isinstance(tok, dict):
                      return tok.get("token") or ""
                  return tok if isinstance(tok, str) else ""

              def initialize_admin(user, password):
                  req = urllib.request.Request(
                      base + "/api/v1/user/initialize",
                      data=json.dumps({
                          "username": user,
                          "password": password,
                          "email": f"{user}@sovereign.local",
                          "access_token": True,
                      }).encode(),
                      method="POST",
                      headers={"Content-Type": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req, context=ctx, timeout=60) as r:
                          return r.status, json.loads(r.read().decode() or "{}")
                  except urllib.error.HTTPError as e:
                      try:
                          return e.code, json.loads(e.read().decode() or "{}")
                      except Exception:
                          return e.code, {}

              user = secret_field("quay-admin-credentials", "username") or "quayadmin"
              password = secret_field("quay-admin-credentials", "password")
              token = secret_field("quay-admin-credentials", "token")

              if bearer_ok(token):
                  apply_secret(user, password or "unset", token)
                  print("ok quay-admin-credentials (existing token)")
                  sys.exit(0)

              if password and password != "quay-bootstrap-pending":
                  token = csrf_signin_apptoken(user, password)
                  if bearer_ok(token):
                      apply_secret(user, password, token)
                      print("ok quay-admin-credentials (csrf+apptoken)")
                      sys.exit(0)

              # Fresh registry: create first superuser via initialize API
              import secrets
              password = secrets.token_urlsafe(24)
              st, body = initialize_admin(user, password)
              token = body.get("access_token") or body.get("token") or ""
              if isinstance(token, dict):
                  token = token.get("token") or ""
              if st in (200, 201) and bearer_ok(token):
                  apply_secret(user, password, token)
                  print("ok quay-admin-credentials (user/initialize)")
                  sys.exit(0)

              print(f"FATAL: Quay admin bootstrap failed status={st} keys={list(body.keys())}", file=sys.stderr)
              sys.exit(1)
              PY
              echo "ok quay-admin-credentials → $QUAY_URL"
              echo "ZTP Sync: plugin secrets ready"
