# Always-on CloudVirt (tenant project) on the hub OpenShift Virtualization (CNV).
# CNV is adopted on every target (adopt.cnv); this CR is base ZTP with Entity, not a sample.
# cloudRef: the platform CloudInfrastructure hub-virt (sovereign-cloud), declared in
# gitops/apps/platform-fabric/templates/cloud-infrastructure.yaml. That app syncs
# after this one; the CloudVirt reports Blocked until hub-virt exists, then reconciles.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudVirt
metadata:
  name: local-virt
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-smoke: "true"
    hybridsovereign.redhat/local-cluster: "true"
spec:
  cloudRef:
    kind: CloudInfrastructure
    name: hub-virt
  # Stable logical domain (no per-cluster apps./api. hardcoding in Git).
  baseDomain: cnv.local
  # Workshop / external ODF default; CRD default is internal ocs-storagecluster-ceph-rbd.
  storageClass: ocs-external-storagecluster-ceph-rbd
  toolRbac:
    environmentAdminRbac:
      - acme-platform-admins
    environmentPoweruserRbac:
      - acme-infra-team
    environmentViewerRbac:
      - acme-viewers
