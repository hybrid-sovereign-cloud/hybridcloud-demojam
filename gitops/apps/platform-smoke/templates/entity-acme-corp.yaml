# Always-on ACME smoke Entity (not a sample). Validates entity + namespace operator path.
---
apiVersion: v1
kind: Namespace
metadata:
  name: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-smoke: "true"
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Entity
metadata:
  name: acme-corp
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-smoke: "true"
spec:
  description: >-
    ACME Corporation — always-on smoke tenant for platform config validation.
  billingID: ACME-2024-001
  websiteLink: https://acme-corp.example.com
  namespaceRbac:
    entityAdmin:
      - acme-platform-admins
    auditor:
      - acme-auditors
      - acme-viewers
    BobsTeam:
      - acme-viewers
    cloudOSOAdmin:
      - acme-infra-team
    cloudOSOView:
      - acme-devs
    cloudAWSAdmin:
      - acme-infra-team
    cloudAWSView:
      - acme-devs
    platformOpenshiftAdmin:
      - acme-platform-admins
    platformOpenshiftView:
      - acme-viewers
    teamAdmin:
      - acme-platform-admins
    teamView:
      - acme-viewers
    projectAdmin:
      - acme-platform-admins
    projectView:
      - acme-viewers
    assignmentAdmin:
      - acme-platform-admins
    identityAdmin:
      - acme-platform-admins
