  platformOpenshiftRef: hcp3
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: acme-hcp1-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/platformopenshift: hcp1
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: acme-hcp1-gw
  tunnelType: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: acme-oso1-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: acme-oso1-gw
  # Keys come from the BGW and gateway Vault entries; no vaultConfigRef needed.
  tunnelType: wireguard
---
