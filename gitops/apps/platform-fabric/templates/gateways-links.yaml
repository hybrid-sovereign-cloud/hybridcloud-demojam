# One CloudGateway per site attached to the fabric (design/fabric.md §8.2, §8.3).
# Sites are shared by all tenant VRFs. cloudRef names the CloudInfrastructure
# (cloud-infrastructure.yaml); the transport type is set here only.
# OpenStack site: transport wireguard (site gateway VM tunnels to the border gateway).
# Hub (OpenShift Virtualization): transport none (hub node VTEPs on the underlay).
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-oso1-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudRef:
    kind: CloudInfrastructure
    name: oso1
  transport:
    type: wireguard
    # WireGuard key pair; generated when missing.
    vaultPeerConfigRef: fabric/wireguard/acme-oso1-gw
  wireguard:
    address: 10.254.254.12/32
  siteUnderlay:
    interface: enp7s0          # management-cluster node NIC on the site underlay
    computeInterface: eth5     # compute node NIC on the site underlay (VTEP)
    cidr: 192.168.80.0/24
    gatewayAddress: 192.168.80.1
    mtu: 1442
  # Lab-only shim (hypervisor source-MAC filtering); off on physical sites.
  macNatShim:
    enabled: true
    interface: enp7s0
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: hub-virt-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudRef:
    kind: CloudInfrastructure
    name: hub-virt
  transport:
    type: none
  # If the hub hypervisor filters source MACs on the node NIC (plan §4 step 2),
  # enable the shim for the border gateway's hub leg:
  # macNatShim:
  #   enabled: true
  #   interface: enp2s0
---
# TransportLink: kept for the WireGuard site until the operator generates links
# from CloudGateways (TransportLink is operator-generated in the new API).
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: acme-oso1-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: acme-oso1-gw
  # Keys come from the border gateway and site gateway Vault entries.
  tunnelType: wireguard
