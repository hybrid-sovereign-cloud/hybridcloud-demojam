# One CloudGateway + TransportLink per site (design/fabric.md §8.2, §8.3).
# Sites are shared by all tenant VRFs; domainAsn is the fabric ASN (iBGP).
# Hosted clusters: transport none (nodes on the hub underlay).
# OpenStack site: transport wireguard (site gateway VM tunnels to the border gateway).
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-hcp1-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp1
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp1
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-oso1-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openstack
  region: regionOne
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: wireguard
    # WireGuard key pair; generated when missing.
    vaultPeerConfigRef: fabric/wireguard/acme-oso1-gw
  openstackCloudOSORef: oso1
  # Management cluster kubeconfig: CloudOSO spec.managementClusterKubeconfigRef.
  wireguard:
    address: 10.254.254.12/32
  siteUnderlay:
    interface: enp7s0          # management-cluster node NIC on the site underlay
    computeInterface: eth5     # compute node NIC on the site underlay (VTEP)
    cidr: 192.168.80.0/24
    gatewayAddress: 192.168.80.1
    mtu: 1442
    # Lab-only shim (hypervisor source-MAC filtering); off on physical sites.
    macNatShim:
      enabled: true
      vmMac: "02:fa:b0:50:00:01"
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: chad-hcp2-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: chad
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp2
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp2
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: chad-hcp3-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: chad
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp3
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp3
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: acme-hcp1-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/platformopenshift: hcp1
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: acme-hcp1-gw
  tunnelType: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: acme-oso1-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: acme-oso1-gw
  # Keys come from the border gateway and site gateway Vault entries.
  tunnelType: wireguard
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: chad-hcp2-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
