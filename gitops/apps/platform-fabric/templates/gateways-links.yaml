# EVPN zoning — Acme HCP1 + OSO1; Chad HCP2+HCP3.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-hcp1-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: acme-fabric
    hybridsovereign.redhat/platformopenshift: hcp1
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65011
  fabricRef: acme-fabric
  transport:
    type: wireguard
  platformOpenshiftRef: hcp1
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
