# Sites on the single platform fabric (design/fabric-bgw-plan.md §12).
# Gateways/links are platform-owned per site; tenants (acme-corp, chad) share them
# and are separated by RT. domainAsn = fabric ASN (iBGP to the BGW; the per-spoke
# ASN scheme is retired).
# HCP spokes: transport none — workers sit on the fabric hub underlay (eth1) and
# peer natively with the border gateway loopback.
# OSO1: transport wireguard — EDA builds a site gateway VM on the RHOSO management
# cluster (br-fabric on siteUnderlay.interface) that tunnels to the BGW over
# WireGuard inside wstunnel (hub ingress, TLS 443), and lands EDPM EVPN.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-hcp1-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp1
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp1
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-oso1-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openstack
  region: regionOne
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: wireguard
    # wgPrivateKey / wgPublicKey (generated by EDA when missing).
    vaultPeerConfigRef: fabric/wireguard/acme-oso1-gw
  openstackCloudOSORef: oso1
  # RHOSO management cluster kubeconfig comes from CloudOSO/oso1
  # spec.managementClusterKubeconfigRef (override here if needed).
  wireguard:
    address: 10.254.254.12/32
  siteUnderlay:
    interface: enp7s0          # spare NIC on the RHOSO OCP nodes (bridged as br-fabric)
    computeInterface: eth5     # EDPM compute NIC on the same L2 (VTEP / FRR source)
    cidr: 192.168.80.0/24
    gatewayAddress: 192.168.80.1
    mtu: 1442
    # LAB ONLY (RHDP hypervisor MAC anti-spoof). DaemonSet on every node derives
    # the local NIC MAC at runtime; no per-node values. Off on physical sites.
    macNatShim:
      enabled: true
      vmMac: "02:fa:b0:50:00:01"
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: chad-hcp2-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: chad
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp2
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp2
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
