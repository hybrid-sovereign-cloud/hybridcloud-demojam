# EVPN zoning — HCP spokes only (acme = HCP1; chad = HCP2+HCP3). No OSO1 / CloudOSO.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-hcp1-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: acme-fabric
    hybridsovereign.redhat/platformopenshift: hcp1
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65011
  fabricRef: acme-fabric
  transport:
    type: wireguard
  platformOpenshiftRef: hcp1
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: chad-hcp2-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: chad
    hybridsovereign.redhat/fabric: chad-fabric
    hybridsovereign.redhat/platformopenshift: hcp2
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65021
  fabricRef: chad-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp2
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: chad-hcp3-gw
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  labels:
    hybridsovereign.redhat/entity: chad
    hybridsovereign.redhat/fabric: chad-fabric
    hybridsovereign.redhat/platformopenshift: hcp3
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65022
  fabricRef: chad-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp3
  virtCloudVirtRef: local-virt
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: acme-hcp1-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/platformopenshift: hcp1
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: acme-fabric
  cloudGatewayRef: acme-hcp1-gw
  tunnelType: wireguard
  vaultConfigRef: fabric/wireguard/hub
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: chad-hcp2-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/platformopenshift: hcp2
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: chad-fabric
  cloudGatewayRef: chad-hcp2-gw
  tunnelType: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: chad-hcp3-link
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "55"
  labels:
    hybridsovereign.redhat/platformopenshift: hcp3
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  fabricRef: chad-fabric
  cloudGatewayRef: chad-hcp3-gw
  tunnelType: none
