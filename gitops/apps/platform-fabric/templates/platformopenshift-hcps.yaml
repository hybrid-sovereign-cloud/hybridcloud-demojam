# Hosted Control Planes — design/fabric.md §3 (all three HCPs in ZTP).
# No type=openstack / CloudOSO. Shared CNV underlay via per-entity CloudVirt/local-virt.
# nodePoolReplicas=1 keeps workshop footprint workable on compact hubs.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: PlatformOpenshift
metadata:
  name: hcp1
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
    hybridsovereign.redhat/fabric: platform-fabric
spec:
  type: hosted
  hosted:
    environment: local-virt
    nodePoolReplicas: 1
    # ACM policy addons + openshift-frr-k8s need headroom on the single worker.
    workerCores: 4
    workerMemory: 16Gi
  networking:
    allocateFromFabric: true
    fabricRef: platform-fabric
  fabric:
    joinPolicy: ExplicitOnly
    fabricRefs:
      - platform-fabric
    # Gateways/links are owned by this chart (EVPN zoning); do not double-create.
    manageGatewayAndLink: false
    tunnelType: none
  toolRbac:
    clusterAdminRbac:
      - acme-platform-admins
    clusterViewerRbac:
      - acme-viewers
