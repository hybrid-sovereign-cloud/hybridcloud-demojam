# Platform fabric: one HybridFabric per hub, owned by the platform
# (design/fabric.md §1.1). Tenants are VRFs (HybridNetwork: VNI + RT) on it and
# share the border gateway and site tunnels; isolation is by route target.
# Fabric-wide unique: VNI/RT, underlay segments, gateway addresses (§16).
# WireGuard keys: Vault fabric/<fabric>/bgw (generated when missing).
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridFabric
metadata:
  name: platform-fabric
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  enabled: true
  domainAsn: 65010
  entityRefs:
    - name: acme-corp
    - name: chad
  # Underlay address plan. Site underlays (e.g. 192.168.80.0/24 behind the
  # site gateway) and the hub VTEP block are carved from cidr.
  # localnet: the border gateway's underlay NIC is an OVN-K localnet network
  # on the node bridge for physnet (br-ex), addressed hubLegAddress; hub nodes
  # take VTEP addresses from hubVtepBlock. No DHCP on a localnet leg.
  underlay:
    type: localnet
    physicalNetworkName: physnet
    nadName: fabric-localnet
    cidr: 192.168.64.0/18
    hubVtepBlock: 192.168.65.0/24
    hubLegAddress: 192.168.65.1/24
    mtu: 1400
  borderGateway:
    name: fabric-bgw
    loopback: 10.255.10.10
    vaultCredentialRef: fabric/platform-fabric/bgw
    # ingressHost defaults to fabric-bgw.<hub ingress domain>.
    wireguard:
      address: 10.254.254.1/24
      listenPort: 51820
    vmSize:
      cpu: 2
      memory: 4Gi
    image: docker://quay.io/containerdisks/centos-stream:9
  vniPool:
    start: 51000
    end: 52127
  transportDefaults:
    mtu: 1442
    defaultTunnelType: none
