  ipam:
    clusterNetworkPool:
      cidr: 10.144.0.0/12
      blockPrefixLength: 14
    serviceNetworkPool:
      cidr: 172.32.0.0/15
      blockPrefixLength: 16
    machineNetworkPool:
      cidr: 192.168.128.0/18
