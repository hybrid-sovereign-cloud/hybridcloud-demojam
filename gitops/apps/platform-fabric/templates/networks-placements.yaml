# Tenant VRFs (HybridNetwork) and their placements on the platform fabric.
# Backends are tenant cloud projects: CloudVirt (VMs on the hub) and CloudOSO.
# CloudVirt placements: the operator creates the vmNamespaces, labelled as
# primary-network members of the HybridNetwork, before any VM starts.
# CloudOSO placement acme-core-oso1 (10.110.1.0/24) is applied outside GitOps
# (samples/hybridvpc/acme-chad-networks.yaml), like CloudOSO oso1 itself.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridNetwork
metadata:
  name: acme-core
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  description: Acme core VRF (hub VMs and the OpenStack site)
  fabricRef: platform-fabric
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: acme-core-hub
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  network: acme-core
  backend:
    kind: CloudVirt
    name: local-virt
  prefixes:
    - 10.110.2.0/24
  vmNamespaces:
    - acme-core-vms
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridNetwork
metadata:
  name: chad-app
  namespace: entity-chad
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  description: Chad app VRF (hub VMs)
  fabricRef: platform-fabric
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: chad-app-hub
  namespace: entity-chad
  annotations:
    argocd.argoproj.io/sync-wave: "65"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/platform-fabric: "true"
spec:
  network: chad-app
  backend:
    kind: CloudVirt
    name: local-virt
  prefixes:
    - 10.120.2.0/24
  vmNamespaces:
    - chad-app-vms
