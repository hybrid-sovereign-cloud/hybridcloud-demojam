# Admin + tenant dashboards from local ImageStreams (built by hs-builds).
# Auth: ose-oauth-proxy sidecar (OpenShift SA OAuth) → X-Forwarded-User / Access-Token.
apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-ui
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sovereign-ui-puller
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: default
    namespace: sovereign-ui
  - kind: ServiceAccount
    name: sovereign-cloud-dashboard
    namespace: sovereign-ui
  - kind: ServiceAccount
    name: tenancy-dashboard
    namespace: sovereign-ui
  - kind: ServiceAccount
    name: sovereign-admin-plugin
    namespace: sovereign-ui
  - kind: ServiceAccount
    name: sovereign-tenant-plugin
    namespace: sovereign-ui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"sovereign-cloud-dashboard"}}'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenancy-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"tenancy-dashboard"}}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sovereign-cloud-dashboard-auth-delegator
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: sovereign-cloud-dashboard
    namespace: sovereign-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenancy-dashboard-auth-delegator
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: tenancy-dashboard
    namespace: sovereign-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    app.kubernetes.io/name: sovereign-cloud-dashboard
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-cloud-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-cloud-dashboard
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: sovereign-cloud-dashboard
      initContainers:
        - name: gen-cookie-secret
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              # Exactly 32 bytes required when pass_access_token=true (no trailing newline)
              printf '%s' "$(openssl rand -hex 16)" > /etc/proxy/secrets/session_secret
              chmod 0444 /etc/proxy/secrets/session_secret
          volumeMounts:
            - name: proxy-secret
              mountPath: /etc/proxy/secrets
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9@sha256:649e898b993644eb7253fa36468d5417f124bdeedeebaa503660e4bc9f23fc8e
          imagePullPolicy: IfNotPresent
          args:
            - -provider=openshift
            - -https-address=:8443
            - -http-address=
            - -email-domain=*
            - -upstream=http://127.0.0.1:8080
            - -tls-cert=/etc/tls/private/tls.crt
            - -tls-key=/etc/tls/private/tls.key
            - -cookie-secret-file=/etc/proxy/secrets/session_secret
            - -openshift-service-account=sovereign-cloud-dashboard
            - -openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - -pass-access-token=true
            - -pass-user-headers=true
            - -cookie-secure=true
            - -cookie-httponly=true
            - -cookie-samesite=strict
            - -scope=user:full
            - -skip-auth-regex=^/healthz
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: proxy-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/sovereign-cloud/sovereign-cloud-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: ENTITY_NAMESPACE
              value: sovereign-cloud
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: proxy-tls
          secret:
            secretName: sovereign-cloud-dashboard-tls
        - name: proxy-secret
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: sovereign-cloud-dashboard-tls
spec:
  ports:
    - port: 8443
      targetPort: https
      name: https
  selector:
    app.kubernetes.io/name: sovereign-cloud-dashboard
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  to:
    kind: Service
    name: sovereign-cloud-dashboard
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
---
