# Admin + tenant dashboards from local ImageStreams (built by hs-builds).
apiVersion: v1
kind: Namespace
metadata:
  name: sovereign-ui
  labels:
    app.kubernetes.io/part-of: hybridsovereign-gitops
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sovereign-ui-puller
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: default
    namespace: sovereign-ui
  - kind: ServiceAccount
    name: sovereign-cloud-dashboard
    namespace: sovereign-ui
  - kind: ServiceAccount
    name: tenancy-dashboard
    namespace: sovereign-ui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenancy-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    app.kubernetes.io/name: sovereign-cloud-dashboard
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sovereign-cloud-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sovereign-cloud-dashboard
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: sovereign-cloud-dashboard
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/sovereign-cloud/sovereign-cloud-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: sovereign-cloud-dashboard
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sovereign-cloud-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  to:
    kind: Service
    name: sovereign-cloud-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenancy-dashboard
  namespace: sovereign-ui
  labels:
    app.kubernetes.io/name: tenancy-dashboard
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenancy-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenancy-dashboard
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: tenancy-dashboard
      containers:
        - name: dashboard
          image: image-registry.openshift-image-registry.svc:5000/sovereign-cloud/tenancy-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tenancy-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: tenancy-dashboard
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tenancy-dashboard
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
spec:
  to:
    kind: Service
    name: tenancy-dashboard
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
