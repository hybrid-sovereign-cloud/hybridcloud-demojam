# Generate oauth-proxy cookie secrets in-cluster (never committed to git).
# Idempotent: creates Secret only if missing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: dashboard-oauth-bootstrap
    namespace: sovereign-ui
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: dashboard-oauth-bootstrap
      containers:
        - name: bootstrap
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              NS=sovereign-ui
              for NAME in sovereign-cloud-dashboard-proxy tenancy-dashboard-proxy; do
                NEED=1
                if oc get secret "$NAME" -n "$NS" >/dev/null 2>&1; then
                  # ose-oauth-proxy requires cookie secret length exactly 16, 24, or 32 bytes
                  LEN=$(oc get secret "$NAME" -n "$NS" -o jsonpath='{.data.session_secret}' | base64 -d | wc -c | tr -d ' ')
                  if [ "$LEN" = "16" ] || [ "$LEN" = "24" ] || [ "$LEN" = "32" ]; then
                    echo "secret/$NAME ok (len=$LEN) — skip"
                    NEED=0
                  else
                    echo "secret/$NAME invalid len=$LEN — recreate"
                    oc delete secret "$NAME" -n "$NS" --ignore-not-found
                  fi
                fi
                if [ "$NEED" = "1" ]; then
                  # Exactly 32 ASCII bytes (AES key length for pass_access_token)
                  SECRET=$(openssl rand -hex 16)
                  oc create secret generic "$NAME" -n "$NS" \
                    --from-literal=session_secret="$SECRET"
                  echo "created secret/$NAME (len=32)"
                fi
              done
