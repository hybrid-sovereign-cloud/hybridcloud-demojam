# Bootstrap real OAuthClients for standalone dashboards.
# SA-as-OAuth-client cannot request user:full (scope denied) — see OpenShift docs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashboard-oauth-bootstrap
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: ["oauth.openshift.io"]
    resources: ["oauthclients"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-oauth-bootstrap
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashboard-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: dashboard-oauth-bootstrap
    namespace: sovereign-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashboard-oauth-bootstrap
subjects:
  - kind: ServiceAccount
    name: dashboard-oauth-bootstrap
    namespace: sovereign-ui
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dashboard-oauth-bootstrap
  namespace: sovereign-ui
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard-oauth-bootstrap
    spec:
      serviceAccountName: dashboard-oauth-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              NS=sovereign-ui
              DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
              for NAME in tenancy-dashboard sovereign-cloud-dashboard; do
                SECRET_NAME=${NAME}-oauth-client
                if ! oc get secret -n "$NS" "$SECRET_NAME" -o jsonpath='{.data.client-secret}' 2>/dev/null | grep -q .; then
                  CLIENT_SECRET=$(openssl rand -hex 32)
                  oc create secret generic -n "$NS" "$SECRET_NAME" \
                    --from-literal=client-secret="$CLIENT_SECRET"
                  oc label secret -n "$NS" "$SECRET_NAME" hybridsovereign.redhat/gitops-owned=true --overwrite || true
                else
                  CLIENT_SECRET=$(oc get secret -n "$NS" "$SECRET_NAME" -o jsonpath='{.data.client-secret}' | base64 -d)
                fi
                HOST="${NAME}-${NS}.${DOMAIN}"
                cat <<EOF | oc apply -f -
              apiVersion: oauth.openshift.io/v1
              kind: OAuthClient
              metadata:
                name: ${NAME}
                labels:
                  hybridsovereign.redhat/gitops-owned: "true"
              secret: ${CLIENT_SECRET}
              redirectURIs:
                - https://${HOST}/oauth/callback
              grantMethod: auto
              EOF
                echo "ok ${NAME} -> https://${HOST}/oauth/callback"
              done
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
