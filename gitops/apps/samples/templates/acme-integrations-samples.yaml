# Additional ACME samples that depend on always-on platform-smoke (Entity + core Rbacs + AAP/Quay orgs).
# Vault/VaultKV, HybridNetwork, extra Personas — not platform configs or smoke Entity.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Rbac
metadata:
  name: acme-vault-admins
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  config: keycloak-sovereign-tenants-services
  description: Vault administrators
---
# ha: true requires integrated raft (plugin-vault HA path). File storage is ha: false only.
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Vault
metadata:
  name: acme-vault
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  ha: true
  rbacConfig: keycloak-sovereign-tenants-services
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: VaultKV
metadata:
  name: acme-app-secrets
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  vault: acme-vault
  vaultAdminRbac:
    - acme-vault-admins
  vaultReaderRbac:
    - acme-developers
    - acme-operators
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridNetwork
metadata:
  name: payments-vpc
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  description: Application payments tier hybrid network
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Rbac
metadata:
  name: acme-assignment-admins
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  config: keycloak-sovereign-tenants-services
  description: Assignment administrators
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Persona
metadata:
  name: test-assignment-admin
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  rbac: acme-assignment-admins
  type: assignmentAdmin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Persona
metadata:
  name: test-identity-admin
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  rbac: acme-platform-admins
  type: identityAdmin
