    argocd.argoproj.io/sync-wave: "13"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  quayConfig: quay-sovereign-services
  quayAdminRbac:
    - acme-quay-admins
  quayCreatorRbac:
    - acme-developers
  quayMemberRbac:
    - acme-viewers
---
