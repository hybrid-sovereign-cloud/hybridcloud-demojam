---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Vault
metadata:
  name: acme-vault
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  ha: true
  rbacConfig: keycloak-sovereign-tenants-services
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: VaultKV
metadata:
  name: acme-app-secrets
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  vault: acme-vault
  vaultAdminRbac:
    - acme-vault-admins
  vaultReaderRbac:
    - acme-developers
    - acme-operators
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: AAPOrg
metadata:
  name: acme-automation
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "13"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  aapConfig: aap-sovereign-services
  aapAdminRbac:
    - acme-aap-admins
    - acme-devops
  aapJobExecutorRbac:
    - acme-aap-executors
    - acme-operators
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: QuayOrg
metadata:
  name: acme-registry
  namespace: entity-acme-corp
