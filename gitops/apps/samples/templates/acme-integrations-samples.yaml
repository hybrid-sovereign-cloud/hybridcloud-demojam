  name: acme-aap-admins
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  config: keycloak-sovereign-tenants-services
  description: AAP organization administrators
