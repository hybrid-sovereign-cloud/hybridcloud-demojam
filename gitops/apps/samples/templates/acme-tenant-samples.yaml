---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridFabric
metadata:
  name: lab-fabric
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  enabled: true
  domainAsn: 65000
  routeReflectors:
    - name: rr1
      address: 10.0.0.1
  vniPool:
    start: 50000
    end: 50511
  transportDefaults:
    mtu: 9000
    defaultTunnelType: wireguard
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: aws-us-east-1
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  enabled: true
  cloud: aws
  region: us-east-1
  domainAsn: 65001
  fabricRef: lab-fabric
  transport:
    type: wireguard
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: onprem-to-aws
  namespace: sovereign-cloud
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  enabled: true
  fabricRef: lab-fabric
  cloudGatewayRef: aws-us-east-1
  tunnelType: wireguard
