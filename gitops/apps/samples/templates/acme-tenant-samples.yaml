# ACME tenant sample CRs (Teams / Projects / Personas / fabric).
# Entity, core Rbacs, AAPOrg, QuayOrg, CloudVirt: always-on via hs-platform-smoke.
# No CloudAWS, CloudOSO, PlatformOpenshift, or Assignment samples.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Team
metadata:
  name: platform-engineering
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec: {}
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Team
metadata:
  name: platform-ops
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec: {}
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Project
metadata:
  name: website-redesign
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  description: ACME marketing site redesign
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Project
metadata:
  name: api-services
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  description: ACME public APIs
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Persona
metadata:
  name: test-entity-admin
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  rbac: acme-entity-admins
  type: entityAdmin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Persona
metadata:
  name: test-auditor
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "12"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  rbac: acme-viewers
  type: auditor
# HybridFabric, CloudInfrastructure, CloudGateways and the tenant VRF placements
# are always-on ZTP via hs-platform-fabric (gitops/apps/platform-fabric).
