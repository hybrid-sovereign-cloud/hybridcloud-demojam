apiVersion: hybridsovereign.redhat/v1alpha1
kind: RbacConfig
metadata:
  # CR name is historical; Keycloak realm is OpenShift lab `sso` (not sovereign-tenants).
  name: keycloak-sovereign-tenants-services
  namespace: sovereign-cloud-plugins
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  type: keycloak
  secret: rhbk-services-admin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: AAPConfig
metadata:
  name: aap-sovereign-services
  namespace: sovereign-cloud-plugins
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  secret: aap-admin-credentials
  rbacConfig: keycloak-sovereign-tenants-services
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: QuayConfig
metadata:
  name: quay-sovereign-services
  namespace: sovereign-cloud-plugins
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  secret: quay-admin-credentials
  rbacConfig: keycloak-sovereign-tenants-services
