apiVersion: v1
kind: ConfigMap
metadata:
  name: hs-samples-policy
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
data:
  parked: |
    CloudAWS, CloudOSO, PlatformOpenshift, Assignment, OpenStackMigration —
    not applied via hs-samples.
  unparked: |
    Tenant Teams/Projects/Personas + fabric samples via hs-samples (seed-once).
    CloudVirt local-virt is base ZTP (hs-platform-smoke), not a sample.
  status: |
    No Cloud* environment CRs in hs-samples.
  reconcile: |
    hs-samples: automated prune=false selfHeal=false — UI deletes of sample CRs
    are not restored by ArgoCD.
