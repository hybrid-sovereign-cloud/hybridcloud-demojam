apiVersion: v1
kind: ConfigMap
metadata:
  name: hs-samples-policy
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
data:
  parked: |
    OpenStackMigration — YAML retained in repo samples/; not applied this pass.
  unparked: |
    CloudAWS, CloudOSO, PlatformOpenshift (openstack|aws|virt|hosted) —
    applied via hs-samples (seed-once: no selfHeal / no prune).
    CloudVirt local-virt is base ZTP (hs-platform-smoke), not a sample.
  status: |
    Cloud environment + four PlatformOpenshift samples live under
    templates/cloud-environments.yaml and templates/platformopenshift-four.yaml.
  reconcile: |
    hs-samples: automated prune=false selfHeal=false — UI deletes of sample CRs
    are not restored by ArgoCD.
