apiVersion: v1
kind: ConfigMap
metadata:
  name: hs-samples-policy
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
data:
  parked: |
    OpenStackMigration, PlatformOpenshift, Assignment — not applied via hs-samples.
  unparked: |
    CloudAWS, CloudOSO — applied via hs-samples (seed-once: no selfHeal / no prune).
    CloudVirt local-virt is base ZTP (hs-platform-smoke), not a sample.
  status: |
    Cloud environment samples live under templates/cloud-environments.yaml.
  reconcile: |
    hs-samples: automated prune=false selfHeal=false — UI deletes of sample CRs
    are not restored by ArgoCD.
