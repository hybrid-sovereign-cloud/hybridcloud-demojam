apiVersion: v1
kind: ConfigMap
metadata:
  name: hs-samples-policy
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
data:
  parked: |
    CloudAWS, CloudOSO, PlatformOpenshift, OpenStackMigration — YAML retained in repo samples/; not applied until cloud secrets provided.
  status: |
    Live sample CRs are added in a subsequent commit after CRDs and operators are Ready.
    This placeholder keeps the hs-samples Application healthy during bootstrap.
