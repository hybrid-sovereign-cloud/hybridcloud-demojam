# Unparked CloudOSO + CloudAWS + CloudVirt sample CRs (GitOps).
# Credentials via vaultPath only (Step 0 → sovereign-secrets → PushSecret → Vault).
# baseDomain uses non-cluster placeholders (no apps./api. hardcoding).
# Note: CloudOSO/CloudAWS CRDs do not declare toolRbac yet — omit until CRD extended.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudOSO
metadata:
  name: workshop-oso
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  project: workshop-oso
  vaultPath: oso/accounts/example-admin
  baseDomain: lab.example.com
  projectDomain: example_domain
  externalNetwork: ext-net
  route53VaultPath: oso/accounts/route53-openstack
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudAWS
metadata:
  name: workshop-aws
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  # ACCOUNT_ID for API calls comes from Vault aws/accounts/example-admin
  account: "929186565356"
  vaultPath: aws/accounts/example-admin
  baseDomain: sandbox356.opentlc.com
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudVirt
metadata:
  name: workshop-virt
  namespace: entity-acme-corp
  annotations:
    argocd.argoproj.io/sync-wave: "40"
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
    hybridsovereign.redhat/sample: "true"
spec:
  vaultPath: virt/accounts/example-admin
  baseDomain: virt.example.com
  storageClass: ocs-external-storagecluster-ceph-rbd
  enableVRF: false
  toolRbac:
    environmentAdminRbac:
      - acme-platform-admins
    environmentPoweruserRbac:
      - acme-infra-team
    environmentViewerRbac:
      - acme-viewers
