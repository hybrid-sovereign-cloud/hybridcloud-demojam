# Create UIHealthChecker CRs with cluster-discovered apps domain (no hardcoded cluster URL).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hs-ui-health-urls
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hs-ui-health-urls
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: ["hybridsovereign.redhat"]
    resources: ["uihealthcheckers"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hs-ui-health-urls
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hs-ui-health-urls
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: hs-ui-health-urls
    namespace: sovereign-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hs-ui-health-urls
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hs-ui-health-urls
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: hs-ui-health-urls
    namespace: sovereign-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hs-ui-health-urls
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-ui-health-urls
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hs-ui-health-urls
      containers:
        - name: apply
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              APPS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
              [ -n "$APPS_DOMAIN" ]

              gitea_url="https://gitea-gitea.${APPS_DOMAIN}/"
              if oc -n gitea get route gitea >/dev/null 2>&1; then
                gitea_url="https://$(oc -n gitea get route gitea -o jsonpath='{.spec.host}')/"
              fi
              scd_url="https://sovereign-cloud-dashboard-sovereign-ui.${APPS_DOMAIN}/"
              if oc -n sovereign-ui get route sovereign-cloud-dashboard >/dev/null 2>&1; then
                scd_url="https://$(oc -n sovereign-ui get route sovereign-cloud-dashboard -o jsonpath='{.spec.host}')/"
              fi
              ten_url="https://tenancy-dashboard-sovereign-ui.${APPS_DOMAIN}/"
              if oc -n sovereign-ui get route tenancy-dashboard >/dev/null 2>&1; then
                ten_url="https://$(oc -n sovereign-ui get route tenancy-dashboard -o jsonpath='{.spec.host}')/"
              fi

              apply_one() {
                local name="$1" url="$2" display="$3" group="$4"
                printf '%s\n' \
                  "apiVersion: hybridsovereign.redhat/v1alpha1" \
                  "kind: UIHealthChecker" \
                  "metadata:" \
                  "  name: ${name}" \
                  "  namespace: sovereign-cloud" \
                  "  labels:" \
                  "    hybridsovereign.redhat/gitops-owned: \"true\"" \
                  "    hybridsovereign.redhat/sample: \"true\"" \
                  "spec:" \
                  "  url: ${url}" \
                  "  displayName: ${display}" \
                  "  group: ${group}" \
                  "  expectedStatus: 200" \
                | oc apply -f -
                echo "applied ${name} -> ${url}"
              }

              apply_one sovereign-ui-health "$gitea_url" "Gitea" services
              apply_one sovereign-cloud-dashboard "$scd_url" "Sovereign Cloud Dashboard" ui
              apply_one tenancy-dashboard "$ten_url" "Tenancy Dashboard" ui
              echo "UIHealthChecker URLs applied for domain=${APPS_DOMAIN}"
