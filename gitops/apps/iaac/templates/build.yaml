{{- if not .Values.image.override }}
# Build the IaaC sync image in-cluster. There is no published image for it, so
# this is unconditional (independent of the global `provision.builds` switch,
# which only governs rebuilding images that *do* exist on quay.io).
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: iaac-git-sync
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: iaac-git-sync
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
  output:
    to:
      kind: ImageStreamTag
      name: iaac-git-sync:{{ .Values.image.tag }}
  source:
    type: Git
    git:
      uri: {{ .Values.git.uri | quote }}
      ref: {{ .Values.git.ref | quote }}
    contextDir: {{ .Values.git.contextDir | quote }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  triggers:
    - type: ConfigChange
{{- end }}
