apiVersion: v1
kind: ServiceAccount
metadata:
  name: iaac-git-sync
  namespace: {{ .Values.namespace }}
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
# Reads every hybridsovereign kind (that is the point of config-as-code) and
# writes status back onto the Iaac CRs only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iaac-git-sync
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: ["hybridsovereign.redhat"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hybridsovereign.redhat"]
    resources: ["iaacs/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iaac-git-sync
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: iaac-git-sync
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iaac-git-sync
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iaac-git-sync
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: iaac-git-sync
    app.kubernetes.io/part-of: hybridsovereign
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  serviceName: iaac-git-sync
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iaac-git-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iaac-git-sync
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      serviceAccountName: iaac-git-sync
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: {{ .Values.image.override | default (printf "%s:%s" .Values.image.repository .Values.image.tag) | quote }}
          imagePullPolicy: Always
          env:
            - name: GITEA_URL
              value: {{ .Values.gitea.url | quote }}
            - name: GITEA_REPO_OWNER
              value: {{ .Values.gitea.repoOwner | quote }}
            - name: GITEA_REPO_NAME
              value: {{ .Values.gitea.repoName | quote }}
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-token
                  key: admin_token
            - name: GIT_CLONE_PATH
              value: /data/git/{{ .Values.gitea.repoName }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.reconcileInterval | quote }}
          volumeMounts:
            - name: git-data
              mountPath: /data/git
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: git-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Declared explicitly even though it is the default: volumeClaimTemplates
        # are immutable, so a field the API server defaults in shows up as a
        # permanent OutOfSync that no sync can ever resolve.
        volumeMode: Filesystem
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
