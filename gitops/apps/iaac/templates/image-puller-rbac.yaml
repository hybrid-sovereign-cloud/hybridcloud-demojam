{{- if not .Values.image.override }}
# The sync StatefulSet runs in {{ .Values.namespace }} but the ImageStream lives in
# sovereign-cloud, so its SA needs pull rights across the namespace boundary.
# Self-contained here rather than relying on gitops/builds, which is off by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iaac-git-sync-puller
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: iaac-git-sync
    namespace: {{ .Values.namespace }}
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
{{- end }}
