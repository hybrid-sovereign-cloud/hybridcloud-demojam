{{- if not .Values.image.override }}
# Gate the StatefulSet (wave 10) on the image actually existing, so a cold ZTP
# run does not sit in ImagePullBackOff and report the app Degraded while the
# first build is still running.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hs-iaac-build-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hs-iaac-build-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
rules:
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams", "imagestreamtags"]
    verbs: ["get", "list"]
  - apiGroups: ["build.openshift.io"]
    resources: ["builds", "buildconfigs"]
    verbs: ["get", "list"]
  - apiGroups: ["build.openshift.io"]
    resources: ["buildconfigs/instantiate"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hs-iaac-build-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
subjects:
  - kind: ServiceAccount
    name: hs-iaac-build-wait
    namespace: sovereign-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hs-iaac-build-wait
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hs-iaac-build-wait
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/gitops-owned: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  template:
    metadata:
      labels:
        hybridsovereign.redhat/gitops-owned: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hs-iaac-build-wait
      containers:
        - name: wait
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              TAG="iaac-git-sync:{{ .Values.image.tag }}"

              if oc -n sovereign-cloud get istag "$TAG" >/dev/null 2>&1; then
                echo "$TAG already present"
                exit 0
              fi

              # ConfigChange fires on create; only start one if nothing is running.
              if ! oc -n sovereign-cloud get builds -l buildconfig=iaac-git-sync \
                   --no-headers 2>/dev/null | grep -qE 'Running|New|Pending|Complete'; then
                echo "no build found; starting one"
                oc -n sovereign-cloud start-build iaac-git-sync
              fi

              echo "waiting for $TAG (up to 20m)..."
              for _ in $(seq 1 120); do
                if oc -n sovereign-cloud get istag "$TAG" >/dev/null 2>&1; then
                  echo "$TAG is available"
                  exit 0
                fi
                sleep 10
              done

              echo "FATAL: $TAG did not appear in time" >&2
              oc -n sovereign-cloud get builds -l buildconfig=iaac-git-sync >&2 || true
              exit 1
{{- end }}
