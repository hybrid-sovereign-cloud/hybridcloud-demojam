# IaaC git-sync ZTP defaults.
#
# Pulled prebuilt from Quay like every other ZTP image — there is no
# in-cluster build. Publish a new one with:
#   make -f Makefile.ztp-images.mk push-iaac-git-sync OCI_REGISTRY_TOKEN=...
# The Quay repo must be public: the cluster pulls quay.io/gauravshankar images
# anonymously and carries no pull secret for that namespace.
image:
  repository: quay.io/gauravshankar/iaac-git-sync
  tag: latest

gitea:
  # In-cluster Service — never the route, so sync does not depend on ingress.
  url: http://gitea-http.gitea.svc:3000
  adminUser: gitea_admin
  repoOwner: gitea_admin
  repoName: tenancy_repo

# Namespace holding the Iaac CR and the sync StatefulSet.
namespace: sovereign-cloud-plugins

# Seconds between full sync passes once healthy.
reconcileInterval: "300"

# Resilience during ZTP: the sync pod routinely starts before Gitea is
# serving. It waits startupWait seconds on first boot, then retries forever
# with exponential back-off between backoffStart and backoffMax, reporting
# status: pending on the Iaac CR rather than crash-looping.
startupWait: "600"
backoffStart: "15"
backoffMax: "300"

persistence:
  size: 10Gi
  storageClass: ""
