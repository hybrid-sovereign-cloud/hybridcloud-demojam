---
# =============================================================================
# test-charmander-ocp-hybrid.yaml — an OCP cluster joined to a hybrid network
#
# The experimental counterpart to test-squirtle-ocp-plain.yaml. Squirtle proves
# a tenant cluster comes up fine with no fabric membership; Charmander proves
# the opposite case actually works: a cluster whose machine network is carved
# out of a tenant VRF on the hybrid fabric still builds, registers with ACM and
# gets its RBAC — and gives the VNI back when it is torn down.
#
#   --tags create   Entity -> Rbac -> CloudVirt -> HybridNetwork ->
#                   NetworkPlacement -> PlatformOpenshift (hosted)
#   --tags test     placement/VNI health, ManagedCluster available, the
#                   POSITIVE fabric-membership assertion, machineNetwork really
#                   inside the hybrid prefix, and tenant RoleBindings
#   --tags destroy  deprovision in reverse and prove both the ManagedCluster
#                   and the VNI were released
#
# A hosted (HyperShift-on-hub) cluster is used because it is the only cluster
# type the lab has capacity for.
# =============================================================================
- name: "Charmander — OCP cluster joined to a hybrid network"
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ hs_kubeconfig }}"
      validate_certs: "{{ ocp_validate_certs }}"

  vars:
    e: "{{ poke.ocp_hybrid.entity }}"
    ns: "{{ poke.ocp_hybrid.ns }}"
    cloudvirt_name: charmander-virt
    hybrid_net: charmander-core
    np_name: charmander-core-hub
    vm_ns: charmander-core-vms
    cluster_name: charmander-ocp
    charmander_type: hosted
    rbac_groups: [charmander-cluster-admins, charmander-cluster-viewers]

    # The point of the whole suite: the cluster's nodes must be addressed out
    # of the tenant VRF's prefix. machine_cidr is a subnet of hybrid_prefix.
    hybrid_prefix: "{{ poke_cidr.charmander_hub }}"
    machine_cidr: "10.131.10.0/25"
    # Kept deliberately clear of 10.131.10.0/24 — the stock OCP default
    # (10.128.0.0/14) spans 10.128-10.131 and would collide with the hybrid
    # prefix, which is exactly the misconfiguration this test must not have.
    cluster_cidr: "10.134.0.0/16"
    service_cidr: "172.31.0.0/16"

    # Cluster builds are slow; override with HS_READY_TIMEOUT if needed.
    build_timeout: 3600

  tasks:
    - name: Resolve platform endpoints and credentials
      ansible.builtin.import_role:
        name: platform_auth
      tags: [always]

    # =========================================================================
    # CREATE
    # =========================================================================
    - name: Create the cluster and the network it lives on
      tags: [create]
      block:
        - name: Create the Entity
          ansible.builtin.include_role:
            name: cr_apply
          vars:
            cr_apply_defs:
              - apiVersion: "{{ hs_api_version }}"
                kind: Entity
                metadata: { name: "{{ e }}", namespace: "{{ hs_platform_ns }}" }
                spec:
                  description: "Charmander — QA tenant, OCP on a hybrid network"
                  billingID: "CHARMANDER-TEST-001"
                  namespaceRbac:
                    entityAdmin: [charmander-cluster-admins]
                    platformOpenshiftAdmin: [charmander-cluster-admins]
                    platformOpenshiftView: [charmander-cluster-viewers]

        - name: Wait for the Entity
          ansible.builtin.include_role:
            name: cr_wait_ready
          vars: { cr_wait_kind: Entity, cr_wait_name: "{{ e }}", cr_wait_namespace: "{{ hs_platform_ns }}" }

        - name: Create the Rbac groups
          kubernetes.core.k8s:
            state: present
            apply: true
            definition:
              apiVersion: "{{ hs_api_version }}"
              kind: Rbac
              metadata: { name: "{{ item }}", namespace: "{{ ns }}", labels: "{{ hs_test_labels }}" }
              spec:
                config: "{{ hs_rbac_config }}"
                description: "QA group {{ item }}"
          loop: "{{ rbac_groups }}"

        - name: Wait for the Rbac groups
          ansible.builtin.include_role:
            name: cr_wait_ready
          vars: { cr_wait_kind: Rbac, cr_wait_name: "{{ item }}", cr_wait_namespace: "{{ ns }}" }
          loop: "{{ rbac_groups }}"

        - name: Create the CloudVirt environment that hosts the cluster
          ansible.builtin.include_role:
            name: cr_apply
          vars:
            cr_apply_defs:
              - apiVersion: "{{ hs_api_version }}"
                kind: CloudVirt
                metadata: { name: "{{ cloudvirt_name }}", namespace: "{{ ns }}" }
                spec:
                  cloudRef: { kind: CloudInfrastructure, name: "{{ hs_hub_cloudinfra }}" }
                  baseDomain: cnv.local
                  storageClass: ocs-external-storagecluster-ceph-rbd

        - name: Wait for CloudVirt
          ansible.builtin.include_role:
            name: cr_wait_ready
          vars: { cr_wait_kind: CloudVirt, cr_wait_name: "{{ cloudvirt_name }}", cr_wait_namespace: "{{ ns }}" }

        - name: Create the HybridNetwork (allocates a VNI from the fabric pool)
          ansible.builtin.include_role:
            name: cr_apply
          vars:
            cr_apply_defs:
              - apiVersion: "{{ hs_api_version }}"
                kind: HybridNetwork
                metadata: { name: "{{ hybrid_net }}", namespace: "{{ ns }}" }
                spec:
                  fabricRef: "{{ hs_fabric }}"
                  description: "Charmander core VRF — carries the OCP machine network"

        - name: Wait for the HybridNetwork
          ansible.builtin.include_role:
            name: cr_wait_ready
          vars: { cr_wait_kind: HybridNetwork, cr_wait_name: "{{ hybrid_net }}", cr_wait_namespace: "{{ ns }}" }

        - name: Place the network onto the hub CloudVirt backend
          ansible.builtin.include_role:
            name: cr_apply
          vars:
            cr_apply_defs:
              - apiVersion: "{{ hs_api_version }}"
                kind: NetworkPlacement
                metadata: { name: "{{ np_name }}", namespace: "{{ ns }}" }
                spec:
                  network: "{{ hybrid_net }}"
                  backend: { kind: CloudVirt, name: "{{ cloudvirt_name }}" }
                  prefixes: ["{{ hybrid_prefix }}"]
                  vmNamespaces: ["{{ vm_ns }}"]

        - name: Wait for the NetworkPlacement
          ansible.builtin.include_role:
            name: cr_wait_ready
          vars: { cr_wait_kind: NetworkPlacement, cr_wait_name: "{{ np_name }}", cr_wait_namespace: "{{ ns }}" }

        - name: Request the OpenShift cluster — machine network inside the hybrid prefix
          ansible.builtin.include_role:
            name: cr_apply
          vars:
            cr_apply_defs:
              - apiVersion: "{{ hs_api_version }}"
                kind: PlatformOpenshift
                metadata: { name: "{{ cluster_name }}", namespace: "{{ ns }}" }
                spec:
                  type: "{{ charmander_type }}"
                  hosted:
                    environment: "{{ cloudvirt_name }}"
                    nodePoolReplicas: 2
                    workerCores: 4
                    workerMemory: 8Gi
                  networking:
                    clusterNetwork: ["{{ cluster_cidr }}"]
                    serviceNetwork: ["{{ service_cidr }}"]
                    machineNetwork: ["{{ machine_cidr }}"]
                    # No overlap is intended anywhere, so the operator must not
                    # need the escape hatch. If the build fails on a conflict,
                    # that is a real finding, not something to paper over here.
                    allowConflict: false
                  toolRbac:
                    clusterAdminRbac: [charmander-cluster-admins]
                    clusterViewerRbac: [charmander-cluster-viewers]

        - name: Wait for the cluster build (this is slow)
          ansible.builtin.include_role:
            name: cr_wait_ready
          vars:
            cr_wait_kind: PlatformOpenshift
            cr_wait_name: "{{ cluster_name }}"
            cr_wait_namespace: "{{ ns }}"
            cr_wait_timeout: "{{ build_timeout }}"

    # =========================================================================
    # TEST
    # =========================================================================
    - name: Verify the cluster and its fabric membership
      tags: [test]
      block:
        - name: "Network — VNI, uniqueness, placements and NADs"
          ansible.builtin.include_role:
            name: verify_hybrid_network
          vars:
            hn_name: "{{ hybrid_net }}"
            hn_namespace: "{{ ns }}"
            hn_placements:
              - { name: "{{ np_name }}", namespace: "{{ ns }}" }

        - name: "ACM — the ManagedCluster was registered"
          kubernetes.core.k8s_info:
            api_version: cluster.open-cluster-management.io/v1
            kind: ManagedCluster
            name: "{{ cluster_name }}"
          register: _mc

        - name: Assert the ManagedCluster joined and is available
          ansible.builtin.assert:
            that:
              - _mc.resources | length > 0
              - >-
                _mc.resources[0].status.conditions | default([])
                  | selectattr('type', 'equalto', 'ManagedClusterConditionAvailable')
                  | selectattr('status', 'equalto', 'True') | list | length > 0
            fail_msg: >-
              ManagedCluster/{{ cluster_name }} is not Available. Conditions:
              {{ _mc.resources[0].status.conditions | default('<not found>') }}
            success_msg: "ManagedCluster/{{ cluster_name }} is Available."
            quiet: true

        - name: "Positive — this cluster MUST be a fabric member"
          kubernetes.core.k8s_info:
            api_version: "{{ hs_api_version }}"
            kind: NetworkPlacement
            namespace: "{{ ns }}"
          register: _np

        - name: "Fabric — the HybridNetwork's VNI and the fabric's pool"
          kubernetes.core.k8s_info:
            api_version: "{{ hs_api_version }}"
            kind: HybridNetwork
            name: "{{ hybrid_net }}"
            namespace: "{{ ns }}"
          register: _hn

        - name: "Fabric — the pool the VNI must have come from"
          kubernetes.core.k8s_info:
            api_version: "{{ hs_api_version }}"
            kind: HybridFabric
            name: "{{ hs_fabric }}"
            namespace: "{{ hs_platform_ns }}"
          register: _fab

        - name: Assert a Ready placement exists and the network holds a pool VNI
          ansible.builtin.assert:
            that:
              - _np.resources | length > 0
              - >-
                _np.resources
                  | selectattr('metadata.name', 'equalto', np_name)
                  | map(attribute='status.conditions', default=[]) | flatten
                  | selectattr('type', 'equalto', 'Ready')
                  | selectattr('status', 'equalto', 'True') | list | length > 0
              - _hn.resources | length > 0
              - _hn.resources[0].status.vni is defined
              - (_hn.resources[0].status.vni | int) >= (_fab.resources[0].spec.vniPool.start | int)
              - (_hn.resources[0].status.vni | int) <= (_fab.resources[0].spec.vniPool.end | int)
            fail_msg: >-
              Charmander is the hybrid-network case, but its fabric attachment
              is incomplete: {{ _np.resources | length }} NetworkPlacement(s) in
              {{ ns }}, HybridNetwork vni={{ _hn.resources[0].status.vni | default('<unset>') }},
              fabric pool {{ _fab.resources[0].spec.vniPool | default('<unset>') }}.
              Without a VNI from the pool the cluster has no tenant VRF and no
              route-target isolation, whatever Ready says.
            success_msg: >-
              {{ cluster_name }} is on the fabric via {{ np_name }},
              vni={{ _hn.resources[0].status.vni }}.
            quiet: true

        - name: "Networking — what the cluster actually ended up with"
          kubernetes.core.k8s_info:
            api_version: "{{ hs_api_version }}"
            kind: PlatformOpenshift
            name: "{{ cluster_name }}"
            namespace: "{{ ns }}"
          register: _po

        - name: Keep the machine networks the cluster reports
          ansible.builtin.set_fact:
            _machine_nets: >-
              {{ _po.resources[0].spec.networking.machineNetwork | default([]) }}

        # ansible.utils is already a dependency of this suite — the fabric
        # roles use it for prefix maths — so the network_in_network test is
        # safe to rely on here. Note it is a *test*, used via reject(), not a
        # filter: ipsubnet is no good for this because it raises on a
        # non-contained prefix instead of returning false.
        - name: Assert every machine network sits inside the hybrid prefix
          ansible.builtin.assert:
            that:
              - _machine_nets | length > 0
              - >-
                _machine_nets
                  | reject('ansible.utils.in_network', hybrid_prefix)
                  | list | length == 0
            fail_msg: >-
              machineNetwork {{ _machine_nets }} is not contained in the hybrid
              network prefix {{ hybrid_prefix }}. The cluster's nodes are then
              addressed outside the tenant VRF, so the fabric is not carrying
              their traffic and this test is passing for the wrong reason.
            success_msg: >-
              machineNetwork {{ _machine_nets }} is inside {{ hybrid_prefix }}.
            quiet: true

        - name: Keep the pod and service networks the cluster reports
          ansible.builtin.set_fact:
            _other_nets: >-
              {{ (_po.resources[0].spec.networking.clusterNetwork | default([]))
                 + (_po.resources[0].spec.networking.serviceNetwork | default([])) }}

        # Checked in both directions: a net can overlap the hybrid prefix by
        # sitting inside it, or by swallowing it — the stock OCP default
        # clusterNetwork 10.128.0.0/14 spans 10.131.10.0/24 and would be the
        # second kind.
        - name: Assert cluster and service networks stay off the hybrid prefix
          ansible.builtin.assert:
            that:
              - _other_nets | select('ansible.utils.in_network', hybrid_prefix) | list | length == 0
              - not (hybrid_prefix is ansible.utils.in_network item)
            fail_msg: >-
              Network {{ item }} overlaps {{ hybrid_prefix }}. Pod or service
              traffic would collide with the tenant VRF's address space.
            quiet: true
          loop: "{{ _other_nets }}"

        - name: "RBAC — the cluster's admin/viewer bindings were created"
          kubernetes.core.k8s_info:
            # api_version is explicit: OpenShift serves RoleBinding under both
            # rbac.authorization.k8s.io/v1 and authorization.openshift.io/v1,
            # and letting the client resolve the ambiguous kind sends it into
            # "maximum recursion depth exceeded".
            api_version: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            namespace: "{{ ns }}"
          register: _rb

        - name: Assert tenant RoleBindings exist
          ansible.builtin.assert:
            that: _rb.resources | length > 0
            fail_msg: "No RoleBindings in {{ ns }} — cluster RBAC was not applied."
            quiet: true

    # =========================================================================
    # DESTROY
    # =========================================================================
    - name: Deprovision the cluster and its network
      tags: [destroy]
      block:
        - name: Record the VNI before deleting, so we can prove it is released
          kubernetes.core.k8s_info:
            api_version: "{{ hs_api_version }}"
            kind: HybridNetwork
            name: "{{ hybrid_net }}"
            namespace: "{{ ns }}"
          register: _pre

        - name: Keep the VNI
          ansible.builtin.set_fact:
            _old_vni: "{{ _pre.resources[0].status.vni | default(0) }}"
          when: _pre.resources | length > 0

        - name: Delete cluster, placement, network, environment, groups and entity
          ansible.builtin.include_role:
            name: cr_destroy
          vars:
            cr_destroy_timeout: "{{ build_timeout }}"
            cr_destroy_defs: >-
              {{ [{'kind': 'PlatformOpenshift', 'name': cluster_name, 'namespace': ns},
                   {'kind': 'NetworkPlacement', 'name': np_name, 'namespace': ns},
                   {'kind': 'HybridNetwork', 'name': hybrid_net, 'namespace': ns},
                   {'kind': 'CloudVirt', 'name': cloudvirt_name, 'namespace': ns}]
                 + (rbac_groups | map('community.general.dict_kv', 'name')
                    | map('combine', {'kind': 'Rbac', 'namespace': ns}) | list)
                 + [{'kind': 'Entity', 'name': e, 'namespace': hs_platform_ns}] }}

        - name: Assert the ManagedCluster was deregistered from ACM
          kubernetes.core.k8s_info:
            api_version: cluster.open-cluster-management.io/v1
            kind: ManagedCluster
            name: "{{ cluster_name }}"
          register: _mc_gone
          until: _mc_gone.resources | length == 0
          retries: 60
          delay: 10
          failed_when: false

        - name: ManagedCluster is gone
          ansible.builtin.assert:
            that: _mc_gone.resources | length == 0
            fail_msg: >-
              ManagedCluster/{{ cluster_name }} still exists after the
              PlatformOpenshift CR was deleted — ACM was left with a stale
              cluster registration.
            success_msg: "ManagedCluster/{{ cluster_name }} deregistered."
            quiet: true

        - name: Assert the VNI is no longer claimed by anything
          kubernetes.core.k8s_info:
            api_version: "{{ hs_api_version }}"
            kind: HybridNetwork
          register: _post

        - name: VNI released back to the pool
          ansible.builtin.assert:
            that: >-
              _post.resources | map(attribute='status.vni', default=0)
                | select('equalto', _old_vni | int) | list | length == 0
            fail_msg: >-
              VNI {{ _old_vni }} is still claimed after Charmander was deleted —
              the pool leaks VNIs, and the fabric will eventually exhaust it.
            success_msg: "VNI {{ _old_vni }} was returned to the pool."
            quiet: true
          when: _old_vni is defined and (_old_vni | int) > 0
