---
# Wait for a CR to report ready, then fail loudly with the operator's own
# message if it does not.
#
# The platform is not consistent about how it signals readiness, so this role
# accepts either form:
#   * a Ready condition with status "True"  — Entity, Rbac, Team, Project,
#     Persona, AAPOrg, QuayOrg, Vault, VaultKV, HybridNetwork, NetworkPlacement
#   * status.ready == true with no Ready condition at all — CloudVirt, whose
#     conditions are only Running/Successful/Failure
# Treating only the condition as authoritative makes CloudVirt hang forever;
# treating only status.ready makes everything else flap, because the operator
# resets status.ready to false at the start of each reconcile while leaving
# the condition intact.
#
# Required:
#   cr_wait_kind, cr_wait_name, cr_wait_namespace
# Optional:
#   cr_wait_timeout (default hs_ready_timeout)

- name: "Wait for {{ cr_wait_kind }}/{{ cr_wait_name }} to become Ready"
  kubernetes.core.k8s_info:
    api_version: "{{ hs_api_version }}"
    kind: "{{ cr_wait_kind }}"
    name: "{{ cr_wait_name }}"
    namespace: "{{ cr_wait_namespace }}"
  register: _cr
  until: >-
    _cr.resources | default([]) | length > 0 and
    (
      (_cr.resources[0].status.conditions | default([])
        | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length > 0)
      or
      (
        (_cr.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready') | list | length == 0)
        and (_cr.resources[0].status.ready | default(false) | bool)
      )
    )
  retries: "{{ ((cr_wait_timeout | default(hs_ready_timeout) | int) / 10) | round(0, 'ceil') | int }}"
  delay: 10
  # Let the assert below produce the useful message instead of a bare timeout.
  failed_when: false

- name: "Assert {{ cr_wait_kind }}/{{ cr_wait_name }} is Ready"
  ansible.builtin.assert:
    that:
      - _cr.resources | default([]) | length > 0
      - >-
        (_cr.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready')
          | selectattr('status', 'equalto', 'True') | list | length > 0)
        or (_cr.resources[0].status.ready | default(false) | bool)
    fail_msg: >-
      {{ cr_wait_kind }}/{{ cr_wait_name }} in {{ cr_wait_namespace }} never
      became Ready within {{ cr_wait_timeout | default(hs_ready_timeout) }}s.
      status.ready={{ (_cr.resources[0].status.ready | default('<unset>'))
                      if _cr.resources | default([]) | length > 0 else '<CR not found>' }}
      conditions=
      {{ (_cr.resources[0].status.conditions | default('<none>'))
         if _cr.resources | default([]) | length > 0 else '<CR not found>' }}
    success_msg: "{{ cr_wait_kind }}/{{ cr_wait_name }} is Ready."
    quiet: true
