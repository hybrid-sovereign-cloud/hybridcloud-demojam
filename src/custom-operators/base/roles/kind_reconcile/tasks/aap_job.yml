---
# AAP job launch / reconcile — anti-loop + 3h stale cancel+relaunch
# On delete: launch *-teardown and fail (keep finalizer) until deletionComplete.
- name: Compute now UTC
  ansible.builtin.set_fact:
    now_epoch: "{{ now(utc=true, fmt='%s') | int }}"

- name: Query existing AAP job if tracked
  when: cur_job_id | length > 0
  block:
    - name: Get job status from AAP
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/jobs/{{ cur_job_id }}/"
        method: GET
        user: "{{ lookup('env', 'AAP_USER') | default('admin', true) }}"
        password: "{{ lookup('env', 'AAP_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 404]
      register: aap_job_get
      no_log: true

    - name: Set job facts
      ansible.builtin.set_fact:
        aap_job_status: "{{ aap_job_get.json.status | default('missing') if aap_job_get.status == 200 else 'missing' }}"
        aap_job_finished: "{{ aap_job_get.json.finished | default('') if aap_job_get.status == 200 else '' }}"
        aap_job_name: "{{ aap_job_get.json.name | default('') if aap_job_get.status == 200 else '' }}"

- name: Default job status when none
  ansible.builtin.set_fact:
    aap_job_status: "{{ aap_job_status | default('none') }}"
    aap_job_name: "{{ aap_job_name | default('') }}"

- name: Compute job age seconds
  ansible.builtin.set_fact:
    job_age_seconds: 0

- name: Age from startedAt when present
  when: cur_job_started | length > 0
  ansible.builtin.set_fact:
    job_age_seconds: "{{ (now_epoch | int) - (cur_job_started | to_datetime('%Y-%m-%dT%H:%M:%SZ')).strftime('%s') | int }}"
  ignore_errors: true

- name: Decide action
  ansible.builtin.set_fact:
    job_is_success: "{{ aap_job_status == 'successful' }}"
    job_is_running: "{{ aap_job_status in ['pending', 'waiting', 'running'] }}"
    job_is_failed: "{{ aap_job_status in ['failed', 'error', 'canceled', 'missing'] }}"
    tracked_is_teardown: "{{ (teardown_template_name in (aap_job_name | default(''))) | bool }}"

- name: Mark ready when AAP provision job successful (always wins over relaunch)
  when:
    - job_is_success | bool
    - not (is_delete | bool)
  block:
    - name: Patch ready status
      operator_sdk.util.k8s_status:
        api_version: "{{ hs_api_version }}"
        kind: "{{ hs_kind }}"
        name: "{{ hs_name }}"
        namespace: "{{ hs_namespace }}"
        status: "{{ {'phase': 'provisioned', 'ready': true, 'message': 'AAP job successful', 'observedGeneration': hs_generation | int, 'aapJob': {'jobId': cur_job_id | string, 'status': 'successful', 'startedAt': cur_job_started, 'url': aap_host ~ '/execution/jobs/playbook/' ~ cur_job_id ~ '/details'}} }}"
    - name: End after ready
      ansible.builtin.meta: end_play

- name: On delete — allow finalizer clear only after deletionComplete
  when:
    - is_delete | bool
    - deletion_complete | bool
  block:
    - name: Teardown complete — release finalizer
      ansible.builtin.meta: end_play

- name: No-op while job running within 3h window
  when:
    - job_is_running | bool
    - (job_age_seconds | int) <= (job_stale_seconds | int)
    - (not (is_delete | bool)) or (tracked_is_teardown | bool)
  block:
    - name: Keep reconciling status while AAP runs
      operator_sdk.util.k8s_status:
        api_version: "{{ hs_api_version }}"
        kind: "{{ hs_kind }}"
        name: "{{ hs_name }}"
        namespace: "{{ hs_namespace }}"
        status: "{{ {'phase': 'reconciling', 'ready': false, 'message': ((is_delete | bool) | ternary('Waiting for AAP teardown job ', 'Waiting for AAP job ')) ~ cur_job_id, 'observedGeneration': hs_generation | int, 'aapJob': {'jobId': cur_job_id | string, 'status': aap_job_status, 'startedAt': cur_job_started, 'url': aap_host ~ '/execution/jobs/playbook/' ~ cur_job_id ~ '/details'}} }}"
    - name: End while provision running
      ansible.builtin.meta: end_play
      when: not (is_delete | bool)
    - name: Keep finalizer while teardown running
      ansible.builtin.fail:
        msg: "Waiting for AAP teardown job {{ cur_job_id }} ({{ aap_job_status }})"
      when: is_delete | bool

- name: Decide whether to launch
  ansible.builtin.set_fact:
    need_launch: >-
      {{
        (
          (is_delete | bool) and (
            (aap_job_status == 'none') or
            (job_is_failed | bool) or
            (job_is_success | bool and not (tracked_is_teardown | bool)) or
            (job_is_running | bool and not (tracked_is_teardown | bool)) or
            (
              job_is_running | bool and
              (tracked_is_teardown | bool) and
              (job_age_seconds | int) > (job_stale_seconds | int)
            )
          )
        )
        or
        (
          (not (is_delete | bool)) and (
            (job_is_failed | bool) or
            (aap_job_status == 'none') or
            (
              job_is_running | bool and
              (job_age_seconds | int) > (job_stale_seconds | int)
            )
          )
        )
      }}
    need_cancel: >-
      {{
        cur_job_id | length > 0 and (
          (
            job_is_running | bool and
            (job_age_seconds | int) > (job_stale_seconds | int)
          )
          or
          (
            (is_delete | bool) and job_is_running | bool and not (tracked_is_teardown | bool)
          )
        )
      }}

- name: Cancel stale or wrong-type job before relaunch
  when:
    - need_cancel | bool or (need_launch | bool and cur_job_id | length > 0 and (job_is_failed | bool or job_is_running | bool))
    - cur_job_id | length > 0
    - not (job_is_success | bool and tracked_is_teardown | bool and is_delete | bool)
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/{{ cur_job_id }}/cancel/"
    method: POST
    user: "{{ lookup('env', 'AAP_USER') | default('admin', true) }}"
    password: "{{ lookup('env', 'AAP_PASSWORD') }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 202, 400, 404, 405]
  failed_when: false
  no_log: true

- name: When delete teardown already succeeded but deletionComplete missing — wait
  when:
    - is_delete | bool
    - job_is_success | bool
    - tracked_is_teardown | bool
    - not (deletion_complete | bool)
    - not (need_launch | bool)
  block:
    - name: Status awaiting deletionComplete
      operator_sdk.util.k8s_status:
        api_version: "{{ hs_api_version }}"
        kind: "{{ hs_kind }}"
        name: "{{ hs_name }}"
        namespace: "{{ hs_namespace }}"
        status: "{{ {'phase': 'reconciling', 'ready': false, 'message': 'Teardown job succeeded; waiting for deletionComplete', 'observedGeneration': hs_generation | int, 'aapJob': {'jobId': cur_job_id | string, 'status': 'successful', 'startedAt': cur_job_started}} }}"
    - name: Keep finalizer until deletionComplete
      ansible.builtin.fail:
        msg: Waiting for status.deletionComplete after teardown job {{ cur_job_id }}

- name: Launch AAP JobTemplate
  when: need_launch | bool
  block:
    - name: Find JobTemplate id
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/?name={{ (is_delete | bool) | ternary(teardown_template_name, job_template_name) | urlencode }}"
        method: GET
        user: "{{ lookup('env', 'AAP_USER') | default('admin', true) }}"
        password: "{{ lookup('env', 'AAP_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: jt_lookup
      no_log: true

    - name: Fail soft if JT missing
      when: (jt_lookup.json.count | default(0) | int) < 1
      block:
        - name: Status missing JT
          operator_sdk.util.k8s_status:
            api_version: "{{ hs_api_version }}"
            kind: "{{ hs_kind }}"
            name: "{{ hs_name }}"
            namespace: "{{ hs_namespace }}"
            status: "{{ {'phase': 'pending', 'message': 'JobTemplate ' ~ ((is_delete | bool) | ternary(teardown_template_name, job_template_name)) ~ ' not found in AAP', 'observedGeneration': hs_generation | int} }}"
        - name: End on missing provision JT
          ansible.builtin.meta: end_play
          when: not (is_delete | bool)
        - name: Keep finalizer when teardown JT missing
          ansible.builtin.fail:
            msg: "JobTemplate {{ teardown_template_name }} not found in AAP"
          when: is_delete | bool

    - name: Build event note from live CR spec
      ansible.builtin.set_fact:
        hs_event_note: "{{ (hs_live.resources | default([{}]))[0].spec | default({}) | to_json }}"

    - name: Launch job
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/{{ jt_lookup.json.results[0].id }}/launch/"
        method: POST
        user: "{{ lookup('env', 'AAP_USER') | default('admin', true) }}"
        password: "{{ lookup('env', 'AAP_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          # AAP Controller expects extra_vars as a JSON/YAML *string*, not a nested object.
          extra_vars: >-
            {{
              {
                'event_payload': {
                  'reason': hs_kind ~ ((is_delete | bool) | ternary('Delete', 'Create')) ~ 'Requested',
                  'regarding': {
                    'apiVersion': hs_api_version,
                    'kind': hs_kind,
                    'name': hs_name,
                    'namespace': hs_namespace
                  },
                  'note': hs_event_note,
                  'action': ((is_delete | bool) | ternary('Delete', 'Create')),
                  'cluster': 'local'
                },
                'plugin_rbac_keycloak_realm': 'sso',
                'KEYCLOAK_EXTERNAL_URL': lookup('env', 'KEYCLOAK_EXTERNAL_URL') | default('https://sso.apps.cluster-kbnzw.dyn.redhatworkshops.io', true)
              } | to_json
            }}
        status_code: [201]
      register: jt_launch
      no_log: true

    - name: Patch reconciling status with job id
      operator_sdk.util.k8s_status:
        api_version: "{{ hs_api_version }}"
        kind: "{{ hs_kind }}"
        name: "{{ hs_name }}"
        namespace: "{{ hs_namespace }}"
        status: "{{ {'phase': 'reconciling', 'ready': false, 'message': ((is_delete | bool) | ternary('AAP teardown job launched', 'AAP job launched')), 'observedGeneration': hs_generation | int, 'aapJob': {'jobId': jt_launch.json.id | string, 'status': jt_launch.json.status | default('pending'), 'startedAt': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'), 'url': aap_host ~ '/execution/jobs/playbook/' ~ (jt_launch.json.id | string) ~ '/details'}} }}"

    - name: End after provision launch
      ansible.builtin.meta: end_play
      when: not (is_delete | bool)

    - name: Keep finalizer after teardown launch
      ansible.builtin.fail:
        msg: "Teardown job {{ jt_launch.json.id }} launched; waiting for deletionComplete"
      when: is_delete | bool
