---
# Shared reconcile for all hybridsovereign kinds.
# - Launch AAP JobTemplate on create / spec generation change
# - On delete: launch *-teardown and BLOCK finalizer until status.deletionComplete
# - Cancel+relaunch if failed or not completed within 3 hours
# - Status-only updates must NOT relaunch (status.aapJob.generation + in-window job)
# - ansible.sdk.operatorframework.io/reconcileNow forces exactly one relaunch
#   (see the state machine at the top of aap_job.yml)
- name: Resolve kind and job template
  ansible.builtin.set_fact:
    hs_kind: "{{ operator_kind | default(lookup('env', 'OPERATOR_KIND') | default(ansible_operator_meta.kind, true), true) }}"
    hs_name: "{{ ansible_operator_meta.name }}"
    hs_namespace: "{{ ansible_operator_meta.namespace }}"
    hs_api_version: "{{ ansible_operator_meta.api_version | default('hybridsovereign.redhat/v1alpha1') }}"
    job_stale_seconds: 10800
    # Delete path: max in-run wait on a running teardown job (wait_teardown.yml).
    # Blocks one of MAX_CONCURRENT_RECONCILES workers for this kind meanwhile.
    teardown_wait_seconds: "{{ lookup('env', 'TEARDOWN_WAIT_SECONDS') | default(120, true) | int }}"
    teardown_poll_seconds: 10
    # Never hardcode a demojam apps domain — empty host fails loud if secret missing.
    aap_host: "{{ lookup('env', 'AAP_HOST') | default('', true) }}"

- name: Map kind to JobTemplate name
  ansible.builtin.set_fact:
    job_template_name: "{{ (hs_kind | lower) }}-provision"
    teardown_template_name: "{{ (hs_kind | lower) }}-teardown"

- name: Read live CR for reliable status (ansible status var can be stale/empty)
  kubernetes.core.k8s_info:
    api_version: "{{ hs_api_version }}"
    kind: "{{ hs_kind }}"
    name: "{{ hs_name }}"
    namespace: "{{ hs_namespace }}"
  register: hs_live
  failed_when: false

# Every decision below keys on the live status (aapJob, ready, deletionComplete).
# Proceeding on an API error used to look like "no job tracked" and launched a
# duplicate job, or, on a deleting CR, like a non-delete reconcile whose
# "End after ready" exit let ansible-operator drop the finalizer without teardown.
- name: Requeue when the live CR could not be read
  ansible.builtin.fail:
    msg: "Could not read {{ hs_kind }} {{ hs_namespace }}/{{ hs_name }}: {{ hs_live.msg | default('unknown error') }}"
  # failed_when: false above masks .failed; an API error leaves no resources key
  # (a missing CR returns resources: []).
  when: hs_live.resources is not defined

# ansible_operator_meta only carries name/namespace, so the old
# ansible_operator_meta.generation default made hs_generation 0 on every CR (and
# the operator stamped observedGeneration 0 over the EDA value). Take the
# generation from the live read, falling back to the object ansible-operator
# passes as _<group>_<kind>.
- name: Pick the live CR (fallback to the object ansible-operator passed in)
  ansible.builtin.set_fact:
    hs_cr: "{{ (hs_live.resources | default([]))[0] | default(lookup('ansible.builtin.vars', '_hybridsovereign_redhat_' ~ (hs_kind | lower), default={}), true) }}"

- name: Normalize generation and deletion state
  ansible.builtin.set_fact:
    hs_generation: "{{ hs_cr.metadata.generation | default(0) | int }}"
    hs_status: "{{ hs_cr.status | default(status | default({})) }}"
    # watches use snakeCaseParameters: false → camelCase deletionTimestamp
    is_delete: "{{ ((ansible_operator_meta.deletionTimestamp | default(ansible_operator_meta.deletion_timestamp | default(hs_cr.metadata.deletionTimestamp | default('')) | default('')) | string | length) > 0) | bool }}"
    hs_reconcile_now_value: "{{ (hs_cr.metadata.annotations | default({})).get('ansible.sdk.operatorframework.io/reconcileNow', '') | string }}"

- name: Normalize status fields
  ansible.builtin.set_fact:
    cur_observed: "{{ (hs_status.observedGeneration | default(-1)) | int }}"
    cur_job_id: "{{ hs_status.aapJob.jobId | default('') | string }}"
    cur_job_started: "{{ hs_status.aapJob.startedAt | default('') | string }}"
    # Generation the tracked job was launched for ('' on jobs launched by older images).
    cur_job_generation_raw: "{{ hs_status.aapJob.generation | default('') | string }}"
    cur_phase: "{{ hs_status.phase | default('') | string }}"
    deletion_complete: "{{ hs_status.deletionComplete | default(false) | bool }}"

- name: Clear finalizers when EDA teardown reported deletionComplete
  when:
    - is_delete | bool
    - deletion_complete | bool
  ansible.builtin.include_tasks: release_finalizer.yml

# Fast path only. observedGeneration alone is not trusted (EDA provision roles
# stamp it from the CR they read, which can be newer than the generation the job
# was launched for), so also require the tracked job's own generation to match.
- name: Skip when generation already observed and phase ready
  ansible.builtin.meta: end_play
  when:
    - not is_delete | bool
    - cur_observed | int == hs_generation | int
    - cur_job_generation_raw | length > 0
    - cur_job_generation_raw | int == hs_generation | int
    - cur_phase in ['ready', 'provisioned']
    - (hs_status.ready | default(false) | bool)
    - (hs_status.status | default('') | string | lower) not in ['failed', 'error', 'degraded']
    - hs_reconcile_now_value | length == 0

# Periodic retry for non-ready / failed CRs (watches reconcilePeriod also requeues).
# If lastReconciledAt is older than reconcile window (or missing) and not ready, force AAP path.
- name: Detect stale failure / pending needing periodic retry
  ansible.builtin.set_fact:
    hs_status_failed: >-
      {{
        (hs_status.status | default('') | string | lower) in ['failed', 'error', 'degraded']
        or (hs_status.ready | default(false) | bool) == false
        or (cur_phase | string | lower) in ['pending', 'failed', 'error']
      }}
    hs_last_reconciled: "{{ hs_status.lastReconciledAt | default('') | string }}"
    # Match watches reconcilePeriod (120s); keep a small floor for clock skew.
    hs_retry_after_seconds: 120

- name: Compute seconds since lastReconciledAt
  when: hs_last_reconciled | length > 0
  ansible.builtin.set_fact:
    hs_seconds_since_reconcile: "{{ (now(utc=true, fmt='%s') | int) - (hs_last_reconciled | to_datetime('%Y-%m-%dT%H:%M:%S.%fZ')).strftime('%s') | int }}"
  ignore_errors: true

- name: Fallback datetime without micros
  when: hs_last_reconciled | length > 0 and (hs_seconds_since_reconcile is not defined)
  ansible.builtin.set_fact:
    hs_seconds_since_reconcile: "{{ (now(utc=true, fmt='%s') | int) - (hs_last_reconciled | to_datetime('%Y-%m-%dT%H:%M:%SZ')).strftime('%s') | int }}"
  ignore_errors: true

- name: Flag periodic retry when failed/pending and stale or never reconciled
  ansible.builtin.set_fact:
    hs_force_hourly_retry: >-
      {{
        (hs_status_failed | bool) and (
          (hs_last_reconciled | length == 0) or
          ((hs_seconds_since_reconcile | default(999999) | int) >= (hs_retry_after_seconds | int))
        )
      }}

- name: Clear reconcileNow annotation when present
  when: hs_reconcile_now_value | length > 0
  kubernetes.core.k8s:
    state: patched
    api_version: "{{ hs_api_version }}"
    kind: "{{ hs_kind }}"
    name: "{{ hs_name }}"
    namespace: "{{ hs_namespace }}"
    definition:
      metadata:
        annotations:
          ansible.sdk.operatorframework.io/reconcileNow: null
  register: hs_reconcile_now_clear
  failed_when: false

# The annotation is consumed by clearing it, so it forces one relaunch per
# set. If the clear failed, do not force: the annotation would still be there
# on the next pass and relaunch again (loop). failed_when: false masks .failed,
# so check that the patched object came back without the annotation.
- name: Force one relaunch for a consumed reconcileNow annotation
  ansible.builtin.set_fact:
    hs_reconcile_now: >-
      {{
        hs_reconcile_now_value | length > 0
        and not (is_delete | bool)
        and (hs_reconcile_now_clear.result | default({})).metadata is defined
        and 'ansible.sdk.operatorframework.io/reconcileNow' not in
          ((hs_reconcile_now_clear.result | default({})).metadata.annotations | default({}))
      }}

- name: Include AAP API tasks
  ansible.builtin.include_tasks: aap_job.yml
  when: lookup('env', 'AAP_TOKEN') | length > 0 or lookup('env', 'AAP_PASSWORD') | length > 0

- name: End when AAP credentials missing (requeue until secret exists)
  when: lookup('env', 'AAP_TOKEN') | length == 0 and lookup('env', 'AAP_PASSWORD') | length == 0
  block:
    - name: Patch waiting-for-aap status
      operator_sdk.util.k8s_status:
        api_version: "{{ hs_api_version }}"
        kind: "{{ hs_kind }}"
        name: "{{ hs_name }}"
        namespace: "{{ hs_namespace }}"
        status: "{{ {'phase': 'pending', 'message': 'Waiting for AAP credentials (AAP_TOKEN or AAP_PASSWORD env)', 'observedGeneration': hs_generation | int} }}"
      when: cur_phase != 'pending'
    - name: Requeue until AAP credentials are available
      ansible.builtin.fail:
        msg: Waiting for AAP credentials (AAP_TOKEN or AAP_PASSWORD env)
