# Sample CloudAWS — acme-dev-aws
# Source: CloudAWS/config/samples/cloudaws-dev.yaml
# Apply manually to services cluster (NOT via ArgoCD):
#   oc apply -f samples/cloudaws/acme-dev-aws.yaml --context=services-admin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudAWS
metadata:
  name: acme-dev-aws
  namespace: entity-acme-corp
spec:
  account: '000000000000'
  vaultPath: aws/accounts/acme-dev
  baseDomain: sandbox.example.com
# spec.toolRbac is deliberately absent. The CloudAWS CRD does not define it and
# no operator reads it, so the API server prunes it on write — a sample that
# sets it silently promises tenant RBAC that is never applied. Tenant access to
# an AWS project is granted through Entity.namespaceRbac (cloudAWSAdmin /
# cloudAWSView), which is what the platform actually enforces.
