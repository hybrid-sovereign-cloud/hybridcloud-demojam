# Sample CloudOSO — acme-dev-openstack
# Source: CloudOSO/config/samples/cloudoso-dev.yaml
# Apply manually to services cluster (NOT via ArgoCD):
#   oc apply -f samples/cloudoso/acme-dev-openstack.yaml --context=services-admin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudOSO
metadata:
  name: acme-dev-openstack
  namespace: entity-acme-corp
spec:
  project: acme-dev
  cloudRef:
    kind: CloudInfrastructure
    name: example-openstack   # samples/cloudinfrastructure/example-openstack.yaml
  baseDomain: lab.example.com
  projectDomain: example_domain
  externalNetwork: ext-net
  route53VaultPath: oso/accounts/route53-openstack
# spec.toolRbac is deliberately absent. The CloudOSO CRD does not define it and
# no operator reads it, so the API server prunes it on write — a sample that
# sets it silently promises tenant RBAC that is never applied. Tenant access to
# an OpenStack project is granted through Entity.namespaceRbac (cloudOSOAdmin /
# cloudOSOView), which is what the platform actually enforces.
