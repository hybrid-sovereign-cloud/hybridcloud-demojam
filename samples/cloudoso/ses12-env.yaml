# Sample CloudOSO — ses12-env
# Source: CloudOSO/config/samples/ses12-env.yaml
# Apply manually to services cluster (NOT via ArgoCD):
#   oc apply -f samples/cloudoso/ses12-env.yaml --context=services-admin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudOSO
metadata:
  name: ses12-env
  namespace: entity-acme-corp
spec:
  cloudRef:
    kind: CloudInfrastructure
    name: example-openstack   # samples/cloudinfrastructure/example-openstack.yaml
  baseDomain: lab.example.com
  projectDomain: example_domain
  externalNetwork: ext-net
  route53VaultPath: oso/accounts/route53-openstack
