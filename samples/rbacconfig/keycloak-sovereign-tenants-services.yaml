# Sample RbacConfig — points at the OpenShift lab SSO Keycloak (realm `sso`).
# The CR name is historical; the Keycloak realm used by operators/playbooks is `sso`
# (OpenShift-provided, not created by HybridSovereign).
# Apply manually to services cluster (NOT via ArgoCD):
#   oc apply -f samples/rbacconfig/keycloak-sovereign-tenants-services.yaml --context=services-admin
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: RbacConfig
metadata:
  name: keycloak-sovereign-tenants-services
  namespace: sovereign-cloud-plugins
spec:
  type: keycloak
  secret: rhbk-services-admin
