# Repo-local sample retained for reference. Live CloudVirt is base ZTP:
#   gitops/apps/platform-smoke/templates/cloudvirt-local.yaml (name: local-virt)
# Do not apply this file via Argo samples.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudVirt
metadata:
  name: workshop-virt
  namespace: entity-acme-corp
spec:
  vaultPath: virt/accounts/example-admin
  baseDomain: virt.example.com
  storageClass: ocs-external-storagecluster-ceph-rbd
  enableVRF: false
  toolRbac:
    environmentAdminRbac:
      - acme-platform-admins
    environmentPoweruserRbac:
      - acme-infra-team
    environmentViewerRbac:
      - acme-viewers
