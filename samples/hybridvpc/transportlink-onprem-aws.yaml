# TransportLinks are generated by the operator from CloudGateways; this sample
# shows the shape only (do not apply alongside an operator-managed gateway).
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: onprem-to-aws
  namespace: sovereign-cloud
spec:
  enabled: true
  fabricRef: lab-fabric
  cloudGatewayRef: aws-us-east-1
  tunnelType: wireguard
