# Platform fabric with two tenant entities (design/fabric.md §11).
# Canonical ZTP path: gitops/apps/platform-fabric (Argo hs-platform-fabric), which
# also registers the OpenStack site (CloudInfrastructure oso1, CloudGateway acme-oso1-gw).
# This sample covers the hub side only: hub-virt infrastructure, its gateway and
# the second tenant's CloudVirt project.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridFabric
metadata:
  name: platform-fabric
  namespace: sovereign-cloud
spec:
  enabled: true
  domainAsn: 65010
  entityRefs:
    - name: acme-corp
    - name: chad
  underlay:
    type: localnet
    physicalNetworkName: physnet
    nadName: fabric-localnet
    cidr: 192.168.64.0/18
    hubVtepBlock: 192.168.65.0/24
    hubLegAddress: 192.168.65.1/24
    mtu: 1400
  borderGateway:
    name: fabric-bgw
    loopback: 10.255.10.10
    wireguard:
      address: 10.254.254.1/24
  vniPool:
    start: 51000
    end: 52127
  transportDefaults:
    mtu: 1442
    defaultTunnelType: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudInfrastructure
metadata:
  name: hub-virt
  namespace: sovereign-cloud
spec:
  type: openshift
  displayName: Hub OpenShift Virtualization
  openshift:
    clusterRef: local
    storageClass: ocs-external-storagecluster-ceph-rbd
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: hub-virt-gw
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/fabric: platform-fabric
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudRef:
    kind: CloudInfrastructure
    name: hub-virt
  transport:
    type: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Entity
metadata:
  name: chad
  namespace: sovereign-cloud
spec:
  billingID: CHAD-2026-001
  description: Chad tenant — VRF isolation showcase (hub VMs)
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudVirt
metadata:
  name: local-virt
  namespace: entity-chad
spec:
  cloudRef:
    kind: CloudInfrastructure
    name: hub-virt
  baseDomain: cnv.local
  storageClass: ocs-external-storagecluster-ceph-rbd
