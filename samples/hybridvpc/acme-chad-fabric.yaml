# Platform fabric with two tenant entities (design/fabric.md §11).
# Canonical ZTP path: gitops/apps/platform-fabric (Argo hs-platform-fabric).
# ZTP omits RHOSO/OSO1 — this sample file also has no CloudOSO gateway/link.
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridFabric
metadata:
  name: platform-fabric
  namespace: sovereign-cloud
spec:
  enabled: true
  domainAsn: 65010
  entityRefs:
    - name: acme-corp
    - name: chad
  underlay:
    nadName: fabric-underlay
    cidr: 192.168.64.0/18
    gatewayAddress: 192.168.64.1
    mtu: 1400
  borderGateway:
    name: fabric-bgw
    loopback: 10.255.10.10
    wireguard:
      address: 10.254.254.1/24
  vniPool:
    start: 51000
    end: 52127
  transportDefaults:
    mtu: 1442
    innerMssClamp: 1360
    defaultTunnelType: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: Entity
metadata:
  name: chad
  namespace: sovereign-cloud
spec:
  billingID: CHAD-2026-001
  description: Chad tenant — dual-HCP fabric isolation showcase
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudVirt
metadata:
  name: local-virt
  namespace: entity-chad
spec:
  baseDomain: cnv.local
  enableVRF: false
  storageClass: ocs-external-storagecluster-ceph-rbd
  vaultPath: virt/accounts/local
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: acme-hcp1-gw
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/entity: acme-corp
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp1
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp1
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: chad-hcp2-gw
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/entity: chad
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp2
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp2
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: chad-hcp3-gw
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/entity: chad
    hybridsovereign.redhat/fabric: platform-fabric
    hybridsovereign.redhat/platformopenshift: hcp3
spec:
  enabled: true
  cloud: openshift
  region: local-virt
  domainAsn: 65010
  fabricRef: platform-fabric
  transport:
    type: none
  platformOpenshiftRef: hcp3
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: acme-hcp1-link
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/platformopenshift: hcp1
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: acme-hcp1-gw
  tunnelType: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: chad-hcp2-link
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/platformopenshift: hcp2
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: chad-hcp2-gw
  tunnelType: none
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: TransportLink
metadata:
  name: chad-hcp3-link
  namespace: sovereign-cloud
  labels:
    hybridsovereign.redhat/platformopenshift: hcp3
spec:
  enabled: true
  fabricRef: platform-fabric
  cloudGatewayRef: chad-hcp3-gw
  tunnelType: none
