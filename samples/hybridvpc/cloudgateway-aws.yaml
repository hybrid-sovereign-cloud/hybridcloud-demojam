# AWS site attached to a fabric. cloudRef: samples/cloudinfrastructure/example-aws.yaml.
apiVersion: hybridsovereign.redhat/v1alpha1
kind: CloudGateway
metadata:
  name: aws-us-east-1
  namespace: sovereign-cloud
spec:
  enabled: true
  fabricRef: lab-fabric
  cloudRef:
    kind: CloudInfrastructure
    name: example-aws
  transport:
    type: wireguard
