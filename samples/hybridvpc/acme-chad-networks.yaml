# Tenant HybridNetworks + NetworkPlacements on the platform fabric.
# Backends: CloudVirt local-virt (VMs on the hub; the operator creates the
# vmNamespaces) and CloudOSO oso1 (Neutron network on the OpenStack site).
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridNetwork
metadata:
  name: acme-core
  namespace: entity-acme-corp
spec:
  description: Acme core VRF — hub VMs + OSO1 via EVPN IP-VRF
  fabricRef: platform-fabric
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: acme-core-hub
  namespace: entity-acme-corp
spec:
  network: acme-core
  backend:
    kind: CloudVirt
    name: local-virt
  prefixes:
    - 10.110.2.0/24
  vmNamespaces:
    - acme-core-vms
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: acme-core-oso1
  namespace: entity-acme-corp
spec:
  network: acme-core
  backend:
    kind: CloudOSO
    name: oso1
  prefixes:
    - 10.110.1.0/24
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: HybridNetwork
metadata:
  name: chad-app
  namespace: entity-chad
spec:
  description: Chad app VRF — hub VMs (isolated from acme-core)
  fabricRef: platform-fabric
---
apiVersion: hybridsovereign.redhat/v1alpha1
kind: NetworkPlacement
metadata:
  name: chad-app-hub
  namespace: entity-chad
spec:
  network: chad-app
  backend:
    kind: CloudVirt
    name: local-virt
  prefixes:
    - 10.120.2.0/24
  vmNamespaces:
    - chad-app-vms
