---
# Resolve the RHOSO management OpenShift cluster kubeconfig from Vault.
# CloudGateway.spec.managementClusterKubeconfigRef wins, else
# CloudOSO.spec.managementClusterKubeconfigRef, else oso/<cloudoso>/mgmt-kubeconfig.
# Vault key: kubeconfig.
# Sets: cgw_mgmt_kubeconfig (path of a 0600 temp file)

- name: Resolve management cluster kubeconfig Vault path
  ansible.builtin.set_fact:
    cgw_mgmt_kubeconfig_ref: >-
      {{
        cloudgateway_spec.managementClusterKubeconfigRef
        | default(((cgw_cloudoso | default({})).spec | default({})).managementClusterKubeconfigRef | default(''), true)
        | default('oso/' ~ cloudgateway_spec.openstackCloudOSORef ~ '/mgmt-kubeconfig', true)
      }}
    cgw_mgmt_kubeconfig: "/tmp/cgw-{{ cloudgateway_cr_name }}-mgmt-kubeconfig"

- name: Set kubeconfig-missing failure reason before failing
  when: cgw_mgmt_kubeconfig_ref | length == 0
  ansible.builtin.set_fact:
    cloudgateway_fail_reason: ManagementKubeconfigMissing

- name: Require a management cluster kubeconfig reference
  ansible.builtin.fail:
    msg: >-
      CloudGateway {{ cloudgateway_cr_name }}: set spec.managementClusterKubeconfigRef or
      CloudOSO {{ cloudgateway_spec.openstackCloudOSORef }} spec.managementClusterKubeconfigRef
      (Vault path with key kubeconfig) to land the site gateway and EDPM EVPN.
  when: cgw_mgmt_kubeconfig_ref | length == 0

- name: Read management cluster kubeconfig from Vault
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
  vars:
    vault_kv_path: "{{ cgw_mgmt_kubeconfig_ref }}"

- name: Write management cluster kubeconfig
  ansible.builtin.copy:
    content: "{{ vault_kv_data.kubeconfig }}"
    dest: "{{ cgw_mgmt_kubeconfig }}"
    mode: "0600"
  no_log: true
