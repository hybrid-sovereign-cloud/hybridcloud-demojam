---
# Resolve the RHOSO management OpenShift cluster kubeconfig (Vault key kubeconfig).
# Source: CloudInfrastructure.spec.openstack.managementClusterKubeconfigRef
# (rcs_mgmt_kubeconfig_ref from common/tasks/resolve_cloudgateway_site.yml).
# Deprecated path (no cloudRef): CloudGateway.spec.managementClusterKubeconfigRef,
# else CloudOSO.spec.managementClusterKubeconfigRef, else oso/<cloudoso>/mgmt-kubeconfig.
# Sets: cgw_mgmt_kubeconfig (path of a 0600 temp file)

- name: Set management cluster kubeconfig path
  ansible.builtin.set_fact:
    cgw_mgmt_kubeconfig: "/tmp/cgw-{{ cloudgateway_cr_name }}-mgmt-kubeconfig"

- name: Set kubeconfig-missing failure reason before failing
  when: (rcs_mgmt_kubeconfig_ref | default('', true)) | length == 0
  ansible.builtin.set_fact:
    cloudgateway_fail_reason: ManagementKubeconfigMissing

- name: Require a management cluster kubeconfig reference
  ansible.builtin.fail:
    msg: >-
      CloudGateway {{ cloudgateway_cr_name }}: CloudInfrastructure {{ cgw_site_name }} needs
      spec.openstack.managementClusterKubeconfigRef (Vault path with key kubeconfig) to land
      the site gateway and EDPM EVPN.
  when: (rcs_mgmt_kubeconfig_ref | default('', true)) | length == 0

- name: Write management cluster kubeconfig
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/cloudinfra_mgmt_kubeconfig.yml"
  vars:
    ci_kubeconfig_ref: "{{ rcs_mgmt_kubeconfig_ref }}"
    ci_kubeconfig_dest: "{{ cgw_mgmt_kubeconfig }}"

- name: Set kubeconfig-unreadable failure reason before failing
  when: not (ci_kubeconfig_ok | bool)
  ansible.builtin.set_fact:
    cloudgateway_fail_reason: ManagementKubeconfigUnavailable

- name: Require a readable management cluster kubeconfig
  ansible.builtin.fail:
    msg: "CloudGateway {{ cloudgateway_cr_name }}: {{ ci_kubeconfig_error }}"
  when: not (ci_kubeconfig_ok | bool)
