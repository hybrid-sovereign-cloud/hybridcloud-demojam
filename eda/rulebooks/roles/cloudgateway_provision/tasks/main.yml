---
# CloudGateway provision — design/fabric.md §8.2.
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        cloudgateway_cr_name: "{{ event_payload.regarding.name }}"
        cloudgateway_cr_namespace: "{{ event_payload.regarding.namespace }}"
        cloudgateway_fail_reason: ""

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read CloudGateway CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        name: "{{ cloudgateway_cr_name }}"
        namespace: "{{ cloudgateway_cr_namespace }}"
      register: cloudgateway_cr_lookup

    - name: Fail if CloudGateway CR is missing
      ansible.builtin.fail:
        msg: "CloudGateway {{ cloudgateway_cr_name }} not found in {{ cloudgateway_cr_namespace }}"
      when: cloudgateway_cr_lookup.resources | default([]) | length == 0

    - name: Set spec/generation facts from live CR
      ansible.builtin.set_fact:
        cloudgateway_spec: "{{ cloudgateway_cr_lookup.resources[0].spec | default({}) }}"
        cloudgateway_labels: "{{ cloudgateway_cr_lookup.resources[0].metadata.labels | default({}) }}"
        cloudgateway_generation: "{{ cloudgateway_cr_lookup.resources[0].metadata.generation | default(0) | int }}"
        cloudgateway_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Set fabricRef failure reason before validating
      ansible.builtin.set_fact:
        cloudgateway_fail_reason: FabricRefMissing
      when: (cloudgateway_spec.fabricRef | default('')) | length == 0

    - name: Require spec.fabricRef
      ansible.builtin.fail:
        msg: "CloudGateway {{ cloudgateway_cr_name }} spec.fabricRef is required"
      when: (cloudgateway_spec.fabricRef | default('')) | length == 0

    - name: Read referenced HybridFabric
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ cloudgateway_spec.fabricRef }}"
        namespace: sovereign-cloud
      register: cgw_fabric_lookup

    - name: Set fabric-not-found failure reason before failing
      ansible.builtin.set_fact:
        cloudgateway_fail_reason: FabricNotFound
      when: cgw_fabric_lookup.resources | default([]) | length == 0

    - name: Fail if fabricRef does not exist
      ansible.builtin.fail:
        msg: "CloudGateway {{ cloudgateway_cr_name }} fabricRef {{ cloudgateway_spec.fabricRef }} not found in sovereign-cloud"
      when: cgw_fabric_lookup.resources | default([]) | length == 0

    - name: Set fabric facts
      ansible.builtin.set_fact:
        cgw_fabric: "{{ cgw_fabric_lookup.resources[0] }}"

    - name: Set fabric-not-ready failure reason before failing
      ansible.builtin.set_fact:
        cloudgateway_fail_reason: FabricNotReady
      when: not (cgw_fabric.status.ready | default(false) | bool)

    - name: Require fabricRef Ready
      ansible.builtin.fail:
        msg: "CloudGateway {{ cloudgateway_cr_name }} fabricRef {{ cloudgateway_spec.fabricRef }} is not Ready"
      when: not (cgw_fabric.status.ready | default(false) | bool)

    - name: Resolve this gateway's entity (label wins, else namespace pattern)
      ansible.builtin.set_fact:
        cgw_entity: >-
          {{
            cloudgateway_labels.get('hybridsovereign.redhat/entity', '')
            if (cloudgateway_labels.get('hybridsovereign.redhat/entity', '') | length > 0)
            else (cloudgateway_cr_namespace | regex_replace('^entity-', '') if (cloudgateway_cr_namespace | regex_search('^entity-')) else '')
          }}

    - name: Normalize fabric entityRefs to name list
      ansible.builtin.set_fact:
        cgw_fabric_entity_names: "{{ cgw_fabric.spec.entityRefs | default([]) | map(attribute='name') | list }}"

    - name: Set entity-mismatch failure reason before failing
      ansible.builtin.set_fact:
        cloudgateway_fail_reason: EntityMismatch
      when:
        - (cgw_fabric_entity_names | length) > 0
        - (cgw_entity | length) > 0
        - cgw_entity not in cgw_fabric_entity_names

    - name: Reject gateway/fabric entity mismatch (design §8.2)
      ansible.builtin.fail:
        msg: >-
          CloudGateway {{ cloudgateway_cr_name }} entity '{{ cgw_entity }}' is not in
          HybridFabric {{ cloudgateway_spec.fabricRef }} entityRefs {{ cgw_fabric_entity_names }}.
      when:
        - (cgw_fabric_entity_names | length) > 0
        - (cgw_entity | length) > 0
        - cgw_entity not in cgw_fabric_entity_names

    # BGW fabrics: every spoke peers with the single border gateway loopback.
    # Legacy fabrics: one peer per spec.routeReflectors[] entry.
    - name: Set fabric peering facts (border gateway or legacy RRs)
      ansible.builtin.set_fact:
        cgw_bgw_loopback: "{{ (cgw_fabric.spec.borderGateway | default({})).loopback | default('') }}"
        cgw_rr_addrs: >-
          {{
            cgw_fabric.spec.routeReflectors | default([])
            | map(attribute='address') | select('string') | list
          }}

    - name: Set fabric peer list and count
      ansible.builtin.set_fact:
        cgw_fabric_peers: "{{ [cgw_bgw_loopback] if (cgw_bgw_loopback | length > 0) else cgw_rr_addrs }}"
        cgw_peer_count: "{{ 1 if (cgw_bgw_loopback | length > 0) else (cgw_rr_addrs | length) }}"

    # ---------------------------------------------------------------
    # Site: spec.cloudRef -> CloudInfrastructure (plan §2.1). Live objects may
    # still carry the deprecated spec.cloud/openstackCloudOSORef during the
    # cutover; those are read only when cloudRef is absent (with a warning).
    # ---------------------------------------------------------------
    - name: Resolve the site this gateway lands on (cloudRef, else deprecated fields)
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloudgateway_site.yml"
      vars:
        rcs_gateway: "{{ cloudgateway_cr_lookup.resources[0] }}"

    - name: Set site facts
      ansible.builtin.set_fact:
        cgw_cloud_type: "{{ rcs_cloud_type }}"
        cgw_site_name: "{{ rcs_site_name }}"
        cgw_cloudinfra: "{{ rcs_cloudinfra }}"
        cgw_site_warning: "{{ rcs_warning }}"
        cgw_transport_type: "{{ rcs_transport }}"

    - name: Set cloudRef failure reason before failing
      when: rcs_error | length > 0
      ansible.builtin.set_fact:
        cloudgateway_fail_reason: "{{ 'CloudInfrastructureNotFound' if ('not found' in rcs_error) else 'CloudRefInvalid' }}"

    - name: Fail when the site cannot be resolved
      when: rcs_error | length > 0
      ansible.builtin.fail:
        msg: "{{ rcs_error }}"

    - name: Set CloudInfrastructure-not-ready failure reason before failing
      when:
        - not (rcs_legacy | bool)
        - not (cgw_cloudinfra.status.ready | default(false) | bool)
      ansible.builtin.set_fact:
        cloudgateway_fail_reason: CloudInfrastructureNotReady

    - name: Require the CloudInfrastructure Ready
      when:
        - not (rcs_legacy | bool)
        - not (cgw_cloudinfra.status.ready | default(false) | bool)
      ansible.builtin.fail:
        msg: >-
          CloudGateway {{ cloudgateway_cr_name }}: CloudInfrastructure {{ cgw_site_name }} is not Ready
          ({{ cgw_cloudinfra.status.message | default('no status yet') }}).

    - name: Set transport-unsupported failure reason before failing
      when: cgw_transport_type not in ['none', 'wireguard']
      ansible.builtin.set_fact:
        cloudgateway_fail_reason: TransportUnsupported

    - name: Reject transports other than none / wireguard
      when: cgw_transport_type not in ['none', 'wireguard']
      ansible.builtin.fail:
        msg: >-
          CloudGateway {{ cloudgateway_cr_name }} spec.transport.type={{ cgw_transport_type }} is not
          supported (none or wireguard).

    # ---------------------------------------------------------------
    # AWS: no EVPN fabric landing (design §8.2 / §15.0)
    # ---------------------------------------------------------------
    - name: Reject AWS cloud gateways
      when: cgw_cloud_type == 'aws'
      block:
        - ansible.builtin.set_fact:
            cloudgateway_fail_reason: AwsUnsupported
        - ansible.builtin.fail:
            msg: "AWS EVPN fabric landing unsupported"

    # ---------------------------------------------------------------
    # OpenStack: RHOSO 18.0 FR6 native OVN BGP-EVPN (fail closed)
    # NodeSets / NetConfig / management kubeconfig come from the
    # CloudInfrastructure (rcs_* facts), never from a tenant CloudOSO.
    # ---------------------------------------------------------------
    - name: Handle an openstack site
      when: cgw_cloud_type == 'openstack'
      block:
        - name: Probe RHOSO FR6 native OVN BGP-EVPN support
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_fr6_probe.yml"

        # The Neutron evpn extension seen by cloudinfrastructure_provision (admin
        # credentials) is authoritative when this EE cannot run the CLI probe.
        - name: Adopt the CloudInfrastructure Neutron evpn capability
          when:
            - not (fr6_probe_available | default(false) | bool)
            - (cgw_cloudinfra.status.capabilities | default({})).neutronEvpnExtension | default(false) | bool
          ansible.builtin.set_fact:
            fr6_probe_available: true
            fr6_probe_message: >-
              Neutron evpn extension reported by CloudInfrastructure {{ cgw_site_name }}
              (status.capabilities.neutronEvpnExtension).

        # Legacy RR fabrics only: with a border gateway everything is iBGP in the
        # fabric ASN (per-spoke ASNs retired, design §11).
        - name: Require spoke domainAsn for OpenStack landing (legacy RR fabrics)
          when:
            - (cloudgateway_spec.domainAsn | default(0) | int) == 0
            - cgw_bgw_loopback | length == 0
          ansible.builtin.fail:
            msg: >-
              CloudGateway {{ cloudgateway_cr_name }} on an openstack site requires
              spec.domainAsn (spoke ASN) for legacy route-reflector fabrics.

        - name: Fail closed when fabric has neither a border gateway nor routeReflectors
          when: (cgw_fabric_peers | default([]) | length) == 0
          ansible.builtin.fail:
            msg: >-
              CloudGateway {{ cloudgateway_cr_name }}: HybridFabric
              {{ cloudgateway_spec.fabricRef }} has no spec.borderGateway.loopback (and no
              legacy routeReflectors[]); EDPM FRR has nothing to peer with.

        # design/fabric.md §21.4 — site gateway VM + EDPM EVPN landing on
        # the RHOSO management cluster. Must complete before NetworkPlacement
        # creates the EVPN router (HA chassis group needs the gateway chassis).
        - name: Land the site gateway and EDPM EVPN (transport wireguard)
          when: cgw_transport_type == 'wireguard'
          block:
            - name: Resolve management cluster kubeconfig
              ansible.builtin.include_tasks: openstack_mgmt_kubeconfig.yml

            - name: Site gateway VM, br-fabric, NAD, MAC-NAT shim
              ansible.builtin.include_tasks: openstack_site_gateway.yml

            - name: EDPM NetConfig / NodeSet / deployment
              ansible.builtin.include_tasks: openstack_edpm_evpn.yml
          always:
            - name: Remove management cluster kubeconfig
              ansible.builtin.file:
                path: "/tmp/cgw-{{ cloudgateway_cr_name }}-mgmt-kubeconfig"
                state: absent

        # Lab soft-realize: RHOSO without Neutron FR6 EVPN still gets a Ready
        # CloudGateway so NetworkPlacement can create the tenant Neutron network.
        # EVPN Type-5 remains deferred until --evpn-vni is available server-side.
        - name: Set OpenStack landing zone facts (FR6 verified or EvpnDeferred)
          ansible.builtin.set_fact:
            cgw_landing_zone_ready: true
            cgw_transport_ready: true
            cgw_peer_count: "{{ cgw_fabric_peers | default([]) | length }}"
            cgw_gateway_address: >-
              {{
                cgw_gateway_address
                | default(cloudgateway_cr_lookup.resources[0].status.gatewayAddress | default(''), true)
              }}
            cloudgateway_fail_reason: "{{ '' if (fr6_probe_available | default(false)) else 'Fr6EvpnDeferred' }}"
            cgw_message: >-
              {{
                (
                  'OpenStack FR6 landing Ready on site '
                  ~ cgw_site_name ~ ': '
                  ~ (fr6_probe_message | default(''))
                  ~ '; fabric peers=' ~ (cgw_fabric_peers | join(','))
                  ~ ' (native OVN BGP-EVPN Type-5). '
                  ~ (cgw_site_gw_message | default('')) ~ ' ' ~ (cgw_edpm_message | default(''))
                )
                if (fr6_probe_available | default(false))
                else (
                  'OpenStack landing Ready (EvpnDeferred) on site '
                  ~ cgw_site_name ~ ': '
                  ~ (fr6_probe_message | default('FR6 EVPN unavailable'))
                  ~ '; fabric peers=' ~ (cgw_fabric_peers | join(','))
                  ~ ' — Neutron network placement allowed; EVPN Type-5 deferred. '
                  ~ (cgw_site_gw_message | default('')) ~ ' ' ~ (cgw_edpm_message | default(''))
                )
              }}

    # ---------------------------------------------------------------
    # OpenShift: hub CNV EVPN landing (cloudRef), legacy HCP peer address
    # ---------------------------------------------------------------
    - name: Handle an openshift site
      when: cgw_cloud_type == 'openshift'
      block:
        # Hub CNV EVPN landing (plan §3.2.2 / §4): hub node VTEPs on the localnet
        # underlay, VTEP CR, FRRConfiguration to the BGW. cloudRef objects only; a
        # legacy gateway (spec.cloud=openshift + platformOpenshiftRef/virtCloudVirtRef,
        # hosted-cluster spokes) keeps the old peer-address-only behaviour below.
        - name: Hub CNV EVPN landing (CNO check, hub underlay DaemonSet, VTEP CR, FRRConfiguration)
          when: not (rcs_legacy | bool)
          ansible.builtin.include_tasks: openshift_hub_evpn.yml

        - name: Fail so the operator relaunches until the hub landing is Ready
          when:
            - not (rcs_legacy | bool)
            - not (cgw_hub_evpn_ready | default(false) | bool)
          ansible.builtin.fail:
            msg: "CloudGateway {{ cloudgateway_cr_name }} not Ready: {{ cgw_hub_evpn_message | default('hub EVPN landing not ready') }}"

        - name: Set hub landing zone facts
          when: not (rcs_legacy | bool)
          ansible.builtin.set_fact:
            cgw_landing_zone_ready: true
            cgw_transport_ready: true
            cgw_hub_vtep_list: "{{ cgw_hub_vteps.values() | list | sort | join(',') }}"
            cgw_message: "{{ cgw_hub_evpn_message }}"

        # Legacy HCP spokes peered natively over the hub underlay (eth1, DHCP from
        # the BGW); the gateway address is the BGP peer: the border gateway loopback.
        - name: Set gatewayAddress to the fabric BGP peer (legacy hosted-cluster gateways)
          when: rcs_legacy | bool
          ansible.builtin.set_fact:
            cgw_gateway_address: >-
              {{
                cgw_bgw_loopback
                if (cgw_bgw_loopback | length > 0)
                else (cloudgateway_cr_lookup.resources[0].status.gatewayAddress
                      | default('10.255.' ~ ((cloudgateway_spec.domainAsn | default(cgw_fabric.spec.domainAsn | default(0)) | int) % 250) ~ '.1', true))
              }}

        - name: Set OpenShift landing zone facts (legacy hosted-cluster gateways)
          when: rcs_legacy | bool
          ansible.builtin.set_fact:
            cgw_landing_zone_ready: true
            cgw_transport_ready: true
            cgw_message: >-
              OpenShift/HCP EVPN landing prepared; peer address {{ cgw_gateway_address }}
              (transport={{ cgw_transport_type }}).

    - name: Get timestamp
      ansible.builtin.set_fact:
        cloudgateway_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark CloudGateway ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudgateways
        cr_name: "{{ cloudgateway_cr_name }}"
        cr_namespace: "{{ cloudgateway_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: true
          message: "{{ cgw_message }}{{ (' WARNING: ' ~ cgw_site_warning) if (cgw_site_warning | default('') | length > 0) else '' }}"
          lastReconciledAt: "{{ cloudgateway_status_transition_time }}"
          observedGeneration: "{{ cloudgateway_generation }}"
          landingZoneReady: "{{ cgw_landing_zone_ready | default(false) }}"
          transportReady: "{{ cgw_transport_ready | default(false) }}"
          peerCount: "{{ cgw_peer_count | int }}"
          gatewayAddress: "{{ cgw_gateway_address | default('') }}"
          # Allocated by the BGW facts when spec.wireguard.address is omitted.
          wireguardAddress: "{{ cgw_gw_wg_address | default('') }}"
          cloudInfrastructure: "{{ cgw_site_name | default('') }}"
          # openshift (hub CNV): node VTEP addresses; '' elsewhere.
          vtep: "{{ cgw_hub_vtep_list | default('') }}"
          conditions:
            - type: Ready
              status: "True"
              lastTransitionTime: "{{ cloudgateway_status_transition_time }}"
              reason: EDASucceeded
              message: "{{ cgw_message }}"

  rescue:
    - name: Mark CloudGateway failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudgateways
        cr_name: "{{ cloudgateway_cr_name }}"
        cr_namespace: "{{ cloudgateway_cr_namespace }}"
        cr_status_body:
          # PendingPrereq (e.g. hub CNO without FRR/route advertisements) is not a
          # failure of this object; the operator relaunches either way.
          status: "{{ 'pending' if (cloudgateway_fail_reason | default('')) == 'PendingPrereq' else 'failed' }}"
          ready: false
          landingZoneReady: false
          message: "{{ 'provision failed: ' ~ (ansible_failed_result.msg | default('EDA provision failed') | string) }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: "{{ cloudgateway_fail_reason if (cloudgateway_fail_reason | default('') | length > 0) else 'EDAFailed' }}"
              message: "{{ 'provision failed: ' ~ (ansible_failed_result.msg | default('EDA provision failed') | string) }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudGateway {{ cloudgateway_cr_name | default('unknown') }} provision failed"
