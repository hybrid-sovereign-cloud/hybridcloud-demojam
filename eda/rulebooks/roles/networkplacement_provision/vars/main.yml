---
# Neutron MTU for fabric-placed networks (design/fabric.md §21.5:
# 1442 RHDP segment - WireGuard/wstunnel - VXLAN leaves 1330; 1300 keeps margin
# and matches the HCP CUDN MTU).
np_oso_network_mtu: 1300
# RHOSO control plane namespace on the management cluster.
np_oso_namespace: openstack
np_oso_nb_pod: ovsdbserver-nb-0
np_oso_nb_container: ovsdbserver-nb

# Hub CNV EVPN backend (CloudVirt, backend_cloudvirt_evpn.yml).
# Overlay MTU when the HybridNetwork sets neither spec.overlayMtu nor
# status.overlayMtu (1300 in the lab: 1442 RHDP segment - WireGuard/wstunnel - VXLAN).
np_overlay_default_mtu: 1300
# Hub kubemacpool webhook is broken in the lab: opt the VM namespaces out
# (explicit or kubemacpool-free MACs then). Set false once kubemacpool works.
np_hub_kubemacpool_ignore: true
np_hub_wait_retries: 18
np_hub_wait_delay: 10
