---
# NetworkPlacement provision (realize + validate) — design/fabric.md §8.5.
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        networkplacement_cr_name: "{{ event_payload.regarding.name }}"
        networkplacement_cr_namespace: "{{ event_payload.regarding.namespace }}"
        networkplacement_fail_reason: ""

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read NetworkPlacement CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        name: "{{ networkplacement_cr_name }}"
        namespace: "{{ networkplacement_cr_namespace }}"
      register: networkplacement_cr_lookup

    - name: Fail if NetworkPlacement CR is missing
      ansible.builtin.fail:
        msg: "NetworkPlacement {{ networkplacement_cr_name }} not found in {{ networkplacement_cr_namespace }}"
      when: networkplacement_cr_lookup.resources | default([]) | length == 0

    - name: Set spec/generation facts from live CR
      ansible.builtin.set_fact:
        np_spec: "{{ networkplacement_cr_lookup.resources[0].spec | default({}) }}"
        networkplacement_generation: "{{ networkplacement_cr_lookup.resources[0].metadata.generation | default(0) | int }}"
        np_entity: "{{ networkplacement_cr_namespace | regex_replace('^entity-', '') }}"
        np_backend_name: "{{ networkplacement_cr_lookup.resources[0].spec.backend.name | default('') }}"
        np_backend_kind: "{{ networkplacement_cr_lookup.resources[0].spec.backend.kind | default('') }}"
        np_target_backend: >-
          {{
            {'CloudAWS': 'aws', 'CloudOSO': 'openstack', 'CloudVirt': 'openshift'}.get(
              networkplacement_cr_lookup.resources[0].spec.backend.kind | default(''), 'unsupported')
          }}

    - name: Get timestamp
      ansible.builtin.set_fact:
        networkplacement_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    # ---------------------------------------------------------------
    # Backends are CloudOSO, CloudAWS, CloudVirt only (plan decision 6): a
    # tenant cluster-admin controls OVN-K/FRR on a hosted cluster, so
    # PlatformOpenshift attachment is removed.
    # ---------------------------------------------------------------
    - name: Set backend-kind failure reason before failing
      when: np_backend_kind not in ['CloudOSO', 'CloudAWS', 'CloudVirt']
      ansible.builtin.set_fact:
        networkplacement_fail_reason: "{{ 'BackendKindRemoved' if np_backend_kind == 'PlatformOpenshift' else 'BackendKindUnsupported' }}"

    - name: Reject unsupported backend kinds
      when: np_backend_kind not in ['CloudOSO', 'CloudAWS', 'CloudVirt']
      ansible.builtin.fail:
        msg: >-
          NetworkPlacement {{ networkplacement_cr_name }}: spec.backend.kind={{ np_backend_kind }} is not
          supported; use CloudOSO, CloudAWS or CloudVirt
          {{- ' (PlatformOpenshift attachment was removed: tenant cluster-admins control the hosted
          cluster network stack; place VMs on CloudVirt instead)' if np_backend_kind == 'PlatformOpenshift' else '' }}.

    # ---------------------------------------------------------------
    # state: absent — withdraw, keep the VNI (HybridNetwork owns release)
    # ---------------------------------------------------------------
    - name: Withdraw placement when state=absent
      when: (np_spec.state | default('present')) == 'absent'
      block:
        - ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
          vars:
            cr_api_version: hybridsovereign.redhat/v1alpha1
            cr_plural: networkplacements
            cr_name: "{{ networkplacement_cr_name }}"
            cr_namespace: "{{ networkplacement_cr_namespace }}"
            cr_status_body:
              status: ready
              ready: false
              backendApplied: false
              validated: false
              message: "NetworkPlacement withdrawn (spec.state=absent); VNI retained on HybridNetwork until last placement is gone."
              lastReconciledAt: "{{ networkplacement_status_transition_time }}"
              observedGeneration: "{{ networkplacement_generation }}"
        - ansible.builtin.meta: end_host

    # ---------------------------------------------------------------
    # §8.5.1 Common preflight — HybridNetwork must be allocated
    # ---------------------------------------------------------------
    - name: Load HybridNetwork CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridNetwork
        name: "{{ np_spec.network | default('') }}"
        namespace: "{{ networkplacement_cr_namespace }}"
      register: hn_lookup
      when: (np_spec.network | default('')) | length > 0
      failed_when: false

    - name: Patch PendingPrereq when HybridNetwork is missing or not allocated
      when: >-
        (np_spec.network | default('') | length == 0)
        or (hn_lookup.resources | default([]) | length == 0)
        or not (hn_lookup.resources[0].status.allocated | default(false) | bool)
      block:
        - ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
          vars:
            cr_api_version: hybridsovereign.redhat/v1alpha1
            cr_plural: networkplacements
            cr_name: "{{ networkplacement_cr_name }}"
            cr_namespace: "{{ networkplacement_cr_namespace }}"
            cr_status_body:
              status: reconciling
              ready: false
              prerequisiteReady: false
              backendReady: false
              backendApplied: false
              validated: false
              message: >-
                PendingPrereq: HybridNetwork '{{ np_spec.network | default('') }}' does not exist yet or is not allocated.
              lastReconciledAt: "{{ networkplacement_status_transition_time }}"
              observedGeneration: "{{ networkplacement_generation }}"
        # Fail (not end_host) so AAP marks the job failed and the operator relaunches
        # once HybridNetwork.allocated becomes true.
        - ansible.builtin.fail:
            msg: >-
              PendingPrereq: HybridNetwork '{{ np_spec.network | default('') }}' does not exist yet or is not allocated.

    - name: Set numbering facts from allocated HybridNetwork
      ansible.builtin.set_fact:
        hn_selected_fabric_name: "{{ hn_lookup.resources[0].status.fabric | default('') }}"
        np_network_id: "{{ hn_lookup.resources[0].status.networkId | default('') }}"
        np_vni: "{{ hn_lookup.resources[0].status.vni | default(0) | int }}"
        np_vrf: "{{ hn_lookup.resources[0].status.vrfName | default(np_spec.network) }}"
        np_canonical_rt: "{{ hn_lookup.resources[0].status.canonicalRt | default('') }}"
        np_domain_asn: "{{ hn_lookup.resources[0].status.canonicalRt | default('0:0') | regex_replace(':.*$', '') | int }}"
        # Overlay MTU (CUDN mtu, Neutron network MTU): HybridNetwork spec.overlayMtu,
        # else status.overlayMtu, else the lab default (1300).
        np_overlay_mtu: >-
          {{
            (hn_lookup.resources[0].spec | default({})).overlayMtu
            | default((hn_lookup.resources[0].status | default({})).overlayMtu | default(np_overlay_default_mtu, true), true) | int
          }}

    - name: Load HybridFabric detail (used for spoke FRR route reflectors)
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ hn_selected_fabric_name }}"
        namespace: sovereign-cloud
      register: np_fabric_lookup
      when: (hn_selected_fabric_name | default('')) | length > 0
      failed_when: false

    - name: Set HybridFabric detail fact
      ansible.builtin.set_fact:
        hn_all_fabrics_detail: "{{ (np_fabric_lookup.resources | default([{}]))[0] | default({}, true) }}"

    # ---------------------------------------------------------------
    # Resolve the backend's site and its CloudGateway (design §8.5.1):
    # backend (CloudOSO / CloudVirt, entity namespace) -> spec.cloudRef ->
    # CloudInfrastructure -> the CloudGateway on this fabric with the same
    # cloudRef. Deprecated: a CloudOSO without cloudRef matches a gateway whose
    # spec.openstackCloudOSORef names it.
    # ---------------------------------------------------------------
    - name: Read the backend cloud project
      when: np_backend_kind in ['CloudOSO', 'CloudVirt']
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: "{{ np_backend_kind }}"
        name: "{{ np_backend_name }}"
        namespace: "{{ networkplacement_cr_namespace }}"
      register: np_backend_obj_lookup
      failed_when: false

    - name: Set backend site facts
      ansible.builtin.set_fact:
        np_backend_obj: "{{ (np_backend_obj_lookup.resources | default([]) + [{}])[0] }}"
        np_backend_site: "{{ (((np_backend_obj_lookup.resources | default([]) + [{}])[0].spec | default({})).cloudRef | default({}, true)).name | default('', true) }}"

    - name: Resolve the backend's CloudInfrastructure
      when: np_backend_site | length > 0
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloud_infrastructure.yml"
      vars:
        ci_ref_name: "{{ np_backend_site }}"
        ci_expected_type: "{{ np_target_backend }}"

    - name: Keep the backend CloudInfrastructure
      ansible.builtin.set_fact:
        np_cloudinfra: "{{ ci_obj if (np_backend_site | length > 0) else {} }}"
        np_cloudinfra_error: "{{ ci_error if (np_backend_site | length > 0) else '' }}"

    - name: List CloudGateways in sovereign-cloud
      when: np_backend_kind in ['CloudOSO', 'CloudVirt']
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        namespace: sovereign-cloud
      register: np_all_gateways
      failed_when: false

    - name: Select the CloudGateway of this site on the network's fabric
      when: np_backend_kind in ['CloudOSO', 'CloudVirt']
      ansible.builtin.set_fact:
        np_gateway: >-
          {%- set ns = namespace(hit={}) -%}
          {%- for g in np_all_gateways.resources | default([]) -%}
          {%-   set gs = g.spec | default({}) -%}
          {%-   if gs.fabricRef | default('') == hn_selected_fabric_name and not ns.hit -%}
          {%-     if np_backend_site | length > 0 and ((gs.cloudRef | default({}, true)).name | default('')) == np_backend_site -%}
          {%-       set ns.hit = g -%}
          {%-     elif np_backend_site | length == 0 and np_backend_kind == 'CloudOSO'
                     and (gs.cloudRef | default({}, true)).name | default('') == ''
                     and gs.openstackCloudOSORef | default('') == np_backend_name -%}
          {%-       set ns.hit = g -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.hit }}

    - name: Warn about a backend without cloudRef
      when:
        - np_backend_kind in ['CloudOSO', 'CloudVirt']
        - np_backend_site | length == 0
      ansible.builtin.set_fact:
        np_site_warning: >-
          {{ np_backend_kind }} {{ np_backend_name }} has no spec.cloudRef; matched the deprecated
          CloudGateway.spec.openstackCloudOSORef.

    - name: Set empty gateway fact for unsupported/AWS backends
      when: np_gateway is not defined
      ansible.builtin.set_fact:
        np_gateway: {}

    - name: Compute prerequisiteReady + gatewayRef/linkRef facts
      ansible.builtin.set_fact:
        np_gateway_ready: "{{ (np_gateway.status.ready | default(false)) | bool }}"
        np_cloud_gateway_ref: "{{ np_gateway.metadata.name | default('') }}"
        np_transport_link_ref: ""

    - name: Patch Blocked when prerequisite CloudGateway is not Ready
      when:
        - np_spec.backend.kind in ['CloudOSO', 'CloudVirt']
        - not np_gateway_ready
      block:
        - ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
          vars:
            cr_api_version: hybridsovereign.redhat/v1alpha1
            cr_plural: networkplacements
            cr_name: "{{ networkplacement_cr_name }}"
            cr_namespace: "{{ networkplacement_cr_namespace }}"
            cr_status_body:
              status: reconciling
              ready: false
              prerequisiteReady: false
              backendReady: false
              backendApplied: false
              validated: false
              vni: "{{ np_vni | int }}"
              domainAsn: "{{ np_domain_asn | int }}"
              message: >-
                Blocked: no Ready CloudGateway found for backend
                {{ np_spec.backend.kind }}/{{ np_backend_name }} (site {{ np_backend_site | default('', true) or 'unset' }})
                on fabric {{ hn_selected_fabric_name }}. {{ np_cloudinfra_error | default('') }}
              lastReconciledAt: "{{ networkplacement_status_transition_time }}"
              observedGeneration: "{{ networkplacement_generation }}"
        - ansible.builtin.fail:
            msg: >-
              Blocked: no Ready CloudGateway found for backend
              {{ np_spec.backend.kind }}/{{ np_backend_name }} (site {{ np_backend_site | default('', true) or 'unset' }})
              on fabric {{ hn_selected_fabric_name }}. {{ np_cloudinfra_error | default('') }}

    - name: Set prerequisiteReady true + fabricApplied best-effort (design §8.5.4)
      ansible.builtin.set_fact:
        np_prerequisite_ready: true
        np_fabric_applied: true

    # ---------------------------------------------------------------
    # Prefix validation
    # ---------------------------------------------------------------
    - name: Validate placement prefixes parse as CIDRs
      ansible.builtin.shell: |
        set -euo pipefail
        python3 <<'PY'
        import ipaddress, json, os
        for p in json.loads(os.environ["PREFIXES"]):
            ipaddress.ip_network(p, strict=False)
        print("ok")
        PY
      environment:
        PREFIXES: "{{ np_spec.prefixes | default([]) | to_json }}"
      register: np_prefix_check
      changed_when: false
      failed_when: false

    - name: Set prefix-validation failure reason before failing
      ansible.builtin.set_fact:
        networkplacement_fail_reason: PrefixInvalid
      when: (np_prefix_check.rc | default(1)) != 0

    - name: Fail on invalid prefixes
      ansible.builtin.fail:
        msg: "NetworkPlacement {{ networkplacement_cr_name }} has invalid CIDR(s) in spec.prefixes: {{ np_prefix_check.stderr | default('') }}"
      when: (np_prefix_check.rc | default(1)) != 0

    # Overlay prefix rules (design/fabric.md §16): prefixes are unique per
    # HybridNetwork (VRF) only. (a) no overlap with sibling placements of the SAME
    # HybridNetwork, any backend (CUDN or Neutron); (b) no overlap with the target
    # cluster's own pod/service (and node/underlay) CIDRs, below; (c) deliberately
    # NO check against other HybridNetworks - identical prefixes in different VRFs
    # are allowed.
    - name: List sibling NetworkPlacements of the same HybridNetwork
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        namespace: "{{ networkplacement_cr_namespace }}"
      register: np_sibling_lookup

    - name: Overlap-check placement prefixes vs sibling placements of the same network
      ansible.builtin.shell: |
        set -euo pipefail
        python3 <<'PY'
        import ipaddress, json, os, sys
        mine = json.loads(os.environ["PREFIXES"])
        hits = []
        for sib in json.loads(os.environ["SIBLINGS"]):
            spec = sib.get("spec") or {}
            if sib["metadata"]["name"] == os.environ["SELF"]:
                continue
            if spec.get("network") != os.environ["NETWORK"] or spec.get("state") == "absent":
                continue
            for p in mine:
                for q in spec.get("prefixes") or []:
                    if ipaddress.ip_network(p, strict=False).overlaps(ipaddress.ip_network(q, strict=False)):
                        hits.append("%s overlaps %s of NetworkPlacement %s" % (p, q, sib["metadata"]["name"]))
        if hits:
            print("; ".join(hits), file=sys.stderr)
            sys.exit(1)
        print("ok")
        PY
      environment:
        PREFIXES: "{{ np_spec.prefixes | default([]) | to_json }}"
        SIBLINGS: "{{ np_sibling_lookup.resources | default([]) | to_json }}"
        SELF: "{{ networkplacement_cr_name }}"
        NETWORK: "{{ np_spec.network }}"
      register: np_sibling_overlap_check
      changed_when: false
      failed_when: false

    - name: Set sibling-overlap failure reason before failing
      when: (np_sibling_overlap_check.rc | default(0)) != 0
      ansible.builtin.set_fact:
        networkplacement_fail_reason: PrefixNetworkOverlap

    - name: Fail when placement prefixes overlap another placement of the same HybridNetwork
      when: (np_sibling_overlap_check.rc | default(0)) != 0
      ansible.builtin.fail:
        msg: >-
          NetworkPlacement {{ networkplacement_cr_name }} prefixes overlap another placement of
          HybridNetwork {{ np_spec.network }}: {{ np_sibling_overlap_check.stderr | default('overlap detected') }}

    # design/fabric.md §16.5 / plan §2.2 — CloudVirt placements land on the hub:
    # prefixes must not overlap the hub's cluster, service or node networks.
    - name: Read hub network config for the CloudVirt overlap check
      when: np_backend_kind == 'CloudVirt'
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: config.openshift.io/v1
        kind: Network
        name: cluster
      register: np_hub_net
      failed_when: false

    - name: List hub nodes for the CloudVirt overlap check
      when: np_backend_kind == 'CloudVirt'
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: Node
      register: np_hub_nodes
      failed_when: false

    - name: Overlap-check CloudVirt prefixes vs hub cluster/service/node networks
      when: np_backend_kind == 'CloudVirt'
      ansible.builtin.shell: |
        set -euo pipefail
        python3 <<'PY'
        import ipaddress, json, os, sys
        net = json.loads(os.environ["HUB_NET"])
        st = net.get("status") or net.get("spec") or {}
        hub = [c.get("cidr") for c in st.get("clusterNetwork") or [] if c.get("cidr")]
        hub += [c for c in st.get("serviceNetwork") or [] if c]
        # Node addresses: a /32 per InternalIP (machine network CIDRs are not on the API).
        hub += ["%s/32" % a for a in json.loads(os.environ["NODE_IPS"])]
        hub += json.loads(os.environ.get("EXTRA") or "[]")
        hits = []
        for p in json.loads(os.environ["PREFIXES"]):
            for h in hub:
                if ipaddress.ip_network(p, strict=False).overlaps(ipaddress.ip_network(h, strict=False)):
                    hits.append("%s overlaps hub %s" % (p, h))
        if hits:
            print("; ".join(sorted(set(hits))), file=sys.stderr)
            sys.exit(1)
        print("ok")
        PY
      environment:
        PREFIXES: "{{ np_spec.prefixes | default([]) | to_json }}"
        HUB_NET: "{{ ((np_hub_net.resources | default([])) + [{}])[0] | to_json }}"
        NODE_IPS: >-
          {{
            np_hub_nodes.resources | default([]) | map(attribute='status.addresses') | flatten
            | selectattr('type', 'equalto', 'InternalIP') | map(attribute='address')
            | select('match', '^[0-9.]+$') | list | to_json
          }}
        EXTRA: "{{ np_hub_reserved_cidrs | default([]) | to_json }}"
      register: np_net_overlap_check
      changed_when: false
      failed_when: false

    - name: Set overlap failure reason before failing
      ansible.builtin.set_fact:
        networkplacement_fail_reason: PrefixClusterOverlap
      when:
        - np_net_overlap_check is defined
        - (np_net_overlap_check.rc | default(0)) != 0

    - name: Fail when CloudVirt prefixes overlap hub networking
      ansible.builtin.fail:
        msg: >-
          NetworkPlacement {{ networkplacement_cr_name }} prefixes overlap the hub's networks:
          {{ np_net_overlap_check.stderr | default('overlap detected') }}
      when:
        - np_net_overlap_check is defined
        - (np_net_overlap_check.rc | default(0)) != 0

    # ---------------------------------------------------------------
    # §8.5.2 / §8.5.3 backend dispatch
    # ---------------------------------------------------------------
    - name: Reject AWS backend (no EVPN fabric placement path)
      when: np_spec.backend.kind == 'CloudAWS'
      ansible.builtin.set_fact:
        np_backend_applied: false
        np_backend_ready: false
        np_backend_fail_reason: AwsUnsupported
        np_backend_message: "CloudAWS backend has no EVPN fabric placement path (design §8.2/§15.0)."

    - name: Dispatch to RHOSO FR6 native OVN BGP-EVPN backend
      when: np_spec.backend.kind == 'CloudOSO'
      ansible.builtin.include_tasks: backend_rhoso_ovn_evpn.yml

    # Hub CNV EVPN backend (plan §3.2.4 / §4): Layer2 primary CUDN with ipVRF +
    # macVRF on the hub VTEP, RouteAdvertisements, vmNamespaces created labelled.
    - name: Dispatch to the hub CNV EVPN backend (Layer2 CUDN, RouteAdvertisements, vmNamespaces)
      when: np_spec.backend.kind == 'CloudVirt'
      ansible.builtin.include_tasks: backend_cloudvirt_evpn.yml

    - name: Set networkplacement_fail_reason from backend failure
      ansible.builtin.set_fact:
        networkplacement_fail_reason: "{{ np_backend_fail_reason | default('') }}"

    # Per-site RT policy on the BGW (plan §3.2.5): a realized placement adds its
    # RT to its site's peer-group. bgw_config.yml re-renders and pushes in place;
    # a no-op when nothing changed. Failure only warns (the next HybridFabric
    # reconcile retries).
    - name: Refresh the border gateway per-site RT policy
      when:
        - np_backend_applied | default(false) | bool
        - ((hn_all_fabrics_detail.spec | default({})).borderGateway | default({})).loopback | default('') | length > 0
      block:
        - name: Re-render BGW config for this placement's site
          ansible.builtin.include_role:
            name: hybridfabric_provision
            tasks_from: bgw_config.yml
          vars:
            bgw_fabric_cr: "{{ hn_all_fabrics_detail }}"
      rescue:
        - name: Record BGW refresh failure
          ansible.builtin.set_fact:
            np_bgw_refresh_warning: >-
              BGW RT policy not refreshed: {{ ansible_failed_result.msg | default('error') }}

    # ---------------------------------------------------------------
    # §8.5.5 validate — live BGP / TCP-179 probe (design/fabric-verify.md)
    # ---------------------------------------------------------------
    - name: Live-validate EVPN BGP readiness
      ansible.builtin.include_tasks: validate_bgp.yml

    - name: Mark NetworkPlacement status
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: networkplacements
        cr_name: "{{ networkplacement_cr_name }}"
        cr_namespace: "{{ networkplacement_cr_namespace }}"
        cr_status_body:
          status: "{{ 'ready' if (np_backend_applied | default(false)) else 'failed' }}"
          ready: "{{ np_backend_ready | default(false) }}"
          message: >-
            {{ np_backend_message | default('') }} {{ np_validated_message }}
            {{ np_bgw_refresh_warning | default('') }} {{ np_site_warning | default('') }}
          lastReconciledAt: "{{ networkplacement_status_transition_time }}"
          observedGeneration: "{{ networkplacement_generation }}"
          entity: "{{ np_entity }}"
          networkId: "{{ np_network_id | default('') }}"
          targetBackend: "{{ np_target_backend }}"
          vni: "{{ np_vni | int }}"
          vrfName: "{{ np_vrf | default(networkplacement_cr_name) }}"
          canonicalRt: "{{ np_canonical_rt | default('') }}"
          backendRt: "{{ np_canonical_rt | default('') }}"
          rtStrategy: native
          domainAsn: "{{ np_domain_asn | int }}"
          backendReady: "{{ np_backend_ready | default(false) }}"
          prerequisiteReady: "{{ np_prerequisite_ready | default(false) }}"
          fabricApplied: "{{ np_fabric_applied | default(false) }}"
          backendApplied: "{{ np_backend_applied | default(false) }}"
          validated: "{{ np_validated | default(false) }}"
          lastValidatedAt: "{{ networkplacement_status_transition_time }}"
          realizedPrefixes: "{{ np_spec.prefixes | default([]) }}"
          # CloudVirt: hub namespaces created for this placement; CUDN/RA/VTEP/L2VNI ids.
          vmNamespaces: "{{ np_vm_namespaces | default([]) }}"
          backendIds: "{{ np_backend_ids | default({}) }}"
          cloudGatewayRef: "{{ np_cloud_gateway_ref | default('') }}"
          transportLinkRef: "{{ np_transport_link_ref | default('') }}"
          cloudInfrastructure: "{{ np_backend_site | default('') }}"
          conditions:
            - type: Ready
              status: "{{ 'True' if (np_backend_ready | default(false)) else 'False' }}"
              lastTransitionTime: "{{ networkplacement_status_transition_time }}"
              reason: "{{ 'EDASucceeded' if (np_backend_ready | default(false)) else (networkplacement_fail_reason | default('BackendNotReady')) }}"
              message: "{{ np_backend_message | default('') }}"

    - name: Fail so operator relaunches when EVPN backend not Ready (EvpnPrepPending)
      when: not (np_backend_ready | default(false) | bool)
      ansible.builtin.fail:
        msg: >-
          NetworkPlacement {{ networkplacement_cr_name }} not Ready:
          {{ np_backend_message | default(networkplacement_fail_reason | default('BackendNotReady')) }}

  rescue:
    - name: Mark NetworkPlacement failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: networkplacements
        cr_name: "{{ networkplacement_cr_name }}"
        cr_namespace: "{{ networkplacement_cr_namespace }}"
        cr_status_body:
          status: failed
          ready: false
          backendApplied: false
          validated: false
          message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: "{{ networkplacement_fail_reason if (networkplacement_fail_reason | default('') | length > 0) else 'EDAFailed' }}"
              message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "NetworkPlacement {{ networkplacement_cr_name | default('unknown') }} provision failed"
