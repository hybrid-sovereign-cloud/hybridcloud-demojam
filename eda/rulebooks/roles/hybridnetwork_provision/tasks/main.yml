---
# HybridNetwork provision (allocate) — design/fabric.md §8.4.
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        hybridnetwork_cr_name: "{{ event_payload.regarding.name }}"
        hybridnetwork_cr_namespace: "{{ event_payload.regarding.namespace }}"
        hybridnetwork_fail_reason: ""

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read HybridNetwork CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridNetwork
        name: "{{ hybridnetwork_cr_name }}"
        namespace: "{{ hybridnetwork_cr_namespace }}"
      register: hybridnetwork_cr_lookup

    - name: Fail if HybridNetwork CR is missing
      ansible.builtin.fail:
        msg: "HybridNetwork {{ hybridnetwork_cr_name }} not found in {{ hybridnetwork_cr_namespace }}"
      when: hybridnetwork_cr_lookup.resources | default([]) | length == 0

    - name: Set spec/status/generation facts from live CR
      ansible.builtin.set_fact:
        hybridnetwork_spec: "{{ hybridnetwork_cr_lookup.resources[0].spec | default({}) }}"
        hybridnetwork_prior_status: "{{ hybridnetwork_cr_lookup.resources[0].status | default({}) }}"
        hybridnetwork_generation: "{{ hybridnetwork_cr_lookup.resources[0].metadata.generation | default(0) | int }}"

    # Resolve entity from namespace entity-* (design §8.4).
    - name: Resolve entity from namespace
      ansible.builtin.set_fact:
        hn_entity: "{{ hybridnetwork_cr_namespace | regex_replace('^entity-', '') }}"
        hn_network_id: "net-{{ hybridnetwork_cr_name }}"
        hn_alloc_key: "{{ hybridnetwork_cr_namespace }}/{{ hybridnetwork_cr_name }}"

    - name: List HybridFabric CRs in sovereign-cloud
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        namespace: sovereign-cloud
      register: hn_all_fabrics

    - name: Compute Ready fabrics
      ansible.builtin.set_fact:
        hn_ready_fabrics: "{{ hn_all_fabrics.resources | default([]) | selectattr('status.ready', 'defined') | selectattr('status.ready') | list }}"

    # Idempotent fast-path: reuse the fabric already recorded when it is
    # still Ready, so a stable HybridNetwork never re-runs fabric selection.
    - name: Prefer previously selected fabric when still Ready (idempotent)
      when:
        - (hybridnetwork_prior_status.fabric | default('')) | length > 0
        - hybridnetwork_prior_status.fabric in (hn_ready_fabrics | map(attribute='metadata.name') | list)
      ansible.builtin.set_fact:
        hn_selected_fabric_name: "{{ hybridnetwork_prior_status.fabric }}"

    - name: Reset entity-visible fabric name accumulator
      when: hn_selected_fabric_name is not defined
      ansible.builtin.set_fact:
        hn_visible_fabric_names: []

    - name: Compute entity-visible fabric names (entityRefs, else label fallback)
      ansible.builtin.set_fact:
        hn_visible_fabric_names: "{{ hn_visible_fabric_names + [item.metadata.name] }}"
      loop: "{{ hn_ready_fabrics }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when:
        - hn_selected_fabric_name is not defined
        - >-
          (hn_entity in (item.spec.entityRefs | default([]) | map(attribute='name') | list))
          or (
            (item.spec.entityRefs | default([]) | length == 0)
            and ((item.metadata.labels | default({})).get('hybridsovereign.redhat/entity', '') == hn_entity)
          )

    - name: Fail when spec.fabricRef is set but not entity-visible (design §19.6)
      when:
        - hn_selected_fabric_name is not defined
        - (hybridnetwork_spec.fabricRef | default('')) | length > 0
        - hybridnetwork_spec.fabricRef not in (hn_visible_fabric_names | default([]))
      block:
        - name: Set fabricRef failure reason
          ansible.builtin.set_fact:
            hybridnetwork_fail_reason: FabricRefNotVisible
        - name: Fail on invalid fabricRef
          ansible.builtin.fail:
            msg: >-
              HybridNetwork.spec.fabricRef='{{ hybridnetwork_spec.fabricRef }}' is not a Ready
              HybridFabric visible to Entity '{{ hn_entity }}' (entityRefs / label mismatch).

    - name: Honor HybridNetwork.spec.fabricRef when entity-visible (design §19.6)
      when:
        - hn_selected_fabric_name is not defined
        - (hybridnetwork_spec.fabricRef | default('')) | length > 0
        - hybridnetwork_spec.fabricRef in (hn_visible_fabric_names | default([]))
      ansible.builtin.set_fact:
        hn_selected_fabric_name: "{{ hybridnetwork_spec.fabricRef }}"

    - name: Set entity-visibility failure reason before failing
      ansible.builtin.set_fact:
        hybridnetwork_fail_reason: NoVisibleFabric
      when:
        - hn_selected_fabric_name is not defined
        - hn_visible_fabric_names | default([]) | length == 0

    - name: Fail when no Ready HybridFabric is visible to this Entity
      ansible.builtin.fail:
        msg: >-
          No Ready HybridFabric tagged for Entity '{{ hn_entity }}' — set
          HybridFabric.spec.entityRefs or label hybridsovereign.redhat/entity={{ hn_entity }}.
          When more than one fabric is visible, set HybridNetwork.spec.fabricRef.
      when:
        - hn_selected_fabric_name is not defined
        - hn_visible_fabric_names | default([]) | length == 0

    - name: Require fabricRef when Entity has more than one visible fabric
      when:
        - hn_selected_fabric_name is not defined
        - (hn_visible_fabric_names | default([]) | length) > 1
        - (hybridnetwork_spec.fabricRef | default('')) | length == 0
      block:
        - name: Set ambiguous-fabric failure reason
          ansible.builtin.set_fact:
            hybridnetwork_fail_reason: FabricRefRequired
        - name: Fail when fabricRef omitted with multiple fabrics
          ansible.builtin.fail:
            msg: >-
              Entity '{{ hn_entity }}' is tagged on multiple Ready HybridFabrics
              ({{ hn_visible_fabric_names | join(', ') }}); set HybridNetwork.spec.fabricRef.

    - name: Select first entity-visible fabric
      when: hn_selected_fabric_name is not defined
      ansible.builtin.set_fact:
        hn_selected_fabric_name: "{{ hn_visible_fabric_names | first }}"

    - name: Load selected HybridFabric detail
      ansible.builtin.set_fact:
        hn_fabric: "{{ hn_ready_fabrics | selectattr('metadata.name', 'equalto', hn_selected_fabric_name) | list | first }}"

    - name: Set domainAsn fact
      ansible.builtin.set_fact:
        hn_domain_asn: "{{ hn_fabric.spec.domainAsn | default(0) | int }}"

    # Atomic, idempotent, conflict-retried VNI allocation from the fabric
    # numbering ledger ConfigMap.
    - name: Allocate VNI from fabric numbering ledger
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_numbering_allocate.yml"
      vars:
        fn_fabric_name: "{{ hn_selected_fabric_name }}"
        fn_fabric_namespace: sovereign-cloud
        fn_alloc_key: "{{ hn_alloc_key }}"
        # Keep the VNI this network already uses (e.g. after moving to platform-fabric).
        fn_preferred_vni: "{{ hybridnetwork_prior_status.vni | default(0) }}"

    - name: Derive VRF + canonical RT (design §8.4)
      ansible.builtin.set_fact:
        hn_vrf_name: "vrf-{{ hybridnetwork_cr_name }}"
        hn_canonical_rt: "{{ hn_domain_asn }}:{{ fn_vni }}"

    # Shared BGW reflects only ledger RTs (design §8.5.4): re-render its config so
    # the new RT is allowed. Pushed into the running BGW (bgw_config_push.yml); the
    # VMI restarts only when the in-place push is unavailable (bgw_inplace_fallback).
    - name: Refresh the border gateway RT allow-list for a newly allocated VNI
      when:
        - not (fn_reused | default(false) | bool)
        - ((hn_fabric.spec.borderGateway | default({})).loopback | default('')) | length > 0
      block:
        - name: Re-render BGW config
          ansible.builtin.include_role:
            name: hybridfabric_provision
            tasks_from: bgw_config.yml
          vars:
            bgw_fabric_cr: "{{ hn_fabric }}"
      rescue:
        - name: Record BGW refresh failure (the next HybridFabric reconcile retries)
          ansible.builtin.set_fact:
            hn_bgw_refresh_warning: >-
              BGW RT allow-list not refreshed: {{ ansible_failed_result.msg | default('error') }}

    # Recompute placement counts from live NetworkPlacement CRs referencing
    # this HybridNetwork (owned here so HybridNetwork stays authoritative).
    - name: List NetworkPlacements referencing this HybridNetwork
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        namespace: "{{ hybridnetwork_cr_namespace }}"
      register: hn_all_placements

    - name: Compute placement counts
      ansible.builtin.set_fact:
        hn_placements_for_network: >-
          {{
            hn_all_placements.resources
            | default([])
            | selectattr('spec.network', 'defined')
            | selectattr('spec.network', 'equalto', hybridnetwork_cr_name)
            | rejectattr('spec.state', 'equalto', 'absent')
            | list
          }}

    - name: Set placement count facts
      ansible.builtin.set_fact:
        hn_placement_count: "{{ hn_placements_for_network | length }}"
        hn_placements_ready: "{{ hn_placements_for_network | selectattr('status.ready', 'defined') | selectattr('status.ready') | list | length }}"

    - name: Get timestamp
      ansible.builtin.set_fact:
        hybridnetwork_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark HybridNetwork ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: hybridnetworks
        cr_name: "{{ hybridnetwork_cr_name }}"
        cr_namespace: "{{ hybridnetwork_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: true
          message: >-
            VNI {{ fn_vni }} {{ 'reused' if (fn_reused | default(false)) else 'allocated' }}
            from fabric-numbering-{{ hn_selected_fabric_name }} (fabric {{ hn_selected_fabric_name }}).
            {{ hn_bgw_refresh_warning | default('') }}
          lastReconciledAt: "{{ hybridnetwork_status_transition_time }}"
          observedGeneration: "{{ hybridnetwork_generation }}"
          entity: "{{ hn_entity }}"
          networkId: "{{ hn_network_id }}"
          vni: "{{ fn_vni | int }}"
          domainAsn: "{{ hn_domain_asn | int }}"
          vrfName: "{{ hn_vrf_name }}"
          canonicalRt: "{{ hn_canonical_rt }}"
          fabric: "{{ hn_selected_fabric_name }}"
          placementCount: "{{ hn_placement_count | int }}"
          placementsReady: "{{ hn_placements_ready | int }}"
          allocated: true
          fabricVniReady: true
          conditions:
            - type: Ready
              status: "True"
              lastTransitionTime: "{{ hybridnetwork_status_transition_time }}"
              reason: EDASucceeded
              message: "HybridNetwork allocated VNI {{ fn_vni }} on fabric {{ hn_selected_fabric_name }}"

  rescue:
    - name: Mark HybridNetwork failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: hybridnetworks
        cr_name: "{{ hybridnetwork_cr_name }}"
        cr_namespace: "{{ hybridnetwork_cr_namespace }}"
        cr_status_body:
          status: failed
          ready: false
          allocated: false
          message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: "{{ hybridnetwork_fail_reason if (hybridnetwork_fail_reason | default('') | length > 0) else 'EDAFailed' }}"
              message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "HybridNetwork {{ hybridnetwork_cr_name | default('unknown') }} provision failed"
