---
platformopenshift_operator_namespace: sovereign-cloud
central_api_server: ""
central_sa_secret_name: awshelper-creator-sa
oso_central_sa_secret_name: osohelper-creator-sa
central_sa_secret_namespace: sovereign-cloud
eda_central_work_namespace: sovereign-cloud-jobs
keycloak_internal_url: "{{ lookup('env', 'KEYCLOAK_INTERNAL_URL') | default('http://keycloak.keycloak.svc:8080', true) }}"
keycloak_external_url: "{{ lookup('env', 'KEYCLOAK_EXTERNAL_URL') }}"
keycloak_realm: "{{ lookup('env', 'KEYCLOAK_REALM') | default('sso', true) }}"
keycloak_admin_secret_name: "rhbk-admin-credentials"

default_pull_secret_vault_path: "aws/ocp-pull-secret"
default_ssh_key_vault_path: "aws/ocp-ssh-key"
default_ocp_image_set: "img4.21.9-x86-64-appsub"
default_control_plane_count: 3
default_worker_count: 3
default_control_plane_flavor: "b1.xlarge"
default_worker_flavor: "b1.large"
default_glance_image_override: "rhcos-9.6.20250826"
default_external_network: "internet"
default_project_domain: "shc_domain"

vault_init_secret_name: "vault-init"
vault_init_secret_namespace: "vault"
vault_init_addr: "{{ lookup('env', 'VAULT_ADDR') | default('http://vault.vault.svc:8200', true) }}"
vault_kv_mount: hybridsovereign

oci_registry_host: "{{ (lookup('env', 'OCI_HOST') | trim) or 'quay.io/gauravshankar' }}"
mce_cluster_build_chart_version: "0.2.3"

eda_dashboard_host: ""

# Default pod/service ranges for hosted clusters without explicit
# spec.networking (design/fabric.md §16, CG-NAT assumption). The CloudVirt's
# CloudInfrastructure (spec.openshift.hostedClusterCidrDefaults) overrides per
# environment; deprecated: CloudVirt spec.hostedClusterCidrDefaults.
po_default_cluster_network_pool: {cidr: 100.64.0.0/11, blockPrefixLength: 14}
po_default_service_network_pool: {cidr: 100.96.0.0/11, blockPrefixLength: 16}
# Reject pod/service CIDRs that overlap another PlatformOpenshift's.
po_deny_peer_cidr_overlap: true
