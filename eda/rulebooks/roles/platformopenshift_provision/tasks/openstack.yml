---
# PlatformOpenshift type:openstack handler
# Workshop path: bind to ready CloudOSO and mark ready (full OSP cluster build
# deferred — needs sovereign-cloud-jobs prep + OpenStack installer EE).

- name: Set OpenStack spec facts
  ansible.builtin.set_fact:
    oso_env_name: "{{ platform_spec['openstack']['environment'] | default('') }}"

- name: Fail when CloudOSO environment ref missing
  ansible.builtin.assert:
    that:
      - oso_env_name | length > 0
    fail_msg: >-
      PlatformOpenshift {{ platformopenshift_cr_name }} type=openstack
      needs spec.openstack.environment

- name: Read CloudOSO CR
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudOSO
    name: "{{ oso_env_name }}"
    namespace: "{{ platformopenshift_cr_namespace }}"
  register: cloudoso_cr

- name: Fail if CloudOSO missing
  ansible.builtin.assert:
    that:
      - cloudoso_cr.resources | length > 0
    fail_msg: CloudOSO '{{ oso_env_name }}' not found in {{ platformopenshift_cr_namespace }}

- name: Fail if CloudOSO not ready
  ansible.builtin.assert:
    that:
      - cloudoso_cr.resources[0].status.ready | default(false) | bool
    fail_msg: >-
      CloudOSO '{{ oso_env_name }}' is not ready yet. Wait for environment preparation.

- name: Get current timestamp and CloudOSO status fields
  ansible.builtin.set_fact:
    event_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
    transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    oso_slug: "{{ cloudoso_cr.resources[0].status.slug | default(oso_env_name[:5]) }}"
    oso_domain: "{{ cloudoso_cr.resources[0].status.domain | default('') }}"

- name: Update PlatformOpenshift status as ready (openstack workshop stub)
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ platformopenshift_cr_name }}"
    cr_namespace: "{{ platformopenshift_cr_namespace }}"
    cr_status_body:
      status: ready
      ready: true
      phase: provisioned
      observedGeneration: "{{ platformopenshift_generation }}"
      lastReconciledAt: "{{ event_time }}"
      name: "{{ platformopenshift_cr_name }}"
      namespace: "{{ platformopenshift_cr_namespace }}"
      entity: "{{ resolved_entity }}"
      billingId: "{{ resolved_billing_id }}"
      description: "{{ resolved_description }}"
      platformType: openstack
      slug: "{{ oso_slug }}"
      domain: "{{ oso_domain }}"
      clusterInstalled: false
      message: >-
        PlatformOpenshift type=openstack bound to CloudOSO {{ oso_env_name }}
        (OSP install deferred — workshop stub)
      conditions:
        - type: Available
          status: "True"
          lastTransitionTime: "{{ transition_time }}"
          reason: EDASucceeded
          message: Bound to ready CloudOSO {{ oso_env_name }}
