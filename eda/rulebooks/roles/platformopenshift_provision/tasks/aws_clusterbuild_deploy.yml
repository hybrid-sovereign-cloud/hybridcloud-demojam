---
- name: Render install-config YAML
  ansible.builtin.set_fact:
    cb_install_config: "{{ lookup('template', 'install-config.yaml.j2') }}"
  no_log: true

- name: Set Vault root token from job credential
  ansible.builtin.set_fact:
    vault_root_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
  no_log: true

- name: Write install-config to Vault
  ansible.builtin.uri:
    url: "{{ vault_init_addr }}/v1/hybridsovereign/data/{{ cb_install_config_vault }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      data:
        install-config.yaml: "{{ cb_install_config }}"
    status_code: [200, 204]
    validate_certs: false
  no_log: true

- name: Render build-values YAML to tempfile
  ansible.builtin.copy:
    content: "{{ lookup('template', 'build-values.yaml.j2') }}"
    dest: "/tmp/{{ cb_app_name }}-build-values.yaml"
    mode: '0600'
  changed_when: false

- name: Write central cluster kubeconfig for Helm
  ansible.builtin.include_tasks: write_central_helm_kubeconfig.yml

- name: Check existing Helm release
  ansible.builtin.command:
    argv:
      - helm
      - status
      - "{{ cb_app_name }}"
      - --namespace
      - "{{ cb_cluster_name }}"
      - --output
      - json
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
  register: helm_release_status
  failed_when: false
  changed_when: false

- name: Set helm release exists flag
  ansible.builtin.set_fact:
    cb_helm_release_exists: "{{ helm_release_status.rc == 0 }}"

- name: Set helm release failed flag
  ansible.builtin.set_fact:
    cb_helm_release_failed: >-
      {{ cb_helm_release_exists | bool and
         (helm_release_status.stdout | from_json).info.status | default('') == 'failed' }}
  when: cb_helm_release_exists | bool

- name: Set helm release failed flag (when release does not exist)
  ansible.builtin.set_fact:
    cb_helm_release_failed: false
  when: not (cb_helm_release_exists | bool)

- name: Get current Helm values for idempotency check
  ansible.builtin.command:
    argv:
      - helm
      - get
      - values
      - "{{ cb_app_name }}"
      - --namespace
      - "{{ cb_cluster_name }}"
      - --output
      - yaml
      - --kubeconfig
      - "/tmp/{{ cb_app_name }}-kubeconfig"
  register: helm_current_values
  failed_when: false
  changed_when: false
  when: cb_helm_release_exists | bool

- name: Determine if Helm upgrade is needed
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, yaml
        new = yaml.safe_load(open('/tmp/{{ cb_app_name }}-build-values.yaml').read()) or {}
        cur_raw = """{{ helm_current_values.stdout | default('null') }}"""
        cur = yaml.safe_load(cur_raw) or {}
        print("true" if new != cur else "false")
  register: values_diff_result
  changed_when: false
  when: cb_helm_release_exists | bool

- name: Set values changed flag
  ansible.builtin.set_fact:
    cb_values_changed: >-
      {{ not (cb_helm_release_exists | bool) or
         (cb_helm_release_failed | bool) or
         (values_diff_result.stdout | default('true') | trim == 'true') }}

- name: Deploy mce-cluster-build chart via in-cluster Helm Job
  when: cb_values_changed | bool
  block:
    - name: Ensure work namespace for Helm Job
      kubernetes.core.k8s:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: sovereign-cloud-jobs

    - name: Create Helm values ConfigMap
      kubernetes.core.k8s:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "helm-values-{{ cb_app_name }}"
            namespace: sovereign-cloud-jobs
          data:
            values.yaml: "{{ lookup('file', '/tmp/' + cb_app_name + '-build-values.yaml') }}"

    - name: Create kubeconfig Secret for Helm Job
      kubernetes.core.k8s:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "helm-kubeconfig-{{ cb_app_name }}"
            namespace: sovereign-cloud-jobs
          type: Opaque
          stringData:
            kubeconfig: "{{ lookup('file', '/tmp/' + cb_app_name + '-kubeconfig') }}"

    # The in-cluster Helm Job below mounts the chart from the
    # mce-cluster-build-chart ConfigMap, but nothing in the platform ever
    # created it: no gitops manifest, no Job, no earlier task. Every AWS build
    # therefore died here on "Require pre-staged mce-cluster-build chart
    # ConfigMap" with resources: []. Only the aws path was migrated to the
    # ConfigMap-mounted Helm Job; openstack_clusterbuild.yml still helm-pulls
    # the same chart straight from OCI, which is what proves the execution
    # environment can reach the registry. So stage it here from that same OCI
    # coordinate rather than depending on an out-of-band step.
    # Staged on every deploy rather than only when absent: the ConfigMap name
    # the Helm Job mounts is fixed, so a stage-if-missing would pin whatever
    # chart version happened to be staged first and silently ignore
    # mce_cluster_build_chart_version from then on.
    - name: Stage the mce-cluster-build chart ConfigMap from OCI
      block:
        - name: Create a scratch directory for the chart pull
          ansible.builtin.tempfile:
            state: directory
            suffix: mce-chart
          register: cb_chart_tmp

        # Same bootstrap as openstack_clusterbuild.yml: the execution
        # environment historically ships without helm, and helm_bin is only
        # set on the openstack path, so it cannot be relied on here.
        - name: Ensure helm CLI is available
          ansible.builtin.shell: |
            set -euo pipefail
            if command -v helm >/dev/null 2>&1; then
              command -v helm
              exit 0
            fi
            curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
            tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
            mv /tmp/linux-amd64/helm /tmp/helm
            chmod 755 /tmp/helm
            echo /tmp/helm
          args:
            executable: /bin/bash
          register: cb_helm_bin_path
          changed_when: false

        - name: Pull the mce-cluster-build chart from OCI
          ansible.builtin.command:
            argv:
              - "{{ cb_helm_bin_path.stdout | trim }}"
              - pull
              - "oci://{{ oci_registry_host }}/mce-cluster-build"
              - --version
              - "{{ mce_cluster_build_chart_version }}"
              - --destination
              - "{{ cb_chart_tmp.path }}"
          changed_when: true

        - name: Read the pulled chart tarball
          ansible.builtin.slurp:
            src: "{{ cb_chart_tmp.path }}/mce-cluster-build-{{ mce_cluster_build_chart_version }}.tgz"
          register: cb_chart_tgz

        - name: Create the mce-cluster-build chart ConfigMap
          kubernetes.core.k8s:
            host: "{{ central_api_host }}"
            api_key: "{{ central_bearer_token }}"
            validate_certs: false
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: mce-cluster-build-chart
                namespace: sovereign-cloud-jobs
              binaryData:
                # slurp already returns standard base64, which is exactly what
                # binaryData wants. The Helm Job mounts this as /chart/chart.tgz.
                chart.tgz: "{{ cb_chart_tgz.content }}"

      always:
        - name: Remove the chart scratch directory
          ansible.builtin.file:
            path: "{{ cb_chart_tmp.path }}"
            state: absent
          when: cb_chart_tmp.path is defined

    - name: Require the mce-cluster-build chart ConfigMap
      kubernetes.core.k8s_info:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: ConfigMap
        name: mce-cluster-build-chart
        namespace: sovereign-cloud-jobs
      register: staged_chart
      failed_when: staged_chart.resources | length == 0

    - name: Delete previous Helm Job if present
      kubernetes.core.k8s:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        state: absent
        api_version: batch/v1
        kind: Job
        name: "helm-{{ cb_app_name }}"
        namespace: sovereign-cloud-jobs
        delete_options:
          propagationPolicy: Background

    - name: Run Helm upgrade Job (local chart ConfigMap)
      kubernetes.core.k8s:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: "helm-{{ cb_app_name }}"
            namespace: sovereign-cloud-jobs
          spec:
            ttlSecondsAfterFinished: 86400
            backoffLimit: 1
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: helm
                    image: alpine/helm:3.14.4
                    env:
                      - name: HELM_CACHE_HOME
                        value: /tmp/helm-cache
                      - name: HELM_CONFIG_HOME
                        value: /tmp/helm-config
                      - name: HELM_DATA_HOME
                        value: /tmp/helm-data
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eux
                        mkdir -p /tmp/helm-cache /tmp/helm-config /tmp/helm-data
                        cp /chart/chart.tgz /tmp/chart.tgz
                        helm upgrade "{{ cb_app_name }}" /tmp/chart.tgz \
                          --install \
                          --namespace "{{ cb_cluster_name }}" \
                          --create-namespace \
                          --values /values/values.yaml \
                          --history-max 2 \
                          --wait \
                          --timeout 45m \
                          --kubeconfig /kube/kubeconfig
                    volumeMounts:
                      - name: values
                        mountPath: /values
                      - name: kube
                        mountPath: /kube
                        readOnly: true
                      - name: chart
                        mountPath: /chart
                        readOnly: true
                volumes:
                  - name: values
                    configMap:
                      name: "helm-values-{{ cb_app_name }}"
                  - name: kube
                    secret:
                      secretName: "helm-kubeconfig-{{ cb_app_name }}"
                  - name: chart
                    configMap:
                      name: mce-cluster-build-chart

    - name: Wait for Helm Job to complete
      kubernetes.core.k8s_info:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        api_version: batch/v1
        kind: Job
        name: "helm-{{ cb_app_name }}"
        namespace: sovereign-cloud-jobs
      register: helm_job
      until: >-
        (helm_job.resources | length > 0) and (
          (helm_job.resources[0].status.succeeded | default(0) | int) > 0 or
          (helm_job.resources[0].status.failed | default(0) | int) > 0
        )
      retries: 90
      delay: 30

    - name: Fail if Helm Job failed
      ansible.builtin.fail:
        msg: Helm Job helm-{{ cb_app_name }} failed
      when: (helm_job.resources[0].status.failed | default(0) | int) > 0

- name: Clean up temp values file
  ansible.builtin.file:
    path: "/tmp/{{ cb_app_name }}-build-values.yaml"
    state: absent
  changed_when: false
