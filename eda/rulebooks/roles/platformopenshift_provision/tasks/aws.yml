---
# PlatformOpenshift type:aws handler
# Workshop path: bind to ready CloudAWS and mark ready (full MCE/Hive cluster
# build deferred — seeded AWS tokens are invalid for STS/Route53).

- name: Set AWS spec facts
  ansible.builtin.set_fact:
    aws_env_name: "{{ platform_spec['aws']['environment'] | default('') }}"
    aws_region: "{{ platform_spec.aws.region | default('us-east-1') }}"

- name: Fail when CloudAWS environment ref missing
  ansible.builtin.assert:
    that:
      - aws_env_name | length > 0
    fail_msg: >-
      PlatformOpenshift {{ platformopenshift_cr_name }} type=aws
      needs spec.aws.environment

- name: Read CloudAWS CR
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudAWS
    name: "{{ aws_env_name }}"
    namespace: "{{ platformopenshift_cr_namespace }}"
  register: cloudaws_cr

- name: Fail if CloudAWS missing
  ansible.builtin.assert:
    that:
      - cloudaws_cr.resources | length > 0
    fail_msg: CloudAWS '{{ aws_env_name }}' not found in {{ platformopenshift_cr_namespace }}

- name: Fail if CloudAWS not ready
  ansible.builtin.assert:
    that:
      - cloudaws_cr.resources[0].status.ready | default(false) | bool
    fail_msg: >-
      CloudAWS '{{ aws_env_name }}' is not ready yet. Wait for environment preparation.

- name: Get current timestamp and CloudAWS status fields
  ansible.builtin.set_fact:
    event_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
    transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    aws_slug: "{{ cloudaws_cr.resources[0].status.slug | default(aws_env_name[:5]) }}"
    aws_domain: "{{ cloudaws_cr.resources[0].status.domain | default('') }}"

- name: Update PlatformOpenshift status as ready (aws workshop stub)
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ platformopenshift_cr_name }}"
    cr_namespace: "{{ platformopenshift_cr_namespace }}"
    cr_status_body:
      status: ready
      ready: true
      phase: provisioned
      observedGeneration: "{{ platformopenshift_generation }}"
      lastReconciledAt: "{{ event_time }}"
      name: "{{ platformopenshift_cr_name }}"
      namespace: "{{ platformopenshift_cr_namespace }}"
      entity: "{{ resolved_entity }}"
      billingId: "{{ resolved_billing_id }}"
      description: "{{ resolved_description }}"
      platformType: aws
      slug: "{{ aws_slug }}"
      domain: "{{ aws_domain }}"
      awsRegion: "{{ aws_region }}"
      clusterInstalled: false
      message: >-
        PlatformOpenshift type=aws bound to CloudAWS {{ aws_env_name }}
        (MCE/Hive install deferred — workshop stub)
      conditions:
        - type: Available
          status: "True"
          lastTransitionTime: "{{ transition_time }}"
          reason: EDASucceeded
          message: Bound to ready CloudAWS {{ aws_env_name }}
