---
# Virt / Hosted PlatformOpenshift — require CloudVirt ready, then mark platform ready
# (full CNV/Hypershift install deferred until custom EE with installers is wired).
- name: Resolve CloudVirt environment name
  ansible.builtin.set_fact:
    virt_env_name: >-
      {{
        platform_spec.virt.environment
        | default(platform_spec.hosted.environment
        | default(platform_spec.cloudRef
        | default('')))
      }}

- name: Fail when CloudVirt environment ref missing
  ansible.builtin.assert:
    that:
      - virt_env_name | length > 0
    fail_msg: >-
      PlatformOpenshift {{ platformopenshift_cr_name }} type={{ platform_type }}
      needs spec.virt.environment, spec.hosted.environment, or spec.cloudRef

- name: Read CloudVirt CR
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudVirt
    name: "{{ virt_env_name }}"
    namespace: "{{ platformopenshift_cr_namespace }}"
  register: virt_cloud_cr

- name: Fail if CloudVirt missing
  ansible.builtin.assert:
    that:
      - virt_cloud_cr.resources | length > 0
    fail_msg: CloudVirt '{{ virt_env_name }}' not found in {{ platformopenshift_cr_namespace }}

- name: Fail if CloudVirt not ready
  ansible.builtin.assert:
    that:
      - virt_cloud_cr.resources[0].status.ready | default(false) | bool
    fail_msg: >-
      CloudVirt '{{ virt_env_name }}' is not ready yet. Wait for environment preparation.

- name: Get current timestamp
  ansible.builtin.set_fact:
    event_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
    transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    virt_slug: "{{ virt_cloud_cr.resources[0].status.slug | default(virt_env_name[:5]) }}"
    virt_domain: "{{ virt_cloud_cr.resources[0].status.domain | default(virt_cloud_cr.resources[0].spec.baseDomain | default('')) }}"

- name: Update PlatformOpenshift status as ready (virt/hosted stub)
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ platformopenshift_cr_name }}"
    cr_namespace: "{{ platformopenshift_cr_namespace }}"
    cr_status_body:
      status: ready
      ready: true
      phase: provisioned
      observedGeneration: "{{ platformopenshift_generation }}"
      lastReconciledAt: "{{ event_time }}"
      name: "{{ platformopenshift_cr_name }}"
      namespace: "{{ platformopenshift_cr_namespace }}"
      entity: "{{ resolved_entity }}"
      billingId: "{{ resolved_billing_id }}"
      description: "{{ resolved_description }}"
      platformType: "{{ platform_type }}"
      slug: "{{ virt_slug }}"
      domain: "{{ virt_domain }}"
      message: >-
        PlatformOpenshift type={{ platform_type }} bound to CloudVirt {{ virt_env_name }}
        (CNV/Hypershift install deferred)
      conditions:
        - type: Available
          status: "True"
          lastTransitionTime: "{{ transition_time }}"
          reason: EDASucceeded
          message: Bound to ready CloudVirt {{ virt_env_name }}
