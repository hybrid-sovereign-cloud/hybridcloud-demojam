---
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        cloudgateway_cr_name: "{{ event_payload.regarding.name }}"
        cloudgateway_cr_namespace: "{{ event_payload.regarding.namespace }}"

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read CloudGateway CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        name: "{{ cloudgateway_cr_name }}"
        namespace: "{{ cloudgateway_cr_namespace }}"
      register: cgwt_lookup

    - name: Set CloudGateway spec fact
      ansible.builtin.set_fact:
        cgwt_spec: "{{ (cgwt_lookup.resources | default([]) + [{}])[0].spec | default({}) }}"

    - name: Resolve the site (cloudRef, else deprecated fields)
      when: (cgwt_lookup.resources | default([])) | length > 0
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloudgateway_site.yml"
      vars:
        rcs_gateway: "{{ cgwt_lookup.resources[0] }}"

    - name: Remove RHOSO site gateway (openstack site, transport wireguard)
      when:
        - (cgwt_lookup.resources | default([])) | length > 0
        - rcs_cloud_type | default('') == 'openstack'
        - rcs_transport | default('none') == 'wireguard'
        - rcs_site_name | default('') | length > 0
      ansible.builtin.include_tasks: remove_site_gateway.yml

    - name: Remove hub CNV EVPN landing (openshift site, cloudRef)
      when:
        - (cgwt_lookup.resources | default([])) | length > 0
        - rcs_cloud_type | default('') == 'openshift'
        - not (rcs_legacy | default(true) | bool)
        - (cgwt_spec.fabricRef | default('')) | length > 0
      ansible.builtin.include_tasks: remove_hub_evpn.yml

    - name: Release the gateway's allocated WireGuard address
      when: (cgwt_spec.fabricRef | default('')) | length > 0
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_wg_address_release.yml"
      vars:
        fwr_fabric_name: "{{ cgwt_spec.fabricRef }}"
        fwr_fabric_namespace: sovereign-cloud
        fwr_gateway_name: "{{ cloudgateway_cr_name }}"

    - name: Mark deletion complete
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudgateways
        cr_name: "{{ cloudgateway_cr_name }}"
        cr_namespace: "{{ cloudgateway_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: true
          deletionComplete: true
          message: >-
            CloudGateway teardown complete (site gateway removed for an openstack site with transport
            wireguard; EDPM left as-is; WireGuard address released){{ ('; ' ~ cgwt_hub_message) if (cgwt_hub_message | default('') | length > 0) else '' }}.
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

  rescue:
    - name: Mark teardown failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudgateways
        cr_name: "{{ cloudgateway_cr_name }}"
        cr_namespace: "{{ cloudgateway_cr_namespace }}"
        cr_status_body:
          status: failed
          ready: false
          message: "{{ ansible_failed_result.msg | default('EDA teardown failed') }}"
      ignore_errors: true
      when: services_api_host is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudGateway teardown failed"
