---
# tunnelType=wireguard (design/fabric.md §21.4, §8):
#   BGW side    : this gateway becomes a [Peer] on the border gateway — rendered by
#                 hybridfabric_provision/tasks/bgw_config.yml from Vault
#                 (gateway wgPublicKey via CloudGateway.spec.transport.vaultPeerConfigRef).
#                 Peer set changes are pushed into the running BGW (bgw_config_push.yml).
#   Gateway side: rendered by cloudgateway_provision (cloud-init of fabric-gw-<oso>,
#                 BGW wgPublicKey via HybridFabric.spec.borderGateway.vaultCredentialRef).
#   Handshake   : best effort. Without guest access the API only shows whether wg0 is
#                 up in each guest (VMI status.interfaces from the guest agent); the
#                 authoritative check is the EDPM FRR session to the BGW loopback
#                 (NetworkPlacement validate).
# Sets: tl_tunnel_up, tl_ready, tl_border_endpoint, tl_cloud_endpoint, tl_message

- name: Set wrong-cloud failure reason before validating
  when: (rcs_cloud_type | default('')) != 'openstack'
  ansible.builtin.set_fact:
    transportlink_fail_reason: TunnelTypeUnsupported

- name: Wireguard links terminate on a RHOSO site gateway VM
  ansible.builtin.assert:
    that:
      - (rcs_cloud_type | default('')) == 'openstack'
      - ((tl_fabric.spec.borderGateway | default({})).loopback | default('')) | length > 0
    fail_msg: >-
      TransportLink {{ transportlink_cr_name }} tunnelType=wireguard needs a CloudGateway on an
      openstack site (cloudRef to a CloudInfrastructure type openstack) and a HybridFabric with
      spec.borderGateway (other sites use transport none).

- name: Render the BGW peer set (pushed in place; VMI restart only as fallback)
  ansible.builtin.include_role:
    name: hybridfabric_provision
    tasks_from: bgw_config.yml
  vars:
    bgw_fabric_cr: "{{ tl_fabric }}"

- name: Set peer-missing failure reason before failing
  when: tl_gateway.metadata.name not in (bgw_peers | map(attribute='name') | list)
  ansible.builtin.set_fact:
    transportlink_fail_reason: TunnelConfigUnavailable

- name: Require this gateway on the BGW peer list
  ansible.builtin.fail:
    msg: >-
      CloudGateway {{ tl_gateway.metadata.name }} is not a WireGuard peer on
      {{ bgw_name }}: {{ bgw_peer_errors | join('; ') | default('unknown', true) }}
  when: tl_gateway.metadata.name not in (bgw_peers | map(attribute='name') | list)

- name: Wait for the BGW guest agent (after a restart) and read its interfaces
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    name: "{{ bgw_name }}"
    namespace: "{{ bgw_namespace }}"
  register: tl_bgw_vmi
  until: >-
    ((tl_bgw_vmi.resources | default([]) + [{}])[0].status.conditions | default([])
     | selectattr('type', 'equalto', 'AgentConnected') | selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: "{{ tl_bgw_wait_retries | int if (bgw_vmi_restarted | default(false) | bool) else 1 }}"
  delay: "{{ tl_bgw_wait_delay | int }}"
  failed_when: false

- name: Read the site gateway VMI on the RHOSO management cluster (best effort)
  block:
    - name: Resolve management cluster kubeconfig ref (CloudInfrastructure, else deprecated fields)
      ansible.builtin.set_fact:
        tl_mgmt_ref: "{{ rcs_mgmt_kubeconfig_ref | default('', true) }}"

    - name: Write management cluster kubeconfig
      when: tl_mgmt_ref | length > 0
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/cloudinfra_mgmt_kubeconfig.yml"
      vars:
        ci_kubeconfig_ref: "{{ tl_mgmt_ref }}"
        ci_kubeconfig_dest: "/tmp/tl-{{ transportlink_cr_name }}-mgmt-kubeconfig"

    - name: Read site gateway VMI
      when:
        - tl_mgmt_ref | length > 0
        - ci_kubeconfig_ok | default(false) | bool
      kubernetes.core.k8s_info:
        kubeconfig: "/tmp/tl-{{ transportlink_cr_name }}-mgmt-kubeconfig"
        validate_certs: false
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "fabric-gw-{{ rcs_site_name }}"
        namespace: "{{ tl_oso_namespace }}"
      register: tl_gw_vmi
  rescue:
    - name: Site gateway VMI not observable
      ansible.builtin.set_fact:
        tl_gw_vmi: {resources: []}
  always:
    - name: Remove management cluster kubeconfig
      ansible.builtin.file:
        path: "/tmp/tl-{{ transportlink_cr_name }}-mgmt-kubeconfig"
        state: absent

- name: Evaluate wg0 presence on both ends (guest agent interface report)
  ansible.builtin.set_fact:
    tl_bgw_wg0: >-
      {{
        ((tl_bgw_vmi.resources | default([]) + [{}])[0].status.interfaces | default([])
         | selectattr('interfaceName', 'defined') | selectattr('interfaceName', 'equalto', 'wg0') | list | length) > 0
      }}
    tl_gw_wg0: >-
      {{
        ((tl_gw_vmi.resources | default([]) + [{}])[0].status.interfaces | default([])
         | selectattr('interfaceName', 'defined') | selectattr('interfaceName', 'equalto', 'wg0') | list | length) > 0
      }}

- name: Set restart note
  ansible.builtin.set_fact:
    tl_restart_note: "{{ (', BGW ' ~ bgw_apply_note) if (bgw_apply_note | default('') | length > 0) else '' }}"

- name: Set WireGuard Ready facts
  ansible.builtin.set_fact:
    tl_tunnel_up: "{{ (tl_bgw_wg0 | bool) and (tl_gw_wg0 | bool) }}"
    tl_ready: true
    tl_border_endpoint: "{{ bgw_endpoint }}"
    tl_cloud_endpoint: "{{ (tl_gateway.spec.wireguard | default({})).address | default((bgw_wg_gateway_addresses | default({})).get(tl_gateway.metadata.name, ''), true) }}"
    tl_message: >-
      tunnelType=wireguard: {{ tl_gateway.metadata.name }} is peer
      {{ (bgw_peers | selectattr('name', 'equalto', tl_gateway.metadata.name) | first).wgIp }}
      on {{ bgw_namespace }}/{{ bgw_name }} (wss {{ bgw_endpoint }}, {{ bgw_peers | length }} peer(s){{ tl_restart_note }});
      wg0 up: bgw={{ tl_bgw_wg0 }} gateway={{ tl_gw_wg0 }} (handshake itself is confirmed by
      the EDPM BGP session to {{ bgw_loopback }}).
