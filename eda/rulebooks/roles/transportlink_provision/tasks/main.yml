---
# TransportLink provision — design/fabric.md §8.3.
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        transportlink_cr_name: "{{ event_payload.regarding.name }}"
        transportlink_cr_namespace: "{{ event_payload.regarding.namespace }}"
        transportlink_fail_reason: ""

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read TransportLink CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: TransportLink
        name: "{{ transportlink_cr_name }}"
        namespace: "{{ transportlink_cr_namespace }}"
      register: transportlink_cr_lookup

    - name: Fail if TransportLink CR is missing
      ansible.builtin.fail:
        msg: "TransportLink {{ transportlink_cr_name }} not found in {{ transportlink_cr_namespace }}"
      when: transportlink_cr_lookup.resources | default([]) | length == 0

    - name: Set spec/generation facts from live CR
      ansible.builtin.set_fact:
        transportlink_spec: "{{ transportlink_cr_lookup.resources[0].spec | default({}) }}"
        transportlink_generation: "{{ transportlink_cr_lookup.resources[0].metadata.generation | default(0) | int }}"

    - name: Set required-refs failure reason before validating
      ansible.builtin.set_fact:
        transportlink_fail_reason: RefsMissing
      when:
        - ((transportlink_spec.fabricRef | default('')) | length == 0)
          or ((transportlink_spec.cloudGatewayRef | default('')) | length == 0)

    - name: Require spec.fabricRef and spec.cloudGatewayRef
      ansible.builtin.fail:
        msg: "TransportLink {{ transportlink_cr_name }} requires spec.fabricRef and spec.cloudGatewayRef"
      when:
        - ((transportlink_spec.fabricRef | default('')) | length == 0)
          or ((transportlink_spec.cloudGatewayRef | default('')) | length == 0)

    - name: Read referenced HybridFabric
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ transportlink_spec.fabricRef }}"
        namespace: sovereign-cloud
      register: tl_fabric_lookup

    - name: Read referenced CloudGateway
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudGateway
        name: "{{ transportlink_spec.cloudGatewayRef }}"
        namespace: sovereign-cloud
      register: tl_gateway_lookup

    - name: Set fabric/gateway-not-found failure reason before failing
      ansible.builtin.set_fact:
        transportlink_fail_reason: RefsNotFound
      when:
        - (tl_fabric_lookup.resources | default([]) | length == 0)
          or (tl_gateway_lookup.resources | default([]) | length == 0)

    - name: Fail if fabricRef or cloudGatewayRef does not resolve
      ansible.builtin.fail:
        msg: >-
          TransportLink {{ transportlink_cr_name }}: fabricRef {{ transportlink_spec.fabricRef }} or
          cloudGatewayRef {{ transportlink_spec.cloudGatewayRef }} not found in sovereign-cloud.
      when:
        - (tl_fabric_lookup.resources | default([]) | length == 0)
          or (tl_gateway_lookup.resources | default([]) | length == 0)

    - name: Set fabric/gateway facts
      ansible.builtin.set_fact:
        tl_fabric: "{{ tl_fabric_lookup.resources[0] }}"
        tl_gateway: "{{ tl_gateway_lookup.resources[0] }}"

    # The transport type lives in one place: CloudGateway.spec.transport.type
    # (plan §2.1). TransportLink.spec.tunnelType is a copy, read only as fallback.
    - name: Resolve the gateway's site and transport
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_cloudgateway_site.yml"
      vars:
        rcs_gateway: "{{ tl_gateway }}"

    - name: Set tunnel type from the CloudGateway
      ansible.builtin.set_fact:
        tl_tunnel_type: >-
          {{
            ((tl_gateway.spec.transport | default({}, true)).type | default('', true))
            | default(transportlink_spec.tunnelType | default('none', true), true)
          }}

    - name: Set cross-fabric-bind failure reason before failing
      ansible.builtin.set_fact:
        transportlink_fail_reason: CrossFabricBind
      when: (tl_gateway.spec.fabricRef | default('')) != transportlink_spec.fabricRef

    - name: Reject cross-fabric bind (gateway.fabricRef != link.fabricRef)
      ansible.builtin.fail:
        msg: >-
          TransportLink {{ transportlink_cr_name }} fabricRef {{ transportlink_spec.fabricRef }}
          does not match CloudGateway {{ transportlink_spec.cloudGatewayRef }}
          fabricRef {{ tl_gateway.spec.fabricRef | default('') }}.
      when: (tl_gateway.spec.fabricRef | default('')) != transportlink_spec.fabricRef

    - name: Set fabric-not-ready failure reason before failing
      ansible.builtin.set_fact:
        transportlink_fail_reason: FabricNotReady
      when: not (tl_fabric.status.ready | default(false) | bool)

    - name: Require fabric Ready
      ansible.builtin.fail:
        msg: "TransportLink {{ transportlink_cr_name }}: HybridFabric {{ transportlink_spec.fabricRef }} is not Ready"
      when: not (tl_fabric.status.ready | default(false) | bool)

    - name: Set gateway-not-ready failure reason before failing
      ansible.builtin.set_fact:
        transportlink_fail_reason: GatewayNotReady
      when: not (tl_gateway.status.ready | default(false) | bool)

    - name: Require gateway Ready (no partial-Fr6-pending exception)
      ansible.builtin.fail:
        msg: "TransportLink {{ transportlink_cr_name }}: CloudGateway {{ transportlink_spec.cloudGatewayRef }} is not Ready"
      when: not (tl_gateway.status.ready | default(false) | bool)

    - name: Handle tunnelType none (native underlay peering, no tunnel)
      when: tl_tunnel_type == 'none'
      block:
        - name: Collect fabric peers (border gateway loopback, else legacy RRs)
          ansible.builtin.set_fact:
            tl_bgw_loopback: "{{ (tl_fabric.spec.borderGateway | default({})).loopback | default('') }}"
            tl_rr_addrs: >-
              {{
                tl_fabric.spec.routeReflectors | default([])
                | map(attribute='address') | select('string') | list
              }}
            tl_fabric_asn: "{{ tl_fabric.spec.domainAsn | default(0) | int }}"

        - name: Set fabric peer list
          ansible.builtin.set_fact:
            tl_fabric_peers: "{{ [tl_bgw_loopback] if (tl_bgw_loopback | length > 0) else tl_rr_addrs }}"

        - name: Fail closed when the fabric has no BGP peer for spokes
          when: (tl_fabric_peers | length) == 0
          ansible.builtin.fail:
            msg: >-
              TransportLink {{ transportlink_cr_name }}: HybridFabric {{ transportlink_spec.fabricRef }}
              has neither spec.borderGateway.loopback nor legacy spec.routeReflectors[].

        - name: Set tunnelType=none Ready facts
          ansible.builtin.set_fact:
            tl_tunnel_up: true
            tl_ready: true
            tl_border_endpoint: "{{ tl_fabric_peers | first }}"
            tl_cloud_endpoint: "{{ tl_gateway.status.gatewayAddress | default('') }}"
            tl_message: >-
              tunnelType=none: {{ rcs_cloud_type | default('unknown', true) }} site {{ rcs_site_name | default('', true) }} peers natively
              (iBGP AS{{ tl_fabric_asn }}, l2vpn evpn) with {{ tl_fabric_peers | join(',') }}
              over the hub underlay (design/fabric.md §21.3).

    - name: Handle tunnelType wireguard (BGW <-> site gateway VM over wstunnel)
      when: tl_tunnel_type == 'wireguard'
      ansible.builtin.include_tasks: deploy_wireguard.yml

    - name: Handle tunneled transport (ipsec/macsec)
      when: tl_tunnel_type in ['ipsec', 'macsec']
      block:
        - name: Set tunnel-config-unavailable failure reason before validating
          ansible.builtin.set_fact:
            transportlink_fail_reason: TunnelConfigUnavailable
          when: (transportlink_spec.vaultConfigRef | default('')) | length == 0

        - name: Fail closed when vaultConfigRef missing for a tunneled TransportLink
          ansible.builtin.fail:
            msg: >-
              TransportLink {{ transportlink_cr_name }} tunnelType={{ tl_tunnel_type }}
              requires spec.vaultConfigRef (peer keys/PSK); none provided.
          when: (transportlink_spec.vaultConfigRef | default('')) | length == 0

        - name: Read tunnel config from Vault (never logs secret values)
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
          vars:
            vault_kv_path: "{{ transportlink_spec.vaultConfigRef }}"

        - name: Set tunnel-up facts from Vault-backed config (ipsec/macsec)
          ansible.builtin.set_fact:
            tl_tunnel_up: true
            tl_ready: true
            tl_border_endpoint: "{{ vault_kv_data.borderEndpoint | default(tl_fabric.spec.borderGateway.loopback | default('')) }}"
            tl_cloud_endpoint: "{{ vault_kv_data.cloudEndpoint | default(tl_gateway.status.gatewayAddress | default('')) }}"
            tl_message: "tunnelType={{ tl_tunnel_type }}: tunnel config loaded from Vault {{ transportlink_spec.vaultConfigRef }}."

    - name: Get timestamp
      ansible.builtin.set_fact:
        transportlink_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Mark TransportLink ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: transportlinks
        cr_name: "{{ transportlink_cr_name }}"
        cr_namespace: "{{ transportlink_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: true
          message: "{{ tl_message }}"
          lastReconciledAt: "{{ transportlink_status_transition_time }}"
          observedGeneration: "{{ transportlink_generation }}"
          tunnelUp: "{{ tl_tunnel_up | default(false) }}"
          borderEndpoint: "{{ tl_border_endpoint | default('') }}"
          cloudEndpoint: "{{ tl_cloud_endpoint | default('') }}"
          lastHandshakeAt: "{{ transportlink_status_transition_time }}"
          conditions:
            - type: Ready
              status: "True"
              lastTransitionTime: "{{ transportlink_status_transition_time }}"
              reason: EDASucceeded
              message: "{{ tl_message }}"

  rescue:
    - name: Mark TransportLink failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: transportlinks
        cr_name: "{{ transportlink_cr_name }}"
        cr_namespace: "{{ transportlink_cr_namespace }}"
        cr_status_body:
          status: failed
          ready: false
          tunnelUp: false
          message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: "{{ transportlink_fail_reason if (transportlink_fail_reason | default('') | length > 0) else 'EDAFailed' }}"
              message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "TransportLink {{ transportlink_cr_name | default('unknown') }} provision failed"
