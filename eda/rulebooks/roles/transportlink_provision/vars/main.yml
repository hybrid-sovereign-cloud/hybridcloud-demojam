---
# TransportLink tunnelType=wireguard (design/fabric.md §21.4): the tunnel
# runs between the fabric border gateway VM (hub) and the RHOSO site gateway VM,
# WireGuard inside wstunnel over the hub ingress (TLS 443).
tl_oso_namespace: openstack
# Bounded wait for the BGW to come back after a peer-change restart.
tl_bgw_wait_retries: 30
tl_bgw_wait_delay: 10
