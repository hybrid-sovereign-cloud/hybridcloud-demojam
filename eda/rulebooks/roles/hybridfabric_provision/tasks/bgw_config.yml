---
# Render the BGW dynamic configuration (wg0.conf, frr.conf, dnsmasq, nftables)
# into Secret <bgw>-config (the VM's config disk, re-read at every boot) and roll
# it out WITHOUT restarting the VMI (plan §3.2.5): bgw_config_push.yml copies the
# changed files over SSH and reloads only what changed (frr-reload, nft -f,
# wg syncconf, dnsmasq restart). The VMI is restarted only when the push is not
# possible and bgw_inplace_fallback == restart (the pre-restructure behaviour).
#
# Entry point for transportlink_provision, hybridnetwork_provision and
# networkplacement_provision (include_role tasks_from) as well as
# deploy_border_gateway.yml. Required vars: bgw_fabric_cr, services_api_host,
# services_bearer_token. Optional: bgw_apply_mode (auto | deferred; deferred =
# only update the Secret, the caller decides; deploy_border_gateway.yml uses it
# so a VM-spec restart and a config push never both happen).
# Sets: bgw_config_changed, bgw_rollout_needed, bgw_config_hash, bgw_config_existed, bgw_vmi_restarted,
#       bgw_config_applied_inplace, bgw_apply_note, plus all bgw_* facts.

- name: Compute BGW facts
  ansible.builtin.include_tasks: bgw_facts.yml

- name: Render BGW config files
  ansible.builtin.set_fact:
    bgw_frr_conf: "{{ lookup('template', 'bgw-frr.conf.j2') }}"
    bgw_dnsmasq_conf: "{{ lookup('template', 'bgw-dnsmasq.conf.j2') }}"
    bgw_fabric_nft: "{{ lookup('template', 'bgw-fabric.nft.j2') }}"
    bgw_wg0_conf: "{{ lookup('template', 'bgw-wg0.conf.j2') if (bgw_wg_enabled | bool) else '' }}"
    bgw_hubleg_nm: "{{ lookup('template', 'bgw-hubleg.nmconnection.j2') if (bgw_hub_leg_enabled | bool) else '' }}"
  no_log: true

- name: Build BGW config Secret data
  ansible.builtin.set_fact:
    _bgw_cfg_data: >-
      {{
        {
          'frr.conf': bgw_frr_conf | b64encode,
          'dnsmasq-fabric.conf': bgw_dnsmasq_conf | b64encode,
          'fabric.nft': bgw_fabric_nft | b64encode
        }
        | combine({'wg0.conf': bgw_wg0_conf | b64encode} if (bgw_wg_enabled | bool) else {})
        | combine({'hubleg.nmconnection': bgw_hubleg_nm | b64encode} if (bgw_hub_leg_enabled | bool) else {})
      }}
  no_log: true

- name: Hash BGW config
  ansible.builtin.set_fact:
    _bgw_cfg_hash: "{{ (_bgw_cfg_data | to_json(sort_keys=true)) | hash('sha256') }}"
  no_log: true

- name: Read existing BGW config Secret
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: v1
    kind: Secret
    name: "{{ bgw_name }}-config"
    namespace: "{{ bgw_namespace }}"
  register: _bgw_cfg_existing
  no_log: true

# config-hash  = content of the Secret; applied-hash = content the running guest
# has (set after a successful in-place push or a VMI restart). A Secret written
# by the pre-restructure code has no applied-hash: it restarted on every change,
# so its config-hash counts as applied.
- name: Detect BGW config change
  vars:
    _bgw_ann: "{{ ((_bgw_cfg_existing.resources | default([{}]))[0].metadata | default({})).annotations | default({}) }}"
  ansible.builtin.set_fact:
    _bgw_cfg_existed: "{{ (_bgw_cfg_existing.resources | default([])) | length > 0 }}"
    _bgw_prev_cfg_hash: "{{ _bgw_ann.get('hybridsovereign.redhat/config-hash', '') }}"
    _bgw_prev_applied_hash: >-
      {{ _bgw_ann.get('hybridsovereign.redhat/applied-hash', _bgw_ann.get('hybridsovereign.redhat/config-hash', '')) }}

- name: Set BGW change facts
  ansible.builtin.set_fact:
    bgw_config_changed: "{{ _bgw_prev_cfg_hash != _bgw_cfg_hash }}"
    bgw_rollout_needed: "{{ (_bgw_cfg_existed | bool) and (_bgw_prev_applied_hash != _bgw_cfg_hash) }}"
    bgw_config_hash: "{{ _bgw_cfg_hash }}"

- name: Apply BGW config Secret
  when: bgw_config_changed | bool
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: present
    force: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ bgw_name }}-config"
        namespace: "{{ bgw_namespace }}"
        labels:
          app: "{{ bgw_name }}"
          hybridsovereign.redhat/fabric: "{{ bgw_fabric_name }}"
        annotations:
          hybridsovereign.redhat/config-hash: "{{ _bgw_cfg_hash }}"
          # A brand-new Secret is applied by the VM's first boot.
          hybridsovereign.redhat/applied-hash: "{{ _bgw_prev_applied_hash if (_bgw_cfg_existed | bool) else _bgw_cfg_hash }}"
          hybridsovereign.redhat/peers: "{{ bgw_peers | map(attribute='name') | join(',') }}"
      data: "{{ _bgw_cfg_data }}"
  no_log: true

- name: Default rollout outcome facts
  ansible.builtin.set_fact:
    bgw_config_existed: "{{ _bgw_cfg_existed | bool }}"
    bgw_vmi_restarted: false
    bgw_config_applied_inplace: false
    bgw_apply_note: ""

- name: Roll out changed config in place
  when:
    - (bgw_apply_mode | default('auto')) == 'auto'
    - bgw_rollout_needed | bool
  ansible.builtin.include_tasks: bgw_config_push.yml
