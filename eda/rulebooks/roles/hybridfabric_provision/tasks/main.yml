---
# HybridFabric provision — design/fabric.md §8.1 (Layer L1).
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        hybridfabric_cr_name: "{{ event_payload.regarding.name }}"
        hybridfabric_cr_namespace: "{{ event_payload.regarding.namespace }}"
        hybridfabric_fail_reason: ""

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read HybridFabric CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        name: "{{ hybridfabric_cr_name }}"
        namespace: "{{ hybridfabric_cr_namespace }}"
      register: hybridfabric_cr_lookup

    - name: Fail if HybridFabric CR is missing
      ansible.builtin.fail:
        msg: "HybridFabric {{ hybridfabric_cr_name }} not found in {{ hybridfabric_cr_namespace }}"
      when: hybridfabric_cr_lookup.resources | default([]) | length == 0

    - name: Set spec/generation facts from live CR
      ansible.builtin.set_fact:
        hybridfabric_spec: "{{ hybridfabric_cr_lookup.resources[0].spec | default({}) }}"
        hybridfabric_generation: "{{ hybridfabric_cr_lookup.resources[0].metadata.generation | default(0) | int }}"
        hybridfabric_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

    - name: Set VNI pool / ASN facts
      ansible.builtin.set_fact:
        hf_pool_start: "{{ hybridfabric_spec.vniPool.start | default(0) | int }}"
        hf_pool_end: "{{ hybridfabric_spec.vniPool.end | default(0) | int }}"
        hf_domain_asn: "{{ hybridfabric_spec.domainAsn | default(0) | int }}"

    - name: Set VNI pool overlap failure reason before validating
      ansible.builtin.set_fact:
        hybridfabric_fail_reason: VniPoolInvalid
      when: (hf_pool_end | int) < (hf_pool_start | int)

    - name: Validate vniPool.end >= vniPool.start
      ansible.builtin.fail:
        msg: >-
          HybridFabric {{ hybridfabric_cr_name }} spec.vniPool.end ({{ hf_pool_end }})
          must be >= spec.vniPool.start ({{ hf_pool_start }}).
      when: (hf_pool_end | int) < (hf_pool_start | int)

    - name: List other HybridFabric CRs in the same namespace
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridFabric
        namespace: "{{ hybridfabric_cr_namespace }}"
      register: hf_all_fabrics

    - name: Compute other Ready fabrics (excluding self)
      ansible.builtin.set_fact:
        hf_other_ready_fabrics: >-
          {{
            hf_all_fabrics.resources
            | default([])
            | rejectattr('metadata.name', 'equalto', hybridfabric_cr_name)
            | selectattr('status.ready', 'defined')
            | selectattr('status.ready')
            | list
          }}

    - name: Compute VNI pool and ASN conflicts with other Ready fabrics
      ansible.builtin.set_fact:
        hf_pool_conflicts: "{{ hf_pool_conflicts | default([]) + [item.metadata.name] }}"
      when:
        - item.spec.vniPool is defined
        - item.spec.vniPool.start is defined
        - item.spec.vniPool.end is defined
        - (item.spec.vniPool.start | int) <= (hf_pool_end | int)
        - (item.spec.vniPool.end | int) >= (hf_pool_start | int)
      loop: "{{ hf_other_ready_fabrics }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Compute domainAsn conflicts with other Ready fabrics
      ansible.builtin.set_fact:
        hf_asn_conflicts: "{{ hf_asn_conflicts | default([]) + [item.metadata.name] }}"
      when:
        - item.spec.domainAsn is defined
        - (item.spec.domainAsn | int) == (hf_domain_asn | int)
      loop: "{{ hf_other_ready_fabrics }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Default empty conflict lists
      ansible.builtin.set_fact:
        hf_pool_conflicts: "{{ hf_pool_conflicts | default([]) }}"
        hf_asn_conflicts: "{{ hf_asn_conflicts | default([]) }}"

    - name: Set overlap failure reason before failing
      ansible.builtin.set_fact:
        hybridfabric_fail_reason: VniPoolOverlap
      when: hf_pool_conflicts | length > 0

    - name: Fail on VNI pool overlap with another Ready fabric
      ansible.builtin.fail:
        msg: >-
          HybridFabric {{ hybridfabric_cr_name }} vniPool [{{ hf_pool_start }}-{{ hf_pool_end }}]
          overlaps Ready fabric(s): {{ hf_pool_conflicts | join(', ') }}.
      when: hf_pool_conflicts | length > 0

    - name: Set ASN conflict failure reason before failing
      ansible.builtin.set_fact:
        hybridfabric_fail_reason: DomainAsnReused
      when: hf_asn_conflicts | length > 0

    - name: Fail on domainAsn reused by another Ready fabric
      ansible.builtin.fail:
        msg: >-
          HybridFabric {{ hybridfabric_cr_name }} domainAsn {{ hf_domain_asn }}
          is already used by Ready fabric(s): {{ hf_asn_conflicts | join(', ') }}.
      when: hf_asn_conflicts | length > 0

    - name: Check for existing numbering ConfigMap (never reset the ledger)
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: ConfigMap
        name: "fabric-numbering-{{ hybridfabric_cr_name }}"
        namespace: "{{ hybridfabric_cr_namespace }}"
      register: hf_numbering_cm_lookup

    - name: Create numbering ConfigMap on first reconcile only
      when: hf_numbering_cm_lookup.resources | default([]) | length == 0
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "fabric-numbering-{{ hybridfabric_cr_name }}"
            namespace: "{{ hybridfabric_cr_namespace }}"
            labels:
              hybridsovereign.redhat/hybridfabric: "{{ hybridfabric_cr_name }}"
              hybridsovereign.redhat/purpose: fabric-numbering
          data:
            poolStart: "{{ hf_pool_start | string }}"
            poolEnd: "{{ hf_pool_end | string }}"
            nextVni: "{{ hf_pool_start | string }}"
            allocated: "{}"

    - name: Reconcile poolStart/poolEnd on an existing ledger (never touch allocated/nextVni)
      when:
        - hf_numbering_cm_lookup.resources | default([]) | length > 0
        - (hf_numbering_cm_lookup.resources[0].data.poolStart | default('') != (hf_pool_start | string))
          or (hf_numbering_cm_lookup.resources[0].data.poolEnd | default('') != (hf_pool_end | string))
      kubernetes.core.k8s:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        state: present
        merge_type: merge
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "fabric-numbering-{{ hybridfabric_cr_name }}"
            namespace: "{{ hybridfabric_cr_namespace }}"
          data:
            poolStart: "{{ hf_pool_start | string }}"
            poolEnd: "{{ hf_pool_end | string }}"

    - name: Carry legacy fabric VNIs into this ledger (single-fabric consolidation)
      ansible.builtin.include_tasks: ledger_migrate_legacy.yml

    - name: Re-read numbering ConfigMap for live counts
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: ConfigMap
        name: "fabric-numbering-{{ hybridfabric_cr_name }}"
        namespace: "{{ hybridfabric_cr_namespace }}"
      register: hf_numbering_cm_final

    - name: Compute allocated / available VNI counts from the ledger
      ansible.builtin.set_fact:
        hf_allocated_map: "{{ hf_numbering_cm_final.resources[0].data.allocated | default('{}') | from_json }}"

    - name: Set numbering counts
      ansible.builtin.set_fact:
        hf_allocated_count: "{{ hf_allocated_map | length }}"
        hf_pool_size: "{{ (hf_pool_end | int) - (hf_pool_start | int) + 1 }}"

    # DEPRECATED: legacy hostNetwork hub RR pods, only when routeReflectors[] is set.
    - name: Deploy legacy hub FRR route reflector pods (deprecated; routeReflectors set)
      when: (hybridfabric_spec.routeReflectors | default([])) | length > 0
      ansible.builtin.include_tasks: deploy_hub_rr.yml

    - name: Record hub RR not in use
      when: (hybridfabric_spec.routeReflectors | default([])) | length == 0
      ansible.builtin.set_fact:
        hf_hub_rr_ready: true
        hf_hub_rr_message: ""

    # design/fabric.md §21.2 — the BGW VM is the fabric route reflector.
    - name: Deploy border gateway VM (borderGateway.loopback set)
      when: (hybridfabric_spec.borderGateway.loopback | default('')) | length > 0
      ansible.builtin.include_tasks: deploy_border_gateway.yml

    - name: Record no border gateway configured
      when: (hybridfabric_spec.borderGateway.loopback | default('')) | length == 0
      ansible.builtin.set_fact:
        hf_border_bgw_ready: true
        hf_border_message: "No borderGateway configured for this fabric."

    - name: Mark HybridFabric ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: hybridfabrics
        cr_name: "{{ hybridfabric_cr_name }}"
        cr_namespace: "{{ hybridfabric_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: true
          message: >-
            fabric-numbering-{{ hybridfabric_cr_name }} ledger ok
            (pool {{ hf_pool_start }}-{{ hf_pool_end }}, allocated={{ hf_allocated_count }},
            available={{ hf_pool_size | int - hf_allocated_count | int }}). {{ hf_ledger_migration_message | default('') }}{{ hf_border_message }}
            {{ hf_hub_rr_message | default('') }}
          lastReconciledAt: "{{ hybridfabric_status_transition_time }}"
          observedGeneration: "{{ hybridfabric_generation }}"
          fabricBaseReady: true
          borderBgwReady: "{{ hf_border_bgw_ready }}"
          bgwEndpoint: "{{ hf_bgw_endpoint | default('') }}"
          bgwAddress: "{{ hf_bgw_address | default('') }}"
          bgwPeerCount: "{{ hf_bgw_peer_count | default(0) | int | int }}"
          hubRrReady: "{{ hf_hub_rr_ready | default(false) }}"
          allocatedVniCount: "{{ hf_allocated_count | int }}"
          availableVniCount: "{{ (hf_pool_size | int) - (hf_allocated_count | int) }}"
          conditions:
            - type: Ready
              status: "True"
              lastTransitionTime: "{{ hybridfabric_status_transition_time }}"
              reason: EDASucceeded
              message: >-
                HybridFabric base + numbering ledger provisioned;
                borderBgwReady={{ hf_border_bgw_ready }} hubRrReady={{ hf_hub_rr_ready | default(false) }}

  rescue:
    - name: Mark HybridFabric failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: hybridfabrics
        cr_name: "{{ hybridfabric_cr_name }}"
        cr_namespace: "{{ hybridfabric_cr_namespace }}"
        cr_status_body:
          status: failed
          ready: false
          message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: "{{ hybridfabric_fail_reason if (hybridfabric_fail_reason | default('') | length > 0) else 'EDAFailed' }}"
              message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "HybridFabric {{ hybridfabric_cr_name | default('unknown') }} provision failed"
