---
# CloudInfrastructure provision — plan §2.1 / §3.2.1 (platform-owned
# "bring-your-own cloud", namespace sovereign-cloud).
#   type openstack : credentialsRef authenticates against Keystone; the management
#                    cluster kubeconfig is readable; NetConfig and every NodeSet
#                    exist (no EDPM changes). capabilities.evpn = NetConfig has a
#                    `fabric` network.
#   type openshift : CNV (KubeVirt CR) present and Available; HybridFabric underlay
#                    NAD noted when present; capabilities.evpn = CNO has the FRR
#                    provider and routeAdvertisements Enabled (read only).
#   type aws       : credentials check only; capabilities.evpn = false.
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        cloudinfrastructure_cr_name: "{{ event_payload.regarding.name }}"
        cloudinfrastructure_cr_namespace: "{{ event_payload.regarding.namespace }}"
        cloudinfrastructure_fail_reason: ""

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read CloudInfrastructure CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: CloudInfrastructure
        name: "{{ cloudinfrastructure_cr_name }}"
        namespace: "{{ cloudinfrastructure_cr_namespace }}"
      register: cloudinfrastructure_cr_lookup

    - name: Fail if CloudInfrastructure CR is missing
      ansible.builtin.fail:
        msg: "CloudInfrastructure {{ cloudinfrastructure_cr_name }} not found in {{ cloudinfrastructure_cr_namespace }}"
      when: cloudinfrastructure_cr_lookup.resources | default([]) | length == 0

    - name: Set spec/generation facts from live CR
      ansible.builtin.set_fact:
        ci_cr: "{{ cloudinfrastructure_cr_lookup.resources[0] }}"
        ci_cr_spec: "{{ cloudinfrastructure_cr_lookup.resources[0].spec | default({}) }}"
        ci_cr_type: "{{ cloudinfrastructure_cr_lookup.resources[0].spec.type | default('') }}"
        cloudinfrastructure_generation: "{{ cloudinfrastructure_cr_lookup.resources[0].metadata.generation | default(0) | int }}"
        ci_capabilities_out: {evpn: false}
        ci_site_out: {}
        ci_notes: []

    - name: Set type-invalid failure reason before validating
      when: >-
        ci_cr_type not in ['openstack', 'openshift', 'aws']
        or (ci_cr_spec[ci_cr_type] | default({}, true) | length == 0 and ci_cr_type != 'aws')
      ansible.builtin.set_fact:
        cloudinfrastructure_fail_reason: SpecInvalid

    - name: Require spec.type and its matching section
      ansible.builtin.assert:
        that:
          - ci_cr_type in ['openstack', 'openshift', 'aws']
          - ci_cr_type == 'aws' or (ci_cr_spec[ci_cr_type] | default({}, true) | length > 0)
        fail_msg: >-
          CloudInfrastructure {{ cloudinfrastructure_cr_name }}: spec.type must be openstack, openshift
          or aws (got '{{ ci_cr_type }}'), with the matching spec.{{ ci_cr_type | default('<type>', true) }} section.

    - name: Warn about sections that do not match spec.type
      when: >-
        ['openstack', 'openshift', 'aws'] | reject('equalto', ci_cr_type)
        | select('in', ci_cr_spec.keys() | list) | list | length > 0
      ansible.builtin.set_fact:
        ci_notes: >-
          {{ ci_notes + ['ignored spec.' ~ (['openstack', 'openshift', 'aws'] | reject('equalto', ci_cr_type)
             | select('in', ci_cr_spec.keys() | list) | join(', spec.')) ~ ' (type=' ~ ci_cr_type ~ ')'] }}

    - name: Validate an openstack site
      when: ci_cr_type == 'openstack'
      ansible.builtin.include_tasks: openstack.yml

    - name: Validate an openshift (CNV) site
      when: ci_cr_type == 'openshift'
      ansible.builtin.include_tasks: openshift.yml

    - name: Validate an aws account
      when: ci_cr_type == 'aws'
      ansible.builtin.include_tasks: aws.yml

    - name: Get timestamp
      ansible.builtin.set_fact:
        cloudinfrastructure_status_transition_time: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
        ci_message: >-
          CloudInfrastructure {{ cloudinfrastructure_cr_name }} (type {{ ci_cr_type }}) Ready:
          {{ ci_type_message | default('') }} evpn={{ ci_capabilities_out.evpn | default(false) }}.
          {{ ci_notes | join('; ') }}

    - name: Mark CloudInfrastructure ready
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudinfrastructures
        cr_name: "{{ cloudinfrastructure_cr_name }}"
        cr_namespace: "{{ cloudinfrastructure_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: true
          message: "{{ ci_message }}"
          lastReconciledAt: "{{ cloudinfrastructure_status_transition_time }}"
          observedGeneration: "{{ cloudinfrastructure_generation }}"
          capabilities: "{{ ci_capabilities_out }}"
          site: "{{ ci_site_out }}"
          conditions:
            - type: Ready
              status: "True"
              lastTransitionTime: "{{ cloudinfrastructure_status_transition_time }}"
              reason: EDASucceeded
              message: "{{ ci_message }}"
            - type: CredentialsValid
              status: "{{ 'True' if (ci_credentials_valid | default(false) | bool) else 'Unknown' }}"
              lastTransitionTime: "{{ cloudinfrastructure_status_transition_time }}"
              reason: "{{ 'Verified' if (ci_credentials_valid | default(false) | bool) else 'NotVerified' }}"
              message: "{{ ci_credentials_message | default('') }}"
            - type: EvpnCapable
              status: "{{ 'True' if (ci_capabilities_out.evpn | default(false) | bool) else 'False' }}"
              lastTransitionTime: "{{ cloudinfrastructure_status_transition_time }}"
              reason: "{{ ci_evpn_reason | default('Checked') }}"
              message: "{{ ci_evpn_message | default('') }}"

  rescue:
    - name: Mark CloudInfrastructure failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: cloudinfrastructures
        cr_name: "{{ cloudinfrastructure_cr_name }}"
        cr_namespace: "{{ cloudinfrastructure_cr_namespace }}"
        cr_status_body:
          status: failed
          ready: false
          message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
          conditions:
            - type: Ready
              status: "False"
              lastTransitionTime: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
              reason: "{{ cloudinfrastructure_fail_reason if (cloudinfrastructure_fail_reason | default('') | length > 0) else 'EDAFailed' }}"
              message: "{{ ansible_failed_result.msg | default('EDA provision failed') }}"
      ignore_errors: true
      when: services_api_host is defined and services_bearer_token is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "CloudInfrastructure {{ cloudinfrastructure_cr_name | default('unknown') }} provision failed"

  always:
    - name: Remove CloudInfrastructure temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/ci-{{ cloudinfrastructure_cr_name | default('unknown') }}-clouds.yaml"
        - "/tmp/ci-{{ cloudinfrastructure_cr_name | default('unknown') }}-mgmt-kubeconfig"
        - "/tmp/ci-{{ cloudinfrastructure_cr_name | default('unknown') }}-cluster-kubeconfig"
        - "/tmp/ci-{{ cloudinfrastructure_cr_name | default('unknown') }}-aws.json"
