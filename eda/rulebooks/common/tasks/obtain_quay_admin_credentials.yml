---
# Load Quay admin credentials from Vault path quay-admin and/or K8s secret.
# Database AUTHENTICATION_TYPE requires CSRF for /api/v1/signin; signin returns
# {"success": true} (no access_token). Prefer a working OAuth/app Bearer token;
# only then CSRF signin + POST /api/v1/user/apptoken (with wait/retry for ZTP).
#
# ZTP pitfall: Vault may have username/password while the usable apptoken lives
# only in quay-admin-credentials. Always merge the Secret and verify Bearer
# before CSRF (failed signins cause Quay 429 lockouts).

- name: Read Quay admin from Vault when VAULT_TOKEN set
  when: lookup('env', 'VAULT_TOKEN') | default('', true) | length > 0
  block:
    - name: Read quay-admin from Vault
      ansible.builtin.include_tasks: vault_kv_read.yml
      vars:
        vault_kv_path: quay-admin
  rescue:
    - name: Continue without Vault for Quay
      ansible.builtin.debug:
        msg: Vault quay-admin read failed; trying K8s secret

- name: Set Quay facts from Vault (initial)
  when:
    - vault_kv_data is defined
    - (vault_kv_data.username | default('') | length) > 0
      or (vault_kv_data.token | default('') | length) > 0
      or (vault_kv_data.url | default('') | length) > 0
  ansible.builtin.set_fact:
    quay_admin_user: "{{ vault_kv_data.username | default('') }}"
    quay_admin_password: "{{ vault_kv_data.password | default('') }}"
    quay_admin_url: "{{ vault_kv_data.url | default('') }}"
    quay_api_token: "{{ vault_kv_data.token | default('', true) }}"
  no_log: true

- name: Always merge K8s quay-admin-credentials (fill gaps / prefer Secret token)
  block:
    - name: Read quay-admin-credentials Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: quay-admin-credentials
        namespace: "{{ plugin_rbac_operator_namespace | default('sovereign-cloud-plugins') }}"
        host: "{{ services_api_host | default(omit) }}"
        api_key: "{{ services_bearer_token | default(omit) }}"
        validate_certs: false
      register: _quay_secret
      failed_when: false

    - name: Merge Secret fields into Quay facts
      when: (_quay_secret.resources | default([]) | length) > 0
      ansible.builtin.set_fact:
        quay_admin_user: >-
          {{
            quay_admin_user | default('')
            if (quay_admin_user | default('') | length) > 0
            else (_quay_secret.resources[0].data.username | default('') | b64decode)
          }}
        quay_admin_password: >-
          {{
            quay_admin_password | default('')
            if (quay_admin_password | default('') | length) > 0
            else (_quay_secret.resources[0].data.password | default('') | b64decode)
          }}
        quay_admin_url: >-
          {{
            quay_admin_url | default('')
            if (quay_admin_url | default('') | length) > 0
            else (_quay_secret.resources[0].data.url | default('') | b64decode)
          }}
        # Prefer Secret token when Vault token empty — ZTP seeds a working apptoken here.
        quay_api_token: >-
          {{
            quay_api_token | default('')
            if (quay_api_token | default('') | length) > 0
            else (
              (_quay_secret.resources[0].data.token | default('') | length) > 0
              | ternary(_quay_secret.resources[0].data.token | b64decode, '')
            )
          }}
        _quay_secret_token: >-
          {{
            (_quay_secret.resources[0].data.token | default('') | length) > 0
            | ternary(_quay_secret.resources[0].data.token | b64decode, '')
          }}
      no_log: true

- name: Prefer QUAY_URL env when secret url missing
  when: (quay_admin_url | default('') | length) == 0
  ansible.builtin.set_fact:
    quay_admin_url: "{{ lookup('env', 'QUAY_URL') | default('', true) }}"

- name: Set quay_url for provision roles
  when: (quay_admin_url | default('') | length) > 0
  ansible.builtin.set_fact:
    quay_url: "{{ quay_admin_url }}"

- name: Wait for Quay API csrf_token endpoint (ZTP readiness)
  when: (quay_admin_url | default('') | length) > 0
  ansible.builtin.uri:
    url: "{{ quay_admin_url | regex_replace('/$', '') }}/csrf_token"
    method: GET
    validate_certs: false
    status_code: [200]
  register: _quay_csrf_ready
  retries: 30
  delay: 10
  until: (_quay_csrf_ready.status | default(0) | int) == 200

- name: Verify candidate Bearer tokens (Vault then Secret)
  when:
    - (quay_admin_url | default('') | length) > 0
    - (quay_api_token | default('') | length) > 0
      or (_quay_secret_token | default('') | length) > 0
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, ssl, sys, urllib.error, urllib.request

    base = os.environ["QUAY_URL"].rstrip("/")
    candidates = []
    for key in ("QUAY_TOKEN_PRIMARY", "QUAY_TOKEN_SECONDARY"):
        t = os.environ.get(key, "").strip()
        if t and t not in candidates:
            candidates.append(t)
    ctx = ssl._create_unverified_context()

    def probe(token):
        req = urllib.request.Request(
            base + "/api/v1/user/",
            headers={"Authorization": f"Bearer {token}"},
            method="GET",
        )
        try:
            with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                return resp.status == 200
        except Exception:
            return False

    for tok in candidates:
        if probe(tok):
            print(tok)
            sys.exit(0)
    sys.exit(1)
    PY
  environment:
    QUAY_URL: "{{ quay_admin_url }}"
    QUAY_TOKEN_PRIMARY: "{{ quay_api_token | default('') }}"
    QUAY_TOKEN_SECONDARY: "{{ _quay_secret_token | default('') }}"
  register: _quay_token_probe
  failed_when: false
  changed_when: false
  no_log: true

- name: Use verified Bearer token when probe succeeded
  when:
    - (_quay_token_probe.rc | default(1) | int) == 0
    - (_quay_token_probe.stdout | default('') | length) > 0
  ansible.builtin.set_fact:
    quay_api_token: "{{ _quay_token_probe.stdout | trim }}"
  no_log: true

- name: Obtain Quay Bearer token via CSRF signin + apptoken with wait/retry
  when:
    - (quay_api_token | default('') | length) == 0
    - (quay_admin_user | default('') | length) > 0
    - (quay_admin_password | default('') | length) > 0
    - (quay_admin_url | default('') | length) > 0
    - (quay_admin_password | default('') | string) != 'quay-bootstrap-pending'
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, ssl, sys, time, urllib.error, urllib.request
    from http.cookiejar import CookieJar

    base = os.environ["QUAY_URL"].rstrip("/")
    user = os.environ["QUAY_USER"]
    password = os.environ["QUAY_PASS"]
    attempts = int(os.environ.get("QUAY_CSRF_ATTEMPTS", "12"))
    ctx = ssl._create_unverified_context()

    def call(opener, method, path, body=None, csrf=None):
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(base + path, data=data, method=method)
        req.add_header("Content-Type", "application/json")
        req.add_header("X-Requested-With", "XMLHttpRequest")
        if csrf:
            req.add_header("X-CSRF-Token", csrf)
        try:
            with opener.open(req, timeout=60) as resp:
                raw = resp.read()
                return resp.status, json.loads(raw.decode() or "{}")
        except urllib.error.HTTPError as e:
            raw = e.read()
            try:
                payload = json.loads(raw.decode() or "{}")
            except Exception:
                payload = {"error": raw.decode(errors="replace")[:300]}
            return e.code, payload

    last_err = "csrf_unknown"
    for attempt in range(1, attempts + 1):
        jar = CookieJar()
        opener = urllib.request.build_opener(
            urllib.request.HTTPSHandler(context=ctx),
            urllib.request.HTTPCookieProcessor(jar),
        )
        st, csrf_body = call(opener, "GET", "/csrf_token")
        if st != 200 or not csrf_body.get("csrf_token"):
            last_err = f"csrf_failed status={st} attempt={attempt}/{attempts}"
            time.sleep(min(60, 5 * attempt))
            continue
        csrf = csrf_body["csrf_token"]

        st, signin = call(
            opener,
            "POST",
            "/api/v1/signin",
            {"username": user, "password": password},
            csrf=csrf,
        )
        if st == 429 or "too many login" in str(signin).lower():
            last_err = f"signin_rate_limited status={st} attempt={attempt}/{attempts}"
            # Quay lockouts need a longer cool-down
            time.sleep(min(120, 15 * attempt))
            continue
        if st != 200 or not signin.get("success"):
            last_err = (
                f"signin_failed status={st} invalid={signin.get('invalidCredentials')} "
                f"msg={signin.get('message') or signin.get('error') or signin} "
                f"attempt={attempt}/{attempts}"
            )
            time.sleep(min(60, 5 * attempt))
            continue

        st, csrf_body = call(opener, "GET", "/csrf_token")
        csrf = csrf_body.get("csrf_token") or csrf
        st, token_body = call(
            opener,
            "POST",
            "/api/v1/user/apptoken",
            {"title": f"sovereign-eda-quayorg-{int(time.time())}"},
            csrf=csrf,
        )
        token = ""
        if isinstance(token_body.get("token"), dict):
            token = token_body["token"].get("token") or ""
        elif isinstance(token_body.get("token"), str):
            token = token_body.get("token") or ""
        if st not in (200, 201) or not token:
            last_err = f"apptoken_failed status={st} body_keys={list(token_body.keys())} attempt={attempt}/{attempts}"
            time.sleep(min(60, 5 * attempt))
            continue
        print(token)
        sys.exit(0)

    print(last_err, file=sys.stderr)
    sys.exit(3)
    PY
  environment:
    QUAY_URL: "{{ quay_admin_url }}"
    QUAY_USER: "{{ quay_admin_user }}"
    QUAY_PASS: "{{ quay_admin_password }}"
    QUAY_CSRF_ATTEMPTS: "12"
  register: _quay_token_shell
  no_log: true
  changed_when: false
  retries: 3
  delay: 30
  until: (_quay_token_shell.rc | default(1) | int) == 0

- name: Set quay_api_token from CSRF apptoken flow
  when:
    - _quay_token_shell is defined
    - (_quay_token_shell.rc | default(1) | int) == 0
    - (_quay_token_shell.stdout | default('') | length) > 0
  ansible.builtin.set_fact:
    quay_api_token: "{{ _quay_token_shell.stdout | trim }}"
  no_log: true

- name: Verify Quay Bearer token with GET /api/v1/user/
  when:
    - (quay_api_token | default('') | length) > 0
    - (quay_admin_url | default('') | length) > 0
  ansible.builtin.uri:
    url: "{{ quay_admin_url | regex_replace('/$', '') }}/api/v1/user/"
    method: GET
    headers:
      Authorization: "Bearer {{ quay_api_token }}"
    validate_certs: false
    status_code: [200]
  register: _quay_user_probe
  retries: 5
  delay: 10
  until: (_quay_user_probe.status | default(0) | int) == 200
  no_log: true

- name: Assert Quay admin credentials and API token usable
  ansible.builtin.assert:
    that:
      - quay_admin_url | default('') | length > 0
      - quay_api_token | default('') | length > 0
      - (_quay_user_probe.status | default(0) | int) == 200
    fail_msg: >-
      Could not obtain a working Quay API Bearer token after wait/retry.
      Prefer a verified token from quay-admin-credentials (or Vault); CSRF
      signin is a fallback and can hit Quay 429 lockouts during ZTP.
      Password-as-Bearer is not valid Quay API auth.
