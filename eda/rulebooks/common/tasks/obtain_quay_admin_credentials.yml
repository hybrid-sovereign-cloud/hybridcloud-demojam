---
# Load Quay admin credentials from Vault path quay-admin or K8s secret.
# Database AUTHENTICATION_TYPE requires CSRF for /api/v1/signin; signin returns
# {"success": true} (no access_token). Prefer an existing OAuth/app token, else
# CSRF signin + POST /api/v1/user/apptoken to obtain a Bearer token.
- name: Read Quay admin from Vault when VAULT_TOKEN set
  when: lookup('env', 'VAULT_TOKEN') | default('', true) | length > 0
  block:
    - name: Read quay-admin from Vault
      ansible.builtin.include_tasks: vault_kv_read.yml
      vars:
        vault_kv_path: quay-admin
  rescue:
    - name: Continue without Vault for Quay
      ansible.builtin.debug:
        msg: Vault quay-admin read failed; trying K8s secret

- name: Set Quay facts from Vault
  when:
    - vault_kv_data is defined
    - (vault_kv_data.username | default('') | length) > 0
      or (vault_kv_data.token | default('') | length) > 0
  ansible.builtin.set_fact:
    quay_admin_user: "{{ vault_kv_data.username | default('') }}"
    quay_admin_password: "{{ vault_kv_data.password | default('') }}"
    quay_admin_url: "{{ vault_kv_data.url | default('') }}"
    quay_api_token: "{{ vault_kv_data.token | default(quay_api_token | default(''), true) }}"
  no_log: true

- name: Fall back to K8s quay-admin-credentials
  when: >-
    (quay_admin_user | default('') | length) == 0
    and (quay_api_token | default('') | length) == 0
  block:
    - name: Read quay-admin-credentials Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: quay-admin-credentials
        namespace: "{{ plugin_rbac_operator_namespace | default('sovereign-cloud-plugins') }}"
        host: "{{ services_api_host | default(omit) }}"
        api_key: "{{ services_bearer_token | default(omit) }}"
        validate_certs: false
      register: _quay_secret

    - name: Decode Quay admin Secret
      when: (_quay_secret.resources | default([]) | length) > 0
      ansible.builtin.set_fact:
        quay_admin_user: "{{ _quay_secret.resources[0].data.username | default('') | b64decode }}"
        quay_admin_password: "{{ _quay_secret.resources[0].data.password | default('') | b64decode }}"
        quay_admin_url: "{{ _quay_secret.resources[0].data.url | default('') | b64decode }}"
        quay_api_token: >-
          {{
            (_quay_secret.resources[0].data.token | default('') | length) > 0
            | ternary(_quay_secret.resources[0].data.token | b64decode, quay_api_token | default(''))
          }}
      no_log: true

- name: Prefer QUAY_URL env when secret url missing
  when: (quay_admin_url | default('') | length) == 0
  ansible.builtin.set_fact:
    quay_admin_url: "{{ lookup('env', 'QUAY_URL') | default('', true) }}"

- name: Set quay_url for provision roles
  when: (quay_admin_url | default('') | length) > 0
  ansible.builtin.set_fact:
    quay_url: "{{ quay_admin_url }}"

- name: Obtain Quay Bearer token via CSRF signin + apptoken when needed
  when:
    - (quay_api_token | default('') | length) == 0
    - (quay_admin_user | default('') | length) > 0
    - (quay_admin_password | default('') | length) > 0
    - (quay_admin_url | default('') | length) > 0
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json, os, ssl, sys, urllib.error, urllib.request
    from http.cookiejar import CookieJar

    base = os.environ["QUAY_URL"].rstrip("/")
    user = os.environ["QUAY_USER"]
    password = os.environ["QUAY_PASS"]
    ctx = ssl._create_unverified_context()
    jar = CookieJar()
    opener = urllib.request.build_opener(
        urllib.request.HTTPSHandler(context=ctx),
        urllib.request.HTTPCookieProcessor(jar),
    )

    def call(method, path, body=None, csrf=None):
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(base + path, data=data, method=method)
        req.add_header("Content-Type", "application/json")
        req.add_header("X-Requested-With", "XMLHttpRequest")
        if csrf:
            req.add_header("X-CSRF-Token", csrf)
        try:
            with opener.open(req, timeout=60) as resp:
                raw = resp.read()
                return resp.status, json.loads(raw.decode() or "{}")
        except urllib.error.HTTPError as e:
            raw = e.read()
            try:
                payload = json.loads(raw.decode() or "{}")
            except Exception:
                payload = {"error": raw.decode(errors="replace")[:300]}
            return e.code, payload

    st, csrf_body = call("GET", "/csrf_token")
    if st != 200 or not csrf_body.get("csrf_token"):
        print(f"csrf_failed status={st}", file=sys.stderr)
        sys.exit(2)
    csrf = csrf_body["csrf_token"]

    st, signin = call(
        "POST",
        "/api/v1/signin",
        {"username": user, "password": password},
        csrf=csrf,
    )
    if st != 200 or not signin.get("success"):
        print(
            f"signin_failed status={st} invalid={signin.get('invalidCredentials')} "
            f"msg={signin.get('message') or signin.get('error') or signin}",
            file=sys.stderr,
        )
        sys.exit(3)

    st, csrf_body = call("GET", "/csrf_token")
    csrf = csrf_body.get("csrf_token") or csrf
    st, token_body = call(
        "POST",
        "/api/v1/user/apptoken",
        {"title": "sovereign-eda-quayorg"},
        csrf=csrf,
    )
    token = ""
    if isinstance(token_body.get("token"), dict):
        token = token_body["token"].get("token") or ""
    elif isinstance(token_body.get("token"), str):
        token = token_body.get("token") or ""
    if st not in (200, 201) or not token:
        print(f"apptoken_failed status={st} body_keys={list(token_body.keys())}", file=sys.stderr)
        sys.exit(4)
    print(token)
    PY
  environment:
    QUAY_URL: "{{ quay_admin_url }}"
    QUAY_USER: "{{ quay_admin_user }}"
    QUAY_PASS: "{{ quay_admin_password }}"
  register: _quay_token_shell
  no_log: true
  changed_when: false

- name: Set quay_api_token from CSRF apptoken flow
  when:
    - _quay_token_shell is defined
    - (_quay_token_shell.rc | default(1) | int) == 0
    - (_quay_token_shell.stdout | default('') | length) > 0
  ansible.builtin.set_fact:
    quay_api_token: "{{ _quay_token_shell.stdout | trim }}"
  no_log: true

- name: Verify Quay Bearer token with GET /api/v1/user/
  when:
    - (quay_api_token | default('') | length) > 0
    - (quay_admin_url | default('') | length) > 0
  ansible.builtin.uri:
    url: "{{ quay_admin_url | regex_replace('/$', '') }}/api/v1/user/"
    method: GET
    headers:
      Authorization: "Bearer {{ quay_api_token }}"
    validate_certs: false
    status_code: [200]
  register: _quay_user_probe
  no_log: true

- name: Assert Quay admin credentials and API token usable
  ansible.builtin.assert:
    that:
      - quay_admin_url | default('') | length > 0
      - quay_api_token | default('') | length > 0
      - (_quay_user_probe.status | default(0) | int) == 200
    fail_msg: >-
      Could not obtain a working Quay API Bearer token. Database auth requires
      CSRF signin + apptoken (or a pre-seeded token in quay-admin-credentials).
      Password-as-Bearer is not valid Quay API auth.
