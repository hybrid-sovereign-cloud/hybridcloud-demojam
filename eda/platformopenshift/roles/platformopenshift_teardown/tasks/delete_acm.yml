---
# ACM/Hive cleanup on the services/hub cluster (always use services_* connection).
- name: Delete ACM OIDC Policy
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: policy.open-cluster-management.io/v1
    kind: Policy
    name: "{{ platformopenshift_cr_name }}-keycloak-oidc"
    namespace: openshift-gitops
  ignore_errors: true

- name: Delete ACM OIDC PlacementBinding
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: policy.open-cluster-management.io/v1
    kind: PlacementBinding
    name: "{{ platformopenshift_cr_name }}-keycloak-oidc-binding"
    namespace: openshift-gitops
  ignore_errors: true

- name: Delete ACM OIDC Placement
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: "{{ platformopenshift_cr_name }}-keycloak-oidc-placement"
    namespace: openshift-gitops
  ignore_errors: true

- name: Delete cluster RBAC Policy
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: policy.open-cluster-management.io/v1
    kind: Policy
    name: "{{ platformopenshift_cr_name }}-cluster-rbac"
    namespace: openshift-gitops
  ignore_errors: true

- name: Delete cluster RBAC PlacementBinding
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: policy.open-cluster-management.io/v1
    kind: PlacementBinding
    name: "{{ platformopenshift_cr_name }}-cluster-rbac-binding"
    namespace: openshift-gitops
  ignore_errors: true

- name: Delete cluster RBAC Placement
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: "{{ platformopenshift_cr_name }}-cluster-rbac-placement"
    namespace: openshift-gitops
  ignore_errors: true

- name: Delete ManagedCluster
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ platformopenshift_cr_name }}"
  ignore_errors: true

- name: Wait for ManagedCluster deletion
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ platformopenshift_cr_name }}"
  register: mc_wait
  until: (mc_wait.resources | default([]) | length) == 0
  retries: 36
  delay: 10
  ignore_errors: true

# Detached clusters (HC already gone) leave ManagedCluster finalizers stuck.
- name: Strip ManagedCluster finalizers when deletion is stuck
  when: (mc_wait.resources | default([]) | length) > 0
  kubernetes.core.k8s_json_patch:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ platformopenshift_cr_name }}"
    patch:
      - op: replace
        path: /metadata/finalizers
        value: []
  ignore_errors: true

- name: Re-delete ManagedCluster after finalizer strip
  when: (mc_wait.resources | default([]) | length) > 0
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ platformopenshift_cr_name }}"
  ignore_errors: true

- name: Delete leftover cluster namespace on hub
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ platformopenshift_cr_name }}"
  ignore_errors: true
