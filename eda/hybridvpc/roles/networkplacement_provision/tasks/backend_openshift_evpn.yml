---
# Backend: PlatformOpenshift / CloudVirt — CUDN EVPN on the spoke OCP API
# (design/fabric.md §8.5.2 / §10.2). Included by networkplacement_provision
# main.yml when spec.backend.kind is PlatformOpenshift or CloudVirt.
#
# Expected vars: np_spec, np_backend_name, np_vni, np_canonical_rt,
#                np_domain_asn, networkplacement_cr_name/namespace,
#                hn_fabric_cr (HybridFabric detail; used for RR addresses)
#
# Sets facts:
#   np_backend_applied, np_backend_ready, np_backend_message
#   np_backend_fail_reason

- name: Read PlatformOpenshift backend CR (spoke identity + kubeconfig path)
  when: np_spec.backend.kind == 'PlatformOpenshift'
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: PlatformOpenshift
    name: "{{ np_backend_name }}"
    namespace: "{{ networkplacement_cr_namespace }}"
  register: np_po_lookup

- name: Set spoke kubeconfig Vault path fact
  ansible.builtin.set_fact:
    np_spoke_kubeconfig_path: >-
      {{
        (np_po_lookup.resources | default([{}]))[0].status.kubeconfigVaultPath | default('')
        if np_spec.backend.kind == 'PlatformOpenshift'
        else ''
      }}

- name: Set backend-not-found facts when PlatformOpenshift backend missing
  when:
    - np_spec.backend.kind == 'PlatformOpenshift'
    - np_po_lookup.resources | default([]) | length == 0
  ansible.builtin.set_fact:
    np_backend_applied: false
    np_backend_ready: false
    np_backend_fail_reason: BackendNotFound
    np_backend_message: "PlatformOpenshift {{ np_backend_name }} not found in {{ networkplacement_cr_namespace }}"

- name: Try HostedCluster admin-kubeconfig Secret when Vault path missing (hosted)
  when:
    - np_spec.backend.kind == 'PlatformOpenshift'
    - (np_spoke_kubeconfig_path | default('')) | length == 0
    - (np_po_lookup.resources | default([]) | length > 0)
    - (np_po_lookup.resources[0].spec.type | default('')) == 'hosted'
  block:
    - name: Read HostedCluster admin-kubeconfig from hub
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: Secret
        name: "{{ np_backend_name }}-admin-kubeconfig"
        namespace: "clusters-{{ np_backend_name }}"
      register: np_hc_kube_secret
      failed_when: false

    - name: Materialize spoke kubeconfig from HostedCluster Secret
      when:
        - np_hc_kube_secret.resources | default([]) | length > 0
        - (np_hc_kube_secret.resources[0].data.kubeconfig | default('')) | length > 0
      block:
        - name: Write spoke kubeconfig from HostedCluster Secret
          ansible.builtin.copy:
            content: "{{ np_hc_kube_secret.resources[0].data.kubeconfig | b64decode }}"
            dest: "/tmp/np-{{ networkplacement_cr_name }}-spoke-kubeconfig"
            mode: "0600"
          no_log: true

        - name: Mark HostedCluster kubeconfig available for CUDN apply
          ansible.builtin.set_fact:
            np_spoke_kubeconfig_file: "/tmp/np-{{ networkplacement_cr_name }}-spoke-kubeconfig"
            np_spoke_kubeconfig_path: "hostedcluster://clusters-{{ np_backend_name }}/{{ np_backend_name }}-admin-kubeconfig"

- name: Set EvpnPrepPending facts when spoke kubeconfig is unavailable
  when:
    - (np_po_lookup.resources | default([]) | length > 0) or np_spec.backend.kind == 'CloudVirt'
    - (np_spoke_kubeconfig_path | default('')) | length == 0
    - (np_spoke_kubeconfig_file | default('')) | length == 0
  ansible.builtin.set_fact:
    np_backend_applied: false
    np_backend_ready: false
    np_backend_fail_reason: EvpnPrepPending
    np_backend_message: >-
      EvpnPrepPending: spoke kubeconfig unavailable for backend {{ np_backend_name }};
      CUDN/FRR/VTEP/RA apply deferred until PlatformOpenshift.status.kubeconfigVaultPath
      is set or HostedCluster admin-kubeconfig Secret exists.

- name: Apply CUDN-shaped EVPN objects on the spoke (best-effort)
  when: >-
    (np_spoke_kubeconfig_path | default('')) | length > 0
    or (np_spoke_kubeconfig_file | default('')) | length > 0
  block:
    - name: Read spoke kubeconfig from Vault
      when:
        - (np_spoke_kubeconfig_file | default('')) | length == 0
        - not (np_spoke_kubeconfig_path | default('') | regex_search('^hostedcluster://'))
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
      vars:
        vault_kv_path: "{{ np_spoke_kubeconfig_path }}"

    - name: Write spoke kubeconfig from Vault when needed
      when:
        - (np_spoke_kubeconfig_file | default('')) | length == 0
        - (vault_kv_data.kubeconfig | default('')) | length > 0
      ansible.builtin.copy:
        content: "{{ vault_kv_data.kubeconfig }}"
        dest: "/tmp/np-{{ networkplacement_cr_name }}-spoke-kubeconfig"
        mode: "0600"
      no_log: true

    - name: Set spoke kubeconfig file path fact
      ansible.builtin.set_fact:
        np_spoke_kubeconfig_file: "{{ np_spoke_kubeconfig_file | default('/tmp/np-' ~ networkplacement_cr_name ~ '-spoke-kubeconfig') }}"

    - name: Stat spoke kubeconfig file
      ansible.builtin.stat:
        path: "{{ np_spoke_kubeconfig_file }}"
      register: np_spoke_kube_stat

    - name: Set spoke-kubeconfig-unreadable facts when no kubeconfig file
      when: not (np_spoke_kube_stat.stat.exists | default(false))
      ansible.builtin.set_fact:
        np_backend_applied: false
        np_backend_ready: false
        np_backend_fail_reason: EvpnPrepPending
        np_backend_message: "EvpnPrepPending: no readable spoke kubeconfig for {{ np_backend_name }}."

    - name: Realize CUDN/FRR/RA on the spoke when kubeconfig file exists
      when: np_spoke_kube_stat.stat.exists | default(false)
      block:
        - name: Reset FRR neighbor accumulator
          ansible.builtin.set_fact:
            np_frr_neighbors: []

        # Hub RR pods use local ASN = min(domainAsn) across fabrics that share the
        # same routeReflector address (one BGP instance per IP:179). Spoke neighbor
        # ASN must match that hub local ASN — not necessarily this fabric's domainAsn.
        - name: List HybridFabrics for shared hub ASN resolution
          kubernetes.core.k8s_info:
            host: "{{ services_api_host }}"
            api_key: "{{ services_bearer_token }}"
            validate_certs: false
            api_version: hybridsovereign.redhat/v1alpha1
            kind: HybridFabric
            namespace: "{{ networkplacement_cr_namespace | default(hn_fabric_cr.metadata.namespace) | default('sovereign-cloud') }}"
          register: np_hub_fabrics_lookup
          failed_when: false

        - name: Resolve hub RR local ASN for spoke FRR neighbors
          ansible.builtin.shell: |
            python3 <<'PY'
            import json, os
            fabrics = json.loads(os.environ["FABRICS"])
            my_addrs = set(json.loads(os.environ["MY_ADDRS"]))
            asns = set()
            for fab in fabrics:
                spec = fab.get("spec") or {}
                asn = spec.get("domainAsn")
                rrs = spec.get("routeReflectors") or []
                if asn is None:
                    continue
                addrs = {rr.get("address") for rr in rrs if rr.get("address")}
                if addrs & my_addrs:
                    asns.add(int(asn))
            if not asns:
                asns.add(int(os.environ.get("FALLBACK_ASN") or "0"))
            print(min(asns))
            PY
          environment:
            FABRICS: "{{ np_hub_fabrics_lookup.resources | default([hn_fabric_cr]) | to_json }}"
            MY_ADDRS: "{{ hn_fabric_cr.spec.routeReflectors | default([]) | map(attribute='address') | list | to_json }}"
            FALLBACK_ASN: "{{ hn_fabric_cr.spec.domainAsn | default(0) | string }}"
          register: np_hub_asn_cmd
          changed_when: false
          failed_when: false

        - name: Set hub local ASN fact
          ansible.builtin.set_fact:
            np_hub_rr_asn: >-
              {{
                (np_hub_asn_cmd.stdout | trim | int)
                if (np_hub_asn_cmd.rc | default(1) == 0 and (np_hub_asn_cmd.stdout | trim | length) > 0)
                else (hn_fabric_cr.spec.domainAsn | default(0) | int)
              }}

        - name: Build FRR neighbor list from fabric route reflectors
          ansible.builtin.set_fact:
            np_frr_neighbors: "{{ np_frr_neighbors + [{'address': item.address, 'asn': (np_hub_rr_asn | int)}] }}"
          loop: "{{ hn_fabric_cr.spec.routeReflectors | default([]) }}"
          loop_control:
            label: "{{ item.name | default(item.address) }}"

        - name: Reset CUDN subnet accumulator
          ansible.builtin.set_fact:
            np_cudn_subnets: []

        - name: Build CUDN subnet list from placement prefixes
          # hostSubnet must be MORE specific than cidr (OCP CUDN validation).
          # For a /24 placement prefix use /26 node slices; never equal masks.
          ansible.builtin.set_fact:
            np_cudn_subnets: >-
              {{
                np_cudn_subnets + [{
                  'cidr': item,
                  'hostSubnet': (
                    [28, (item.split('/')[1] | int) + 2] | min
                  )
                }]
              }}
          loop: "{{ np_spec.prefixes | default([]) }}"

        - name: Apply FRRConfiguration on the spoke (BGP neighbors = fabric RRs)
          kubernetes.core.k8s:
            kubeconfig: "/tmp/np-{{ networkplacement_cr_name }}-spoke-kubeconfig"
            validate_certs: false
            state: present
            definition:
              apiVersion: frrk8s.metallb.io/v1beta1
              kind: FRRConfiguration
              metadata:
                name: "{{ np_spec.network }}-evpn"
                namespace: openshift-frr-k8s
                labels:
                  evpn: "true"
                  hybridsovereign.redhat/fabric: "{{ hn_selected_fabric_name | default('') }}"
              spec:
                nodeSelector: {}
                bgp:
                  routers:
                    - asn: "{{ np_domain_asn | int }}"
                      neighbors: "{{ np_frr_neighbors }}"
          register: np_frr_apply
          ignore_errors: true

        - name: Write CUDN manifest JSON (integer VNI — avoid Jinja stringification)
          ansible.builtin.copy:
            dest: "/tmp/np-{{ networkplacement_cr_name }}-cudn.json"
            mode: "0600"
            content: |
              {
                "apiVersion": "k8s.ovn.org/v1",
                "kind": "ClusterUserDefinedNetwork",
                "metadata": {
                  "name": {{ np_spec.network | to_json }},
                  "labels": {
                    "hybridsovereign.redhat/network": {{ np_spec.network | to_json }},
                    "hybridsovereign.redhat/fabric": {{ (hn_selected_fabric_name | default('')) | to_json }},
                    "advertise": "true"
                  }
                },
                "spec": {
                  "namespaceSelector": {
                    "matchLabels": {
                      "hybridsovereign.redhat/hybridnetwork": {{ np_spec.network | to_json }}
                    }
                  },
                  "network": {
                    "topology": "Layer3",
                    "layer3": {
                      "role": "Primary",
                      "subnets": {{ np_cudn_subnets | to_json }}
                    },
                    "transport": "EVPN",
                    "evpn": {
                      "vtep": {{ (np_spec.network ~ '-evpn-vtep') | to_json }},
                      "ipVRF": {
                        "vni": {{ np_vni | int }},
                        "routeTarget": {{ np_canonical_rt | to_json }}
                      }
                    }
                  }
                }
              }

        - name: Apply ClusterUserDefinedNetwork on the spoke (transport EVPN)
          kubernetes.core.k8s:
            kubeconfig: "/tmp/np-{{ networkplacement_cr_name }}-spoke-kubeconfig"
            validate_certs: false
            state: present
            src: "/tmp/np-{{ networkplacement_cr_name }}-cudn.json"
          register: np_cudn_apply
          ignore_errors: true

        - name: Apply RouteAdvertisements on the spoke
          kubernetes.core.k8s:
            kubeconfig: "/tmp/np-{{ networkplacement_cr_name }}-spoke-kubeconfig"
            validate_certs: false
            state: present
            definition:
              apiVersion: k8s.ovn.org/v1
              kind: RouteAdvertisements
              metadata:
                name: "advertise-{{ np_spec.network }}-evpn"
              spec:
                advertisements: ["PodNetwork"]
                frrConfigurationSelector:
                  matchLabels:
                    evpn: "true"
                networkSelectors:
                  - networkSelectionType: ClusterUserDefinedNetworks
                    clusterUserDefinedNetworkSelector:
                      networkSelector:
                        matchLabels:
                          hybridsovereign.redhat/network: "{{ np_spec.network }}"
          register: np_ra_apply
          ignore_errors: true

        - name: Set backend-applied facts (CUDN required; FRR/RA optional when CRDs absent)
          ansible.builtin.set_fact:
            np_backend_applied: "{{ not (np_cudn_apply is failed) }}"
            np_backend_ready: "{{ not (np_cudn_apply is failed) }}"
            np_backend_fail_reason: >-
              {{
                ''
                if not (np_cudn_apply is failed)
                else 'BackendApplyFailed'
              }}
            np_backend_message: >-
              {{
                (
                  'CUDN applied on spoke for HybridNetwork '
                  ~ np_spec.network
                  ~ ' (vni=' ~ (np_vni | string) ~ ', rt=' ~ np_canonical_rt ~ ').'
                  ~ (
                    ' FRRConfiguration skipped/unavailable: '
                    ~ (np_frr_apply.msg | default('ok'))
                    if (np_frr_apply is failed) else ' FRRConfiguration applied.'
                  )
                  ~ (
                    ' RouteAdvertisements skipped/unavailable: '
                    ~ (np_ra_apply.msg | default('ok'))
                    if (np_ra_apply is failed) else ' RouteAdvertisements applied.'
                  )
                )
                if not (np_cudn_apply is failed)
                else (
                  'CUDN apply failed on spoke: '
                  ~ (np_cudn_apply.msg | default('unknown error'))
                )
              }}
