---
# Backend: CloudOSO — RHOSO 18.0 FR6 native OVN BGP-EVPN (design/fabric.md §10.3).
# Included by networkplacement_provision main.yml when
# spec.backend.kind == CloudOSO.
#
# Expected vars: np_spec, np_backend_name, np_vni, np_canonical_rt,
#                np_domain_asn, networkplacement_cr_name/namespace
#
# Sets facts:
#   np_backend_applied, np_backend_ready, np_backend_message
#   np_backend_fail_reason
#   np_neutron_network_id / np_neutron_subnet_id / np_neutron_router_id

- name: Read CloudOSO backend CR
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudOSO
    name: "{{ np_backend_name }}"
    namespace: "{{ networkplacement_cr_namespace }}"
  register: np_cloudoso_lookup

- name: Set backend-not-found facts when CloudOSO missing
  when: np_cloudoso_lookup.resources | default([]) | length == 0
  ansible.builtin.set_fact:
    np_backend_applied: false
    np_backend_ready: false
    np_backend_fail_reason: CloudOSONotFound
    np_backend_message: "CloudOSO {{ np_backend_name }} not found in {{ networkplacement_cr_namespace }}"

- name: Continue only when CloudOSO backend was found
  when: np_cloudoso_lookup.resources | default([]) | length > 0
  block:
    - name: Set CloudOSO fact
      ansible.builtin.set_fact:
        np_cloudoso: "{{ np_cloudoso_lookup.resources[0] }}"

    - name: Probe RHOSO FR6 native OVN BGP-EVPN support
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/openstack_fr6_probe.yml"

    # Always attempt Neutron network/subnet realization so the tenant project
    # shows a visible network even when FR6 EVPN is unavailable. EVPN router
    # create remains gated on fr6_probe_available (and still fail-softs when
    # Neutron rejects --evpn-vni despite CLI help advertising it).
    - name: Realize Neutron network (and FR6 EVPN router when available)
      block:
        # Prefer the CloudOSO-provisioned per-project clouds.yaml written to
        # Vault at oso/projects/<name>/clouds-config (app-cred scoped). Fall
        # back to credentialsSecretRef in the entity namespace, then optional
        # spec.vaultPath. Never default to oso/accounts/shc_admin (404).
        - name: Reset clouds.yaml accumulator
          ansible.builtin.set_fact:
            vault_kv_data: {}
            np_clouds_yaml_source: ""
            np_backend_fail_reason: ""

        - name: Attempt to load per-project clouds.yaml from Vault
          ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/vault_kv_read.yml"
          vars:
            vault_kv_path: >-
              {{
                np_cloudoso.spec.vaultPath
                | default('oso/projects/' ~ np_backend_name ~ '/clouds-config', true)
              }}
          ignore_errors: true

        - name: Record Vault clouds.yaml when present
          when: (vault_kv_data['clouds.yaml'] | default('')) | length > 0
          ansible.builtin.set_fact:
            np_clouds_yaml_source: vault

        - name: Fall back to credentialsSecretRef in entity namespace
          when: (vault_kv_data['clouds.yaml'] | default('')) | length == 0
          block:
            - name: Read CloudOSO credentials Secret
              kubernetes.core.k8s_info:
                host: "{{ services_api_host }}"
                api_key: "{{ services_bearer_token }}"
                validate_certs: false
                kind: Secret
                name: "{{ np_cloudoso.spec.credentialsSecretRef.name | default('') }}"
                namespace: "{{ networkplacement_cr_namespace }}"
              register: np_clouds_secret
              failed_when: false
              when: (np_cloudoso.spec.credentialsSecretRef.name | default('')) | length > 0

            - name: Decode clouds.yaml from Secret
              when: (np_clouds_secret.resources | default([])) | length > 0
              ansible.builtin.set_fact:
                vault_kv_data:
                  clouds.yaml: >-
                    {{
                      (np_clouds_secret.resources[0].data['clouds.yaml'] | default(''))
                      | b64decode
                    }}
                np_clouds_yaml_source: secret

        - name: Set credentials-unavailable facts when clouds.yaml missing
          when: (vault_kv_data['clouds.yaml'] | default('')) | length == 0
          ansible.builtin.set_fact:
            np_backend_applied: false
            np_backend_ready: false
            np_backend_fail_reason: OpenStackCredentialsUnavailable
            np_backend_message: >-
              OpenStack clouds.yaml unavailable for CloudOSO {{ np_backend_name }}
              (tried Vault oso/projects/{{ np_backend_name }}/clouds-config and
              credentialsSecretRef); Neutron network for
              {{ networkplacement_cr_name }} deferred.

        - name: Create Neutron network/subnet/EVPN router when credentials are available
          when: (vault_kv_data['clouds.yaml'] | default('')) | length > 0
          block:
            - name: Write clouds.yaml for this NetworkPlacement job (lab TLS + tenant project)
              ansible.builtin.shell: |
                python3 - <<'PY'
                import yaml, pathlib, os
                src = os.environ["CLOUDS_YAML"]
                region = os.environ.get("FORCE_REGION", "").strip()
                project = os.environ.get("FORCE_PROJECT", "").strip()
                domain = os.environ.get("FORCE_PROJECT_DOMAIN", "Default").strip() or "Default"
                cfg = yaml.safe_load(src)
                for _name, cloud in (cfg.get("clouds") or {}).items():
                    if isinstance(cloud, dict):
                        cloud["verify"] = False
                        if region:
                            cloud["region_name"] = region
                        auth = cloud.get("auth") or {}
                        # Password-auth admin clouds.yaml: force tenant project so
                        # networks appear in CloudOSO.status.projectName / spec.project.
                        # Application-credential auth is already project-scoped.
                        if project and auth.get("username") and not auth.get("application_credential_id"):
                            auth["project_name"] = project
                            auth["project_domain_name"] = domain
                            cloud["auth"] = auth
                dest = pathlib.Path(os.environ["DEST"])
                dest.write_text(yaml.safe_dump(cfg, default_flow_style=False))
                dest.chmod(0o600)
                PY
              environment:
                CLOUDS_YAML: "{{ vault_kv_data['clouds.yaml'] }}"
                DEST: "/tmp/np-{{ networkplacement_cr_name }}-clouds.yaml"
                # Prefer CloudGateway.spec.region when set; else regionOne (RHOSO lab).
                FORCE_REGION: "{{ (np_gateway.spec.region | default('regionOne')) if (np_gateway is defined) else 'regionOne' }}"
                FORCE_PROJECT: >-
                  {{
                    np_cloudoso.status.projectName
                    | default(np_cloudoso.spec.project | default(''), true)
                  }}
                FORCE_PROJECT_DOMAIN: >-
                  {{
                    np_cloudoso.status.domainName
                    | default(np_cloudoso.spec.projectDomain | default('Default'), true)
                  }}
              no_log: true

            - name: Resolve cloud name from clouds.yaml
              ansible.builtin.set_fact:
                np_os_cloud_name: "{{ (vault_kv_data['clouds.yaml'] | from_yaml).clouds.keys() | list | first }}"
                np_os_env:
                  OS_CLIENT_CONFIG_FILE: "/tmp/np-{{ networkplacement_cr_name }}-clouds.yaml"
                  PYTHONWARNINGS: ignore:Unverified HTTPS request

            # AAP default EE often has openstacksdk but not the `openstack` CLI.
            # Realize network/subnet via SDK so placements succeed without a DE rebuild.
            - name: Ensure Neutron network + subnet(s) via openstacksdk
              ansible.builtin.shell: |
                python3 - <<'PY'
                import json, os, sys, yaml
                try:
                    import openstack
                except ImportError as e:
                    print(json.dumps({"error": "openstacksdk missing: %s" % e}))
                    sys.exit(2)
                cfg_path = os.environ["OS_CLIENT_CONFIG_FILE"]
                cloud_name = os.environ.get("OS_CLOUD") or "{{ np_os_cloud_name }}"
                net_name = "{{ np_spec.network }}-{{ np_backend_name }}"
                prefixes = json.loads(os.environ["PREFIXES_JSON"])
                with open(cfg_path) as f:
                    cfg = yaml.safe_load(f)
                cloud = (cfg.get("clouds") or {}).get(cloud_name) or next(iter((cfg.get("clouds") or {}).values()))
                auth = dict(cloud.get("auth") or {})
                verify = cloud.get("verify", True)
                if isinstance(verify, str):
                    verify = verify.lower() not in ("0", "false", "no")
                conn = openstack.connect(
                    auth=auth,
                    region_name=cloud.get("region_name", "regionOne"),
                    identity_api_version="3",
                    interface=cloud.get("interface", "public"),
                    verify=cloud.get("cacert", verify),
                )
                net = conn.network.find_network(net_name)
                created_net = False
                if net is None:
                    net = conn.network.create_network(name=net_name)
                    created_net = True
                subnet_ids = []
                created_subnets = False
                for idx, cidr in enumerate(prefixes):
                    sname = "%s-subnet-%s" % (net_name, idx)
                    subnet = conn.network.find_subnet(sname)
                    if subnet is None:
                        subnet = conn.network.create_subnet(
                            name=sname,
                            network_id=net.id,
                            cidr=cidr,
                            ip_version=4,
                        )
                        created_subnets = True
                    subnet_ids.append(subnet.id)
                print(json.dumps({
                    "network_id": net.id,
                    "subnet_ids": subnet_ids,
                    "created_net": created_net,
                    "created_subnets": created_subnets,
                }))
                PY
              environment: "{{ np_os_env | combine({'OS_CLOUD': np_os_cloud_name, 'PREFIXES_JSON': (np_spec.prefixes | default([]) | to_json)}) }}"
              register: np_sdk_net_raw
              changed_when: >-
                (np_sdk_net_raw.rc | default(1) | int) == 0
                and (
                  ((np_sdk_net_raw.stdout | default('{}') | from_json).created_net | default(false))
                  or ((np_sdk_net_raw.stdout | default('{}') | from_json).created_subnets | default(false))
                )
              failed_when: >-
                (np_sdk_net_raw.rc | default(1) | int) != 0
                or ('error' in ((np_sdk_net_raw.stdout | default('{}', true)) | from_json))

            - name: Set Neutron network/subnet id facts from SDK result
              ansible.builtin.set_fact:
                np_neutron_network_id: "{{ (np_sdk_net_raw.stdout | from_json).network_id }}"
                np_neutron_subnet_ids: "{{ (np_sdk_net_raw.stdout | from_json).subnet_ids | default([]) }}"
                np_neutron_subnet_id: >-
                  {{
                    (
                      (np_sdk_net_raw.stdout | from_json).subnet_ids | default([])
                      | first
                    ) | default('', true)
                  }}

            # Look up by name only (existence). Do NOT use `-c id -c evpn_vni`
            # with `-f value` — multi-column value output order is ambiguous and
            # previously caused np_neutron_router_id to be set to the VNI.
            - name: Look up existing EVPN router
              when: fr6_probe_available | default(false)
              ansible.builtin.command: >-
                openstack --os-cloud {{ np_os_cloud_name }} router show
                {{ np_spec.network }}-{{ np_backend_name }}-evpn-rtr
                -f value -c id
              environment: "{{ np_os_env }}"
              register: np_router_existing
              changed_when: false
              failed_when: false

            - name: Create EVPN router when missing (--evpn-vni MUST equal HybridNetwork.status.vni)
              when:
                - fr6_probe_available | default(false)
                - (np_router_existing.rc | default(1) | int) != 0
              ansible.builtin.command: >-
                openstack --os-cloud {{ np_os_cloud_name }} router create
                --evpn-vni {{ np_vni }} {{ np_spec.network }}-{{ np_backend_name }}-evpn-rtr
                -f value -c id
              environment: "{{ np_os_env }}"
              register: np_router_create
              changed_when: (np_router_create.rc | default(1) | int) == 0
              failed_when: false

            # CLI --help can advertise --evpn-vni even when Neutron API lacks FR6.
            # Treat Unrecognized attribute(s) 'evpn_vni' as Fr6EvpnUnavailable (design §10.3.2).
            - name: Detect server-side FR6 EVPN API unavailable
              when:
                - fr6_probe_available | default(false)
                - (np_router_existing.rc | default(1) | int) != 0
                - (np_router_create.rc | default(1) | int) != 0
                - >-
                  ('evpn_vni' in (np_router_create.stderr | default('')))
                  or ('Unrecognized attribute' in (np_router_create.stderr | default('')))
              ansible.builtin.set_fact:
                np_backend_fail_reason: Fr6EvpnDeferred
                fr6_probe_available: false

            - name: Show EVPN router JSON (canonical id + VNI)
              when:
                - fr6_probe_available | default(false)
                - np_backend_fail_reason | default('') not in ['Fr6EvpnUnavailable', 'Fr6EvpnDeferred']
              ansible.builtin.command: >-
                openstack --os-cloud {{ np_os_cloud_name }} router show
                {{ np_spec.network }}-{{ np_backend_name }}-evpn-rtr
                -f json
              environment: "{{ np_os_env }}"
              register: np_router_show_json
              changed_when: false
              failed_when: false

            - name: Parse router show JSON and set router id
              when:
                - fr6_probe_available | default(false)
                - np_backend_fail_reason | default('') not in ['Fr6EvpnUnavailable', 'Fr6EvpnDeferred']
                - (np_router_show_json.rc | default(1) | int) == 0
              ansible.builtin.set_fact:
                np_router_obj: "{{ np_router_show_json.stdout | from_json }}"
                np_neutron_router_id: "{{ (np_router_show_json.stdout | from_json).id | default('') | trim }}"

            - name: Fall back to create/show value id when JSON show failed
              when:
                - fr6_probe_available | default(false)
                - np_backend_fail_reason | default('') not in ['Fr6EvpnUnavailable', 'Fr6EvpnDeferred']
                - (np_neutron_router_id | default('')) | length == 0
              ansible.builtin.set_fact:
                np_neutron_router_id: >-
                  {{
                    (
                      (np_router_existing.stdout | default(''))
                      if (np_router_existing.rc | default(1) | int) == 0
                      else (np_router_create.stdout | default(''))
                    ) | trim
                  }}

            - name: Fail closed when adopted router VNI mismatches HybridNetwork VNI
              when:
                - fr6_probe_available | default(false)
                - np_backend_fail_reason | default('') == ''
                - np_router_obj is defined
                - (np_router_obj.evpn_vni | default('') | string) | length > 0
                - (np_router_obj.evpn_vni | string) != (np_vni | string)
              ansible.builtin.set_fact:
                np_backend_applied: false
                np_backend_ready: false
                np_backend_fail_reason: EvpnVniMismatch
                np_backend_message: >-
                  EVPN router {{ np_spec.network }}-{{ np_backend_name }}-evpn-rtr has
                  evpn_vni={{ np_router_obj.evpn_vni }} but HybridNetwork VNI is {{ np_vni }}.

            # Design §10.3.3 step 4: attach with --advertise-host. If the subnet
            # was previously attached without advertise-host, remove+re-add so
            # Type-5 host-route advertisement is actually enabled (adopt path).
            - name: Advertise subnet host routes into the EVPN router
              when:
                - fr6_probe_available | default(false)
                - np_backend_fail_reason | default('') == ''
                - (np_neutron_router_id | default('')) | length > 0
              ansible.builtin.shell: |
                set -euo pipefail
                RTR="{{ np_spec.network }}-{{ np_backend_name }}-evpn-rtr"
                SUB="{{ np_spec.network }}-{{ np_backend_name }}-subnet-{{ item }}"
                OUT=$(openstack --os-cloud {{ np_os_cloud_name }} router add subnet --advertise-host "$RTR" "$SUB" 2>&1) && {
                  echo "$OUT"
                  exit 0
                }
                if echo "$OUT" | grep -qi 'already has a port on subnet'; then
                  openstack --os-cloud {{ np_os_cloud_name }} router remove subnet "$RTR" "$SUB"
                  openstack --os-cloud {{ np_os_cloud_name }} router add subnet --advertise-host "$RTR" "$SUB"
                  echo "re-attached $SUB on $RTR with --advertise-host"
                  exit 0
                fi
                echo "$OUT" >&2
                exit 1
              environment: "{{ np_os_env }}"
              loop: "{{ range(0, np_spec.prefixes | default([]) | length) | list }}"
              register: np_router_add_subnet
              changed_when: >-
                ('re-attached' in (np_router_add_subnet.stdout | default('')))
                or (np_router_add_subnet.rc | default(1) | int) == 0
              failed_when: (np_router_add_subnet.rc | default(1) | int) != 0

            - name: Set backend-applied facts (FR6 EVPN router Ready)
              when:
                - fr6_probe_available | default(false)
                - np_backend_fail_reason | default('') == ''
              ansible.builtin.set_fact:
                np_backend_applied: "{{ (np_neutron_router_id | default('')) | length > 0 }}"
                np_backend_ready: "{{ (np_neutron_router_id | default('')) | length > 0 }}"
                np_backend_message: >-
                  {{
                    'RHOSO FR6 EVPN router ' ~ (np_spec.network ~ '-' ~ np_backend_name ~ '-evpn-rtr') ~
                    ' id=' ~ (np_neutron_router_id | default('')) ~
                    ' net=' ~ (np_neutron_network_id | default('')) ~
                    ' subnet=' ~ (np_neutron_subnet_id | default('')) ~
                    ' vni=' ~ np_vni ~ ' rt=' ~ np_canonical_rt ~
                    ' realized on ' ~ np_backend_name ~ '.'
                    if (np_neutron_router_id | default('')) | length > 0
                    else (
                      'EVPN router create/show failed on CloudOSO ' ~ np_backend_name ~ ': '
                      ~ (np_router_create.stderr | default(np_router_existing.stderr | default('see job log')) | trim)
                    )
                  }}
                np_backend_fail_reason: "{{ '' if (np_neutron_router_id | default('')) | length > 0 else 'BackendApplyFailed' }}"

            - name: Set backend-applied facts (Neutron network Ready; EVPN deferred)
              when:
                - not (fr6_probe_available | default(false))
                - (np_neutron_network_id | default('')) | length > 0
                - np_backend_fail_reason | default('') in ['', 'Fr6EvpnDeferred', 'Fr6EvpnUnavailable']
              ansible.builtin.set_fact:
                np_backend_applied: true
                np_backend_ready: true
                np_backend_fail_reason: Fr6EvpnDeferred
                np_backend_message: >-
                  Neutron network {{ np_spec.network }}-{{ np_backend_name }}
                  id={{ np_neutron_network_id }} subnet={{ np_neutron_subnet_id }}
                  realized on CloudOSO {{ np_backend_name }} (EvpnDeferred:
                  {{ fr6_probe_message | default('FR6 EVPN unavailable') }}).
