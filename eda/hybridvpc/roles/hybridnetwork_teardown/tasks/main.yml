---
# HybridNetwork teardown — release VNI only when zero placements remain
# (design/fabric.md §8.4 "Teardown" row).
- block:
    - name: Parse event payload
      ansible.builtin.set_fact:
        hybridnetwork_cr_name: "{{ event_payload.regarding.name }}"
        hybridnetwork_cr_namespace: "{{ event_payload.regarding.namespace }}"

    - name: Resolve services cluster API connection from Vault
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/resolve_services_cluster_connection.yml"

    - name: Read HybridNetwork CR
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: HybridNetwork
        name: "{{ hybridnetwork_cr_name }}"
        namespace: "{{ hybridnetwork_cr_namespace }}"
      register: hn_teardown_cr_lookup

    - name: List NetworkPlacements still referencing this HybridNetwork
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: hybridsovereign.redhat/v1alpha1
        kind: NetworkPlacement
        namespace: "{{ hybridnetwork_cr_namespace }}"
      register: hn_teardown_all_placements
      when: hn_teardown_cr_lookup.resources | default([]) | length > 0

    - name: Compute remaining placement count
      ansible.builtin.set_fact:
        hn_teardown_placement_count: >-
          {{
            hn_teardown_all_placements.resources
            | default([])
            | selectattr('spec.network', 'defined')
            | selectattr('spec.network', 'equalto', hybridnetwork_cr_name)
            | rejectattr('spec.state', 'equalto', 'absent')
            | list
            | length
          }}

    # BLOCK: do not release the VNI (or complete deletion) while any
    # NetworkPlacement still references this HybridNetwork.
    - name: Block teardown while placements remain
      when: hn_teardown_placement_count | int > 0
      block:
        - ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
          vars:
            cr_api_version: hybridsovereign.redhat/v1alpha1
            cr_plural: hybridnetworks
            cr_name: "{{ hybridnetwork_cr_name }}"
            cr_namespace: "{{ hybridnetwork_cr_namespace }}"
            cr_status_body:
              status: failed
              ready: false
              deletionComplete: false
              message: >-
                Blocked: {{ hn_teardown_placement_count }} NetworkPlacement(s) still
                reference HybridNetwork {{ hybridnetwork_cr_name }}. Remove them first.
              lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"
        - ansible.builtin.fail:
            msg: >-
              HybridNetwork {{ hybridnetwork_cr_name }} teardown blocked:
              {{ hn_teardown_placement_count }} NetworkPlacement(s) still reference it.

    - name: Release VNI from fabric numbering ledger (safe — zero placements remain)
      when:
        - hn_teardown_placement_count | int == 0
        - hn_teardown_cr_lookup.resources | default([]) | length > 0
        - (hn_teardown_cr_lookup.resources[0].status.fabric | default('')) | length > 0
        - (hn_teardown_cr_lookup.resources[0].status.allocated | default(false)) | bool
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/fabric_numbering_release.yml"
      vars:
        fn_fabric_name: "{{ hn_teardown_cr_lookup.resources[0].status.fabric }}"
        fn_fabric_namespace: sovereign-cloud
        fn_alloc_key: "{{ hybridnetwork_cr_namespace }}/{{ hybridnetwork_cr_name }}"

    - name: Mark deletion complete
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: hybridnetworks
        cr_name: "{{ hybridnetwork_cr_name }}"
        cr_namespace: "{{ hybridnetwork_cr_namespace }}"
        cr_status_body:
          status: ready
          ready: true
          allocated: false
          deletionComplete: true
          message: "VNI released (0 placements remaining) and HybridNetwork torn down."
          lastReconciledAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%S.000000Z') }}"

  rescue:
    - name: Mark teardown failed
      ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
      vars:
        cr_api_version: hybridsovereign.redhat/v1alpha1
        cr_plural: hybridnetworks
        cr_name: "{{ hybridnetwork_cr_name }}"
        cr_namespace: "{{ hybridnetwork_cr_namespace }}"
        cr_status_body:
          status: failed
          ready: false
          deletionComplete: false
          message: "{{ ansible_failed_result.msg | default('EDA teardown failed') }}"
      ignore_errors: true
      when: services_api_host is defined

    - name: Re-raise
      ansible.builtin.fail:
        msg: "HybridNetwork {{ hybridnetwork_cr_name | default('unknown') }} teardown failed"
