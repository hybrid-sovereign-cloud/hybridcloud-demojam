---
- name: Set environmentprep spec facts
  ansible.builtin.set_fact:
    ep_project: "{{ oso_spec.project | default(entity_name ~ '_' ~ cloudoso_cr_name, true) }}"
    ep_vault_path: "{{ oso_spec.vaultPath | default('') }}"
    ep_credentials_secret_name: "{{ (oso_spec.credentialsSecretRef | default({})).name | default('') }}"
    ep_base_domain: "{{ oso_spec.baseDomain | default(lookup('env', 'LAB_DOMAIN') | default('', true)) }}"
    ep_project_domain: "{{ oso_spec.projectDomain | default(default_project_domain) }}"
    ep_entity_name: "{{ entity_name }}"
    ep_route53_vault_path: "{{ oso_spec.route53VaultPath | default('oso/accounts/route53-openstack') }}"
    ep_external_network: "{{ oso_spec.externalNetwork | default(default_external_network) }}"
    ep_region_name: "{{ oso_spec.regionName | default(default_region_name) }}"
    ep_landingzone: "{{ oso_spec.landingzone | default('default') }}"
    ep_enable_vrf: "{{ oso_spec.enableVRF | default(false) | bool }}"
    ep_vrf_id: "{{ oso_spec.vrfId | default('') }}"
    use_designate_dns: "{{ ((oso_spec.designateZoneId | default('', true)) | length > 0) or ((oso_spec.baseDomain | default('', true)) == (BASE_DOMAIN | default(lookup('env', 'BASE_DOMAIN') | default('', true), true))) }}"
    ep_parent_zone_id: "{{ oso_spec.designateZoneId | default('', true) }}"
    ep_reuse_existing_project: "{{ ((oso_spec.credentialsSecretRef | default({})).name | default('') | length) > 0 }}"

- name: Load OpenStack clouds.yaml from entity-namespace Secret
  when: ep_credentials_secret_name | length > 0
  block:
    - name: Read credentials Secret referenced by CloudOSO
      kubernetes.core.k8s_info:
        host: "{{ services_api_host }}"
        api_key: "{{ services_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: Secret
        name: "{{ ep_credentials_secret_name }}"
        namespace: "{{ cloudoso_cr_namespace }}"
      register: openstack_entity_secret
      until: >-
        openstack_entity_secret.resources | length > 0 and
        openstack_entity_secret.resources[0].data is defined and
        openstack_entity_secret.resources[0].data['clouds.yaml'] is defined
      retries: 12
      delay: 5

    - name: Expose entity Secret as openstack_admin_secret
      ansible.builtin.set_fact:
        openstack_admin_secret: "{{ openstack_entity_secret }}"

- name: Load OpenStack clouds.yaml from Vault via ExternalSecret
  when: ep_credentials_secret_name | length == 0
  block:
    - name: Require vaultPath when credentialsSecretRef is unset
      ansible.builtin.assert:
        that:
          - ep_vault_path | length > 0
        fail_msg: CloudOSO requires spec.credentialsSecretRef.name or spec.vaultPath

    - name: Create temporary ExternalSecret for OpenStack admin credentials
      kubernetes.core.k8s:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        state: present
        definition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: "eda-cloudoso-{{ cloudoso_cr_name }}-openstack-creds"
            namespace: "{{ eda_central_work_namespace }}"
            labels:
              app.kubernetes.io/managed-by: eda-cloudoso
              cloudoso: "{{ cloudoso_cr_name }}"
          spec:
            refreshInterval: 1m
            secretStoreRef:
              name: vault-backend
              kind: ClusterSecretStore
            target:
              name: "eda-cloudoso-{{ cloudoso_cr_name }}-openstack-creds"
              creationPolicy: Owner
            data:
              - secretKey: clouds.yaml
                remoteRef:
                  key: "{{ ep_vault_path }}"
                  property: clouds.yaml

    - name: Wait for OpenStack admin credentials
      kubernetes.core.k8s_info:
        host: "{{ central_api_host }}"
        api_key: "{{ central_bearer_token }}"
        validate_certs: false
        api_version: v1
        kind: Secret
        name: "eda-cloudoso-{{ cloudoso_cr_name }}-openstack-creds"
        namespace: "{{ eda_central_work_namespace }}"
      register: openstack_vault_secret
      until: >-
        openstack_vault_secret.resources | length > 0 and
        openstack_vault_secret.resources[0].data is defined and
        openstack_vault_secret.resources[0].data['clouds.yaml'] is defined
      retries: 30
      delay: 10

    - name: Expose Vault Secret as openstack_admin_secret
      ansible.builtin.set_fact:
        openstack_admin_secret: "{{ openstack_vault_secret }}"

- name: Write OpenStack clouds.yaml to temp path
  ansible.builtin.copy:
    content: "{{ openstack_admin_secret.resources[0].data['clouds.yaml'] | b64decode }}"
    dest: "/tmp/eda-cloudoso-{{ cloudoso_cr_name }}-clouds.yaml"
    mode: '0600'
  no_log: true

- name: Set clouds.yaml path for OpenStack operations
  ansible.builtin.set_fact:
    clouds_yaml_path: "/tmp/eda-cloudoso-{{ cloudoso_cr_name }}-clouds.yaml"

- name: Auto-detect OS_CLOUD name from clouds.yaml (prefer default, else first key)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import yaml
        c = yaml.safe_load(open("{{ clouds_yaml_path }}"))
        ks = list((c.get("clouds") or {}).keys())
        print("default" if "default" in ks else (ks[0] if ks else "openstack"))
  register: _clouds_cloud_detect
  changed_when: false

- name: Set clouds_yaml_cloud from detection
  ansible.builtin.set_fact:
    clouds_yaml_cloud: "{{ _clouds_cloud_detect.stdout | trim }}"

- name: Generate deterministic slug from CR name
  ansible.builtin.set_fact:
    ep_slug: "{{ (cloudoso_cr_name | hash('sha256'))[:5] }}"

- name: Derive domain names
  ansible.builtin.set_fact:
    ep_cluster_domain: >-
      {{ (cloudoso_cr_name ~ '.' ~ (BASE_DOMAIN | default(lookup('env', 'BASE_DOMAIN') | default('', true), true)))
         if (use_designate_dns | default(false) | bool)
         else (ep_slug ~ '.' ~ ep_base_domain) }}

- name: Create OpenStack project
  when: not (ep_reuse_existing_project | default(false) | bool)
  openstack.cloud.project:
    cloud: "{{ clouds_yaml_cloud }}"
    name: "{{ ep_project }}"
    description: "Sovereign Cloud project for {{ ep_entity_name | default(cloudoso_cr_name) }}"
    state: present
  environment:
    OS_CLIENT_CONFIG_FILE: "{{ clouds_yaml_path }}"
  register: os_project

- name: Assign admin role to shc_admin on new project
  when: not (ep_reuse_existing_project | default(false) | bool)
  openstack.cloud.role_assignment:
    cloud: "{{ clouds_yaml_cloud }}"
    user: "{{ openstack_admin_user }}"
    role: admin
    project: "{{ ep_project }}"
    state: present
  environment:
    OS_CLIENT_CONFIG_FILE: "{{ clouds_yaml_path }}"

- name: Resolve existing project from clouds.yaml when reusing credentials
  when: ep_reuse_existing_project | default(false) | bool
  ansible.builtin.shell: |
    python3 -c "
    import json, yaml, os
    with open(os.environ['OS_CLIENT_CONFIG_FILE']) as f:
        cfg = yaml.safe_load(f)
    auth = cfg['clouds']['{{ clouds_yaml_cloud }}']['auth']
    print(json.dumps({
      'name': auth.get('project_name') or '{{ ep_project }}',
      'id': auth.get('project_id') or '',
      'domain_id': auth.get('project_domain_id') or '',
      'domain_name': auth.get('project_domain_name') or '{{ ep_project_domain }}',
    }))
    "
  environment:
    OS_CLIENT_CONFIG_FILE: "{{ clouds_yaml_path }}"
  register: existing_project_raw
  changed_when: false

- name: Set os_project fact for reused credentials
  when: ep_reuse_existing_project | default(false) | bool
  ansible.builtin.set_fact:
    os_project:
      project: "{{ existing_project_raw.stdout | from_json }}"

- name: Find or create floating IPs (idempotent via description tags)
  ansible.builtin.shell: |
    python3 -c "
    import json, sys, yaml, os
    try:
        import openstack
    except ImportError as e:
        print(json.dumps({'error': 'openstacksdk not installed in EE: %s' % e}))
        sys.exit(2)
    try:
        cfg_path = os.environ.get('OS_CLIENT_CONFIG_FILE', '/etc/openstack/clouds.yaml')
        with open(cfg_path) as f:
            cfg = yaml.safe_load(f)
        cloud_name = '{{ clouds_yaml_cloud }}'
        if cloud_name not in cfg.get('clouds', {}):
            cloud_name = next(iter(cfg.get('clouds', {})), None)
        if not cloud_name:
            print(json.dumps({'error': 'no clouds in clouds.yaml'}))
            sys.exit(1)
        cloud_cfg = cfg['clouds'][cloud_name]
        auth = dict(cloud_cfg['auth'])
        # When reusing admin credentials, keep the project from clouds.yaml
        # (overriding to a non-existent project yields empty/non-JSON SDK failures).
        reuse = '{{ ep_reuse_existing_project | default(false) | bool }}'.lower() in ('1', 'true', 'yes')
        if not reuse:
            auth['project_name'] = '{{ ep_project }}'
            auth['project_domain_name'] = '{{ ep_project_domain }}'
        verify = cloud_cfg.get('verify', True)
        if isinstance(verify, str):
            verify = verify.lower() not in ('0', 'false', 'no')
        # Lab Keystone often presents a cluster-signed cert; honor clouds.yaml
        # verify/cacert and default to insecure when verify is absent/false.
        conn = openstack.connect(
            auth=auth,
            region_name=cloud_cfg.get('region_name', 'regionOne'),
            identity_api_version='3',
            interface=cloud_cfg.get('interface', 'public'),
            verify=cloud_cfg.get('cacert', verify),
        )
        net = conn.network.find_network('{{ ep_external_network }}')
        if net is None:
            print(json.dumps({'error': 'Network {{ ep_external_network }} not found'}))
            sys.exit(1)

        cr_name = '{{ cloudoso_cr_name }}'
        api_tag = f'sovereign-{cr_name}-api'
        ingress_tag = f'sovereign-{cr_name}-ingress'

        def find_or_create_fip(conn, net_id, description):
            existing = [i for i in conn.network.ips() if getattr(i, 'description', None) == description]
            if existing:
                return {'id': existing[0].id, 'ip': existing[0].floating_ip_address, 'created': False}
            fip = conn.network.create_ip(floating_network_id=net_id, description=description)
            return {'id': fip.id, 'ip': fip.floating_ip_address, 'created': True}

        api_result = find_or_create_fip(conn, net.id, api_tag)
        ingress_result = find_or_create_fip(conn, net.id, ingress_tag)
        print(json.dumps({'api': api_result, 'ingress': ingress_result}))
    except Exception as e:
        print(json.dumps({'error': '%s: %s' % (type(e).__name__, e)}))
        sys.exit(1)
    "
  environment:
    OS_CLIENT_CONFIG_FILE: "{{ clouds_yaml_path }}"
  register: fip_result_raw
  failed_when: >-
    (fip_result_raw.rc | default(1)) != 0
    or ('error' in ((fip_result_raw.stdout | default('{}', true)) | from_json))
  changed_when: >-
    (fip_result_raw.rc | default(1)) == 0
    and (
      (((fip_result_raw.stdout | default('{}', true)) | from_json).api.created | default(false))
      or (((fip_result_raw.stdout | default('{}', true)) | from_json).ingress.created | default(false))
    )
- name: Set VIP facts
  ansible.builtin.set_fact:
    ep_api_vip: "{{ (fip_result_raw.stdout | from_json).api.ip }}"
    ep_ingress_vip: "{{ (fip_result_raw.stdout | from_json).ingress.ip }}"
    ep_api_fip_id: "{{ (fip_result_raw.stdout | from_json).api.id }}"
    ep_ingress_fip_id: "{{ (fip_result_raw.stdout | from_json).ingress.id }}"

- name: Force Designate DNS when CloudOSO.spec.designateZoneId is set
  when: (oso_spec.designateZoneId | default('', true) | string | length) > 0
  ansible.builtin.set_fact:
    use_designate_dns: true
    ep_parent_zone_id: "{{ oso_spec.designateZoneId }}"

- name: Create temporary ExternalSecret for Route53 credentials
  when: not (use_designate_dns | default(false) | bool)
  kubernetes.core.k8s:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "eda-cloudoso-{{ cloudoso_cr_name }}-route53-creds"
        namespace: "{{ eda_central_work_namespace }}"
        labels:
          app.kubernetes.io/managed-by: eda-cloudoso
          cloudoso: "{{ cloudoso_cr_name }}"
      spec:
        refreshInterval: 1m
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: "eda-cloudoso-{{ cloudoso_cr_name }}-route53-creds"
          creationPolicy: Owner
        data:
          - secretKey: AWS_ACCESS_KEY_ID
            remoteRef:
              key: "{{ ep_route53_vault_path }}"
              property: access-key
          - secretKey: AWS_SECRET_ACCESS_KEY
            remoteRef:
              key: "{{ ep_route53_vault_path }}"
              property: secret-access-key

- name: Wait for Route53 credentials
  when: not (use_designate_dns | default(false) | bool)
  kubernetes.core.k8s_info:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    api_version: v1
    kind: Secret
    name: "eda-cloudoso-{{ cloudoso_cr_name }}-route53-creds"
    namespace: "{{ eda_central_work_namespace }}"
  register: route53_creds_secret
  until: >-
    route53_creds_secret.resources | length > 0 and
    route53_creds_secret.resources[0].data is defined
  retries: 30
  delay: 10

- name: Decode Route53 credentials
  when: not (use_designate_dns | default(false) | bool)
  ansible.builtin.set_fact:
    r53_access_key_id: "{{ route53_creds_secret.resources[0].data.AWS_ACCESS_KEY_ID | b64decode }}"
    r53_secret_access_key: "{{ route53_creds_secret.resources[0].data.AWS_SECRET_ACCESS_KEY | b64decode }}"
  no_log: true

- name: List existing Route53 hosted zones
  when: not (use_designate_dns | default(false) | bool)
  amazon.aws.route53_info:
    query: hosted_zone
  register: r53_zones
  environment:
    AWS_ACCESS_KEY_ID: "{{ r53_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ r53_secret_access_key }}"
    AWS_DEFAULT_REGION: "us-east-1"

- name: Set Route53 facts
  when: not (use_designate_dns | default(false) | bool)
  ansible.builtin.set_fact:
    ep_parent_zone_name: "{{ ep_base_domain }}."
    r53_existing_zones: "{{ r53_zones.hosted_zones | map(attribute='name') | list }}"

- name: Find parent hosted zone ID
  when: not (use_designate_dns | default(false) | bool)
  ansible.builtin.set_fact:
    ep_parent_zone_id: >-
      {{ (r53_zones.hosted_zones
          | selectattr('name', 'equalto', ep_parent_zone_name)
          | map(attribute='id')
          | first
          | default(''))
         | regex_replace('^/hostedzone/', '') }}

- name: Fail if parent zone not found
  ansible.builtin.fail:
    msg: "Parent Route53 zone '{{ ep_base_domain }}' not found"
  when:
    - not (use_designate_dns | default(false) | bool)
    - ep_parent_zone_id == ''

- name: Use parent zone for DNS records
  when: not (use_designate_dns | default(false) | bool)
  ansible.builtin.set_fact:
    ep_subdomain_zone_id: "{{ ep_parent_zone_id }}"

- name: Read Vault root token
  when: (lookup('env', 'VAULT_TOKEN') | default('', true) | length) == 0
  kubernetes.core.k8s_info:
    host: "{{ central_api_host }}"
    api_key: "{{ central_bearer_token }}"
    validate_certs: false
    api_version: v1
    kind: Secret
    name: "{{ vault_init_secret_name }}"
    namespace: "{{ vault_init_secret_namespace }}"
  register: vault_init_secret_info_ep

- name: Set Vault root token from job credential or Secret
  ansible.builtin.set_fact:
    vault_root_token_ep: "{{ lookup('env', 'VAULT_TOKEN') | default('', true) }}"
    vault_kv_write_addr: "{{ lookup('env', 'VAULT_ADDR') | default(vault_init_addr, true) }}"
    vault_kv_write_mount: "{{ vault_kv_mount | default('hybridsovereign') }}"
  no_log: true

- name: Fall back to vault-init Secret when VAULT_TOKEN unset
  when: (vault_root_token_ep | default('') | length) == 0
  ansible.builtin.set_fact:
    vault_root_token_ep: >-
      {{
        vault_init_secret_info_ep.resources[0].data[vault_root_token_key | default('rootToken')] | default(vault_init_secret_info_ep.resources[0].data.root_token) | b64decode
      }}
  no_log: true

- name: Check existing credential in Vault
  ansible.builtin.uri:
    url: "{{ vault_kv_write_addr }}/v1/{{ vault_kv_write_mount }}/data/oso/projects/{{ cloudoso_cr_name }}/clouds-config"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_root_token_ep }}"
    status_code: [200, 404]
    validate_certs: false
  register: vault_creds_check
  no_log: true

- name: Set existing credential fact
  ansible.builtin.set_fact:
    existing_cred_in_vault: "{{ vault_creds_check.status == 200 and (vault_creds_check.json.data.data['clouds.yaml'] | default('')) | length > 0 }}"

- name: Validate existing credential against OpenStack
  ansible.builtin.shell: |
    python3 -c "
    import openstack, json, sys, yaml, os
    cfg_path = os.environ.get('OS_CLIENT_CONFIG_FILE', '/etc/openstack/clouds.yaml')
    with open(cfg_path) as f:
        cfg = yaml.safe_load(f)
    cloud_cfg = cfg['clouds']['{{ clouds_yaml_cloud }}']
    # Authenticate with the admin project from clouds.yaml — NOT ep_project.
    # Forcing project_name=oso1 causes HTTP 401 when the admin user is not yet
    # a member of the tenant project; app-creds are user-scoped anyway.
    auth = dict(cloud_cfg['auth'])
    verify = cloud_cfg.get('verify', True)
    if isinstance(verify, str):
        verify = verify.lower() not in ('0', 'false', 'no')
    cacert = cloud_cfg.get('cacert') or None
    # Prefer cacert only when verify is enabled and a path is set; otherwise honor verify=false.
    verify_arg = cacert if (verify and cacert) else verify
    try:
        conn = openstack.connect(
            auth=auth,
            region_name=cloud_cfg.get('region_name', 'regionOne'),
            identity_api_version='3',
            verify=verify_arg,
        )
        cred_name = 'sovereign-{{ ep_project }}'
        existing = list(conn.identity.application_credentials(user=conn.current_user_id, name=cred_name))
        if existing:
            print(json.dumps({'exists': True, 'id': existing[0].id}))
        else:
            print(json.dumps({'exists': False}))
    except Exception as e:
        # Treat auth/TLS failures as missing so the create path can recreate.
        print(json.dumps({'exists': False, 'error': str(e)}))
        sys.exit(0)
    "
  environment:
    OS_CLIENT_CONFIG_FILE: "{{ clouds_yaml_path }}"
  register: cred_check_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: Parse credential check
  ansible.builtin.set_fact:
    cred_check: >-
      {{
        (cred_check_raw.stdout | default('') | from_json)
        if ((cred_check_raw.stdout | default('')) | length > 0)
        else {'exists': false, 'error': 'credential validate produced no output'}
      }}
  no_log: true

- name: Create application credential via openstacksdk (only if not exists)
  ansible.builtin.shell: |
    python3 -c "
    import openstack, json, sys, yaml, os
    cfg_path = os.environ.get('OS_CLIENT_CONFIG_FILE', '/etc/openstack/clouds.yaml')
    with open(cfg_path) as f:
        cfg = yaml.safe_load(f)
    cloud_cfg = cfg['clouds']['{{ clouds_yaml_cloud }}']
    # Keep admin project from clouds.yaml (do not switch to ep_project).
    auth = dict(cloud_cfg['auth'])
    verify = cloud_cfg.get('verify', True)
    if isinstance(verify, str):
        verify = verify.lower() not in ('0', 'false', 'no')
    cacert = cloud_cfg.get('cacert') or None
    verify_arg = cacert if (verify and cacert) else verify
    try:
        conn = openstack.connect(auth=auth, region_name=cloud_cfg.get('region_name','regionOne'), identity_api_version='3', verify=verify_arg)
        cred_name = 'sovereign-{{ ep_project }}'
        existing = list(conn.identity.application_credentials(user=conn.current_user_id, name=cred_name))
        for old in existing:
            conn.identity.delete_application_credential(conn.current_user_id, old.id)
        c = conn.identity.create_application_credential(
            user=conn.current_user_id,
            name=cred_name,
            description='Auto-generated by CloudOSO EDA for project {{ ep_project }}')
        print(json.dumps({'id': c.id, 'secret': c.secret, 'auth_url': auth.get('auth_url','')}))
    except Exception as e:
        # Never print secrets; surface error class/message for operator debugging.
        print(json.dumps({'error': '%s: %s' % (type(e).__name__, e)}))
        sys.exit(1)
    "
  environment:
    OS_CLIENT_CONFIG_FILE: "{{ clouds_yaml_path }}"
  register: app_cred_raw
  changed_when: true
  failed_when: false
  no_log: true
  when: not (existing_cred_in_vault | bool and cred_check.exists | bool)

- name: Fail clearly when application credential create failed
  ansible.builtin.fail:
    msg: >-
      CloudOSO {{ cloudoso_cr_name }} application credential create failed:
      {{ (app_cred_raw.stdout | default('') | from_json).error
         | default(app_cred_raw.stderr | default(app_cred_raw.msg | default('unknown error'))) }}
  when:
    - app_cred_raw is not skipped
    - (app_cred_raw.rc | default(1) | int) != 0
      or ((app_cred_raw.stdout | default('')) | length == 0)
      or (((app_cred_raw.stdout | default('{}') | from_json).error | default('')) | length > 0)

- name: Parse application credential result (new credential)
  ansible.builtin.set_fact:
    app_cred_data: "{{ app_cred_raw.stdout | from_json }}"
  no_log: true
  when:
    - app_cred_raw is not skipped
    - (app_cred_raw.rc | default(1) | int) == 0

- name: Set credential as unchanged (existing credential reused)
  ansible.builtin.set_fact:
    app_cred_unchanged: true
  when: app_cred_raw is skipped

- name: Reuse Vault root token
  ansible.builtin.set_fact:
    vault_root_token: "{{ vault_root_token_ep }}"
  no_log: true

- name: Detect verify + region from source clouds.yaml
  ansible.builtin.set_fact:
    project_clouds_verify: >-
      {{
        (
          (lookup('file', clouds_yaml_path) | from_yaml).clouds[clouds_yaml_cloud].verify
          | default(true)
        )
      }}
    project_clouds_region: >-
      {{
        (
          (lookup('file', clouds_yaml_path) | from_yaml).clouds[clouds_yaml_cloud].region_name
          | default(ep_region_name | default('regionOne'), true)
        )
      }}
  no_log: true
  when: app_cred_unchanged is not defined

- name: Build per-project clouds.yaml content
  ansible.builtin.set_fact:
    project_clouds_yaml: |
      clouds:
        openstack:
          auth:
            auth_url: "{{ app_cred_data.auth_url | default('https://identity.atuin.' ~ (lookup('env', 'BASE_DOMAIN') | default('', true))) }}"
            application_credential_id: "{{ app_cred_data.id }}"
            application_credential_secret: "{{ app_cred_data.secret }}"
          region_name: "{{ project_clouds_region | default('regionOne') }}"
          interface: "public"
          identity_api_version: 3
          auth_type: "v3applicationcredential"
          verify: {{ project_clouds_verify | default(true) | bool | lower }}
  no_log: true
  when: app_cred_unchanged is not defined

- name: Write per-project clouds.yaml to Vault
  ansible.builtin.uri:
    url: "{{ vault_kv_write_addr }}/v1/{{ vault_kv_write_mount }}/data/oso/projects/{{ cloudoso_cr_name }}/clouds-config"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      data:
        clouds.yaml: "{{ project_clouds_yaml }}"
    status_code: [200, 204]
    validate_certs: false
  no_log: true
  when: app_cred_unchanged is not defined

- name: Set Designate DNS zone id when not using Route53
  when: use_designate_dns | default(false) | bool
  ansible.builtin.set_fact:
    ep_parent_zone_id: "{{ oso_spec.designateZoneId | default('') }}"

- name: Set CloudOSO environmentprep output facts
  ansible.builtin.set_fact:
    oso_project_name: "{{ os_project.project.name | default(ep_project) }}"
    oso_project_id: "{{ os_project.project.id | default('') }}"
    oso_domain_id: "{{ os_project.project.domain_id | default('') }}"
    oso_domain_name: "{{ os_project.project.domain_name | default(ep_project_domain) }}"
    oso_slug: "{{ ep_slug }}"
    oso_dns_domain: "{{ ep_cluster_domain }}"
    oso_route53_zone_id: "{{ ep_parent_zone_id | default('') }}"
    oso_api_vip: "{{ ep_api_vip }}"
    oso_ingress_vip: "{{ ep_ingress_vip }}"
    oso_external_network: "{{ ep_external_network }}"
