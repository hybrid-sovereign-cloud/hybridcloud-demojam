---
- name: Create temporary ExternalSecret for Route53 credentials
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: "eda-cloudoso-teardown-{{ cloudoso_cr_name }}-r53"
        namespace: "{{ eda_central_work_namespace }}"
      spec:
        refreshInterval: 1m
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: "eda-cloudoso-teardown-{{ cloudoso_cr_name }}-r53"
          creationPolicy: Owner
        data:
          - secretKey: AWS_ACCESS_KEY_ID
            remoteRef:
              key: "{{ ep_route53_vault_path }}"
              property: access-key
          - secretKey: AWS_SECRET_ACCESS_KEY
            remoteRef:
              key: "{{ ep_route53_vault_path }}"
              property: secret-access-key

- name: Wait for Route53 credentials
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: v1
    kind: Secret
    name: "eda-cloudoso-teardown-{{ cloudoso_cr_name }}-r53"
    namespace: "{{ eda_central_work_namespace }}"
  register: r53_secret
  until: r53_secret.resources | length > 0
  retries: 20
  delay: 5
  ignore_errors: true

- name: Decode Route53 credentials
  when: >-
    r53_secret.resources | default([]) | length > 0 and
    r53_secret.resources[0].data is defined and
    r53_secret.resources[0].data.AWS_ACCESS_KEY_ID is defined
  ansible.builtin.set_fact:
    r53_access_key_id: "{{ r53_secret.resources[0].data.AWS_ACCESS_KEY_ID | b64decode }}"
    r53_secret_access_key: "{{ r53_secret.resources[0].data.AWS_SECRET_ACCESS_KEY | b64decode }}"
  no_log: true

# Unauthenticated teardown must fail, not skip: skipping leaves a lame NS
# delegation for the slug zone in the parent zone.
- name: Require Route53 credentials before removing the delegation
  ansible.builtin.assert:
    that:
      - r53_access_key_id is defined
      - r53_access_key_id | length > 0
      - r53_secret_access_key is defined
      - r53_secret_access_key | length > 0
    fail_msg: >-
      CloudOSO {{ cloudoso_cr_name }} ({{ cloudoso_cr_namespace }}) teardown could
      not resolve Route53 credentials via route53VaultPath
      {{ ep_route53_vault_path | default('', true) }}
      {{ ('(from CloudInfrastructure ' ~ (oso_spec.cloudRef | default({}, true)).name | default('', true) ~ ')') if ((oso_spec.cloudRef | default({}, true)).name | default('')) | length > 0 else '' }}.
      The NS delegation for {{ oso_domain }} in {{ ep_base_domain }} has NOT been
      removed. Failing the teardown instead of reporting success.

- name: Remove NS delegation for slug zone
  amazon.aws.route53:
    state: absent
    zone: "{{ ep_base_domain }}"
    record: "{{ oso_domain }}"
    type: NS
  environment:
    AWS_ACCESS_KEY_ID: "{{ r53_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ r53_secret_access_key }}"
    AWS_DEFAULT_REGION: "us-east-1"
  ignore_errors: true

- name: Remove temporary Route53 credentials secret
  kubernetes.core.k8s:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    state: absent
    api_version: v1
    kind: Secret
    name: "eda-cloudoso-teardown-{{ cloudoso_cr_name }}-r53"
    namespace: "{{ eda_central_work_namespace }}"
  ignore_errors: true
