---
# Load Keycloak admin credentials from Vault (preferred) or K8s secret.
- name: Read Keycloak admin secret from Vault when VAULT_TOKEN set
  when: lookup('env', 'VAULT_TOKEN') | default('', true) | length > 0
  block:
    - name: Read {{ keycloak_vault_path | default('rhbk-services-admin') }} from Vault
      ansible.builtin.include_tasks: vault_kv_read.yml
      vars:
        vault_kv_path: "{{ keycloak_vault_path | default('rhbk-services-admin') }}"
  rescue:
    - name: Continue without Vault
      ansible.builtin.debug:
        msg: Vault read for Keycloak credentials failed; trying K8s secret

- name: Set Keycloak admin facts from Vault
  when:
    - vault_kv_data is defined
    - (vault_kv_data.username | default('') | length) > 0
  ansible.builtin.set_fact:
    keycloak_admin_user: "{{ vault_kv_data.username }}"
    keycloak_admin_password: "{{ vault_kv_data.password }}"
    keycloak_admin_url: "{{ vault_kv_data.url | default('') }}"

- name: Fall back to K8s secret
  when: (keycloak_admin_user | default('') | length) == 0
  block:
    - name: Read Keycloak admin Secret from cluster
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ keycloak_vault_path | default('rhbk-services-admin') }}"
        namespace: "{{ plugin_rbac_operator_namespace | default('sovereign-cloud-plugins') }}"
        host: "{{ services_api_host | default(omit) }}"
        api_key: "{{ services_bearer_token | default(omit) }}"
        validate_certs: false
      register: _kc_secret

    - name: Decode Keycloak admin Secret
      ansible.builtin.set_fact:
        keycloak_admin_user: "{{ _kc_secret.resources[0].data.username | b64decode }}"
        keycloak_admin_password: "{{ _kc_secret.resources[0].data.password | b64decode }}"
        keycloak_admin_url: "{{ _kc_secret.resources[0].data.url | default('') | b64decode }}"
      when: (_kc_secret.resources | default([]) | length) > 0

- name: Assert Keycloak admin credentials present
  ansible.builtin.assert:
    that:
      - keycloak_admin_user | default('') | length > 0
      - keycloak_admin_password | default('') | length > 0
    fail_msg: Could not load Keycloak admin credentials
