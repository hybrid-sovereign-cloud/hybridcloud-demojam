---
# PlatformOpenshift pod/service CIDRs (design/fabric.md §16). Not a fabric
# concern (hosted clusters do not join the HybridFabric, plan decision 6; the
# file keeps its name because the eda/platformopenshift DE copy includes it).
# Candidates, in order: recorded status.networking (kept as-is), explicit
# spec.networking, else a new block from the default ranges:
#   CloudVirt (spec.hosted.environment) -> spec.cloudRef -> CloudInfrastructure
#   spec.openshift.hostedClusterCidrDefaults; deprecated: CloudVirt
#   spec.hostedClusterCidrDefaults; else role vars po_default_cluster_network_pool /
#   po_default_service_network_pool (CG-NAT 100.64.0.0/11 /14 and 100.96.0.0/11 /16),
# else HyperShift defaults when spec.networking.allocateFromFabric (deprecated
# name, means "allocate") is false.
#
# Overlap rules (common/files/fabric_cluster_ipam.py):
#   - pod/service CIDRs must not overlap the hub's own pod/service CIDRs
#   - pod/service CIDRs must not overlap other PlatformOpenshift pod/service CIDRs
#     (role var po_deny_peer_cidr_overlap, default true)
#   - CIDRs outside the default ranges: ipamCondition LegacyClusterCidrs (kept)
#
# Sets facts: po_cluster_networks, po_service_networks, po_machine_networks,
#   po_networking_allocation_source, po_networking_conflict_check (passed|failed),
#   po_networking_legacy
# Fails the play on conflict unless spec.networking.allowConflict.

- name: Read PlatformOpenshift networking intent
  ansible.builtin.set_fact:
    _po_net: "{{ platformopenshift_cr.resources[0].spec.networking | default({}) }}"
    _po_existing_net_status: "{{ platformopenshift_cr.resources[0].status.networking | default({}) }}"
    _po_allocate: "{{ (platformopenshift_cr.resources[0].spec.networking.allocateFromFabric | default(true)) | bool }}"
    _po_allow_conflict: "{{ (platformopenshift_cr.resources[0].spec.networking.allowConflict | default(false)) | bool }}"

- name: Read CloudVirt for hosted-cluster CIDR defaults (hosted clusters)
  when: (platform_spec.type | default('')) == 'hosted'
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudVirt
    name: "{{ (platform_spec.hosted | default({})).environment | default(platform_spec.cloudRef | default(''), true) }}"
    namespace: "{{ platformopenshift_cr_namespace }}"
  register: _po_cloudvirt
  failed_when: false

- name: Read the CloudVirt's CloudInfrastructure
  when: (((_po_cloudvirt.resources | default([]) + [{}])[0].spec | default({})).cloudRef | default({}, true)).name | default('') | length > 0
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: CloudInfrastructure
    name: "{{ _po_cloudvirt.resources[0].spec.cloudRef.name }}"
    namespace: sovereign-cloud
  register: _po_cloudinfra
  failed_when: false

- name: Resolve default pod/service ranges
  ansible.builtin.set_fact:
    _po_pools: >-
      {{
        {
          'clusterNetworkPool': po_default_cluster_network_pool | default({'cidr': '100.64.0.0/11', 'blockPrefixLength': 14}),
          'serviceNetworkPool': po_default_service_network_pool | default({'cidr': '100.96.0.0/11', 'blockPrefixLength': 16})
        }
        | combine(((_po_cloudvirt.resources | default([]) + [{}])[0].spec | default({})).hostedClusterCidrDefaults | default({}), recursive=True)
        | combine((((_po_cloudinfra.resources | default([]) + [{}])[0].spec | default({})).openshift | default({})).hostedClusterCidrDefaults | default({}), recursive=True)
      }}

# (a) HyperShift on KubeVirt: hosted cluster CIDRs must not overlap the hub's.
- name: Read hub (services cluster) network config
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: config.openshift.io/v1
    kind: Network
    name: cluster
  register: _po_hub_net
  failed_when: false

- name: List PlatformOpenshift CRs (peer clusters)
  kubernetes.core.k8s_info:
    host: "{{ services_api_host }}"
    api_key: "{{ services_bearer_token }}"
    validate_certs: false
    api_version: hybridsovereign.redhat/v1alpha1
    kind: PlatformOpenshift
  register: _all_po
  failed_when: false

- name: Choose candidate CIDRs (recorded status, explicit spec, or allocate)
  ansible.builtin.set_fact:
    _po_candidate_source: >-
      {{
        'recorded'
        if ((_po_existing_net_status.clusterNetwork | default([]) | length) > 0
            and (_po_existing_net_status.serviceNetwork | default([]) | length) > 0)
        else (
          'explicit'
          if ((_po_net.clusterNetwork | default([]) | length) > 0
              and (_po_net.serviceNetwork | default([]) | length) > 0)
          else ('allocate' if (_po_allocate | bool) else 'legacy-default')
        )
      }}

- name: Plan / validate cluster CIDRs
  ansible.builtin.command:
    argv: [python3, "{{ role_path }}/../../../common/files/fabric_cluster_ipam.py"]
  environment:
    SELF_NAME: "{{ platformopenshift_cr_name }}"
    SELF_NAMESPACE: "{{ platformopenshift_cr_namespace }}"
    SOURCE: "{{ _po_candidate_source }}"
    RECORDED: "{{ _po_existing_net_status | to_json }}"
    EXPLICIT: "{{ _po_net | to_json }}"
    POOLS: "{{ _po_pools | to_json }}"
    DENY_PEER_OVERLAP: "{{ po_deny_peer_cidr_overlap | default(true) | string }}"
    HUB_NETWORK: "{{ ((_po_hub_net.resources | default([]) + [{}])[0]) | to_json }}"
    PEERS: "{{ _all_po.resources | default([]) | to_json }}"
  register: _po_ipam_plan
  changed_when: false
  failed_when: _po_ipam_plan.rc != 0

- name: Apply IPAM plan
  ansible.builtin.set_fact:
    _po_plan: "{{ _po_ipam_plan.stdout | from_json }}"

- name: Set networking facts
  ansible.builtin.set_fact:
    po_cluster_networks: "{{ _po_plan.clusterNetwork }}"
    po_service_networks: "{{ _po_plan.serviceNetwork }}"
    po_machine_networks: "{{ _po_plan.machineNetwork }}"
    po_networking_allocation_source: "{{ _po_plan.allocationSource }}"
    po_networking_conflict_check: "{{ 'passed' if (_po_plan.conflicts | length == 0) else 'failed' }}"
    po_networking_legacy: "{{ _po_plan.legacy | bool }}"

- name: Persist networking allocation on PlatformOpenshift status
  ansible.builtin.include_tasks: "{{ role_path }}/../../../common/tasks/patch_cr_status.yml"
  vars:
    cr_api_version: hybridsovereign.redhat/v1alpha1
    cr_plural: platformopenshifts
    cr_name: "{{ platformopenshift_cr_name }}"
    cr_namespace: "{{ platformopenshift_cr_namespace }}"
    cr_status_body:
      networking:
        clusterNetwork: "{{ po_cluster_networks }}"
        serviceNetwork: "{{ po_service_networks }}"
        machineNetwork: "{{ po_machine_networks | default([]) }}"
        # No fabric join any more: clear the fields the fabric-join era wrote.
        underlay: null
        fabricRef: null
        allocationSource: "{{ po_networking_allocation_source }}"
        conflictCheck: "{{ po_networking_conflict_check }}"
        conflictMessage: "{{ _po_plan.conflicts | join('; ') }}"
        legacyClusterCidrs: "{{ po_networking_legacy }}"
        ipamCondition: "{{ 'LegacyClusterCidrs' if (po_networking_legacy | bool) else 'DefaultRange' }}"
        ipamMessage: "{{ _po_plan.message }}"

- name: Fail on CIDR conflicts (unless spec.networking.allowConflict)
  when:
    - po_networking_conflict_check == 'failed'
    - not (_po_allow_conflict | bool)
  ansible.builtin.fail:
    msg: >-
      PlatformOpenshift {{ platformopenshift_cr_namespace }}/{{ platformopenshift_cr_name }}
      networking conflicts: {{ _po_plan.conflicts | join('; ') }}
