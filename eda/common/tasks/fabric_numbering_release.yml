---
# Release a previously allocated VNI from a HybridFabric numbering ledger
# ConfigMap (fabric-numbering-<fabric>). Idempotent: releasing a key that is
# not present is a no-op. Caller is responsible for only invoking this once
# zero placements/consumers remain for the allocation.
#
# Required vars:
#   fn_fabric_name       - HybridFabric metadata.name
#   fn_fabric_namespace   - namespace of the numbering ConfigMap (sovereign-cloud)
#   fn_alloc_key          - ledger key to release (e.g. "<ns>/<name>")
#
# Sets facts:
#   fn_release_ok         (bool) true when the key is confirmed absent afterwards

- name: "Write fabric numbering release script for {{ fn_fabric_name }}"
  ansible.builtin.copy:
    dest: /tmp/fabric_numbering_release.py
    mode: "0755"
    content: |
      import json, os, sys, time
      import requests, urllib3
      urllib3.disable_warnings()

      api_host = os.environ["CR_API_HOST"].strip()
      if api_host and not api_host.startswith(("http://", "https://")):
          api_host = "https://" + api_host.lstrip("/")
      token = os.environ["CR_TOKEN"]
      ns = os.environ["CM_NAMESPACE"]
      name = os.environ["CM_NAME"]
      alloc_key = os.environ["ALLOC_KEY"]
      url = f"{api_host}/api/v1/namespaces/{ns}/configmaps/{name}"
      headers = {"Authorization": f"Bearer {token}"}

      for attempt in range(10):
          resp = requests.get(url, headers=headers, verify=False, timeout=30)
          if resp.status_code == 404:
              # Numbering CM already gone — nothing to release.
              print(json.dumps({"released": True, "note": "configmap-not-found"}))
              sys.exit(0)
          if resp.status_code != 200:
              print(f"ERROR reading numbering ConfigMap {ns}/{name}: "
                    f"{resp.status_code} {resp.text[:300]}", file=sys.stderr)
              sys.exit(1)
          cm = resp.json()
          data = cm.get("data") or {}
          allocated = json.loads(data.get("allocated", "{}") or "{}")

          if alloc_key not in allocated:
              print(json.dumps({"released": True, "note": "not-allocated"}))
              sys.exit(0)

          del allocated[alloc_key]
          data["allocated"] = json.dumps(allocated, sort_keys=True)
          cm["data"] = data

          put_resp = requests.put(
              url,
              headers={**headers, "Content-Type": "application/json"},
              data=json.dumps(cm),
              verify=False,
              timeout=30,
          )
          if put_resp.status_code in (200, 201):
              print(json.dumps({"released": True}))
              sys.exit(0)
          if put_resp.status_code == 409:
              time.sleep(0.4 + attempt * 0.3)
              continue
          print(f"ERROR writing numbering ConfigMap {ns}/{name}: "
                f"{put_resp.status_code} {put_resp.text[:300]}", file=sys.stderr)
          sys.exit(1)

      print(f"ERROR: exhausted retries on ConfigMap conflict for {ns}/{name}", file=sys.stderr)
      sys.exit(3)

- name: "Release VNI for {{ fn_alloc_key }} from fabric-numbering-{{ fn_fabric_name }}"
  ansible.builtin.command: python3 /tmp/fabric_numbering_release.py
  environment:
    CR_API_HOST: "{{ services_api_host | trim }}"
    CR_TOKEN: "{{ services_bearer_token | trim }}"
    CM_NAMESPACE: "{{ fn_fabric_namespace }}"
    CM_NAME: "fabric-numbering-{{ fn_fabric_name }}"
    ALLOC_KEY: "{{ fn_alloc_key }}"
  register: _fn_release_result
  changed_when: true
  no_log: false

- name: Expose VNI release fact
  ansible.builtin.set_fact:
    fn_release_ok: "{{ (_fn_release_result.stdout | from_json).released | default(false) | bool }}"
