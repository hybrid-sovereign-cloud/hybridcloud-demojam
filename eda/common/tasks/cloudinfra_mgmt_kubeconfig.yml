---
# Write the management cluster kubeconfig of an openstack CloudInfrastructure
# (spec.openstack.managementClusterKubeconfigRef: Vault path / {vaultPath} /
# {secretRef}, key `kubeconfig`) to a 0600 temp file. Callers delete the file
# in an `always:` block.
#
# Required vars: ci_kubeconfig_ref (the reference), ci_kubeconfig_dest (file path)
# Sets: ci_kubeconfig_ok (bool), ci_kubeconfig_source, ci_kubeconfig_error

- name: Read management cluster kubeconfig reference
  ansible.builtin.include_tasks: cloudinfra_ref_read.yml
  vars:
    cisr_ref: "{{ ci_kubeconfig_ref }}"
    cisr_what: managementClusterKubeconfigRef

- name: Record kubeconfig lookup result
  ansible.builtin.set_fact:
    ci_kubeconfig_ok: "{{ (cisr_data.kubeconfig | default('')) | length > 0 }}"
    ci_kubeconfig_source: "{{ cisr_source }}"
    ci_kubeconfig_error: >-
      {{
        cisr_error
        if (cisr_error | length > 0)
        else ('' if (cisr_data.kubeconfig | default('')) | length > 0 else (cisr_source ~ ' has no key kubeconfig'))
      }}

- name: Write management cluster kubeconfig
  when: ci_kubeconfig_ok | bool
  ansible.builtin.copy:
    content: "{{ cisr_data.kubeconfig }}"
    dest: "{{ ci_kubeconfig_dest }}"
    mode: "0600"
  no_log: true
