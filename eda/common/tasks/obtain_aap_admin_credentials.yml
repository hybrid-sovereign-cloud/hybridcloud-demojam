---
# Load AAP admin credentials from Vault path aap-admin or K8s secret.
- name: Read AAP admin from Vault when VAULT_TOKEN set
  when: lookup('env', 'VAULT_TOKEN') | default('', true) | length > 0
  block:
    - name: Read aap-admin from Vault
      ansible.builtin.include_tasks: vault_kv_read.yml
      vars:
        vault_kv_path: aap-admin
  rescue:
    - name: Continue without Vault for AAP
      ansible.builtin.debug:
        msg: Vault aap-admin read failed; trying K8s secret

- name: Set AAP facts from Vault
  when:
    - vault_kv_data is defined
    - (vault_kv_data.username | default('') | length) > 0
  ansible.builtin.set_fact:
    aap_admin_user: "{{ vault_kv_data.username }}"
    aap_admin_password: "{{ vault_kv_data.password }}"
    aap_admin_url: "{{ vault_kv_data.url | default('') }}"
    aap_controller_url: "{{ vault_kv_data.url | default(aap_controller_url | default(''), true) }}"

- name: Fall back to K8s aap-admin-credentials
  when: (aap_admin_user | default('') | length) == 0
  block:
    - name: Read aap-admin-credentials Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: aap-admin-credentials
        namespace: "{{ plugin_rbac_operator_namespace | default('sovereign-cloud-plugins') }}"
        host: "{{ services_api_host | default(omit) }}"
        api_key: "{{ services_bearer_token | default(omit) }}"
        validate_certs: false
      register: _aap_secret

    - name: Decode AAP admin Secret
      when: (_aap_secret.resources | default([]) | length) > 0
      ansible.builtin.set_fact:
        aap_admin_user: "{{ _aap_secret.resources[0].data.username | b64decode }}"
        aap_admin_password: "{{ _aap_secret.resources[0].data.password | b64decode }}"
        aap_admin_url: "{{ _aap_secret.resources[0].data.url | default('') | b64decode }}"

- name: Assert AAP admin credentials present
  ansible.builtin.assert:
    that:
      - aap_admin_user | default('') | length > 0
      - aap_admin_password | default('') | length > 0
    fail_msg: Could not load AAP admin credentials
